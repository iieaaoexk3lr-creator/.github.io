<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワナオケ（罠オケ）カウンター</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --team-a-color: #ff6b6b;
            --team-b-color: #4dadf7;
            --success-color: #51cf66;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-top: 0;
            font-size: 24px;
            border-bottom: 3px solid #333;
            padding-bottom: 10px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .score-box {
            width: 48%;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }

        .score-box.team-a { background-color: var(--team-a-color); }
        .score-box.team-b { background-color: var(--team-b-color); }
        .score-num { font-size: 32px; margin-top: 5px; }

        .phase-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        h3 { margin-top: 0; color: #495057; }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: #555; }
        button.secondary { background-color: #6c757d; margin-top: 10px;}
        button.secondary:hover { background-color: #5a6268; }

        .hidden { display: none; }
        
        .result-msg {
            font-weight: bold;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            text-align: center;
        }
        .msg-trap { background-color: #ffe3e3; color: #c92a2a; }
        .msg-anti { background-color: #e3fafc; color: #0b7285; }
        .msg-normal { background-color: #ebfbee; color: #2b8a3e; }

        .log-list {
            list-style: none;
            padding: 0;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
        }
        .log-list li {
            padding: 5px 0;
            border-bottom: 1px dashed #dee2e6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎤 ワナオケ（罠オケ）</h1>

    <div class="scoreboard">
        <div class="score-box team-a">
            <div>チームA</div>
            <div class="score-num" id="scoreA">0</div>
        </div>
        <div class="score-box team-b">
            <div>チームB</div>
            <div class="score-num" id="scoreB">0</div>
        </div>
    </div>

    <div id="setupPhase" class="phase-section">
        <h3>① お題の設定</h3>
        <input type="text" id="themeInput" placeholder="例：夏、恋愛、アニソンなど">
        <button onclick="startRound()">ラウンド開始</button>
    </div>

    <div id="cardPhase" class="phase-section hidden">
        <h3 id="cardTitle">チームA の仕込みタイム</h3>
        <p style="font-size:12px; color:red;">※相手に見えないように入力してください</p>
        
        <label>【罠カード（相手が歌いそうな曲）3つ】</label>
        <input type="text" id="trap1" placeholder="罠曲 1">
        <input type="text" id="trap2" placeholder="罠曲 2">
        <input type="text" id="trap3" placeholder="罠曲 3">

        <label>【アンチ罠（自分たちが通したい曲）1つ】</label>
        <input type="text" id="anti1" placeholder="アンチ罠曲">
        
        <button onclick="saveTeamCards()">カードを確定して次のチームへ</button>
    </div>

    <div id="singPhase" class="phase-section hidden">
        <h3>🎤 歌唱＆判定フェーズ</h3>
        <p>現在のお題: <strong id="currentTheme" style="color:#e64980;"></strong></p>
        
        <div style="margin-bottom: 15px; padding: 10px; background: #e9ecef; border-radius: 4px;">
            <span id="singingTeamLabel">次に歌うチーム: <strong>チームA</strong></span>
        </div>

        <label>入れた曲（または歌おうとした曲）名を入力：</label>
        <input type="text" id="sungSongInput" placeholder="曲名を入力">
        <button onclick="judgeSong()" style="background-color: var(--success-color);">判定する！</button>

        <div id="resultArea" class="result-msg hidden"></div>
        
        <button class="secondary" onclick="nextSingTurn()">次の人のターンへ</button>
        <button class="secondary" style="background-color: #e64980;" onclick="endRound()">このラウンドを終了（罠公開）</button>
    </div>

    <div class="phase-section">
        <h3>📋 本ラウンドの履歴</h3>
        <ul id="logList" class="log-list"></ul>
    </div>
</div>

<script>
    // ゲーム状態管理
    let scores = { A: 0, B: 0 };
    let currentTheme = "";
    let currentSettingTeam = "A";
    let currentSingingTeam = "A";

    // 各チームのカードデータ
    let teamData = {
        A: { traps: [], anti: "" },
        B: { traps: [], anti: "" }
    };

    // ① ラウンド開始
    function startRound() {
        const theme = document.getElementById('themeInput').value.trim();
        if(!theme) { alert('お題を入力してください！'); return; }
        currentTheme = theme;
        
        // 画面切り替え
        document.getElementById('setupPhase').classList.add('hidden');
        document.getElementById('cardPhase').classList.remove('hidden');
        currentSettingTeam = "A";
        resetCardForm();
    }

    function resetCardForm() {
        document.getElementById('cardTitle').innerText = `② チーム${currentSettingTeam} の仕込みタイム`;
        document.getElementById('trap1').value = "";
        document.getElementById('trap2').value = "";
        document.getElementById('trap3').value = "";
        document.getElementById('anti1').value = "";
    }

    // ②＆③ カード保存
    function saveTeamCards() {
        const t1 = document.getElementById('trap1').value.trim();
        const t2 = document.getElementById('trap2').value.trim();
        const t3 = document.getElementById('trap3').value.trim();
        const anti = document.getElementById('anti1').value.trim();

        if(!t1 || !t2 || !t3 || !anti) {
            alert('すべての罠（3つ）とアンチ罠（1つ）を入力してください！');
            return;
        }

        // データを格納
        teamData[currentSettingTeam].traps = [t1, t2, t3];
        teamData[currentSettingTeam].anti = anti;

        if(currentSettingTeam === "A") {
            // 次はチームBの入力
            currentSettingTeam = "B";
            resetCardForm();
            alert("チームA登録完了！次はチームBが入力します。画面を渡してください。");
        } else {
            // 両チーム入力完了、歌唱フェーズへ
            document.getElementById('cardPhase').classList.add('hidden');
            document.getElementById('singPhase').classList.remove('hidden');
            document.getElementById('currentTheme').innerText = currentTheme;
            currentSingingTeam = "A";
            updateSingingTeamLabel();
            alert("両チームの仕込みが完了しました！歌唱フェーズを開始します。");
        }
    }

    function updateSingingTeamLabel() {
        document.getElementById('singingTeamLabel').innerHTML = `次に歌う（曲を入れる）チーム: <strong style="font-size:18px; color:${currentSingingTeam==='A'?'var(--team-a-color)':'var(--team-b-color)'}">チーム${currentSingingTeam}</strong>`;
        document.getElementById('resultArea').classList.add('hidden');
        document.getElementById('sungSongInput').value = "";
    }

    // ⑤ 判定ロジック
    function judgeSong() {
        const song = document.getElementById('sungSongInput').value.trim();
        if(!song) { alert('曲名を入力してください！'); return; }

        const attacker = currentSingingTeam; // 歌う側
        const defender = currentSingingTeam === "A" ? "B" : "A"; // 罠を張っている側

        // 相手の罠にかかっているかチェック（全角半角・大文字小文字の揺れを簡易考慮するためトリムのみ。完全一致判定）
        const isTrapped = teamData[defender].traps.includes(song);
        // 自分のアンチ罠と一致しているかチェック
        const isAntiTrapped = teamData[attacker].anti === song;

        const resultArea = document.getElementById('resultArea');
        resultArea.classList.remove('hidden');
        
        let logMsg = "";

        if (isTrapped && isAntiTrapped) {
            // 罠＋アンチ罠一致 → 無効化（そのまま歌える：1点＋ボーナス1点＝2点）
            scores[attacker] += 2;
            resultArea.className = "result-msg msg-anti";
            resultArea.innerHTML = `💥【アンチ罠発動！】<br>相手の罠【${song}】を無効化！見事そのまま歌えます！<br>チーム${attacker}に 2ポイント！`;
            logMsg = `チーム${attacker}: 『${song}』 ➔ アンチ罠成功！ (+2pt)`;
        } else if (isTrapped) {
            // 罠と一致 → 歌えない（罠を張った側に2点）
            scores[defender] += 2;
            resultArea.className = "result-msg msg-trap";
            resultArea.innerHTML = `💀【罠発動！】<br>チーム${defender}の罠にかかりました！この曲は歌えません！<br>罠を張ったチーム${defender}に 2ポイント！`;
            logMsg = `チーム${attacker}: 『${song}』 ➔ チーム${defender}の罠にヒット！ (チーム${defender}に +2pt)`;
        } else {
            // 通常通り（1点）
            scores[attacker] += 1;
            resultArea.className = "result-msg msg-normal";
            resultArea.innerHTML = `🎵【セーフ】<br>罠はありません。普通に歌えます！<br>チーム${attacker}に 1ポイント！`;
            logMsg = `チーム${attacker}: 『${song}』 ➔ セーフ、通常歌唱 (+1pt)`;
        }

        // スコア更新
        document.getElementById('scoreA').innerText = scores.A;
        document.getElementById('scoreB').innerText = scores.B;

        // ログ追加
        const li = document.createElement('li');
        li.innerText = logMsg;
        document.getElementById('logList').appendChild(li);
    }

    // ターンの交代
    function nextSingTurn() {
        currentSingingTeam = currentSingingTeam === "A" ? "B" : "A";
        updateSingingTeamLabel();
    }

    // ラウンド終了（罠の答え合わせと次のラウンドへの準備）
    function endRound() {
        let msg = `【このラウンドの罠の答え合わせ】\n\n`;
        msg += `◆チームAの罠: ${teamData[A].traps.join(', ')} / (アンチ: ${teamData[A].anti})\n`;
        msg += `◆チームBの罠: ${teamData[B].traps.join(', ')} / (アンチ: ${teamData[B].anti})\n\n`;
        msg += `次のラウンドに進みますか？`;

        if(confirm(msg)) {
            // フィールド初期化して最初に戻る
            document.getElementById('singPhase').classList.add('hidden');
            document.getElementById('setupPhase').classList.remove('hidden');
            document.getElementById('themeInput').value = "";
            document.getElementById('logList').innerHTML = "";
            teamData = { A: { traps: [], anti: "" }, B: { traps: [], anti: "" } };
        }
    }
</script>

</body>
</html>
