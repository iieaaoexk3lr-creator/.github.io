<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Room Quiz Score Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap');
        body { font-family: 'Noto+Sans+JP', sans-serif; background-color: #1a202c; color: #f7fafc; }
        .score-hidden { filter: blur(12px); user-select: none; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #708090); color: #000; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #8b4513); color: #000; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        
        <div id="loginScreen" class="bg-gray-800/90 border border-gray-700 rounded-3xl p-6 max-w-md mx-auto my-20 shadow-2xl">
            <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 text-center mb-6">クイズルーム入室</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">部屋名</label>
                    <input type="text" id="roomInput" value="room1" class="w-full bg-gray-700 text-white px-4 py-2 rounded-xl font-bold border border-gray-600 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">あなたの個人名</label>
                    <input type="text" id="userInput" placeholder="例：タロウ" class="w-full bg-gray-700 text-white px-4 py-2 rounded-xl font-bold border border-gray-600 focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="joinRoom()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow">入室する</button>
            </div>
        </div>

        <div id="mainContent" class="hidden">
            <div class="mb-6 flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <a href="6gatu.html" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-4 py-1.5 rounded-lg text-sm font-bold transition-all text-gray-300">🏠 メニューへ</a>
                    <span class="bg-blue-900/60 text-blue-300 border border-blue-700 px-3 py-1 rounded-full text-sm font-bold">部屋: <span id="currentRoomLabel">-</span></span>
                    <span class="bg-green-900/60 text-green-300 border border-green-700 px-3 py-1 rounded-full text-sm font-bold">ユーザー: <span id="currentUserLabel">-</span></span>
                </div>
                <div class="flex items-center gap-2">
                    <input type="password" id="adminKeyInput" placeholder="管理キーを入力" class="bg-gray-800 text-white px-4 py-1.5 rounded-lg border border-gray-700 text-sm focus:outline-none focus:border-blue-500">
                    <button id="authBtn" class="bg-gray-700 hover:bg-gray-600 px-4 py-1.5 rounded-lg text-sm font-bold transition-all">ログイン</button>
                </div>
            </div>

            <div id="adminPanel" class="hidden bg-gray-800/80 border-2 border-blue-500 rounded-3xl p-6 mb-10 shadow-2xl">
                <h2 class="text-2xl font-black text-blue-400 mb-4">🛠️ クイズ管理者パネル</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="border border-gray-700 p-4 rounded-xl">
                        <p class="text-sm text-gray-400 mb-2">1. スプレッドシートから書き出したCSVを選択</p>
                        <input type="file" id="csvFile" accept=".csv" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                    </div>
                    <div class="border border-gray-700 p-4 rounded-xl flex flex-col justify-between">
                        <div>
                            <p class="text-sm text-gray-400">2. 問題の進行コントロール</p>
                            <p class="text-lg font-bold text-yellow-400 mt-1">現在の読込数: <span id="quizTotalCount">0</span> 問</p>
                        </div>
                        <div class="flex gap-2 mt-4">
                            <button onclick="nextQuestion(-1)" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-xl font-bold text-sm">◀ 前の問題</button>
                            <button onclick="nextQuestion(1)" class="bg-blue-600 hover:bg-blue-700 flex-1 py-2 rounded-xl font-bold text-sm text-white">次を出題 ▶</button>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4 flex flex-wrap gap-4 border-t border-gray-700 pt-4">
                    <button id="toggleScores" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl text-sm font-bold shadow">スコア表示の切替</button>
                    <button onclick="toggleHintAdmin()" class="bg-amber-600 hover:bg-amber-700 px-4 py-2 rounded-xl text-sm font-bold shadow">💡 ヒントの表示/非表示切替</button>
                    <button onclick="resetAllScores()" class="bg-gray-900 border border-red-800 px-4 py-2 rounded-xl text-sm font-bold text-red-400">全スコアリセット</button>
                </div>

                <div class="mt-6 border-t border-gray-700 pt-4">
                    <h3 class="text-lg font-bold text-purple-400 mb-2">📝 全員の回答履歴（リアルタイム救済システム）</h3>
                    <div class="max-h-60 overflow-y-auto bg-black/40 rounded-xl p-4 text-sm space-y-2" id="adminHistoryLog">
                        </div>
                </div>
            </div>

            <div class="bg-gray-800/40 border border-gray-700 rounded-3xl p-6 mb-6 shadow-xl grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h3 class="text-lg font-bold text-emerald-400 mb-2">🚩 新しいチームを作る (リーダー用)</h3>
                    <div class="flex gap-2">
                        <input type="text" id="newTeamInput" placeholder="チーム名を入力" class="bg-gray-700 text-white px-4 py-2 rounded-xl font-bold border border-gray-600 focus:outline-none focus:border-emerald-500 flex-1">
                        <button onclick="createTeam()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold text-sm">作成</button>
                    </div>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-blue-400 mb-2">👥 あなたの所属チームを選択</h3>
                    <div class="flex gap-2">
                        <select id="userTeamSelect" onchange="joinTeam(this.value)" class="bg-gray-700 text-white font-bold px-4 py-2 rounded-xl border border-gray-600 focus:outline-none focus:border-blue-500 flex-1">
                            <option value="">-- チームを選択（未所属） --</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-gradient-to-br from-indigo-900/40 to-purple-950/40 border border-purple-500/3xl rounded-3xl p-6 mb-10 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <span class="bg-purple-600 text-white text-xs font-black px-3 py-1 rounded-full uppercase tracking-wider" id="quizNumLabel">Q. 0</span>
                    <span class="text-xs text-gray-400">現在の問題（リアルタイム同期）</span>
                </div>
                <h2 id="displayQuestion" class="text-2xl md:text-3xl font-black text-white mb-2">問題が配信されるのを待っています...</h2>
                <p id="displayHint" class="text-amber-400 font-bold mb-6 text-sm hidden">ヒント: ？？？</p>
                
                <div class="flex flex-wrap gap-3 items-center bg-black/30 p-4 rounded-2xl">
                    <input type="text" id="playerAnswerInput" placeholder="答えを入力してください" class="bg-gray-700 text-white px-4 py-3 rounded-xl border border-gray-600 font-bold focus:outline-none focus:border-purple-500 flex-1 min-w-[200px]">
                    <button onclick="submitAnswer()" class="bg-purple-600 hover:bg-purple-700 text-white px-8 py-3 rounded-xl font-bold transition-all shadow w-full sm:w-auto">回答を送信</button>
                </div>
                <div id="answerLog" class="text-sm mt-3 font-bold text-center text-gray-400"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div>
                    <h3 class="text-xl font-black text-emerald-400 mb-4">🚩 チームランキング (個人の合算)</h3>
                    <div id="teamBoardGrid" class="space-y-4">
                        </div>
                </div>
                <div>
                    <h3 class="text-xl font-black text-blue-400 mb-4">👤 個人ランキング</h3>
                    <div id="playerBoardGrid" class="space-y-4">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
            authDomain: "gamehistory-m84.firebaseapp.com",
            databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
            projectId: "gamehistory-m84",
            storageBucket: "gamehistory-m84.firebasestorage.app",
            messagingSenderId: "475761727837",
            appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
            measurementId: "G-3636W6LC4F"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const ADMIN_SECRET = "admin123"; 
        let isAdmin = false;
        let quizList = []; 
        
        let roomId = "";
        let username = "";
        let myCurrentTeam = "";

        // アプリケーション状態のローカル保持
        let state = {
            currentIndex: -1,
            showScores: false,
            showHint: false,
            currentQuestion: "待機中...",
            currentHint: "待機中...",
            currentAnswer: "",
            players: {},   // { username: { team, score } }
            teams: {},     // { teamName: true }
            history: {}    // { historyId: { username, question, playerAns, isCorrect } }
        };

        const authBtn = document.getElementById('authBtn');
        const adminPanel = document.getElementById('adminPanel');
        const toggleScoresBtn = document.getElementById('toggleScores');

        // 管理者認証
        authBtn.onclick = () => {
            if (document.getElementById('adminKeyInput').value === ADMIN_SECRET) {
                isAdmin = true;
                adminPanel.classList.remove('hidden');
                authBtn.innerText = "管理者モード";
                authBtn.className = "bg-emerald-600 px-4 py-1.5 rounded-lg text-sm font-bold text-white";
                render(); 
            } else { alert("管理キーが違います。"); }
        };

        // --------------------------------------------------
        // 🚪 部屋の入室ロジック
        // --------------------------------------------------
        window.joinRoom = function() {
            roomId = document.getElementById('roomInput').value.trim();
            username = document.getElementById('userInput').value.trim();

            if (!roomId || !username) return alert("部屋名と個人名を入力してください");

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('currentRoomLabel').innerText = roomId;
            document.getElementById('currentUserLabel').innerText = username;

            // ユーザー情報を初期登録（または維持）
            db.ref(`QUIZ_rooms/${roomId}/players/${username}`).update({
                name: username
            });

            // リアルタイムリスナーの結合開始
            startFirebaseListeners();
        };

        // --------------------------------------------------
        // 🚩 チーム作成・所属ロジック
        // --------------------------------------------------
        window.createTeam = function() {
            const teamName = document.getElementById('newTeamInput').value.trim();
            if(!teamName) return alert("チーム名を入力してください");
            
            // チームを追加設定
            db.ref(`QUIZ_rooms/${roomId}/teams/${teamName}`).set(true);
            document.getElementById('newTeamInput').value = "";
            
            // 作成したチームに自動で入る
            joinTeam(teamName);
        };

        window.joinTeam = function(teamName) {
            myCurrentTeam = teamName;
            db.ref(`QUIZ_rooms/${roomId}/players/${username}`).update({
                team: teamName
            });
        };

        // --------------------------------------------------
        // 📁 CSV読み込み (管理者用)
        // --------------------------------------------------
        if(document.getElementById('csvFile')) {
            document.getElementById('csvFile').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const text = evt.target.result;
                    quizList = text.split(/\r\n|\n/).map(line => {
                        const columns = line.split(',');
                        return {
                            question: columns[0] ? columns[0].replace(/"/g, '').trim() : "",
                            hint: columns[1] ? columns[1].replace(/"/g, '').trim() : "",
                            answer: columns[2] ? columns[2].replace(/"/g, '').trim() : ""
                        };
                    }).filter(q => q.question !== "" && q.question !== "問題");

                    document.getElementById('quizTotalCount').innerText = quizList.length;
                    alert(`${quizList.length}問のクイズを読み込みました！`);
                    if(quizList.length > 0) nextQuestion(1); 
                };
                reader.readAsText(file, 'UTF-8');
            });
        }

        // 管理者：問題進行（問題が進む時はヒントを自動的に隠す仕様）
        window.nextQuestion = (step) => {
            if (quizList.length === 0) return alert("先にCSVを読み込んでください");
            let nextIdx = state.currentIndex + step;
            if (nextIdx < 0 || nextIdx >= quizList.length) return alert("これ以上問題はありません");

            db.ref(`QUIZ_rooms/${roomId}/quizState`).update({
                currentIndex: nextIdx,
                currentQuestion: quizList[nextIdx].question,
                currentHint: quizList[nextIdx].hint || "なし",
                currentAnswer: quizList[nextIdx].answer,
                showHint: false // 次の問題に進むときは強制的に隠す
            });
        };

        // 管理者：ヒント表示非表示の個別切り替え
        window.toggleHintAdmin = () => {
            db.ref(`QUIZ_rooms/${roomId}/quizState/showHint`).set(!state.showHint);
        };

        // --------------------------------------------------
        // 🎮 回答送信＆部屋と個人に紐付いた履歴記録
        // --------------------------------------------------
        window.submitAnswer = function() {
            const playerAns = document.getElementById('playerAnswerInput').value.trim();
            const logBox = document.getElementById('answerLog');

            if(!playerAns) return alert("回答を入力してください");
            if(!state.currentAnswer) return alert("現在出題されている問題がありません");

            const isCorrect = playerAns.toLowerCase() === state.currentAnswer.toLowerCase();

            // 部屋・個人名に紐づけて履歴（ログ）を一意のPushIDで記録
            const historyRef = db.ref(`QUIZ_rooms/${roomId}/history`).push();
            historyRef.set({
                username: username,
                team: myCurrentTeam || "未所属",
                question: state.currentQuestion,
                playerAns: playerAns,
                isCorrect: isCorrect
            });

            if(isCorrect) {
                logBox.innerHTML = `<span class="text-emerald-400">⭕ 正解！答え: ${state.currentAnswer}</span>`;
                // 個人スコアに加点
                const currentScore = (state.players[username] && state.players[username].score) || 0;
                db.ref(`QUIZ_rooms/${roomId}/players/${username}/score`).set(currentScore + 1);
                document.getElementById('playerAnswerInput').value = "";
            } else {
                logBox.innerHTML = `<span class="text-red-400">❌ 不正解！「${playerAns}」</span>`;
            }
        };

        // --------------------------------------------------
        // 🛠️ 管理者：不正解だった過去ログを「正解」へ救済変更する機能
        // --------------------------------------------------
        window.rescueAnswer = function(historyId, targetUser) {
            // 1. 履歴の状態を「正解(true)」に書き換え
            db.ref(`QUIZ_rooms/${roomId}/history/${historyId}/isCorrect`).set(true);
            
            // 2. その対象プレイヤーにスコアを+1加点
            const currentScore = (state.players[targetUser] && state.players[targetUser].score) || 0;
            db.ref(`QUIZ_rooms/${roomId}/players/${targetUser}/score`).set(currentScore + 1);
            
            alert(`${targetUser} さんの回答を正解扱いに修正し、1点付与しました。`);
        };

        // --------------------------------------------------
        // 📡 Firebaseとのマルチリスナー接続
        // --------------------------------------------------
        function startFirebaseListeners() {
            db.ref(`QUIZ_rooms/${roomId}`).on('value', (snap) => {
                const rootData = snap.val() || {};
                
                // クイズ状態の読み込み
                const qState = rootData.quizState || {};
                state.currentIndex = qState.currentIndex !== undefined ? qState.currentIndex : -1;
                state.currentQuestion = qState.currentQuestion || "問題がセットされていません。";
                state.currentHint = qState.currentHint || "なし";
                state.currentAnswer = qState.currentAnswer || "";
                state.showScores = qState.showScores || false;
                state.showHint = qState.showHint || false;

                // 参加者データのロード
                state.players = rootData.players || {};
                // チームリストのロード
                state.teams = rootData.teams || {};
                // 回答履歴データのロード
                state.history = rootData.history || {};

                updateTeamSelectUI();
                render();
            });
        }

        // セレクトボックス内のチーム候補を動的に増減
        function updateTeamSelectUI() {
            const select = document.getElementById('userTeamSelect');
            const savedValue = select.value;
            select.innerHTML = '<option value="">-- チームを選択（未所属） --</option>';
            
            Object.keys(state.teams).forEach(teamName => {
                const opt = document.createElement('option');
                opt.value = teamName;
                opt.innerText = teamName;
                select.appendChild(opt);
            });
            select.value = savedValue || myCurrentTeam;
        }

        // --------------------------------------------------
        // 📊 スコアボード＆履歴ログの再描画
        // --------------------------------------------------
        function render() {
            // クイズ配信表示
            document.getElementById('quizNumLabel').innerText = `Q. ${state.currentIndex + 1}`;
            document.getElementById('displayQuestion').innerText = state.currentQuestion;
            document.getElementById('displayHint').innerText = `ヒント: ${state.currentHint}`;
            
            if (state.showHint) {
                document.getElementById('displayHint').classList.remove('hidden');
            } else {
                document.getElementById('displayHint').classList.add('hidden');
            }

            // 1. 個人ランキングの集計とソート
            const playerList = Object.keys(state.players).map(name => {
                return {
                    name: name,
                    team: state.players[name].team || "未所属",
                    score: state.players[name].score || 0
                };
            }).sort((a, b) => b.score - a.score);

            // 2. チームランキングの集計 (所属個人の点数をリアルタイム合算)
            const teamScores = {};
            Object.keys(state.teams).forEach(tName => { teamScores[tName] = 0; }); // 初期化
            
            playerList.forEach(p => {
                if(p.team !== "未所属" && teamScores[p.team] !== undefined) {
                    teamScores[p.team] += p.score;
                }
            });

            const teamList = Object.keys(teamScores).map(tName => {
                return { name: tName, score: teamScores[tName] };
            }).sort((a, b) => b.score - a.score);

            // --- 個人ボード描画 ---
            const pGrid = document.getElementById('playerBoardGrid');
            pGrid.innerHTML = "";
            playerList.forEach((player, index) => {
                const card = document.createElement('div');
                card.className = `glass-card p-4 rounded-2xl flex justify-between items-center shadow-lg`;
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-lg font-black text-gray-500">#${index+1}</span>
                        <div>
                            <div class="text-lg font-black text-white">${player.name}</div>
                            <div class="text-xs text-gray-400">所属: ${player.team}</div>
                        </div>
                    </div>
                    <div class="text-2xl font-black text-blue-400 ${state.showScores || isAdmin ? '' : 'score-hidden'}">${player.score}点</div>
                `;
                pGrid.appendChild(card);
            });

            // --- チームボード描画 ---
            const tGrid = document.getElementById('teamBoardGrid');
            tGrid.innerHTML = "";
            teamList.forEach((team, index) => {
                const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : 'glass-card';
                const textCol = index < 3 ? 'text-gray-900' : 'text-emerald-400';
                const card = document.createElement('div');
                card.className = `${rankClass} p-4 rounded-2xl flex justify-between items-center shadow-lg`;
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-lg font-black ${index < 3 ? 'text-gray-800':'text-gray-500'}">#${index+1}</span>
                        <div class="text-lg font-black">${team.name}</div>
                    </div>
                    <div class="text-2xl font-black ${textCol} ${state.showScores || isAdmin ? '' : 'score-hidden'}">${team.score}点</div>
                `;
                tGrid.appendChild(card);
            });

            // --- 管理者用回答ログ(救済用リスト)の生成 ---
            if (isAdmin) {
                const adminLog = document.getElementById('adminHistoryLog');
                adminLog.innerHTML = "";
                Object.entries(state.history).reverse().forEach(([hId, hData]) => {
                    const item = document.createElement('div');
                    item.className = `flex justify-between items-center border-b border-gray-800 pb-2`;
                    item.innerHTML = `
                        <div>
                            <span class="text-blue-400 font-bold">${hData.username}</span> 
                            <span class="text-gray-500">(${hData.team})</span>: 
                            <span class="text-yellow-200">「${hData.playerAns}」</span>
                            <div class="text-xs text-gray-500">問: ${hData.question}</div>
                        </div>
                        <div>
                            ${hData.isCorrect ? 
                                `<span class="text-emerald-400 font-bold">正解済</span>` : 
                                `<button onclick="rescueAnswer('${hId}', '${hData.username}')" class="bg-indigo-700 hover:bg-indigo-600 px-2 py-1 rounded text-xs font-bold text-white">マルにする</button>`
                            }
                        </div>
                    `;
                    adminLog.appendChild(item);
                });
            }
        }

        // スコア表示非表示切り替え
        toggleScoresBtn.onclick = () => {
            db.ref(`QUIZ_rooms/${roomId}/quizState/showScores`).set(!state.showScores);
        };

        // スコア・ログ・チーム全クリア
        window.resetAllScores = function() {
            if(confirm("この部屋のスコア・登録チーム・回答履歴データをリセットしますか？")) {
                db.ref(`QUIZ_rooms/${roomId}/players`).once('value', snap => {
                    const pData = snap.val() || {};
                    Object.keys(pData).forEach(name => {
                        db.ref(`QUIZ_rooms/${roomId}/players/${name}/score`).set(0);
                    });
                });
                db.ref(`QUIZ_rooms/${roomId}/teams`).remove();
                db.ref(`QUIZ_rooms/${roomId}/history`).remove();
                alert("リセットが完了しました。");
            }
        };
    </script>
