<!-- React アプリケーションコード -->
<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  // チーム設定
  const TEAM_KEYS = ['A', 'B', 'C', 'D', 'E', 'F'];
  const TEAM_NAMES = {
    A: { name: 'チームA', color: 'text-red-400', bg: 'bg-red-950/20', border: 'border-red-500/40', badge: 'bg-red-600' },
    B: { name: 'チームB', color: 'text-blue-400', bg: 'bg-blue-950/20', border: 'border-blue-500/40', badge: 'bg-blue-600' },
    C: { name: 'チームC', color: 'text-emerald-400', bg: 'bg-emerald-950/20', border: 'border-emerald-500/40', badge: 'bg-emerald-600' },
    D: { name: 'チームD', color: 'text-amber-400', bg: 'bg-amber-950/20', border: 'border-amber-500/40', badge: 'bg-amber-600' },
    E: { name: 'チームE', color: 'text-purple-400', bg: 'bg-purple-950/20', border: 'border-purple-500/40', badge: 'bg-purple-600' },
    F: { name: 'チームF', color: 'text-pink-400', bg: 'bg-pink-950/20', border: 'border-pink-500/40', badge: 'bg-pink-600' }
  };

  function App() {
    const [userId, setUserId] = useState('');
    const [playerName, setPlayerName] = useState('');
    const [roomCode, setRoomCode] = useState('');
    const [inRoom, setInRoom] = useState(false);
    
    // ダイアログ・モーダル用ステート（標準のalert/confirmの代替）
    const [modalConfig, setModalConfig] = useState({
        show: false,
        title: '',
        message: '',
        type: 'alert', // alert, confirm
        onConfirm: null
    });
    
    // 過去の対戦履歴画面の表示制御
    const [showHistory, setShowHistory] = useState(false);

    // リアルタイム同期されるゲーム状態
    const [gameState, setGameState] = useState({
        status: 'menu', // menu, lobby, setup, prep, sing, result
        theme: '',
        maxTeams: 2,
        scores: { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 },
        currentSingingTeam: 'A',
        players: {},
        prepStatus: {
            A: { ready: false, traps: ['', '', ''], anti: '' },
            B: { ready: false, traps: ['', '', ''], anti: '' },
            C: { ready: false, traps: ['', '', ''], anti: '' },
            D: { ready: false, traps: ['', '', ''], anti: '' },
            E: { ready: false, traps: ['', '', ''], anti: '' },
            F: { ready: false, traps: ['', '', ''], anti: '' }
        },
        logs: [],
        lastResult: null
    });

    // 部屋専用の過去対戦履歴リスト
    const [histories, setHistories] = useState([]);
    
    // ローカルの罠・アンチ罠入力バッファ
    const [localTraps, setLocalTraps] = useState(['', '', '']);
    const [localAnti, setLocalAnti] = useState('');
    const [songInput, setSongInput] = useState('');

    const [fbReady, setFbReady] = useState(false);

    // 1. 初期化とユーザーID生成
    useEffect(() => {
        let uid = localStorage.getItem('wanaoke_uid');
        if (!uid) {
            uid = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('wanaoke_uid', uid);
        }
        setUserId(uid);

        let savedName = localStorage.getItem('wanaoke_name');
        if (!savedName) {
            savedName = 'シンガー_' + Math.floor(100 + Math.random() * 900);
            localStorage.setItem('wanaoke_name', savedName);
        }
        setPlayerName(savedName);

        // Firebaseのバインドを監視
        const interval = setInterval(() => {
            if (window.fb) {
                setFbReady(true);
                clearInterval(interval);
            }
        }, 100);

        return () => clearInterval(interval);
    }, []);

    // 2. 部屋の監視および「この部屋専用の履歴」の監視
    useEffect(() => {
        if (!fbReady || !roomCode || !inRoom) return;

        const roomRef = window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}`);
        
        // 部屋データの同期
        const unsubscribeRoom = window.fb.onValue(roomRef, (snapshot) => {
            const val = snapshot.val();
            if (val) {
                const basePrep = {};
                TEAM_KEYS.forEach(k => {
                    basePrep[k] = { ready: false, traps: ['', '', ''], anti: '' };
                });

                setGameState({
                    status: val.status || 'lobby',
                    theme: val.theme || '',
                    maxTeams: val.maxTeams || 2,
                    scores: val.scores || { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 },
                    currentSingingTeam: val.currentSingingTeam || 'A',
                    players: val.players || {},
                    prepStatus: { ...basePrep, ...(val.prepStatus || {}) },
                    logs: val.logs ? Object.values(val.logs) : [],
                    lastResult: val.lastResult || null
                });

                const myTeam = val.players?.[userId]?.team;
                if (myTeam && val.prepStatus?.[myTeam]) {
                    const teamPrep = val.prepStatus[myTeam];
                    if (!teamPrep.ready) {
                        setLocalTraps(teamPrep.traps || ['', '', '']);
                        setLocalAnti(teamPrep.anti || '');
                    }
                }
            } else {
                setInRoom(false);
            }
        });

        // 「この部屋限定」の履歴監視（WANA_history/部屋コード）
        const historyRef = window.fb.ref(window.fb.db, `WANA_history/${roomCode}`);
        const unsubscribeHistory = window.fb.onValue(historyRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const historyList = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).reverse(); // 最新を一番上に
                setHistories(historyList);
            } else {
                setHistories([]);
            }
        });

        return () => {
            unsubscribeRoom();
            unsubscribeHistory();
        };
    }, [fbReady, roomCode, inRoom, userId]);

    // カスタムダイアログヘルパー
    const triggerAlert = (title, message) => {
        setModalConfig({
            show: true,
            title,
            message,
            type: 'alert',
            onConfirm: null
        });
    };

    const triggerConfirm = (title, message, onConfirmCallback) => {
        setModalConfig({
            show: true,
            title,
            message,
            type: 'confirm',
            onConfirm: onConfirmCallback
        });
    };

    // 3. アクション：入室処理
    const handleJoinRoom = (e) => {
        e.preventDefault();
        if (!roomCode.trim()) return triggerAlert('入力エラー', '合言葉を入力してください！');
        if (!playerName.trim()) return triggerAlert('入力エラー', '名前を入力してください！');

        localStorage.setItem('wanaoke_name', playerName);
        const code = roomCode.trim().toUpperCase();
        setRoomCode(code);

        const roomRef = window.fb.ref(window.fb.db, `WANA_rooms/${code}`);
        
        window.fb.runTransaction(roomRef, (currentData) => {
            const basePrep = {};
            TEAM_KEYS.forEach(k => {
                basePrep[k] = { ready: false, traps: ['', '', ''], anti: '' };
            });

            if (currentData === null) {
                return {
                    status: 'lobby',
                    theme: '',
                    maxTeams: 2,
                    scores: { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 },
                    currentSingingTeam: 'A',
                    players: {
                        [userId]: { name: playerName, team: '' }
                    },
                    prepStatus: basePrep
                };
            } else {
                if (!currentData.players) currentData.players = {};
                currentData.players[userId] = { name: playerName, team: '' };
                if (!currentData.maxTeams) currentData.maxTeams = 2;
                if (!currentData.scores) currentData.scores = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 };
                if (!currentData.prepStatus) currentData.prepStatus = basePrep;
                return currentData;
            }
        }).then(() => {
            setInRoom(true);
        }).catch(err => {
            console.error(err);
            triggerAlert('接続エラー', '入室に失敗しました。もう一度お試しください。');
        });
    };

    // 退室処理
    const handleLeaveRoom = () => {
        triggerConfirm(
            '退出確認',
            'ロビー・メニューに戻りますか？現在のゲームの接続は解除されます。',
            () => {
                if (roomCode && userId) {
                    const playerRef = window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/players/${userId}`);
                    window.fb.remove(playerRef).then(() => {
                        const roomPlayersRef = window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/players`);
                        window.fb.onValue(roomPlayersRef, (snap) => {
                            if (!snap.exists()) {
                                window.fb.remove(window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}`));
                            }
                        }, { onlyOnce: true });
                    });
                }
                setInRoom(false);
                setShowHistory(false);
                setRoomCode('');
                setGameState({
                    status: 'menu',
                    theme: '',
                    maxTeams: 2,
                    scores: { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 },
                    currentSingingTeam: 'A',
                    players: {},
                    prepStatus: {
                        A: { ready: false, traps: ['', '', ''], anti: '' },
                        B: { ready: false, traps: ['', '', ''], anti: '' },
                        C: { ready: false, traps: ['', '', ''], anti: '' },
                        D: { ready: false, traps: ['', '', ''], anti: '' },
                        E: { ready: false, traps: ['', '', ''], anti: '' },
                        F: { ready: false, traps: ['', '', ''], anti: '' }
                    },
                    logs: [],
                    lastResult: null
                });
            }
        );
    };

    // チーム数切り替え
    const handleMaxTeamsChange = (count) => {
        const num = parseInt(count);
        if (num < 2 || num > 6) return;
        window.fb.set(window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/maxTeams`), num);
    };

    // チームを選択
    const selectTeam = (team) => {
        const playerTeamRef = window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/players/${userId}/team`);
        window.fb.set(playerTeamRef, team);
    };

    // ロビーからお題入力に進む
    const goToSetup = () => {
        const playersList = Object.values(gameState.players);
        const unassigned = playersList.filter(p => !p.team || TEAM_KEYS.indexOf(p.team) >= gameState.maxTeams);
        
        if (unassigned.length > 0) {
            triggerConfirm(
                '確認',
                'チーム未選択、または無効なチームに所属しているプレイヤーがいます。このまま進みますか？',
                () => {
                    window.fb.set(window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/status`), 'setup');
                }
            );
        } else {
            window.fb.set(window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/status`), 'setup');
        }
    };

    // お題設定完了
    const handleSaveTheme = (themeText) => {
        if (!themeText.trim()) return triggerAlert('入力エラー', 'お題を入力してください！');
        
        const updates = {};
        updates[`WANA_rooms/${roomCode}/theme`] = themeText.trim();
        updates[`WANA_rooms/${roomCode}/status`] = 'prep';
        updates[`WANA_rooms/${roomCode}/lastResult`] = null;

        for (let i = 0; i < gameState.maxTeams; i++) {
            const key = TEAM_KEYS[i];
            updates[`WANA_rooms/${roomCode}/prepStatus/${key}/ready`] = false;
        }

        window.fb.update(window.fb.ref(window.fb.db), updates);
    };

    // 罠・アンチ罠の入力更新
    const updateLocalCard = (index, value, isAnti = false) => {
        const myTeam = gameState.players?.[userId]?.team;
        if (!myTeam) return;

        let nextTraps = [...localTraps];
        let nextAnti = localAnti;

        if (isAnti) {
            nextAnti = value;
            setLocalAnti(value);
        } else {
            nextTraps[index] = value;
            setLocalTraps(nextTraps);
        }

        const teamPrepRef = window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/prepStatus/${myTeam}`);
        window.fb.update(teamPrepRef, {
            traps: nextTraps,
            anti: nextAnti
        });
    };

    // 仕込み確定
    const submitPrep = () => {
        const myTeam = gameState.players?.[userId]?.team;
        if (!myTeam) return;

        if (localTraps.some(t => !t.trim()) || !localAnti.trim()) {
            return triggerAlert('未入力項目', 'すべての罠曲（3つ）とアンチ罠曲（1つ）を正しく入力してください！');
        }

        const updates = {};
        updates[`WANA_rooms/${roomCode}/prepStatus/${myTeam}/ready`] = true;
        updates[`WANA_rooms/${roomCode}/prepStatus/${myTeam}/traps`] = localTraps.map(t => t.trim());
        updates[`WANA_rooms/${roomCode}/prepStatus/${myTeam}/anti`] = localAnti.trim();

        window.fb.update(window.fb.ref(window.fb.db), updates).then(() => {
            const activeKeys = TEAM_KEYS.slice(0, gameState.maxTeams);
            const prepRef = window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/prepStatus`);
            window.fb.onValue(prepRef, (snapshot) => {
                const currentPrep = snapshot.val() || {};
                const allReady = activeKeys.every(k => currentPrep[k]?.ready === true);
                if (allReady) {
                    window.fb.set(window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/status`), 'sing');
                }
            }, { onlyOnce: true });
        });
    };

    // 歌の判定
    const handleJudgeSong = (e) => {
        e.preventDefault();
        const song = songInput.trim();
        if (!song) return triggerAlert('入力エラー', '曲名を入力してください！');

        const attacker = gameState.currentSingingTeam;
        const activeKeys = TEAM_KEYS.slice(0, gameState.maxTeams);
        const defenders = activeKeys.filter(k => k !== attacker);

        const myAnti = gameState.prepStatus[attacker]?.anti || '';
        const isAntiTrapped = myAnti.toLowerCase() === song.toLowerCase();

        let hitDefenders = [];
        defenders.forEach(defKey => {
            const enemyTraps = gameState.prepStatus[defKey]?.traps || [];
            const isHit = enemyTraps.some(t => t.toLowerCase() === song.toLowerCase());
            if (isHit) {
                hitDefenders.push(defKey);
            }
        });

        const isTrapped = hitDefenders.length > 0;
        let logMsg = "";
        let resultType = "";
        const nextScores = { ...gameState.scores };

        if (isTrapped && isAntiTrapped) {
            resultType = "anti";
            nextScores[attacker] = (nextScores[attacker] || 0) + 2;
            logMsg = `🎤 チーム${attacker} [${gameState.players[userId]?.name || 'プレイヤー'}]: 『${song}』 ➔ 💥アンチ罠発動！仕掛けられた罠[${hitDefenders.map(d => 'チーム'+d).join(', ')}]を完全無効化し歌唱成功！ (+2pt)`;
        } else if (isTrapped) {
            resultType = "trap";
            hitDefenders.forEach(d => {
                nextScores[d] = (nextScores[d] || 0) + 2;
            });
            logMsg = `💀 チーム${attacker} [${gameState.players[userId]?.name || 'プレイヤー'}]: 『${song}』 ➔ 罠にかかりました！歌えません！ (仕掛けた${hitDefenders.map(d => 'チーム'+d).join(', ')}に +2pt)`;
        } else {
            resultType = "safe";
            nextScores[attacker] = (nextScores[attacker] || 0) + 1;
            logMsg = `🎵 チーム${attacker} [${gameState.players[userId]?.name || 'プレイヤー'}]: 『${song}』 ➔ セーフ！普通に歌います。 (+1pt)`;
        }

        const updates = {};
        TEAM_KEYS.forEach(k => {
            updates[`WANA_rooms/${roomCode}/scores/${k}`] = nextScores[k] || 0;
        });
        
        const logRef = window.fb.push(window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/logs`));
        updates[`WANA_rooms/${roomCode}/logs/${logRef.key}`] = {
            text: logMsg,
            timestamp: Date.now()
        };

        updates[`WANA_rooms/${roomCode}/lastResult`] = {
            song: song,
            type: resultType,
            attacker: attacker,
            hitDefenders: hitDefenders,
            pointsEarned: resultType === 'anti' ? 2 : (resultType === 'safe' ? 1 : 0)
        };

        window.fb.update(window.fb.ref(window.fb.db), updates).then(() => {
            setSongInput('');
        });
    };

    // ターン交代
    const toggleTurn = () => {
        const activeKeys = TEAM_KEYS.slice(0, gameState.maxTeams);
        const currentIndex = activeKeys.indexOf(gameState.currentSingingTeam);
        const nextIndex = (currentIndex + 1) % activeKeys.length;
        const nextTeam = activeKeys[nextIndex];

        window.fb.set(window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/currentSingingTeam`), nextTeam);
    };

    // 答え合わせ（罠公開）へ進む
    const handleGoToResult = () => {
        triggerConfirm(
            'ラウンド終了',
            '今回のラウンドを終了して、すべての罠を公開しますか？',
            () => {
                window.fb.set(window.fb.ref(window.fb.db, `WANA_rooms/${roomCode}/status`), 'result');
            }
        );
    };

    // 次のラウンドへ
    const handleNextRound = () => {
        const updates = {};
        updates[`WANA_rooms/${roomCode}/status`] = 'setup';
        updates[`WANA_rooms/${roomCode}/theme`] = '';
        updates[`WANA_rooms/${roomCode}/lastResult`] = null;

        TEAM_KEYS.forEach(k => {
            updates[`WANA_rooms/${roomCode}/prepStatus/${k}`] = { ready: false, traps: ['', '', ''], anti: '' };
        });

        window.fb.update(window.fb.ref(window.fb.db), updates);
    };

    // 部屋データを初期化し、この部屋の履歴に結果を記録する
    const handleEndAndSave = () => {
        triggerConfirm(
            'ゲーム完全終了',
            'ゲームを完全に終了し、この部屋の履歴に結果を保存しますか？（スコアボードがリセットされ、ロビーに戻ります）',
            () => {
                const activeKeys = TEAM_KEYS.slice(0, gameState.maxTeams);
                const activeScores = {};
                const activeTraps = {};
                activeKeys.forEach(k => {
                    activeScores[k] = gameState.scores[k] || 0;
                    activeTraps[k] = gameState.prepStatus[k];
                });

                let maxScore = -1;
                let winners = [];
                activeKeys.forEach(k => {
                    const score = activeScores[k];
                    if (score > maxScore) {
                        maxScore = score;
                        winners = [k];
                    } else if (score === maxScore) {
                        winners.push(k);
                    }
                });

                const winnerText = winners.length === activeKeys.length 
                    ? '全員引き分け' 
                    : winners.map(w => TEAM_NAMES[w].name).join(' & ');

                const historyData = {
                    roomCode: roomCode,
                    date: new Date().toLocaleString('ja-JP'),
                    theme: gameState.theme,
                    maxTeams: gameState.maxTeams,
                    scores: activeScores,
                    winner: winnerText,
                    traps: activeTraps,
                    logs: gameState.logs.map(l => l.text)
                };

                // 「WANA_history/${roomCode}」の下に保存する（部屋隔離）
                const historyRef = window.fb.ref(window.fb.db, `WANA_history/${roomCode}`);
                const newHistoryRef = window.fb.push(historyRef);
                
                window.fb.set(newHistoryRef, historyData).then(() => {
                    const updates = {};
                    updates[`WANA_rooms/${roomCode}/status`] = 'lobby';
                    updates[`WANA_rooms/${roomCode}/theme`] = '';
                    updates[`WANA_rooms/${roomCode}/lastResult`] = null;
                    updates[`WANA_rooms/${roomCode}/logs`] = null;

                    TEAM_KEYS.forEach(k => {
                        updates[`WANA_rooms/${roomCode}/scores/${k}`] = 0;
                        updates[`WANA_rooms/${roomCode}/prepStatus/${k}`] = { ready: false, traps: ['', '', ''], anti: '' };
                    });
                    
                    window.fb.update(window.fb.ref(window.fb.db), updates).then(() => {
                        triggerAlert('保存完了', 'ゲーム結果を「この部屋専用の履歴」に記録し、ロビーを初期化しました！');
                    });
                });
            }

                                    </button>
                                </form>
                                <p className="text-[10px] text-slate-500 mt-2">※他のチームが登録した「罠」と、自チームの「アンチ罠」をすべてリアルタイムでチェックします。</p>
                            </div>

                            {/* 履歴ログ */}
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                <h3 className="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2">
                                    <i className="fa-solid fa-list-ul text-slate-400"></i> 本ラウンドのログ
                                </h3>
                                <div className="bg-slate-950/60 rounded-xl p-4 max-h-[220px] overflow-y-auto border border-slate-850">
                                    {gameState.logs.length === 0 ? (
                                        <p className="text-slate-500 text-xs text-center py-4">まだ履歴はありません。</p>
                                    ) : (
                                        <ul className="space-y-2.5 text-xs text-slate-300">
                                            {gameState.logs.slice().reverse().map((log, index) => (
                                                <li key={index} className="border-b border-slate-800/60 pb-2">
                                                    {log.text}
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                            </div>

                            {/* ラウンド終了 */}
                            <div className="flex justify-end pt-4">
                                <button 
                                    onClick={handleGoToResult}
                                    className="bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-black px-6 py-3 rounded-lg shadow-md"
                                >
                                    答え合わせ ＆ 罠公開へ
                                </button>
                            </div>
                        </div>
                    )}

                    {/* -------------------- 6. ラウンド終了 & 答え合わせ -------------------- */}
                    {inRoom && gameState.status === 'result' && (
                        <div className="space-y-6">
                            <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-xl text-center">
                                <span className="text-4xl">🏁</span>
                                <h2 className="text-3xl font-black font-logo text-yellow-400 my-3">
                                    ラウンド終了！答え合わせ
                                </h2>
                                <p className="text-slate-400 text-sm mb-8">
                                    各チームが秘密に仕込んでいた罠カードはこちらでした！
                                </p>

                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-8 text-left">
                                    {activeTeams.map(k => {
                                        const team = TEAM_NAMES[k];
                                        return (
                                            <div key={k} className={`${team.bg} border ${team.border} rounded-xl p-5`}>
                                                <h3 className={`text-lg font-bold ${team.color} border-b border-slate-850 pb-2 mb-3 flex justify-between`}>
                                                    <span>{team.name}</span>
                                                    <span className="font-mono font-black">{gameState.scores[k] || 0} pt</span>
                                                </h3>
                                                <div className="space-y-4">
                                                    <div>
                                                        <span className="text-[10px] text-pink-400 font-bold block mb-1">💀 罠カード</span>
                                                        <ul className="list-disc pl-5 text-xs text-slate-300 space-y-1 font-semibold">
                                                            {gameState.prepStatus[k]?.traps?.map((t, idx) => (
                                                                <li key={idx} className="truncate">{t || '（未登録）'}</li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                    <div>
                                                        <span className="text-[10px] text-cyan-400 font-bold block mb-1">🛡️ アンチ罠</span>
                                                        <span className="text-xs font-semibold text-slate-300 truncate block">
                                                            {gameState.prepStatus[k]?.anti || '（未登録）'}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="border-t border-slate-800 pt-8 flex flex-col sm:flex-row justify-center gap-4">
                                    <button 
                                        onClick={handleNextRound}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-lg shadow-lg"
                                    >
                                        別のお題で次のラウンドへ
                                    </button>
                                    <button 
                                        onClick={handleEndAndSave}
                                        className="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 px-6 rounded-lg shadow-lg"
                                    >
                                        ゲームを完全終了して履歴に保存
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </main>
            )}

            {/* この部屋限定・過去の履歴表示ページ（フルスクリーン overlay） */}
            {inRoom && showHistory && (
                <div className="fixed inset-0 bg-slate-950/95 z-50 overflow-y-auto p-4 md:p-8 flex flex-col">
                    <div className="max-w-4xl mx-auto w-full flex-grow flex flex-col">
                        <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                            <div className="flex items-center gap-3">
                                <span className="text-2xl text-amber-500"><i className="fa-solid fa-clock-rotate-left"></i></span>
                                <div>
                                    <h2 className="text-2xl font-bold font-logo text-yellow-400">
                                        部屋「{roomCode}」の過去ログ
                                    </h2>
                                    <p className="text-xs text-slate-400">この合言葉の部屋で過去に行われた対戦履歴のみが表示されています。</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => setShowHistory(false)}
                                className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg font-bold text-sm transition"
                            >
                                ✕ ゲーム画面に戻る
                            </button>
                        </div>
                        
                        {histories.length === 0 ? (
                            <div className="flex-grow flex flex-col justify-center items-center py-20 text-slate-500">
                                <span className="text-5xl mb-4">📭</span>
                                <p className="text-base font-bold">保存された履歴はありません。</p>
                                <p className="text-xs text-slate-600 mt-1">この部屋でゲームを「完全終了して保存」するとここに記録されます。</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pb-12">
                                {histories.map((h) => (
                                    <div key={h.id} className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col justify-between">
                                        <div>
                                            <div className="flex justify-between items-start mb-3 border-b border-slate-800/80 pb-2">
                                                <span className="text-xs text-slate-400">{h.date}</span>
                                                <span className="text-xs bg-yellow-950/30 text-yellow-400 px-2 py-0.5 rounded border border-yellow-850/20 font-mono">
                                                    ROOM: {h.roomCode}
                                                </span>
                                            </div>
                                            <div className="mb-4">
                                                <span className="text-[10px] text-purple-400 font-bold block uppercase tracking-wider">お題</span>
                                                <span className="text-lg font-black text-yellow-300 font-logo">{h.theme}</span>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-3 mb-4">
                                                {Object.keys(h.scores || {}).map(teamKey => {
                                                    const team = TEAM_NAMES[teamKey];
                                                    if (!team) return null;
                                                    return (
                                                        <div key={teamKey} className={`${team.bg} border ${team.border} rounded p-2.5 text-xs`}>
                                                            <div className={`font-bold ${team.color} mb-1 flex justify-between`}>
                                                                <span>{team.name}</span>
                                                                <span>{h.scores[teamKey]}点</span>
                                                            </div>
                                                            <div className="text-[10px] text-slate-500 mb-0.5">💀 罠</div>
                                                            <ul className="list-disc pl-4 text-slate-300 space-y-0.5 mb-1.5">
                                                                {h.traps?.[teamKey]?.traps?.map((t, idx) => <li key={idx} className="truncate">{t}</li>) || <li>未登録</li>}
                                                            </ul>
                                                            <div className="text-[10px] text-slate-500">🛡️ アンチ</div>
                                                            <span className="text-slate-300 font-semibold truncate block">{h.traps?.[teamKey]?.anti || '未登録'}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                        
                                        <div className="border-t border-slate-800/80 pt-3 flex justify-between items-center text-xs">
                                            <span className="bg-slate-800 px-2.5 py-1 rounded text-slate-300 font-bold">
                                                🏆 勝者: {h.winner}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            )}

            {/* カスタムダイアログ（alert/confirmの置き換え） */}
            {modalConfig.show && (
                <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                        <div className="flex items-center gap-2 text-yellow-500 text-lg font-bold">
                            <i className="fa-solid fa-triangle-exclamation"></i>
                            <h4>{modalConfig.title}</h4>
                        </div>
                        <p className="text-sm text-slate-300 leading-relaxed">{modalConfig.message}</p>
                        <div className="flex justify-end gap-3 pt-2">
                            {modalConfig.type === 'confirm' && (
                                <button
                                    onClick={() => setModalConfig({ ...modalConfig, show: false })}
                                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-semibold text-xs transition"
                                >
                                    キャンセル
                                </button>
                            )}
                            <button
                                onClick={() => {
                                    setModalConfig({ ...modalConfig, show: false });
                                    if (modalConfig.onConfirm) modalConfig.onConfirm();
                                }}
                                className="px-4 py-2 bg-gradient-to-r from-pink-600 to-indigo-600 hover:from-pink-500 hover:to-indigo-500 text-white rounded font-bold text-xs shadow transition"
                            >
                                OK
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* フッター */}
            <footer className="mt-12 text-center text-xs text-slate-500 border-t border-slate-900 pt-6 pb-4">
                <p>© 2026 ワナオケ（罠オケ）カウンターオンライン. All rights reserved.</p>
            </footer>
        </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>

</body>
</html>
