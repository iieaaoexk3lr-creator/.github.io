<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>回転円障害物 プレビュー</title>
  <style>
    body { margin: 0; background: #050508; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; font-family: sans-serif; overflow: hidden; }
    canvas { border: 1px solid #334466; background: #0a0d14; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
  </style>
</head>
<body>

<canvas id="preview" width="360" height="640"></canvas>

<script>
const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');

// 障害物の設定値
const ROTATION_PERIOD = 10000; // 10秒で1回転 (ms)
const GAP_SIZE_PX = 50;        // 隙間の広さ (50px)

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // コースの中心座標と半径（底辺サイズ基準）
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2 + 30;
  const radius = (canvas.width - 80) / 2; // 約140px

  // 時間経過による回転角度 (10秒で2π rad)
  const now = performance.now();
  const baseAngle = ((now % ROTATION_PERIOD) / ROTATION_PERIOD) * Math.PI * 2;

  // 50pxの隙間に対応する角度(ラジアン)
  const gapAngle = GAP_SIZE_PX / radius;
  const arcSegmentAngle = (Math.PI / 2) - gapAngle; // 90度 - 隙間分

  ctx.save();
  ctx.shadowColor = '#ff0055';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = '#ff0055';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';

  // 4箇所の壁（円弧）を描画
  for (let i = 0; i < 4; i++) {
    const startA = baseAngle + i * (Math.PI / 2) + (gapAngle / 2);
    const endA = startA + arcSegmentAngle;

    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, startA, endA);
    ctx.stroke();
  }

  // 中心軸ガイド
  ctx.fillStyle = '#ff0055';
  ctx.beginPath();
  ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // テキスト注釈
  ctx.fillStyle = '#00ffcc';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('10秒/1回転 (ネオンピンク壁)', centerX, centerY - radius - 20);
  ctx.fillText(`通れる隙間: ${GAP_SIZE_PX}px`, centerX, centerY + radius + 30);

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
