<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💣 マイクボンバー - 完全復活・統合システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap');
    
    :root {
      --bg-color: #e5ebf0; 
      --studio-wall-light: #f5f8fa;
      --studio-wall-dark: #cbd4de;
      --metallic-frame: #788896;
      --accent-gold: #d4af37;
      --text-color: #202530;
    }

    body {
      font-family: 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(to bottom, var(--studio-wall-light) 0%, var(--bg-color) 60%, var(--studio-wall-dark) 100%);
      color: var(--text-color);
    }

    /* --- お題表示（ゴールド枠） --- */
    #question { 
      font-size: 2.2rem; 
      font-weight: bold;
      background: linear-gradient(to bottom, #ffffff 0%, #f7f9fb 100%);
      border: 6px solid #d5b042;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15), inset 0 0 8px rgba(255,255,255,1);
    }
    #question::before {
      content: "Q. ";
      color: #c01c1c;
      font-size: 2.4rem;
      font-weight: 900;
    }

    /* --- マイクステージ（スクロールゾーン） --- */
    .stage-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(to bottom, #bdcad6 0%, #e2ebf3 100%);
      padding: 15px 10px;
      border-left: 3px solid #fff;
      border-right: 3px solid #cbd5de;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
      flex: 0 0 150px; 
      border-radius: 8px;
    }

    .timer-box {
      font-size: 2.5rem;
      font-weight: 900;
      font-family: 'Impact', 'Arial Black', sans-serif;
      color: #e60012;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.2);
    }

    .mic-container {
      width: 100px;
      height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .mic-head {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at 30% 30%, #666, #222);
      border-radius: 50%;
      border: 3px solid #444;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
      z-index: 5;
    }
    .mic-head::after {
      content: "";
      position: absolute;
      width: 100%; height: 100%;
      background-image: radial-gradient(#444 1px, transparent 1px);
      background-size: 4px 4px;
      opacity: 0.5;
    }

    .answer-box {
      width: 60px;
      height: 380px; 
      margin-top: -10px; 
      font-size: 2.5rem; 
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      z-index: 1;
      border: 4px solid #333;
      border-top: none;
      box-sizing: border-box;
    }

    .mic-bottom {
      width: 56px;
      height: 35px;
      background: linear-gradient(to bottom, #333, #111);
      border-radius: 5px 5px 15px 15px;
      border: 3px solid #444;
      z-index: 2;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    .answer-box span {
      position: relative;
      z-index: 4;
      text-shadow: 0 1px 4px rgba(255,255,255,0.8);
      color: #222;
    }

    .fill {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 0%; 
      background: linear-gradient(to right, #b30000 0%, #ff2a2a 30%, #ff6666 50%, #ff2a2a 70%, #800000 100%);
      box-shadow: 0 0 20px #ff0000;
      z-index: 3;
      opacity: 0.95;
    }

    /* 不正解フラッシュ */
    @keyframes wrongFlash {
      0% { background: #ff0044; box-shadow: 0 0 30px #ff0044; }
      50% { background: transparent; box-shadow: none; }
      100% { background: #ff0044; box-shadow: 0 0 30px #ff0044; }
    }
    .wrongFlash { animation: wrongFlash 0.3s ease-out 2; }

    /* 特殊エフェクト */
    #successEffect {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 5rem; font-weight: 900; color: #009944; text-shadow: 0 0 30px rgba(255,255,255,1);
      z-index: 999;
    }
    #explosion {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 12rem; z-index: 999;
    }
  </style>
</head>
<body class="text-center p-3 m-0 min-h-screen flex flex-col items-center">

  <div class="w-full max-w-6xl">
    
    <h1 class="text-5xl font-black my-4 tracking-wider uppercase drop-shadow" style="font-family: 'Impact', sans-serif;">
      <span class="text-[#00e5ff]">マ</span><span class="text-[#ff2a2a]">イ</span><span class="text-[#00ff66]">ク</span><span class="text-[#ffea00]">ボ</span><span class="text-[#cc33ff]">ンバー</span>
    </h1>

    <div class="mb-3 flex justify-center items-center gap-2">
      <input type="password" id="adminKeyInput" placeholder="管理キー" class="w-24 bg-white text-black px-3 py-1.5 rounded-xl border border-gray-400 text-xs focus:outline-none">
      <button id="authBtn" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all">⚙️ 操作パネル表示</button>
    </div>

    <div id="adminPanel" class="hidden bg-slate-900 text-white border-4 border-red-500 rounded-3xl p-5 mb-6 text-left max-w-2xl mx-auto shadow-2xl space-y-4">
      <h2 class="text-base font-black text-red-400 flex justify-between items-center">
        <span>⚙️ マイクボンバー MC専用コントロール</span>
        <button onclick="resetGame()" class="text-xs bg-gray-800 px-2 py-1 rounded border border-gray-700 text-white">システムリセット</button>
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-black/30 p-3 rounded-xl border border-gray-800">
        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1">■ スコア加算先チーム</label>
          <div class="grid grid-cols-2 gap-2">
            <button id="setTeamA" onclick="selectTargetTeam('Aチーム')" class="py-2 rounded-lg border-2 border-gray-700 font-bold text-xs bg-gray-800 text-white">Aチーム</button>
            <button id="setTeamB" onclick="selectTargetTeam('Bチーム')" class="py-2 rounded-lg border-2 border-gray-700 font-bold text-xs bg-gray-800 text-white">Bチーム</button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1">■ スタジオ基本設定</label>
          <div class="flex items-center gap-2 text-xs">
            <span>秒数:</span><input type="number" id="timeInput" value="50" class="w-12 text-black p-1 rounded text-center">
            <span>本数:</span>
            <select id="barCount" class="text-black p-1 rounded">
              <option value="4">4本</option>
              <option value="5">5本</option>
              <option value="6">6本</option>
              <option value="7">7本</option>
              <option value="8" selected>8本</option>
            </select>
          </div>
        </div>
      </div>

      <div class="border-t border-gray-800 pt-3">
        <div class="bg-black/40 px-3 py-2 rounded-xl border border-gray-800 flex justify-between items-center text-xs">
          <span class="text-yellow-400 font-bold">🎁 1問正解あたりの配点 :</span>
          <select id="pointPerAnswer" class="text-black p-1 rounded font-bold">
            <option value="10" selected>10 点</option>
            <option value="11">11 点</option>
            <option value="12">12 点</option>
            <option value="15">15 点</option>
            <option value="20">20 点</option>
          </select>
        </div>

        <div class="mt-3 flex justify-between items-center text-xs bg-black/20 p-2 rounded">
          <span>加算ターゲット: <b id="adminTargetDisplay" class="text-red-400 text-sm">Aチーム</b></span>
          <button onclick="applySettings()" class="bg-blue-600 px-3 py-1.5 rounded font-bold text-white text-xs">設定を適用してマイク再生成</button>
        </div>

        <button onclick="submitFinalScore()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-sm mt-4 shadow-lg transition-all">
          この内容でチームポイントを確定送信（手元は自動リセット）
        </button>
      </div>
    </div>

    <div id="question" class="w-[95%] max-w-[1400px] mx-auto my-3 px-6 py-4 rounded-2xl text-slate-900 font-bold text-3xl"></div>

    <div id="score" class="text-xl font-bold text-red-700 mb-2">
      手元正解数：<span>0</span>
      <button onclick="resetScore()" class="bg-gray-500 text-white font-bold text-xs px-2 py-1 rounded ml-2">リセット</button>
    </div>

    <div id="gameZone" class="flex justify-start items-stretch gap-5 mx-auto my-4 p-6 bg-white/40 rounded-2xl shadow-inner w-full overflow-x-auto min-h-[620px] scroll-smooth">
    </div>

    <div class="flex flex-col gap-3 max-w-xl mx-auto my-4 w-[95%]">
      <div class="flex gap-4">
        <button class="game-btn btn-correct flex-1 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-black py-5 rounded-2xl text-2xl shadow-lg active:scale-95" onclick="markCorrect()">正解 ○</button>
        <button class="game-btn btn-wrong flex-1 bg-gradient-to-r from-red-500 to-pink-600 text-white font-black py-5 rounded-2xl text-2xl shadow-lg active:scale-95" onclick="markWrong()">不正解 ✕</button>
      </div>
      <div class="flex gap-2">
        <button id="startBtn" class="flex-[2] bg-gradient-to-r from-sky-500 to-blue-600 text-white font-black py-4 rounded-xl text-lg shadow" onclick="handleStartToggle()">START</button>
        <button id="nextBtn" class="flex-[2] bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-black py-4 rounded-xl text-lg shadow" onclick="nextQuestion()" style="display:none;">次の問題へ</button>
        <button class="flex-1 bg-gray-500 text-white font-bold py-4 rounded-xl text-sm" onclick="resetGame()">タイマーリセット</button>
      </div>
      <button class="bg-slate-600 text-white font-bold py-3 rounded-xl text-sm mt-2" onclick="location.href='6gatu.html'">メニューへ戻る</button>
    </div>

  </div>

  <div id="successEffect">STAGE CLEAR!! ✨</div>
  <div id="explosion">💥</div>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

  <script>
    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
      authDomain: "gamehistory-m84.firebaseapp.com",
      databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
      projectId: "gamehistory-m84",
      storageBucket: "gamehistory-m84.firebasestorage.app",
      messagingSenderId: "475761727837",
      appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
      measurementId: "G-3636W6LC4F"
    };
    firebase.initializeApp(firebaseConfig);
    const firestore = firebase.firestore();

    /* -------------------------
        WebAudio：効果音発振器
    ------------------------- */
    function playCorrect(){
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o1 = ctx.createOscillator(); const g1 = ctx.createGain();
        o1.type = "sine"; o1.frequency.setValueAtTime(784, ctx.currentTime); g1.gain.setValueAtTime(0.25, ctx.currentTime);
        o1.connect(g1); g1.connect(ctx.destination); o1.start(); o1.stop(ctx.currentTime + 0.18);
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.type = "sine"; o2.frequency.setValueAtTime(1046, ctx.currentTime + 0.18); g2.gain.setValueAtTime(0.25, ctx.currentTime + 0.18);
        o2.connect(g2); g2.connect(ctx.destination); o2.start(ctx.currentTime + 0.18); o2.stop(ctx.currentTime + 0.45);
    }
    function playWrong(){
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = "square"; osc.frequency.setValueAtTime(120, ctx.currentTime); gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.connect(gain); gain.connect(ctx.destination); osc.start();
        osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.3); osc.stop(ctx.currentTime + 0.3);
    }
    function playExplosion(){
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = 2 * ctx.sampleRate; const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { output[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize); }
        const noise = ctx.createBufferSource(); noise.buffer = noiseBuffer; const gain = ctx.createGain();
        gain.gain.setValueAtTime(1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
        noise.connect(gain); gain.connect(ctx.destination); noise.start(); noise.stop(ctx.currentTime + 1);
    }

    /* -------------------------
        ゲーム状態変数
    ------------------------- */
    let barNum = 8; // 初期設定を8本へ変更
    let timeLimit = 50;
    let timeLeft = 50;
    let found = 0;
    let timerId;
    let started = false;
    let isPaused = false;
    let timerStopped = [];
    let totalScore = 0;
    let questionCount = 1;
    let activeTeam = "Aチーム";

    const barColors = [
      "linear-gradient(to right, #0088cc 0%, #00e5ff 30%, #ffffff 50%, #00e5ff 70%, #005588 100%)", 
      "linear-gradient(to right, #00aa00 0%, #00ff66 30%, #ffffff 50%, #00ff66 70%, #005500 100%)", 
      "linear-gradient(to right, #cc9900 0%, #ffea00 30%, #ffffff 50%, #ffea00 70%, #664400 100%)", 
      "linear-gradient(to right, #9900cc 0%, #cc33ff 30%, #ffffff 50%, #cc33ff 70%, #440066 100%)", 
      "linear-gradient(to right, #cc0066 0%, #ff1493 30%, #ffffff 50%, #ff1493 70%, #660033 100%)"
    ];
    const barNeonShadows = [
      "0 0 25px rgba(0, 229, 255, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.5)",
      "0 0 25px rgba(0, 255, 102, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.5)",
      "0 0 25px rgba(255, 234, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.5)",
      "0 0 25px rgba(204, 51, 255, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.5)",
      "0 0 25px rgba(255, 20, 147, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.5)"
    ];

    const defaultQuestions = [
        "第一問",
        "第二問",
        "第三問",
        "第四問",
        "第五問"
    ];
    let questions = [...defaultQuestions];
    let currentQuestionIndex = 0;

    // パネル認証
    document.getElementById("authBtn").onclick = () => {
      if (document.getElementById("adminKeyInput").value === "0001") {
        document.getElementById("adminPanel").classList.toggle("hidden");
        document.getElementById("adminKeyInput").value = "";
        syncAdminUI();
      } else {
        alert("管理キーが違います。");
      }
    };

    window.selectTargetTeam = (teamName) => {
      activeTeam = teamName;
      syncAdminUI();
    };

    function syncAdminUI() {
      document.getElementById("adminTargetDisplay").textContent = activeTeam;
      const btnA = document.getElementById("setTeamA");
      const btnB = document.getElementById("setTeamB");
      if(activeTeam === "Aチーム") {
        btnA.className = "py-2 rounded-lg border-2 border-red-500 font-black text-xs bg-red-950 text-red-200";
        btnB.className = "py-2 rounded-lg border-2 border-gray-700 font-bold text-xs bg-gray-800 text-white";
      } else {
        btnA.className = "py-2 rounded-lg border-2 border-gray-700 font-bold text-xs bg-gray-800 text-white";
        btnB.className = "py-2 rounded-lg border-2 border-red-500 font-black text-xs bg-red-950 text-red-200";
      }
    }

    function applySettings() {
      barNum = Number(document.getElementById("barCount").value);
      timeLimit = Number(document.getElementById("timeInput").value);
      resetGame();
    }

    function refreshQuestionDisplay() {
      document.getElementById("question").textContent = questions[currentQuestionIndex];
    }

    // --- ⚡️ 3Dマイクバー群の初期描画システム ---
    function init() {
      timeLeft = timeLimit;
      found = 0;
      started = false;
      isPaused = false;
      timerStopped = Array(barNum).fill(false);
      
      refreshQuestionDisplay();
      document.getElementById("score").querySelector("span").textContent = totalScore;
      
      const startBtn = document.getElementById("startBtn");
      startBtn.style.display = "inline-block";
      startBtn.textContent = "START";
      
      document.getElementById("nextBtn").style.display = "none";
      
      // マイクバーの構築
      const gameZone = document.getElementById("gameZone");
      gameZone.innerHTML = "";

      for (let i = 0; i < barNum; i++) {
        const container = document.createElement("div");
        container.className = "stage-container";
        container.id = "stage" + i;

        const t = document.createElement("div");
        t.className = "timer-box";
        t.id = "timer" + i;
        t.textContent = timeLeft;
        container.appendChild(t);

        const mic = document.createElement("div");
        mic.className = "mic-container";

        const head = document.createElement("div");
        head.className = "mic-head";
        mic.appendChild(head);

        const box = document.createElement("div");
        box.className = "answer-box";
        box.id = "box" + i;
        box.style.background = barColors[i % barColors.length];
        box.style.boxShadow = barNeonShadows[i % barNeonShadows.length];

        const fill = document.createElement("div");
        fill.className = "fill";
        fill.id = "fill" + i;

        box.appendChild(fill);
        box.innerHTML += "<span>？</span>";
        mic.appendChild(box);

        const bottom = document.createElement("div");
        bottom.className = "mic-bottom";
        mic.appendChild(bottom);

        container.appendChild(mic);
        gameZone.appendChild(container);
      }
      gameZone.scrollLeft = 0;
      
      // 配信状態同期
      firestore.collection("rooms").doc("bombSession").set({
        activeTeam: activeTeam,
        questionNumber: questionCount,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
    }

    function handleStartToggle() {
      const startBtn = document.getElementById("startBtn");
      if (!started) {
        started = true;
        isPaused = false;
        startBtn.textContent = "PAUSE (審議)";
        startTimer();
        focusBar(0);
      } else {
        if (!isPaused) {
          isPaused = true;
          clearInterval(timerId);
          startBtn.textContent = "RESUME (再開)";
        } else {
          isPaused = false;
          startBtn.textContent = "PAUSE (審議)";
          startTimer();
        }
      }
    }

    function startTimer() {
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        for (let i = 0; i < barNum; i++) {
          if (!timerStopped[i]) {
            const timerEl = document.getElementById("timer" + i);
            if (timerEl) timerEl.textContent = timeLeft;
            const fillEl = document.getElementById("fill" + i);
            if (fillEl) {
                const percent = ((timeLimit - timeLeft) / timeLimit) * 100;
                fillEl.style.height = percent + "%";
            }
          }
        }
        if (timeLeft <= 0) {
          clearInterval(timerId);
          triggerExplosion();
        }
      }, 1000);
    }

    function focusBar(index) {
      if (index < barNum) {
        const targetElement = document.getElementById("stage" + index);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      }
    }

    function markCorrect() {
      if (!started || isPaused) return;
      playCorrect();
      timerStopped[found] = true;
      const box = document.getElementById("box" + found);
      box.querySelector("span").innerHTML = "<span style='color:#fff; font-size:3.5rem; text-shadow:0 0 15px #fff;'>○</span>";
      found++;
      totalScore++;
      document.getElementById("score").querySelector("span").textContent = totalScore;
      
      if (found === barNum) {
        clearInterval(timerId);
        showSuccess();
        started = false;
        document.getElementById("startBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "inline-block";
      } else {
        focusBar(found);
      }
    }

    function markWrong() {
      if (!started || isPaused) return;
      playWrong();
      const box = document.getElementById("box" + found);
      box.classList.add("wrongFlash");
      setTimeout(() => box.classList.remove("wrongFlash"), 600);
      focusBar(found);
    }

    function triggerExplosion() {
      document.getElementById("explosion").style.display = "block";
      playExplosion();
      started = false;
      document.getElementById("startBtn").style.display = "none";
      setTimeout(() => { document.getElementById("explosion").style.display = "none"; }, 900);
      document.getElementById("nextBtn").style.display = "inline-block";
    }

    function showSuccess() {
      document.getElementById("successEffect").style.display = "block";
      setTimeout(() => { document.getElementById("successEffect").style.display = "none"; }, 1200);
    }

    function nextQuestion() {
      currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
      questionCount++;
      init();
    }

    function resetScore() {
      totalScore = 0;
      document.getElementById("score").querySelector("span").textContent = totalScore;
    }

    function resetGame() {
      clearInterval(timerId);
      init();
    }

    // --- 🚀 【機能統合】手元の正解カウント×配点を一括送信処理 ---
    window.submitFinalScore = async () => {
      const pointPerAnswer = parseInt(document.getElementById("pointPerAnswer").value) || 10;
      const finalCalculatedScore = totalScore * pointPerAnswer;

      if (totalScore === 0) {
        if (!confirm("手元の正解数が0です。このまま送信しますか？")) return;
      }

      try {
        // 代表ドキュメントとしてチームスコアを直接インクリメント保存する
        const docRef = firestore.collection("gameResults").doc(`${activeTeam}_総合スコア`);
        
        await docRef.set({
          room: activeTeam,
          name: "チーム合計",
          score_bomb: firebase.firestore.FieldValue.increment(finalCalculatedScore),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        // トータルスコア同期（既存ロジックを担保）
        const docSnap = await docRef.get();
        if (docSnap.exists()) {
          const data = docSnap.data();
          const bomb = data.score_bomb || 0;
          const trans = data.score_translate || 0;
          const rev = data.score_reverse || 0;
          await docRef.update({ totalScore: bomb + trans + rev });
        }

        alert(`🏆 【${activeTeam}】に得点を加算しました！\n（手元正解数: ${totalScore}回 × 1問 ${pointPerAnswer}点 ＝ ＋${finalCalculatedScore}点）`);
        
        // 送信が完了したら手元カウンターをリセット
        resetScore();
      } catch (error) {
        alert("送信・集計エラー: " + error.message);
      }
    };

    // 初期起動
    init();
  </script>
</body>
</html>
