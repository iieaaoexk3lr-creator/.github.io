<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💣 マイクボンバー - コントロールシステム（8人対応版）</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap');
  body {
    font-family: 'Noto+Sans+JP', sans-serif;
    background: #0d0d12;
    color: #fff;
  }
  .bomb-gradient {
    background: linear-gradient(135deg, #f12711, #f5af19);
  }
  .glass-box {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
</style>
</head>
<body class="p-4 min-h-screen flex flex-col items-center">

  <div class="w-full max-w-md flex flex-col min-h-screen justify-between pb-6">
    
    <div>
      <div class="mb-4 flex justify-end items-center gap-2">
        <input type="password" id="adminKeyInput" placeholder="管理キー" class="w-24 bg-gray-800 text-white px-3 py-1 rounded-xl border border-gray-700 text-xs focus:outline-none">
        <button id="authBtn" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded-xl text-xs font-bold transition-all">Panel</button>
      </div>

      <div id="adminPanel" class="hidden bg-gray-900 border-2 border-red-500 rounded-3xl p-5 mb-6 shadow-2xl space-y-4">
        <h2 class="text-base font-black text-red-500 flex justify-between items-center">
          <span>⚙️ マイクボンバー MC操作パネル</span>
          <button onclick="resetBombState()" class="text-xs bg-gray-800 px-2 py-1 rounded border border-gray-700">状態クリア</button>
        </h2>

        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1.5">1. 挑戦するチームを選択</label>
          <div class="grid grid-cols-2 gap-2">
            <button id="setTeamA" onclick="selectTargetTeam('Aチーム')" class="py-2.5 rounded-xl border-2 border-gray-700 font-bold text-sm bg-gray-800 transition-all">Aチーム</button>
            <button id="setTeamB" onclick="selectTargetTeam('Bチーム')" class="py-2.5 rounded-xl border-2 border-gray-700 font-bold text-sm bg-gray-800 transition-all">Bチーム</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1.5">2. 問題カウント（口頭で出題）</label>
          <div class="flex items-center justify-between bg-black/40 p-3 rounded-xl border border-gray-800">
            <button onclick="changeQuestionCount(-1)" class="w-10 h-10 bg-gray-800 rounded-lg font-black text-lg hover:bg-gray-700">-</button>
            <div class="text-center">
              <span class="text-xs text-gray-400 block font-bold">現在の配信</span>
              <span id="adminQNum" class="text-xl font-black text-yellow-400">第 1 問</span>
            </div>
            <button onclick="changeQuestionCount(1)" class="w-10 h-10 bg-gray-800 rounded-lg font-black text-lg hover:bg-gray-700">+</button>
          </div>
        </div>

        <div class="border-t border-gray-800 pt-3">
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-bold text-gray-400">3. プレイヤー別 正解数（デフォルト8人）</label>
            <button onclick="clearAllInputs()" class="text-[10px] bg-gray-800 border border-gray-700 px-2 py-0.5 rounded text-gray-400 hover:text-white">全員0点にリセット</button>
          </div>
          
          <div class="grid grid-cols-2 gap-2 mb-4" id="playerScoreBoard">
            </div>

          <div class="bg-black/40 px-3 py-2 rounded-xl text-center border border-gray-800 mb-3 flex justify-between items-center">
            <span class="text-xs text-gray-400 font-bold">現在の加算ターゲット:</span>
            <span id="adminTargetDisplay" class="text-sm font-black text-red-400">未選択</span>
          </div>

          <button id="sendScoreBtn" onclick="submitFinalScore()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-sm shadow transition-all active:scale-95">
            この内容でポイントを確定送信（手元は自動リセット）
          </button>
        </div>
      </div>

      <div id="loginScreen" class="w-full glass-box p-8 rounded-3xl shadow-2xl my-12">
        <div class="text-center mb-8">
          <span class="text-5xl animate-pulse inline-block">💣</span>
          <h1 class="text-3xl font-black mt-4 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-yellow-500">
            マイクボンバー
          </h1>
          <p class="text-sm text-gray-400 mt-1">ゲーム進行・待機画面</p>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">あなたのチーム名（部屋名）</label>
            <input type="text" id="roomInput" placeholder="例: Aチーム" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-lg font-bold focus:outline-none focus:border-red-500 text-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">お名前（または枠番号 1〜8）</label>
            <input type="text" id="nameInput" placeholder="例: プレイヤー1" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-lg font-bold focus:outline-none focus:border-red-500 text-white">
          </div>
          <button id="loginBtn" class="w-full bomb-gradient hover:opacity-90 text-white font-black py-4 rounded-xl text-xl shadow-lg transition-all mt-4">
            待機画面に入る
          </button>
        </div>
      </div>

      <div id="gameScreen" class="hidden w-full flex flex-col">
        
        <div class="flex justify-between items-center glass-box px-4 py-2.5 rounded-2xl mb-4 text-xs font-bold">
          <div class="flex items-center gap-1 text-red-400">🏠 <span id="displayRoom" class="text-white"></span></div>
          <div class="flex items-center gap-1 text-yellow-400">👤 <span id="displayName" class="text-white"></span></div>
        </div>

        <div class="glass-box rounded-3xl p-8 text-center shadow-xl mb-6 min-h-[250px] flex flex-col justify-center border-2 border-white/5 relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-1.5 bomb-gradient"></div>
          
          <div class="text-xs font-black text-gray-500 uppercase tracking-widest mb-2" id="syncStatusLabel">待機中</div>
          
          <div class="inline-block mx-auto px-4 py-1.5 bg-white/5 rounded-full text-xs font-black text-red-400 border border-white/5 mb-4" id="currentChallengeTeam">
            ーーー チームが挑戦中
          </div>
          
          <div class="text-5xl font-black text-white tracking-wide min-h-[60px] flex items-center justify-center my-2" id="questionNumberDisplay">
            第 1 問
          </div>
          
          <p class="text-xs text-gray-400 mt-4 font-medium">MCからの口頭出題を聞いて回答してください</p>
        </div>

      </div>
    </div>

    <div class="text-center mt-8">
      <a href="6gatu.html" class="inline-block text-sm font-bold text-gray-500 hover:text-gray-300 border border-gray-800 rounded-full px-6 py-2 transition-all bg-gray-900/50">
        メニューへ戻る
      </a>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

  <script>
    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
      authDomain: "gamehistory-m84.firebaseapp.com",
      databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
      projectId: "gamehistory-m84",
      storageBucket: "gamehistory-m84.firebasestorage.app",
      messagingSenderId: "475761727837",
      appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
      measurementId: "G-3636W6LC4F"
    };
    
    firebase.initializeApp(firebaseConfig);
    const firestore = firebase.firestore();

    let currentRoom = "";
    let currentPlayerName = "";
    
    // MC状態変数
    let activeTeam = "Aチーム"; 
    let qCount = 1;            
    const defaultPlayerCount = 8; // 👤 デフォルト人数を8人に設定

    // DOM要素
    const adminKeyInput = document.getElementById("adminKeyInput");
    const authBtn = document.getElementById("authBtn");
    const adminPanel = document.getElementById("adminPanel");
    const loginScreen = document.getElementById("loginScreen");
    const gameScreen = document.getElementById("gameScreen");
    const roomInput = document.getElementById("roomInput");
    const nameInput = document.getElementById("nameInput");
    const loginBtn = document.getElementById("loginBtn");
    const displayRoom = document.getElementById("displayRoom");
    const displayName = document.getElementById("displayName");

    // 管理画面用DOM
    const btnTeamA = document.getElementById("setTeamA");
    const btnTeamB = document.getElementById("setTeamB");
    const adminQNum = document.getElementById("adminQNum");
    const adminTargetDisplay = document.getElementById("adminTargetDisplay");
    const playerScoreBoard = document.getElementById("playerScoreBoard");

    // 参加者画面用DOM
    const syncStatusLabel = document.getElementById("syncStatusLabel");
    const currentChallengeTeam = document.getElementById("currentChallengeTeam");
    const questionNumberDisplay = document.getElementById("questionNumberDisplay");

    // --- 🛠️ 1. デフォルト8人分の入力UIを生成 ---
    for (let i = 1; i <= defaultPlayerCount; i++) {
      const container = document.createElement("div");
      container.className = "flex items-center gap-1 bg-black/30 p-1.5 rounded-xl border border-gray-800/60";
      container.innerHTML = `
        <span class="text-[10px] text-gray-500 font-bold w-9 text-center">P${i}</span>
        <button onclick="adjustIndividualScore(${i}, -1)" class="w-6 h-6 bg-gray-800 rounded font-bold text-xs hover:bg-gray-700">-</button>
        <input type="number" id="pScore_${i}" value="0" min="0" class="w-10 bg-transparent text-center font-black text-sm text-emerald-400 focus:outline-none">
        <button onclick="adjustIndividualScore(${i}, 1)" class="w-6 h-6 bg-gray-800 rounded font-bold text-xs hover:bg-gray-700">+</button>
      `;
      playerScoreBoard.appendChild(container);
    }

    // --- 2. 管理者認証トグル (キー: 0001) ---
    authBtn.onclick = () => {
      if (adminKeyInput.value === "0001") {
        adminPanel.classList.toggle("hidden");
        adminKeyInput.value = "";
        syncAdminPanelUI();
      } else {
        alert("管理キーが正しくありません。");
      }
    };

    // プレイヤーごとのスコア加減算
    window.adjustIndividualScore = (playerIndex, val) => {
      const input = document.getElementById(`pScore_${playerIndex}`);
      let currentVal = parseInt(input.value) || 0;
      currentVal += val;
      if (currentVal < 0) currentVal = 0;
      input.value = currentVal;
    };

    // 手元入力を全員一括0にする関数
    window.clearAllInputs = () => {
      for (let i = 1; i <= defaultPlayerCount; i++) {
        document.getElementById(`pScore_${i}`).value = 0;
      }
    };

    // --- 3. MC操作：挑戦チーム切り替え ---
    window.selectTargetTeam = (teamName) => {
      activeTeam = teamName;
      updateLiveSession();
    };

    // --- 4. MC操作：問題カウンター変更 ---
    window.changeQuestionCount = (val) => {
      qCount += val;
      if (qCount < 1) qCount = 1;
      updateLiveSession();
    };

    // 出題状態の同期送信
    function updateLiveSession() {
      firestore.collection("rooms").doc("bombSession").set({
        activeTeam: activeTeam,
        questionNumber: qCount,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    // 管理UI側の表示同期
    function syncAdminPanelUI() {
      adminQNum.textContent = `第 ${qCount} 問`;
      adminTargetDisplay.textContent = activeTeam;
      
      if (activeTeam === "Aチーム") {
        btnTeamA.className = "py-2.5 rounded-xl border-2 border-red-500 font-black text-sm bg-red-950 text-red-200 shadow-lg";
        btnTeamB.className = "py-2.5 rounded-xl border-2 border-gray-700 font-bold text-sm bg-gray-800 text-gray-400";
      } else {
        btnTeamA.className = "py-2.5 rounded-xl border-2 border-gray-700 font-bold text-sm bg-gray-800 text-gray-400";
        btnTeamB.className = "py-2.5 rounded-xl border-2 border-red-500 font-black text-sm bg-red-950 text-red-200 shadow-lg";
      }
    }

    // --- 5. 🚀 確定送信処理（8人のスコアを一括加算し、手元表示を自動リセット） ---
    window.submitFinalScore = async () => {
      let totalAddedThisGame = 0;
      const batch = firestore.batch();

      // 8人分ループを回して、それぞれのドキュメントに対してスコアをincrement加算
      for (let i = 1; i <= defaultPlayerCount; i++) {
        const scoreVal = parseInt(document.getElementById(`pScore_${i}`).value) || 0;
        if (scoreVal > 0) {
          totalAddedThisGame += scoreVal;
          // 各プレイヤーの個別ID（例: Aチーム_プレイヤー1）
          const pName = `プレイヤー${i}`;
          const docRef = firestore.collection("gameResults").doc(`${activeTeam}_${pName}`);
          
          batch.set(docRef, {
            room: activeTeam,
            name: pName,
            score_bomb: firebase.firestore.FieldValue.increment(scoreVal),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        }
      }

      if (totalAddedThisGame === 0) {
        if (!confirm("手元の入力ポイントが全て0点です。このまま送信しますか？")) return;
      }

      // バッチ処理で一斉送信
      try {
        await batch.commit();
        
        // 🚀 送信が成功したら、送信先のチームに属するプレイヤー全員の totalScore（合計値）を再計算
        const snapshot = await firestore.collection("gameResults").where("room", "==", activeTeam).get();
        const updateBatch = firestore.batch();
        
        snapshot.forEach((doc) => {
          const data = doc.data();
          const bomb = data.score_bomb || 0;
          const trans = data.score_translate || 0;
          const rev = data.score_reverse || 0;
          updateBatch.update(doc.ref, { totalScore: bomb + trans + rev });
        });
        await updateBatch.commit();

        alert(`🏆 【${activeTeam}】のゲーム結果（合計 ${totalAddedThisGame}点分）を保存・合算しました！`);
        
        // ✨ 現場最優先：送信完了後、手元の8人のポイント表示だけを自動で「0」にリセット！
        clearAllInputs();
        
      } catch (error) {
        alert("送信・集計エラーが発生しました: " + error.message);
      }
    };

    // 完全リセット
    window.resetBombState = () => {
      if(confirm("出題状況と手元のポイント入力を初期化しますか？")) {
        activeTeam = "Aチーム";
        qCount = 1;
        clearAllInputs();
        updateLiveSession();
      }
    };

    // --- 6. 参加者用：ログイン処理 ---
    loginBtn.onclick = () => {
      currentRoom = roomInput.value.trim();
      currentPlayerName = nameInput.value.trim();
      if (!currentRoom || !currentPlayerName) { alert("チーム名と名前を入力してください。"); return; }

      displayRoom.textContent = currentRoom;
      displayName.textContent = currentPlayerName;
      loginScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
    };

    // --- 7. リアルタイム配信セッションの受信用リスナー ---
    firestore.collection("rooms").doc("bombSession").onSnapshot((doc) => {
      if (!doc.exists) return;
      const data = doc.data();
      
      activeTeam = data.activeTeam || "Aチーム";
      qCount = data.questionNumber || 1;

      // 参加者画面の書き換え
      syncStatusLabel.textContent = "🔴 LIVE 同期中";
      currentChallengeTeam.textContent = `🔥 ${activeTeam} が挑戦中`;
      questionNumberDisplay.textContent = `第 ${qCount} 問`;

      if (!adminPanel.classList.contains("hidden")) {
        syncAdminPanelUI();
      }
    });
  </script>

</body>
</html>
