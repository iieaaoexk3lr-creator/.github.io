<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リクエスターゲーム</title>
  <link rel="shortcut icon" href="#">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, #05030a 0%, #110926 50%, #080314 100%);
      background-attachment: fixed;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    #app { max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative; }
    .screen { display: none; padding: 20px; }
    .screen.active { display: block; }
    h1, h2 { text-align: center; margin-bottom: 20px; text-shadow: 0 0 8px #9370db; }
    input, button {
      width: 100%; padding: 12px; margin-bottom: 12px;
      border-radius: 8px; border: none; font-size: 16px;
    }
    input { background: rgba(255, 255, 255, 0.9); color: #000; }
    button {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: #fff; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    button.secondary { background: #444; }

    #starry-sky { width: 100%; position: relative; padding-bottom: 130px; }
    .sky-section { width: 100%; position: relative; line-height: 0; }
    .sky-bg { width: 100%; height: auto; display: block; }

    .star {
      position: absolute; width: 22px; height: 22px; border-radius: 50%;
      transform: translate(-50%, -50%); border: none; padding: 0; margin: 0;
      touch-action: manipulation; cursor: pointer; z-index: 10;
    }
    /* タップ領域を大きく */
    .star::after { content: ''; position: absolute; top: -8px; left: -8px; right: -8px; bottom: -8px; }
    .star.yellow { background: #ffd700; box-shadow: 0 0 10px #ffd700, 0 0 20px #ffea00; }
    .star.white { background: rgba(255, 255, 255, 0.35); box-shadow: 0 0 5px rgba(255,255,255,0.5); cursor: not-allowed; }
    .star.blue { background: #00ffff; box-shadow: 0 0 10px #00ffff, 0 0 20px #00bfff; }
    .star.red { background: #ff4d4d; box-shadow: 0 0 10px #ff0000; cursor: not-allowed; }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8); display: none;
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #1a0f35; border: 2px solid #6a11cb;
      padding: 24px; border-radius: 16px; width: 85%; max-width: 360px;
      text-align: center; box-shadow: 0 0 20px rgba(106, 17, 203, 0.5);
    }

    #history-panel {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; background: rgba(10, 5, 20, 0.92);
      border-top: 1px solid #333; max-height: 120px; overflow-y: auto;
      padding: 10px; font-size: 12px; z-index: 20;
    }
  </style>
</head>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
    authDomain: "gamehistory-m84.firebaseapp.com",
    databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
    projectId: "gamehistory-m84",
    storageBucket: "gamehistory-m84.firebasestorage.app",
    messagingSenderId: "475761727837",
    appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
    measurementId: "G-3636W6LC4F"
  };

  let db;
  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
  } catch (e) {
    alert("Firebase初期化エラー: " + e.message);
  }

  const myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
  let roomId = '';
  let currentStarId = null;
  let localStarsData = {};

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // 入室ボタン
  document.getElementById('btn-join').addEventListener('click', async () => {
    const roomInput = document.getElementById('input-room').value.trim();
    const nameInput = document.getElementById('input-name').value.trim();
    if (!roomInput || !nameInput) return alert('部屋コードと名前を入力してください');
    
    roomId = roomInput;
    try {
      await set(ref(db, `star_sight/rooms/${roomId}/players/${myUserId}`), { name: nameInput });
      listenToRoomData();
      showScreen('screen-request');
    } catch (err) {
      alert("送信失敗: Firebaseのルール設定を確認してください。\n詳細: " + err.message);
    }
  });

  // リクエスト登録
  document.getElementById('btn-submit-req').addEventListener('click', () => {
    const title = document.getElementById('input-title').value.trim();
    if (!title) return alert('曲名を入力してください');

    push(ref(db, `star_sight/rooms/${roomId}/requests`), {
      title: title,
      requesterId: myUserId
    });

    document.getElementById('input-title').value = '';
    alert('リクエストを追加しました！');
  });

  // 幹事画面移動
  document.getElementById('btn-to-host').addEventListener('click', () => showScreen('screen-host'));

  // ゲーム開始：星座上の全星にリクエストをランダム配置
  document.getElementById('btn-start-game').addEventListener('click', async () => {
    const reqSnapshot = await get(ref(db, `star_sight/rooms/${roomId}/requests`));
    const requestsObj = reqSnapshot.val() || {};
    const requestsList = Object.values(requestsObj);

    // ランダムシャッフル
    requestsList.sort(() => Math.random() - 0.5);

    const allStarElements = document.querySelectorAll('.star');
    const updates = {};
    updates[`star_sight/rooms/${roomId}/status`] = 'playing';

    allStarElements.forEach((starEl, index) => {
      const starId = starEl.getAttribute('data-star-id');
      if (index < requestsList.length) {
        const req = requestsList[index];
        updates[`star_sight/rooms/${roomId}/stars/${starId}`] = {
          status: 'yellow',
          song: req.title,
          requesterId: req.requesterId
        };
      } else {
        updates[`star_sight/rooms/${roomId}/stars/${starId}`] = {
          status: 'white'
        };
      }
    });

    update(ref(db), updates);
  });

  // 星タップ時の動作
  document.querySelectorAll('.star').forEach(starEl => {
    starEl.addEventListener('click', (e) => {
      currentStarId = e.target.getAttribute('data-star-id');
      const starData = localStarsData[currentStarId];

      if (!starData || starData.status === 'white' || starData.status === 'red') return;

      const modal = document.getElementById('modal-result');
      document.getElementById('modal-title').textContent = '願い星発見！';
      document.getElementById('modal-song').textContent = starData.song || '';
      modal.classList.add('active');
    });
  });

  // 【完唱】ボタン
  document.getElementById('btn-complete').addEventListener('click', () => {
    const starData = localStarsData[currentStarId];
    if (starData) {
      update(ref(db, `star_sight/rooms/${roomId}/stars/${currentStarId}`), { status: 'red' });
      push(ref(db, `star_sight/rooms/${roomId}/history`), { title: starData.song });
    }
    document.getElementById('modal-result').classList.remove('active');
  });

  // 【歌えない】ボタン
  document.getElementById('btn-pass').addEventListener('click', () => {
    document.getElementById('modal-result').classList.remove('active');
  });

  // リアルタイム通信の監視
  function listenToRoomData() {
    onValue(ref(db, `star_sight/rooms/${roomId}/requests`), (snapshot) => {
      const reqs = snapshot.val() || {};
      const count = Object.keys(reqs).length;
      document.getElementById('request-count').textContent = `現在の登録数: ${count}曲`;
    });

    onValue(ref(db, `star_sight/rooms/${roomId}/stars`), (snapshot) => {
      localStarsData = snapshot.val() || {};
      Object.keys(localStarsData).forEach(starId => {
        const starEl = document.querySelector(`[data-star-id="${starId}"]`);
        const starInfo = localStarsData[starId];
        if (starEl && starInfo) {
          starEl.className = `star ${starInfo.status}`;
          if (starInfo.requesterId === myUserId && starInfo.status === 'yellow') {
            starEl.classList.remove('yellow');
            starEl.classList.add('blue');
          }
        }
      });
    });

    onValue(ref(db, `star_sight/rooms/${roomId}/status`), (snapshot) => {
      if (snapshot.val() === 'playing') showScreen('screen-game');
    });

    onValue(ref(db, `star_sight/rooms/${roomId}/history`), (snapshot) => {
      const history = snapshot.val() || {};
      const listEl = document.getElementById('history-list');
      listEl.innerHTML = '';
      Object.values(history).forEach(item => {
        const li = document.createElement('li');
        li.textContent = item.title;
        listEl.appendChild(li);
      });
    });
  }
</script>
</body>
