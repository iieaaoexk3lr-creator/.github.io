<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リクエスターゲーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, #05030a 0%, #110926 50%, #080314 100%);
      background-attachment: fixed;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    #app { max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative; }
    .screen { display: none; padding: 20px; }
    .screen.active { display: block; }
    h1, h2 { text-align: center; margin-bottom: 20px; text-shadow: 0 0 8px #9370db; }
    input, button {
      width: 100%; padding: 12px; margin-bottom: 12px;
      border-radius: 8px; border: none; font-size: 16px;
    }
    input { background: rgba(255, 255, 255, 0.9); color: #000; }
    button {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: #fff; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    button.secondary { background: #444; }

    #starry-sky { width: 100%; position: relative; }
    .sky-section { width: 100%; position: relative; line-height: 0; }
    .sky-bg { width: 100%; height: auto; display: block; }

    .star {
      position: absolute; width: 20px; height: 20px; border-radius: 50%;
      transform: translate(-50%, -50%); border: none; padding: 0; margin: 0;
      touch-action: manipulation; cursor: pointer; z-index: 10;
    }
    .star::after { content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; }
    .star.yellow { background: #ffd700; box-shadow: 0 0 10px #ffd700, 0 0 20px #ffea00; }
    .star.white { background: rgba(255, 255, 255, 0.3); box-shadow: none; cursor: not-allowed; }
    .star.blue { background: #00ffff; box-shadow: 0 0 10px #00ffff, 0 0 20px #00bfff; }
    .star.red { background: #ff4d4d; box-shadow: 0 0 10px #ff0000; cursor: not-allowed; }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8); display: none;
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #1a0f35; border: 2px solid #6a11cb;
      padding: 24px; border-radius: 16px; width: 85%; max-width: 360px;
      text-align: center; box-shadow: 0 0 20px rgba(106, 17, 203, 0.5);
    }

    #history-panel {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; background: rgba(10, 5, 20, 0.9);
      border-top: 1px solid #333; max-height: 120px; overflow-y: auto;
      padding: 10px; font-size: 12px; z-index: 20;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- 部屋入室画面 -->
  <div id="screen-entry" class="screen active">
    <h1>リクエスターゲーム</h1>
    <input type="text" id="input-room" placeholder="部屋コード (例: 1234)">
    <input type="text" id="input-name" placeholder="あなたの名前">
    <button id="btn-join">入室する</button>
  </div>

  <!-- 曲リクエスト画面 -->
  <div id="screen-request" class="screen">
    <h2>曲のリクエスト</h2>
    <input type="text" id="input-title" placeholder="歌ってほしい曲名 (必須)">
    <input type="text" id="input-target" placeholder="歌ってほしい人 (任意)">
    <button id="btn-submit-req">リクエスト登録</button>
    <div id="request-count" style="text-align:center; margin-top:15px;">現在の登録数: 0曲</div>
    <button class="secondary" style="margin-top:20px;" id="btn-to-host">幹事画面へ</button>
  </div>

  <!-- 幹事画面 -->
  <div id="screen-host" class="screen">
    <h2>幹事設定画面</h2>
    <p id="host-stats">リクエスト: 0 / ダミー: 0</p>
    <div style="margin: 20px 0;">
      <label>白くするダミー星の数:</label>
      <input type="number" id="input-dummy-count" value="10" min="0">
    </div>
    <button id="btn-start-game">ゲーム開始！</button>
  </div>

  <!-- ゲームメイン画面 -->
  <div id="screen-game" class="screen" style="padding: 0;">
    <div id="starry-sky">
      <div class="sky-section">
        <img src="assets/bg_01_aries_taurus.webp" class="sky-bg" alt="1枚目">
        <button class="star yellow" style="top: 25%; left: 45%;" data-star-id="star001"></button>
        <button class="star yellow" style="top: 70%; left: 50%;" data-star-id="star002"></button>
      </div>
      <div class="sky-section">
        <img src="assets/bg_02_gemini_cancer.webp" class="sky-bg" alt="2枚目">
        <button class="star yellow" style="top: 30%; left: 40%;" data-star-id="star003"></button>
      </div>
      <div class="sky-section"><img src="assets/bg_03_leo_virgo.webp" class="sky-bg" alt="3枚目"></div>
      <div class="sky-section"><img src="assets/bg_04_libra_scorpio.webp" class="sky-bg" alt="4枚目"></div>
      <div class="sky-section"><img src="assets/bg_05_sagittarius_capricorn.webp" class="sky-bg" alt="5枚目"></div>
      <div class="sky-section"><img src="assets/bg_06_aquarius_pisces.webp" class="sky-bg" alt="6枚目"></div>
    </div>

    <div id="history-panel">
      <strong>📜 完唱履歴</strong>
      <ol id="history-list"></ol>
    </div>
  </div>
</div>

<!-- 結果モーダル -->
<div id="modal-result" class="modal">
  <div class="modal-content">
    <h3 id="modal-title">願い星発見！</h3>
    <p id="modal-song" style="font-size:20px; font-weight:bold; margin: 15px 0; color: #ffd700;"></p>
    <p id="modal-target" style="margin-bottom:15px;"></p>
    <div id="modal-buttons">
      <button id="btn-complete">【完唱】</button>
      <button class="secondary" id="btn-pass">【歌えない】</button>
    </div>
  </div>
</div>

<!-- Firebase SDK とメイン処理 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-rtdb.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
    authDomain: "gamehistory-m84.firebaseapp.com",
    databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
    projectId: "gamehistory-m84",
    storageBucket: "gamehistory-m84.firebasestorage.app",
    messagingSenderId: "475761727837",
    appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
    measurementId: "G-3636W6LC4F"
  };

  let db;
  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
  } catch (e) {
    alert("Firebase接続エラー: " + e.message);
  }

  const myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
  let roomId = '';
  let currentStarId = null;

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // 入室ボタンイベント設定（HTMLのonclickではなくJavaScript側で安全に割り当て）
  document.getElementById('btn-join').addEventListener('click', async () => {
    const roomInput = document.getElementById('input-room').value.trim();
    const nameInput = document.getElementById('input-name').value.trim();
    if (!roomInput || !nameInput) return alert('部屋コードと名前を入力してください');
    
    roomId = roomInput;
    try {
      // Firebaseに書き込みテスト
      await set(ref(db, `star_sight/rooms/${roomId}/players/${myUserId}`), { name: nameInput });
      listenToRoomData();
      showScreen('screen-request');
    } catch (err) {
      alert("送信に失敗しました。Firebaseのルール設定を確認してください。\n詳細: " + err.message);
    }
  });

  // リクエスト登録
  document.getElementById('btn-submit-req').addEventListener('click', () => {
    const title = document.getElementById('input-title').value.trim();
    const target = document.getElementById('input-target').value.trim();
    if (!title) return alert('曲名を入力してください');

    push(ref(db, `star_sight/rooms/${roomId}/requests`), {
      title: title,
      target: target || '誰でも',
      requesterId: myUserId
    });

    document.getElementById('input-title').value = '';
    document.getElementById('input-target').value = '';
    alert('リクエストを追加しました！');
  });

  // 幹事画面へ移動
  document.getElementById('btn-to-host').addEventListener('click', () => showScreen('screen-host'));

  // ゲーム開始
  document.getElementById('btn-start-game').addEventListener('click', () => {
    const updates = {};
    updates[`star_sight/rooms/${roomId}/status`] = 'playing';
    updates[`star_sight/rooms/${roomId}/stars/star001`] = { status: 'yellow', song: 'Pretender', target: '全員' };
    updates[`star_sight/rooms/${roomId}/stars/star002`] = { status: 'white' };
    updates[`star_sight/rooms/${roomId}/stars/star003`] = { status: 'yellow', song: '怪獣の花唄', target: '幹事' };

    update(ref(db), updates);
  });

  // 星タップ時のイベント
  document.querySelectorAll('.star').forEach(starEl => {
    starEl.addEventListener('click', (e) => {
      currentStarId = e.target.getAttribute('data-star-id');
      const modal = document.getElementById('modal-result');
      document.getElementById('modal-title').textContent = '願い星発見！';
      document.getElementById('modal-song').textContent = 'Pretender';
      document.getElementById('modal-target').textContent = '歌唱指名: 全員';
      modal.classList.add('active');
    });
  });

  document.getElementById('btn-complete').addEventListener('click', () => {
    update(ref(db, `star_sight/rooms/${roomId}/stars/${currentStarId}`), { status: 'red' });
    push(ref(db, `star_sight/rooms/${roomId}/history`), { title: 'Pretender', singer: '参加者' });
    document.getElementById('modal-result').classList.remove('active');
  });

  document.getElementById('btn-pass').addEventListener('click', () => {
    document.getElementById('modal-result').classList.remove('active');
  });

  // リアルタイム同期
  function listenToRoomData() {
    onValue(ref(db, `star_sight/rooms/${roomId}/stars`), (snapshot) => {
      const stars = snapshot.val() || {};
      Object.keys(stars).forEach(starId => {
        const starEl = document.querySelector(`[data-star-id="${starId}"]`);
        if (starEl) {
          starEl.className = `star ${stars[starId].status}`;
          if (stars[starId].requesterId === myUserId && stars[starId].status === 'yellow') {
            starEl.classList.remove('yellow');
            starEl.classList.add('blue');
          }
        }
      });
    });

    onValue(ref(db, `star_sight/rooms/${roomId}/status`), (snapshot) => {
      if (snapshot.val() === 'playing') showScreen('screen-game');
    });

    onValue(ref(db, `star_sight/rooms/${roomId}/history`), (snapshot) => {
      const history = snapshot.val() || {};
      const listEl = document.getElementById('history-list');
      listEl.innerHTML = '';
      Object.values(history).forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.singer}: ${item.title}`;
        listEl.appendChild(li);
      });
    });
  }
</script>
</body>
</html>
