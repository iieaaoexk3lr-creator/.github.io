<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【幹事用】ID固定型スマート部屋割り</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="heyawari.css">
</head>
<body>

    <datalist id="modelOptions"><option value="DAM"><option value="JOYSOUND"></datalist>
    <datalist id="capacityOptions"><option value="5"><option value="8"><option value="10"><option value="15"><option value="20"></datalist>
    <datalist id="memoOptions"><option value="企画部屋"><option value="アニソン部屋"><option value="懐メロ部屋"><option value="休憩部屋"><option value="着替え部屋"></datalist>

    <h1>🔑 部屋割り管理室（幹事用）</h1>

    <div id="step1_connection" class="card">
        <h3 style="margin-top:0; text-align:center; font-size:16px;">イベント管理室への入室</h3>
        <input type="text" id="groupNameInput" class="input-field" placeholder="例: カラオケサークル集会">
        <button class="btn" style="background: var(--primary);" onclick="createNewGroupSession()">👥 新規グループ部屋を作成</button>
        <div style="text-align: center; color: #888; font-size: 12px; margin: 10px 0;">ー または ー</div>
        <input type="text" id="existingCodeInput" class="input-field" placeholder="コードを貼り付け">
        <button class="btn" style="background: var(--info);" onclick="joinExistingGroupSession()">🔑 コードでログイン</button>
        
        <div id="historyContainer" style="display: none;">
            <hr>
            <h4 style="margin: 10px 0; font-size: 14px; color: var(--dark); text-align: center;">📂 作成済みのイベント履歴</h4>
            <div id="historyListArea" class="history-list"></div>
        </div>
    </div>

    <div id="step2_mainDashboard" style="display: none;">
        <div class="status-header">
            <span id="activeGroupName" style="color:var(--primary); font-weight:bold;"></span><br>
            <span style="font-weight:normal; font-size:12px; color:#666;">部屋コード:</span> 
            <span id="displayCodeText" class="badge-code"></span>
            <button class="btn btn-sm btn-outline" style="margin-left:5px; padding:2px 6px;" onclick="copyRoomCode()">コピー</button>
            <button class="btn btn-sm btn-outline" style="margin-left:5px; padding:2px 6px; border-color: var(--primary); color: var(--primary);" onclick="exitToMainMenu()">⚙️ 履歴・別イベントへ</button>
        </div>

        <button class="btn btn-outline" style="font-size:13px; padding:8px; margin-bottom:10px; background:#fff;" onclick="toggleDescriptionArea()">
            📢 コメント記入欄の表示 / 非表示を切り替え
        </button>

        <div id="descriptionCardContainer" class="card" style="background: #f1f3f5; border: 1px solid #ced4da; display: block;">
            <label for="eventDescriptionInput">📢 カラオケ会の説明文（いつでも変更可能）</label>
            
            <div class="template-btn-group">
                <span style="font-size: 11px; color: #666; align-self: center;">⚡テンプレ挿入：</span>
                <button type="button" class="btn-tmpl" onclick="applyTemplate('karaoke')">🎵 カラオケ会</button>
                <button type="button" class="btn-tmpl" onclick="applyTemplate('nijikai')">🍻 二次会・飲み会</button>
                <button type="button" class="btn-tmpl" style="background:#dc3545;" onclick="applyTemplate('clear')">🧹 クリア</button>
            </div>

            <textarea id="eventDescriptionInput" rows="7" class="input-field" style="font-size:14px; font-family:inherit; resize:vertical; margin-bottom:8px; line-height:1.4;" placeholder="上のボタンを押すか、自由に説明文を入力してください。"></textarea>
            <button class="btn btn-sm" style="background: var(--primary); width:100%;" onclick="saveEventDescription()">📝 説明文を更新して配信</button>
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('tab_settings')">🛠️ 部屋設定</button>
            <button class="tab-btn" onclick="switchTab('tab_members')">👥 参加者状況</button>
            <button class="tab-btn" onclick="switchTab('tab_shuffle')">🔀 受付＆部屋割り</button>
        </div>

        <div id="tab_settings" class="tab-content active card">
            <div id="roomsSetupContainer"></div>
            <button class="btn btn-outline" style="font-size:13px; padding:8px;" onclick="addRoomRowSetup('', '', 5, '', '')">＋ 新しい部屋を追加</button>
            <hr>
            <button class="btn" style="background: var(--success);" onclick="saveRoomsSetupOnly()">💾 部屋構成の変更を保存</button>
        </div>

        <div id="tab_members" class="tab-content card">
            <div style="background:#e9ecef; padding:10px; border-radius:8px; margin-bottom:15px; font-size:12px;">
                <b style="color:var(--success)">📢 LINE配布用URL:</b>
                <input type="text" id="shareUrl" class="input-field" style="margin: 5px 0; padding:8px; font-size:12px;" readonly>
                <button class="btn btn-success" style="padding:8px; font-size:12px; margin-bottom:0;" onclick="copyShareUrl()">📋 LINE用URLをコピー</button>
            </div>
            <div id="joinedMembersArea"></div>
        </div>

        <div id="tab_shuffle" class="tab-content card">
            <button class="btn" style="background: var(--primary); padding:13px;" onclick="executeSmartShuffle()">🔀 部屋にいるメンバーだけで自動シャッフル配信</button>
            <p style="font-size:11px; color:#666; margin-top:-5px; text-align:center;">※「未参加枠」「未定枠」「不参加枠」の人はシャッフルされずキープされます</p>
            <div id="resultInside"></div>
        </div>

        <div class="card" style="border: 1px solid #f5c6cb; background-color: #fdf3f4; margin-top:20px;">
            <button class="btn btn-danger" style="padding:10px; font-size:13px; margin-bottom:0;" onclick="resetCurrentEvent()">🧹 グループデータを完全に削除して終了</button>
        </div>
    </div>

    <script src="heyawari.js"></script>
</body>
</html>
