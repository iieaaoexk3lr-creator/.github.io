<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カラオケストラックアウト </title>
<style>
  body {
    background: #111;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 20px;
  }

  /* 3×3 盤面 */
  #board {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    gap: 12px;
    justify-content: center;
    margin: 20px auto;
  }

  .cell {
    width: 110px;
    height: 110px;
    background: #333;
    border-radius: 12px;
    font-size: 2.5rem;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.4s;
    position: relative;
    overflow: hidden;
  }

  /* 派手エフェクト */
  .broken {
    background: radial-gradient(circle, #ff0066, #660022);
    transform: scale(2) rotate(180deg);
    opacity: 0;
  }

  input, select {
    font-size: 1.2rem;
    padding: 10px;
    margin: 8px;
    border-radius: 8px;
    border: none;
    width: 80%;
    max-width: 300px;
  }

  button {
    font-size: 1.2rem;
    padding: 10px 20px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  #info {
    font-size: 1.3rem;
    margin-top: 10px;
    color: #00ffcc;
  }

  #history {
    margin-top: 20px;
    font-size: 1.1rem;
    text-align: left;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    background: #222;
    padding: 15px;
    border-radius: 10px;
  }
</style>
</head>
<body>

<h1>カラオケストラックアウト</h1>

<!-- ▼ 設定欄 ▼ -->
<select id="mode">
  <option value="score">点数</option>
  <option value="cal">消費カロリー</option>
  <option value="vib">ビブラート回数</option>
  <option value="shake">しゃくり回数</option>
  <option value="kobushi">こぶし回数</option>
</select>

<select id="triesSelect">
  <option value="9">挑戦回数：9</option>
  <option value="10">挑戦回数：10</option>
  <option value="11">挑戦回数：11</option>
  <option value="12">挑戦回数：12</option>
  <option value="13">挑戦回数：13</option>
  <option value="14">挑戦回数：14</option>
  <option value="15">挑戦回数：15</option>
</select>

<br>
<button onclick="startGame()">START</button>

<div id="info">ゲームを開始してください</div>

<!-- ▼ 数字入力 ▼ -->
<input id="numInput" type="number" placeholder="数字を入力">
<button onclick="shoot()">決定</button>

<!-- ▼ 盤面 ▼ -->
<div id="board"></div>

<button onclick="resetGame()">挑戦リセット</button>
<button onclick="location.href='index.html'">indexへ戻る</button>

<!-- ▼ 履歴 ▼ -->
<div id="history">
  <b>挑戦履歴</b><br>
  <div id="historyList"></div>
</div>

<script>
let tries = 0;
let turn = 0;
let started = false;

// 盤面作成
const board = document.getElementById("board");
for (let i = 1; i <= 9; i++) {
  const div = document.createElement("div");
  div.className = "cell";
  div.id = "cell" + i;
  div.textContent = i;
  board.appendChild(div);
}

// STARTボタン
function startGame() {
  tries = Number(document.getElementById("triesSelect").value);
  turn = 0;
  started = true;

  document.getElementById("info").textContent =
    "残り挑戦回数：" + tries;

  document.getElementById("historyList").innerHTML = "";

  // 盤面リセット
  for (let i = 1; i <= 9; i++) {
    const c = document.getElementById("cell" + i);
    c.classList.remove("broken");
    c.style.opacity = "1";
    c.style.transform = "scale(1)";
  }
}

// 数字入力処理
function shoot() {
  if (!started || tries <= 0) return;

  const num = Number(document.getElementById("numInput").value);
  if (!num) return;

  turn++;

  // 履歴追加
  const history = document.getElementById("historyList");
  history.innerHTML += turn + "回目：" + num + "<br>";

  // 下1桁が0 → 挑戦回数 +1
  if (num % 10 === 0) {
    tries++;
  }

  // 十の位と一の位を抜く
  const ones = num % 10;
  const tens = Math.floor(num / 10) % 10;

  hitCell(ones);
  hitCell(tens);

  tries--;
  document.getElementById("info").textContent =
    "残り挑戦回数：" + tries;

  document.getElementById("numInput").value = "";
}

// マスを抜く処理
function hitCell(n) {
  if (n >= 1 && n <= 9) {
    const cell = document.getElementById("cell" + n);
    if (!cell.classList.contains("broken")) {
      cell.classList.add("broken");
    }
  }
}

// リセット
function resetGame() {
  startGame();
}
</script>

</body>
</html>
