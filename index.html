<meta charset="UTF-8">

<title>カラオケ企画メニュー</title>
<style>
  /* 全体のリセットと基本スタイル */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
    background: #0f0f15;
    color: #fff;
    text-align: center;
    padding: 20px 15px;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 25px;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
  }

  h2 {
    font-size: 1.2rem;
    color: #aaa;
    margin: 30px 0 15px;
    text-align: left;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    padding-left: 5px;
    border-left: 4px solid #ff007f;
  }

  /* 共通のボタン基盤 */
  a {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    border-radius: 12px;
    transition: transform 0.2s, opacity 0.2s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  a:active {
    transform: scale(0.95);
    opacity: 0.9;
  }

  /* ゲームエリア（1行2枠 / Gridレイアウト） */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 500px;
    margin: 0 auto;
  }

  .game-grid a {
    height: 90px;
    font-size: 0.95rem;
    padding: 10px;
    line-height: 1.4;
  }

  /* ゲームごとのカラフルな背景（グラデーション） */
  .btn-bom      { background: linear-gradient(135deg, #ff3366, #ff6633); }
  .btn-quiz     { background: linear-gradient(135deg, #ff9900, #ffcc00); color: #111; }
  .btn-talk     { background: linear-gradient(135deg, #00cc66, #00ffcc); color: #111; }
  .btn-sugo     { background: linear-gradient(135deg, #0099ff, #33ccff); }
  .btn-denshin  { background: linear-gradient(135deg, #9933ff, #cc66ff); }
  .btn-50kara   { background: linear-gradient(135deg, #ff3399, #ff99cc); }
  .btn-str      { background: linear-gradient(135deg, #0055ff, #00aaff); }
  .btn-pict     { background: linear-gradient(135deg, #ff5500, #ffaa00); }
  .btn-bingo    { background: linear-gradient(135deg, #e60067, #ff5e97); }
  .btn-bowl     { background: linear-gradient(135deg, #2baf2b, #3be83b); color: #111; }

  /* ツールエリア（別枠表示） */
  .tool-box {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 500px;
    margin: 0 auto;
  }

  .tool-box h2 {
    border-left-color: #00e5ff;
  }

  .tool-box a {
    flex-direction: row;
    height: 65px;
    font-size: 1.1rem;
    gap: 10px;
    background: #222530;
    border: 2px solid #3a3f58;
  }

  /* PCやタブレットなど少し大きめの画面用の微調整 */
  @media (min-width: 450px) {
    .game-grid a {
      font-size: 1.05rem;
      height: 100px;
    }
    h1 { font-size: 2.2rem; }
  }
</style>
</head>
