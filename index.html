<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カラオケ企画メニュー</title>
<style>
  :root {
    --bg-color: #0b0d17;
    --card-bg: #161a2e;
    --text-main: #ffffff;
    --text-dim: #b0b8d0;
    
    --color-scoring: #ff007f;
    --color-kara-party: #00f2fe;
    --color-variety: #9d50bb;
    --color-tool: #f9d423;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Avenir Next', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    text-align: center;
    padding: 40px 15px;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.05) 0%, transparent 20%),
      radial-gradient(circle at 90% 80%, rgba(157, 80, 187, 0.05) 0%, transparent 20%);
    background-attachment: fixed;
  }

  .container {
    max-width: 550px;
    margin: 0 auto;
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 900;
    margin-bottom: 40px;
    background: linear-gradient(to bottom, #fff 40%, #ccc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* カテゴリリンク共通 */
  .category-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 28px;
    margin-bottom: 20px;
    background: var(--card-bg);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    text-decoration: none;
    color: #fff;
    transition: transform 0.25s, border-color 0.25s;
  }

  .category-link:hover {
    transform: translateY(-3px);
    background: rgba(22, 26, 46, 0.8);
  }

  .category-title {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 1.2rem;
    font-weight: 800;
  }

  .category-icon {
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
  }

  .category-arrow {
    font-size: 1rem;
    opacity: 0.6;
  }

  /* 各カテゴリの専用色 */
  #link-scoring { border-left: 6px solid var(--color-scoring); }
  #link-scoring .category-icon { color: var(--color-scoring); }
  #link-scoring:hover { border-color: var(--color-scoring); }

  #link-kara-party { border-left: 6px solid var(--color-kara-party); }
  #link-kara-party .category-icon { color: var(--color-kara-party); }
  #link-kara-party:hover { border-color: var(--color-kara-party); }

  #link-variety { border-left: 6px solid var(--color-variety); }
  #link-variety .category-icon { color: var(--color-variety); }
  #link-variety:hover { border-color: var(--color-variety); }

  #link-tool { border-left: 6px solid var(--color-tool); }
  #link-tool .category-icon { color: var(--color-tool); }
  #link-tool:hover { border-color: var(--color-tool); }
</style>
</head>
<body>

<div class="container">
  <h1>カラオケ企画メニュー</h1>

  <!-- 採点系 -->
  <a href="menu-scoring.html" class="category-link" id="link-scoring">
    <div class="category-title">
      <div class="category-icon">📈</div>
      <span>カラオケ（採点系）</span>
    </div>
    <span class="category-arrow">▶</span>
  </a>

  <!-- パーティー系 -->
  <a href="menu-kara-party.html" class="category-link" id="link-kara-party">
    <div class="category-title">
      <div class="category-icon">🎤</div>
      <span>カラオケ（パーティー系）</span>
    </div>
    <span class="category-arrow">▶</span>
  </a>

  <!-- バラエティ -->
  <a href="menu-variety.html" class="category-link" id="link-variety">
    <div class="category-title">
      <div class="category-icon">🥳</div>
      <span>バラエティ・パーティー</span>
    </div>
    <span class="category-arrow">▶</span>
  </a>

  <!-- 便利ツール -->
  <a href="menu-tool.html" class="category-link" id="link-tool">
    <div class="category-title">
      <div class="category-icon">🛠️</div>
      <span>便利ツール</span>
    </div>
    <span class="category-arrow">▶</span>
  </a>
</div>

</body>
</html>
