<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ドキドキ棒</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; flex-direction: column; gap: 10px; width: calc(100% - 20px); }
    
    .stats-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 12px; border: 1px solid #444; font-size: 16px; }
    .title-text { color: #fff; font-weight: bold; font-size: 22px; margin-bottom: 5px; }
    
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn { height: 50px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: #fff; opacity: 0.5; transition: opacity 0.2s; }
    .btn.active { opacity: 1; border: 3px solid #fff; }
    
    #btn-easy { background: #00ccff; }
    #btn-normal { background: #ffd700; color: #000; }
    #btn-hard { background: #ff4444; }
    
    .extra-btns { display: flex; gap: 10px; margin-top: 5px; }
    .secondary-btn { flex: 1; height: 40px; background: #333; color: #fff; border-radius: 8px; border: none; font-size: 14px; }
    
    canvas { display: block; }
    #overlay { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); font-size: 50px; font-weight: 900; display: none; pointer-events: none; text-shadow: 0 0 10px #000, 0 0 20px #000;}
  </style>
</head>
<body>

<div id="ui">
  <div class="stats-box">
    <div class="title-text">ドキドキ棒</div>
    <div>総合点: <span id="total-score" style="color:#00ffcc; font-weight:bold; font-size: 20px;">0</span> (E:<span id="count-easy">0</span> N:<span id="count-normal">0</span> H:<span id="count-hard">0</span>)</div>
  </div>
  <div class="controls">
    <button class="btn active" id="btn-easy" onclick="setDiff('easy')">Easy</button>
    <button class="btn" id="btn-normal" onclick="setDiff('normal')">Normal</button>
    <button class="btn" id="btn-hard" onclick="setDiff('hard')">Hard</button>
  </div>
  <div class="extra-btns">
    <button class="secondary-btn" onclick="if(!isPlaying) generateCourse()">コース変更</button>
    <button class="secondary-btn" onclick="resetStats()" style="background:#800;">リセット</button>
  </div>
</div>

<div id="overlay"></div>
<canvas id="stage"></canvas>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const colors = { easy: '#00ccff', normal: '#ffd700', hard: '#ff4444' };
let stats = { easy: 0, normal: 0, hard: 0, total: 0 };
let isPlaying = false;
let difficulty = 'easy';
let nodes = []; 
let trace = [];
let lastTouchPos = null;

function loadStats() {
  const saved = localStorage.getItem('dokidoki_stats');
  if (saved) stats = JSON.parse(saved);
  updateDisplay();
}

function updateDisplay() {
  document.getElementById('count-easy').innerText = stats.easy;
  document.getElementById('count-normal').innerText = stats.normal;
  document.getElementById('count-hard').innerText = stats.hard;
  document.getElementById('total-score').innerText = stats.total;
}

function saveStats() {
  localStorage.setItem('dokidoki_stats', JSON.stringify(stats));
  updateDisplay();
}

function setDiff(d) {
  difficulty = d;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + d).classList.add('active');
  generateCourse();
}

function resetStats() {
  if (confirm("記録をリセットしますか？")) {
    stats = { easy: 0, normal: 0, hard: 0, total: 0 };
    saveStats();
    generateCourse();
  }
}

function init() {
  resizeCanvas();
  loadStats();
  generateCourse();
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function generateCourse() {
  nodes = [];
  const w = canvas.width, h = canvas.height;
  
  const uiElement = document.getElementById('ui');
  const uiBottom = uiElement ? uiElement.getBoundingClientRect().bottom + 30 : 220;
  const playableHeight = h - uiBottom - 80;

  // 上・中・下の基準Y座標
  const zoneY = {
    top: uiBottom + playableHeight * 0.15,
    middle: uiBottom + playableHeight * 0.5,
    bottom: uiBottom + playableHeight * 0.85
  };
  const zones = ['top', 'middle', 'bottom'];

  // スタート地点（1点目）：全難易度共通で「上中下」からランダム選定
  const startZone = zones[Math.floor(Math.random() * 3)];
  const startY = zoneY[startZone];

  if (difficulty === 'easy') {
    // Easy: 3点 (左=上中下ランダム、中間=上中下ランダム、ゴール=上中下ランダム)
    const courseWidth = 90;
    const midZone = zones[Math.floor(Math.random() * 3)];
    const goalZone = zones[Math.floor(Math.random() * 3)];

    nodes.push({ x: 70, y: startY, w: courseWidth });
    nodes.push({ x: w / 2, y: zoneY[midZone], w: courseWidth });
    nodes.push({ x: w - 70, y: zoneY[goalZone], w: courseWidth });

  } else {
    // Normal / Hard: グリッド生成＆一筆書きルート選択
    const gridCols = difficulty === 'normal' ? 3 : 4; 
    const gridRows = 3; // 上・中・下
    const courseWidth = difficulty === 'normal' ? 65 : 45;

    // 格子点の座標テーブルを作成
    const gridPoints = [];
    for (let r = 0; r < gridRows; r++) {
      gridPoints[r] = [];
      const rZone = zones[r];
      for (let c = 0; c < gridCols; c++) {
        const x = 70 + (w - 140) * (c / (gridCols - 1));
        const y = zoneY[rZone];
        gridPoints[r][c] = { x, y, w: courseWidth };
      }
    }

    // スタート行のインデックス設定
    let currentR = zones.indexOf(startZone);
    let currentC = 0;

    const path = [{ r: currentR, c: currentC }];
    const visited = new Array(gridRows).fill(null).map(() => new Array(gridCols).fill(false));
    visited[currentR][currentC] = true;

    // ゴール（右端列）に達するまでランダムウォーク
    while (currentC < gridCols - 1) {
      const neighbors = [];
      
      // 右
      if (currentC + 1 < gridCols && !visited[currentR][currentC + 1]) {
        neighbors.push({ r: currentR, c: currentC + 1 });
      }
      // 上
      if (currentR - 1 >= 0 && !visited[currentR - 1][currentC]) {
        neighbors.push({ r: currentR - 1, c: currentC });
      }
      // 下
      if (currentR + 1 < gridRows && !visited[currentR + 1][currentC]) {
        neighbors.push({ r: currentR + 1, c: currentC });
      }

      if (neighbors.length === 0) {
        // 行き止まりになったら右へ強制移動
        currentC++;
        visited[currentR][currentC] = true;
        path.push({ r: currentR, c: currentC });
      } else {
        // 右方向を優先的に選ばせる重み付け
        const next = neighbors[Math.floor(Math.random() * neighbors.length)];
        currentR = next.r;
        currentC = next.c;
        visited[currentR][currentC] = true;
        path.push({ r: currentR, c: currentC });
      }
    }

    // 目標の点数範囲（Normal: 7〜9点, Hard: 12〜16点）に合わせてポイントを構築
    // 足りない場合はランダムにグリッド間の中間点（直角曲がり点）を生成
    nodes = path.map(p => gridPoints[p.r][p.c]);

    const targetMin = difficulty === 'normal' ? 7 : 12;
    const targetMax = difficulty === 'normal' ? 9 : 16;
    const targetCount = Math.floor(Math.random() * (targetMax - targetMin + 1)) + targetMin;

    // ノード数が目標に達するまで、直線上の曲がり角を補間して増やす
    let attempts = 0;
    while (nodes.length < targetCount && attempts < 50) {
      attempts++;
      const idx = Math.floor(Math.random() * (nodes.length - 1));
      const p1 = nodes[idx];
      const p2 = nodes[idx + 1];

      // 隣接ノード間にL字の屈折点を1つ追加
      if (p1.x !== p2.x && p1.y !== p2.y) {
        const midPoint = (Math.random() > 0.5) 
          ? { x: p2.x, y: p1.y, w: courseWidth } 
          : { x: p1.x, y: p2.y, w: courseWidth };
        nodes.splice(idx + 1, 0, midPoint);
      }
    }
  }

  trace = [];
  isPlaying = false;
  lastTouchPos = null;
  draw();
}

function traceCoursePath() {
  ctx.beginPath();
  ctx.moveTo(nodes[0].x, nodes[0].y);
  for (let i = 0; i < nodes.length - 1; i++) {
    const p0 = nodes[i];
    const p1 = nodes[i + 1];
    // 直角や屈折を表現するため直線で接続
    ctx.lineTo(p1.x, p1.y);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  const avgWidth = nodes.reduce((sum, n) => sum + n.w, 0) / nodes.length;
  const themeColor = colors[difficulty];

  // 1. 壁の描画
  ctx.strokeStyle = themeColor;
  ctx.lineWidth = avgWidth + 18;
  traceCoursePath();
  ctx.stroke();

  // 2. 通路の描画
  ctx.strokeStyle = '#000';
  ctx.lineWidth = avgWidth;
  traceCoursePath();
  ctx.stroke();

  // 3. 軌跡の描画
  if (trace.length > 0) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    trace.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
  }

  // 4. スタート・ゴール
  ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.arc(nodes[0].x, nodes[0].y, 25, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(nodes[nodes.length-1].x, nodes[nodes.length-1].y, 25, 0, Math.PI*2); ctx.fill();
}

// 点(px, py)と線分(p1-p2)の最短距離の二乗を計算
function distToSegmentSq(p, p1, p2) {
  const l2 = (p2.x - p1.x) ** 2 + (p2.y - p1.y) ** 2;
  if (l2 === 0) return (p.x - p1.x) ** 2 + (p.y - p1.y) ** 2;
  let t = ((p.x - p1.x) * (p2.x - p1.x) + (p.y - p1.y) * (p2.y - p1.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return (p.x - (p1.x + t * (p2.x - p1.x))) ** 2 + (p.y - (p1.y + t * (p2.y - p1.y))) ** 2;
}

// 精密な幾何学距離判定（壁のない場所での誤作動を排除）
function isInsideCourse(x, y) {
  let minDistanceSq = Infinity;
  let currentWidth = 60;

  for (let i = 0; i < nodes.length - 1; i++) {
    const p1 = nodes[i];
    const p2 = nodes[i + 1];
    const dSq = distToSegmentSq({ x, y }, p1, p2);

    if (dSq < minDistanceSq) {
      minDistanceSq = dSq;
      currentWidth = (p1.w + p2.w) / 2;
    }
  }

  // 通路の幅（安全余裕度0.85倍）の中にいるか判定
  const safeRadius = (currentWidth / 2) * 0.85;
  return minDistanceSq <= safeRadius ** 2;
}

canvas.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];
  lastTouchPos = { x: touch.clientX, y: touch.clientY };
});

canvas.addEventListener('touchmove', (e) => {
  const x = e.touches[0].clientX, y = e.touches[0].clientY;
  const distStart = Math.hypot(x - nodes[0].x, y - nodes[0].y);
  
  if (distStart < 30 && !isPlaying) { 
    isPlaying = true; 
    trace = []; 
    showMsg('START!', '#fff'); 
    lastTouchPos = { x, y };
  }
  if (!isPlaying) return;

  // ゴール判定
  if (Math.hypot(x - nodes[nodes.length-1].x, y - nodes[nodes.length-1].y) < 25) {
    isPlaying = false;
    const points = { easy: 1, normal: 2, hard: 3 };
    stats[difficulty]++;
    stats.total += points[difficulty];
    saveStats();
    showMsg('GOAL!', '#0f0'); 
    setTimeout(generateCourse, 1000); 
    return;
  }

  if (distStart > 30) {
    const prev = lastTouchPos || { x, y };
    const dist = Math.hypot(x - prev.x, y - prev.y);
    const steps = Math.max(1, Math.ceil(dist / 3));

    for (let i = 1; i <= steps; i++) {
      const checkX = prev.x + (x - prev.x) * (i / steps);
      const checkY = prev.y + (y - prev.y) * (i / steps);

      if (!isInsideCourse(checkX, checkY)) {
        isPlaying = false; 
        showMsg('ビリビリ！', '#ff3366'); 
        if (navigator.vibrate) navigator.vibrate(200);
        setTimeout(generateCourse, 1000); 
        return;
      }
    }
    trace.push({x, y});
  }

  lastTouchPos = { x, y };
  draw();
});

canvas.addEventListener('touchend', () => {
  lastTouchPos = null;
});

window.addEventListener('resize', () => {
  resizeCanvas();
  generateCourse();
});

function showMsg(t, c) {
  const o = document.getElementById('overlay');
  o.innerText = t; o.style.color = c; o.style.display = 'block';
  setTimeout(() => o.style.display = 'none', 600);
}

window.onload = init;
</script>
</body>
</html>
