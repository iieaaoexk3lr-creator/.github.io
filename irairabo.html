<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ドキドキ棒</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; flex-direction: column; gap: 10px; width: calc(100% - 20px); }
    
    .stats-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 12px; border: 1px solid #444; font-size: 16px; }
    .title-text { color: #fff; font-weight: bold; font-size: 22px; margin-bottom: 5px; }
    
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn { height: 50px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: #fff; opacity: 0.5; transition: opacity 0.2s; }
    .btn.active { opacity: 1; border: 3px solid #fff; }
    
    #btn-easy { background: #00ccff; }
    #btn-normal { background: #ffd700; color: #000; }
    #btn-hard { background: #ff4444; }
    
    .extra-btns { display: flex; gap: 10px; margin-top: 5px; }
    .secondary-btn { flex: 1; height: 40px; background: #333; color: #fff; border-radius: 8px; border: none; font-size: 14px; }
    
    canvas { display: block; }
    #overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 42px; font-weight: 900; display: none; text-align: center; width: 100%; pointer-events: none; text-shadow: 0 0 10px #000, 0 0 20px #000; z-index: 20; }
    .sub-msg { font-size: 18px; font-weight: normal; color: #ccc; margin-top: 15px; }
  </style>
</head>
<body>

<div id="ui">
  <div class="stats-box">
    <div class="title-text">ドキドキ棒</div>
    <div>総合点: <span id="total-score" style="color:#00ffcc; font-weight:bold; font-size: 20px;">0</span> (E:<span id="count-easy">0</span> N:<span id="count-normal">0</span> H:<span id="count-hard">0</span>)</div>
  </div>
  <div class="controls">
    <button class="btn active" id="btn-easy" onclick="setDiff('easy')">Easy</button>
    <button class="btn" id="btn-normal" onclick="setDiff('normal')">Normal</button>
    <button class="btn" id="btn-hard" onclick="setDiff('hard')">Hard</button>
  </div>
  <div class="extra-btns">
    <button class="secondary-btn" onclick="if(!isPlaying && !isCleared) generateCourse()">コース変更</button>
    <button class="secondary-btn" onclick="resetStats()" style="background:#800;">リセット</button>
  </div>
</div>

<div id="overlay">
  <div id="main-msg"></div>
  <div id="sub-msg" class="sub-msg"></div>
</div>
<canvas id="stage"></canvas>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let stats = { easy: 0, normal: 0, hard: 0, total: 0 };
let isPlaying = false;
let isCleared = false;
let difficulty = 'easy';
let nodes = []; 
let trace = [];
let lastTouchPos = null;

// 1秒ごとの壁開閉ギミック用
let wallTimer = null;
let isWallClosed = false;
let wallSegments = [];

// 0.5秒ごとの奇数点伸縮ギミック用
let widthChangeTimer = null;
let currentOddWidthOffset = 0; 
let widthExpanding = false; 

// 難易度別の基本サイズ制限
const MIN_WIDTH = 40; 
const MAX_WIDTH = 80;

function loadStats() {
  const saved = localStorage.getItem('dokidoki_stats');
  if (saved) stats = JSON.parse(saved);
  updateDisplay();
}

function updateDisplay() {
  document.getElementById('count-easy').innerText = stats.easy;
  document.getElementById('count-normal').innerText = stats.normal;
  document.getElementById('count-hard').innerText = stats.hard;
  document.getElementById('total-score').innerText = stats.total;
}

function saveStats() {
  localStorage.setItem('dokidoki_stats', JSON.stringify(stats));
  updateDisplay();
}

function setDiff(d) {
  if (isCleared) return;
  difficulty = d;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + d).classList.add('active');
  generateCourse();
}

function resetStats() {
  if (confirm("記録をリセットしますか？")) {
    stats = { easy: 0, normal: 0, hard: 0, total: 0 };
    saveStats();
    generateCourse();
  }
}

function init() {
  resizeCanvas();
  loadStats();
  generateCourse();
  gameLoop();
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function getRandomWidth(min, max) {
  return min + Math.random() * (max - min);
}

function generateHamiltonianPath(cols, rows) {
  const visited = new Array(rows).fill(null).map(() => new Array(cols).fill(false));
  const path = [];
  const totalPoints = cols * rows;

  function dfs(r, c) {
    visited[r][c] = true;
    path.push({ r, c });
    if (path.length === totalPoints) return true;

    const dirs = [
      { r: r - 1, c: c },
      { r: r + 1, c: c },
      { r: r, c: c - 1 },
      { r: r, c: c + 1 }
    ].sort(() => Math.random() - 0.5);

    for (let d of dirs) {
      if (d.r >= 0 && d.r < rows && d.c >= 0 && d.c < cols && !visited[d.r][d.c]) {
        if (dfs(d.r, d.c)) return true;
      }
    }
    visited[r][c] = false;
    path.pop();
    return false;
  }

  let attempts = 0;
  while (attempts < 100) {
    attempts++;
    for (let r = 0; r < rows; r++) visited[r].fill(false);
    path.length = 0;
    if (dfs(Math.floor(Math.random() * rows), 0)) return path;
  }

  path.length = 0;
  for (let c = 0; c < cols; c++) {
    if (c % 2 === 0) {
      for (let r = 0; r < rows; r++) path.push({ r, c });
    } else {
      for (let r = rows - 1; r >= 0; r--) path.push({ r, c });
    }
  }
  return path;
}

function generateCourse() {
  if (wallTimer) clearInterval(wallTimer);
  if (widthChangeTimer) clearInterval(widthChangeTimer);

  wallSegments = [];
  isWallClosed = false;
  isCleared = false;
  currentOddWidthOffset = 0;
  widthExpanding = false;
  hideOverlay();

  nodes = [];
  const w = canvas.width, h = canvas.height;
  const uiElement = document.getElementById('ui');
  const uiBottom = uiElement ? uiElement.getBoundingClientRect().bottom + 30 : 220;
  const playableHeight = h - uiBottom - 80;

  if (difficulty === 'easy') {
    const cols = 3, rows = 3;
    const pathCoords = generateHamiltonianPath(cols, rows);
    const count = Math.floor(Math.random() * 3) + 7; // 7〜9点
    const slicedCoords = pathCoords.slice(0, count);

    nodes = slicedCoords.map(p => ({
      x: 70 + (w - 140) * (p.c / (cols - 1)),
      y: uiBottom + playableHeight * (0.15 + (0.7 / (rows - 1)) * p.r),
      w: Math.max(65, getRandomWidth(MIN_WIDTH + 10, MAX_WIDTH))
    }));

  } else if (difficulty === 'normal') {
    const cols = 4, rows = 4;
    const pathCoords = generateHamiltonianPath(cols, rows);
    const count = Math.floor(Math.random() * 5) + 12; // 12〜16点
    const slicedCoords = pathCoords.slice(0, count);

    nodes = slicedCoords.map(p => ({
      x: 70 + (w - 140) * (p.c / (cols - 1)),
      y: uiBottom + playableHeight * (0.15 + (0.7 / (rows - 1)) * p.r),
      w: getRandomWidth(MIN_WIDTH, MAX_WIDTH - 20)
    }));

  } else {
    // Hard: 5×4 = 20点
    const cols = 4, rows = 5;
    const pathCoords = generateHamiltonianPath(cols, rows);

    // Hardは初期幅を細め（30〜50pt）に設定して壁との一体化を防ぐ
    nodes = pathCoords.map(p => ({
      x: 70 + (w - 140) * (p.c / (cols - 1)),
      y: uiBottom + playableHeight * (0.15 + (0.7 / (rows - 1)) * p.r),
      w: getRandomWidth(30, 50)
    }));

    // 壁の配置（太さが変化しない偶数インデックスの区間に2箇所設置）
    const evenIndices = [];
    for (let i = 2; i < nodes.length - 2; i += 2) {
      evenIndices.push(i);
    }
    // ランダムに2箇所選出
    evenIndices.sort(() => Math.random() - 0.5);
    wallSegments = evenIndices.slice(0, 2);

    // 壁は1.1秒ごとに開閉
    wallTimer = setInterval(() => {
      isWallClosed = !isWallClosed;
    }, 1100);

    // 奇数番目ノードの太さ変動（0.5秒ごとに1pt変動）
    widthChangeTimer = setInterval(() => {
      if (widthExpanding) {
        currentOddWidthOffset += 1;
        if (currentOddWidthOffset >= 6) {
          widthExpanding = false; // 上限に達したら縮小へ
        }
      } else {
        currentOddWidthOffset -= 1;
        if (currentOddWidthOffset <= -12) {
          widthExpanding = true; // 下限に達したら拡大へ
        }
      }
    }, 500);
  }

  trace = [];
  isPlaying = false;
  lastTouchPos = null;
}

// ノード毎の実効幅計算（奇数点のみ動的変化）
function getNodeWidth(index) {
  const baseW = nodes[index].w;
  if (difficulty === 'hard' && index % 2 !== 0) {
    return Math.max(20, baseW + currentOddWidthOffset);
  }
  return baseW;
}

function drawPipeSegment(p1, p2, w1, w2, diff) {
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;
  const len = Math.hypot(dx, dy);
  if (len === 0) return;

  const nx = -dy / len;
  const ny = dx / len;
  const avgW = (w1 + w2) / 2;
  const halfW = avgW / 2 + 8;

  const grad = ctx.createLinearGradient(
    (p1.x + p2.x) / 2 - nx * halfW,
    (p1.y + p2.y) / 2 - ny * halfW,
    (p1.x + p2.x) / 2 + nx * halfW,
    (p1.y + p2.y) / 2 + ny * halfW
  );

  if (diff === 'easy') {
    grad.addColorStop(0.0, '#003355'); grad.addColorStop(0.3, '#00aacc');
    grad.addColorStop(0.5, '#ffffff'); grad.addColorStop(0.7, '#00aacc'); grad.addColorStop(1.0, '#002233');
  } else if (diff === 'normal') {
    grad.addColorStop(0.0, '#4a3500'); grad.addColorStop(0.3, '#d4af37');
    grad.addColorStop(0.5, '#ffffff'); grad.addColorStop(0.7, '#d4af37'); grad.addColorStop(1.0, '#332400');
  } else {
    grad.addColorStop(0.0, '#440000'); grad.addColorStop(0.3, '#cc2222');
    grad.addColorStop(0.5, '#ffffff'); grad.addColorStop(0.7, '#cc2222'); grad.addColorStop(1.0, '#220000');
  }

  // テーパー状の外枠描画
  ctx.save();
  ctx.strokeStyle = grad;
  ctx.lineWidth = avgW + 16;
  ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  ctx.restore();
}

// 物理的なハッチング危険壁の描画
function drawWall(p1, p2, width) {
  if (!isWallClosed) return; // 通れる時は完全に何も表示しない

  const mx = (p1.x + p2.x) / 2;
  const my = (p1.y + p2.y) / 2;
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;
  const len = Math.hypot(dx, dy);
  if (len === 0) return;

  ctx.save();
  ctx.translate(mx, my);
  ctx.rotate(Math.atan2(dy, dx));

  const wallThickness = 16;
  const halfW = width / 2;

  // 赤背景
  ctx.fillStyle = '#cc0000';
  ctx.fillRect(-wallThickness / 2, -halfW, wallThickness, width);

  // 黒のハッチングパターン
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 4;
  for (let i = -halfW; i <= halfW; i += 8) {
    ctx.beginPath();
    ctx.moveTo(-wallThickness / 2, i);
    ctx.lineTo(wallThickness / 2, i + 8);
    ctx.stroke();
  }

  // 外枠強調
  ctx.strokeStyle = '#ff3333';
  ctx.lineWidth = 2;
  ctx.strokeRect(-wallThickness / 2, -halfW, wallThickness, width);

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // 1. メタリックパイプ外枠の描画
  for (let i = 0; i < nodes.length - 1; i++) {
    const w1 = getNodeWidth(i);
    const w2 = getNodeWidth(i + 1);
    drawPipeSegment(nodes[i], nodes[i + 1], w1, w2, difficulty);
  }

  // 2. 内側のくり抜き（黒色）- テーパー接続でスムーズな可変幅を表現
  for (let i = 0; i < nodes.length - 1; i++) {
    const w1 = getNodeWidth(i);
    const w2 = getNodeWidth(i + 1);
    
    const p1 = nodes[i];
    const p2 = nodes[i + 1];
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy);
    if (len === 0) continue;

    const nx = -dy / len;
    const ny = dx / len;

    // ポリゴンで内側を綺麗にくり抜いて関節部分の離脱を防ぐ
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.moveTo(p1.x - nx * (w1 / 2), p1.y - ny * (w1 / 2));
    ctx.lineTo(p2.x - nx * (w2 / 2), p2.y - ny * (w2 / 2));
    ctx.lineTo(p2.x + nx * (w2 / 2), p2.y + ny * (w2 / 2));
    ctx.lineTo(p1.x + nx * (w1 / 2), p1.y + ny * (w1 / 2));
    ctx.closePath();
    ctx.fill();

    // 関節部分の円形カバー
    ctx.beginPath();
    ctx.arc(p1.x, p1.y, w1 / 2, 0, Math.PI * 2);
    ctx.arc(p2.x, p2.y, w2 / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // 3. シャッター壁の描画（Hard限定）
  if (difficulty === 'hard') {
    wallSegments.forEach(idx => {
      if (idx < nodes.length - 1) {
        const w1 = getNodeWidth(idx);
        const w2 = getNodeWidth(idx + 1);
        drawWall(nodes[idx], nodes[idx + 1], (w1 + w2) / 2);
      }
    });
  }

  // 4. トレース軌跡
  if (trace.length > 0) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    trace.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
  }

  // 5. スタート/ゴール点
  const start = nodes[0];
  const goal = nodes[nodes.length - 1];

  ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.arc(start.x, start.y, 22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(goal.x, goal.y, 22, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#000'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('S', start.x, start.y);
  ctx.fillText('G', goal.x, goal.y);
}

function distToSegmentSq(p, p1, p2) {
  const l2 = (p2.x - p1.x) ** 2 + (p2.y - p1.y) ** 2;
  if (l2 === 0) return { dSq: (p.x - p1.x) ** 2 + (p.y - p1.y) ** 2, t: 0 };
  let t = ((p.x - p1.x) * (p2.x - p1.x) + (p.y - p1.y) * (p2.y - p1.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  const dSq = (p.x - (p1.x + t * (p2.x - p1.x))) ** 2 + (p.y - (p1.y + t * (p2.y - p1.y))) ** 2;
  return { dSq, t };
}

function isInsideCourse(x, y) {
  let minDistanceSq = Infinity;
  let currentWidthAtPos = MIN_WIDTH;

  for (let i = 0; i < nodes.length - 1; i++) {
    const p1 = nodes[i];
    const p2 = nodes[i + 1];
    const { dSq, t } = distToSegmentSq({ x, y }, p1, p2);

    const w1 = getNodeWidth(i);
    const w2 = getNodeWidth(i + 1);
    const segW = w1 + t * (w2 - w1);

    // 壁出現中の判定
    if (difficulty === 'hard' && isWallClosed && wallSegments.includes(i)) {
      if (t >= 0.35 && t <= 0.65) {
        if (dSq <= (segW / 2) ** 2) {
          return false; // 赤い壁への衝突判定
        }
      }
    }

    if (dSq < minDistanceSq) {
      minDistanceSq = dSq;
      currentWidthAtPos = segW;
    }
  }

  const safeRadius = (currentWidthAtPos / 2) * 0.85;
  return minDistanceSq <= safeRadius ** 2;
}

function gameLoop() {
  draw();
  requestAnimationFrame(gameLoop);
}

function handleTouchStart(e) {
  if (isCleared) {
    generateCourse();
    return;
  }

  const touch = e.touches ? e.touches[0] : e;
  lastTouchPos = { x: touch.clientX, y: touch.clientY };
}

function handleTouchMove(e) {
  if (isCleared) return;

  const touch = e.touches ? e.touches[0] : e;
  const x = touch.clientX, y = touch.clientY;
  const start = nodes[0];
  const goal = nodes[nodes.length - 1];

  const distStart = Math.hypot(x - start.x, y - start.y);
  
  if (distStart < 30 && !isPlaying) { 
    isPlaying = true; 
    trace = []; 
    showMsg('START!', '', '#fff'); 
    lastTouchPos = { x, y };
  }
  if (!isPlaying) return;

  // ゴール処理
  if (Math.hypot(x - goal.x, y - goal.y) < 25) {
    isPlaying = false;
    isCleared = true;

    const points = { easy: 1, normal: 2, hard: 3 };
    stats[difficulty]++;
    stats.total += points[difficulty];
    saveStats();

    const diffTitle = difficulty.toUpperCase();
    showMsg(`${diffTitle} CLEAR!`, '画面をタップして次のコースへ', '#00ffcc');
    return;
  }

  // 衝突検知
  if (distStart > 30) {
    const prev = lastTouchPos || { x, y };
    const dist = Math.hypot(x - prev.x, y - prev.y);
    const steps = Math.max(1, Math.ceil(dist / 3));

    for (let i = 1; i <= steps; i++) {
      const checkX = prev.x + (x - prev.x) * (i / steps);
      const checkY = prev.y + (y - prev.y) * (i / steps);

      if (!isInsideCourse(checkX, checkY)) {
        isPlaying = false; 
        showMsg('ビリビリ！', '', '#ff3366'); 
        if (navigator.vibrate) navigator.vibrate(200);
        setTimeout(generateCourse, 1000); 
        return;
      }
    }
    trace.push({x, y});
  }

  lastTouchPos = { x, y };
}

canvas.addEventListener('touchstart', handleTouchStart);
canvas.addEventListener('touchmove', handleTouchMove);
canvas.addEventListener('touchend', () => { lastTouchPos = null; });

canvas.addEventListener('mousedown', handleTouchStart);
canvas.addEventListener('mousemove', (e) => {
  if (e.buttons === 1) handleTouchMove(e);
});
canvas.addEventListener('mouseup', () => { lastTouchPos = null; });

window.addEventListener('resize', () => { resizeCanvas(); generateCourse(); });

function showMsg(main, sub, c) {
  const o = document.getElementById('overlay');
  const m = document.getElementById('main-msg');
  const s = document.getElementById('sub-msg');
  
  m.innerText = main;
  m.style.color = c;
  s.innerText = sub || '';
  o.style.display = 'block';

  if (!isCleared) {
    setTimeout(hideOverlay, 600);
  }
}

function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

window.onload = init;
</script>
</body>
</html>
