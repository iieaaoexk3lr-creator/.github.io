<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ドキドキ棒</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
    
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; flex-direction: column; gap: 5px; }
    
    .stats-box { background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px; border: 1px solid #444; font-size: 14px; }
    .title-text { color: #ff0077; font-weight: bold; font-size: 20px; margin-bottom: 5px; }
    .score-row { display: flex; gap: 10px; }
    
    .controls { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
    .btn { background: #333; color: white; border: 1px solid #666; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn.active { background: #ff0077; border-color: #cc0066; }
    
    canvas { display: block; }
    #overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 50px; font-weight: 900; display: none; pointer-events: none; text-shadow: 0 0 10px #000, 0 0 20px #000;}
  </style>
</head>
<body>

<div id="ui">
  <div class="stats-box">
    <div class="title-text">ドキドキ棒</div>
    <div class="score-row">
      <div>E: <span id="count-easy">0</span></div>
      <div>N: <span id="count-normal">0</span></div>
      <div>H: <span id="count-hard">0</span></div>
    </div>
    <div style="font-size: 18px; margin-top: 5px;">総合点: <span id="total-score" style="color:#00ffcc; font-weight:bold;">0</span></div>
  </div>
  <div class="controls">
    <button class="btn active" id="btn-easy" onclick="setDiff('easy')">Easy</button>
    <button class="btn" id="btn-normal" onclick="setDiff('normal')">Normal</button>
    <button class="btn" id="btn-hard" onclick="setDiff('hard')">Hard</button>
    <button class="btn" style="background:#444;" onclick="if(!isPlaying) generateCourse()">コース変更</button>
    <button class="btn" style="background:#880000;" onclick="resetStats()">リセット</button>
  </div>
</div>

<div id="overlay"></div>
<canvas id="stage"></canvas>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let stats = { easy: 0, normal: 0, hard: 0, total: 0 };
let isPlaying = false;
let difficulty = 'easy';
let path = [], trace = [];
const pathWidth = 40;

function loadStats() {
  const saved = localStorage.getItem('dokidoki_stats');
  if (saved) stats = JSON.parse(saved);
  updateDisplay();
}

function updateDisplay() {
  document.getElementById('count-easy').innerText = stats.easy;
  document.getElementById('count-normal').innerText = stats.normal;
  document.getElementById('count-hard').innerText = stats.hard;
  document.getElementById('total-score').innerText = stats.total;
}

function saveStats() {
  localStorage.setItem('dokidoki_stats', JSON.stringify(stats));
  updateDisplay();
}

function setDiff(d) {
  difficulty = d;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + d).classList.add('active');
  generateCourse();
}

function resetStats() {
  if (confirm("記録をすべてリセットしますか？")) {
    stats = { easy: 0, normal: 0, hard: 0, total: 0 };
    saveStats();
    generateCourse();
  }
}

function init() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  loadStats();
  generateCourse();
}

function generateCourse() {
  path = [];
  const w = canvas.width, h = canvas.height;
  const startX = 60, endX = w - 60;
  
  if (difficulty === 'easy') {
    path = [{x: startX, y: h/2}, {x: w/2, y: h/4}, {x: endX, y: h/2}];
  } else if (difficulty === 'normal') {
    path = [{x: startX, y: h/2}, {x: w*0.3, y: h/4}, {x: w*0.6, y: h*0.75}, {x: endX, y: h/2}];
  } else {
    path = [{x: startX, y: h/2}, {x: w*0.3, y: h/6}, {x: w*0.5, y: h*0.8}, {x: w*0.7, y: h/6}, {x: endX, y: h/2}];
  }
  trace = [];
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#ff3366'; ctx.lineWidth = pathWidth + 10; ctx.lineCap = 'round';
  ctx.beginPath(); path.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)); ctx.stroke();
  ctx.strokeStyle = '#000'; ctx.lineWidth = pathWidth;
  ctx.beginPath(); path.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); trace.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)); ctx.stroke();
  ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.arc(path[0].x, path[0].y, 20, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(path[path.length-1].x, path[path.length-1].y, 20, 0, Math.PI*2); ctx.fill();
}

canvas.addEventListener('touchmove', (e) => {
  const x = e.touches[0].clientX, y = e.touches[0].clientY;
  const distStart = Math.hypot(x - path[0].x, y - path[0].y);
  
  // スタート地点に触れた瞬間
  if (distStart < 30 && !isPlaying) { 
    isPlaying = true; 
    trace = []; 
    showMsg('START!', '#fff');
  }
  
  if (!isPlaying) return;

  // ゴール判定
  if (Math.hypot(x - path[path.length-1].x, y - path[path.length-1].y) < 20) {
    isPlaying = false;
    const points = { easy: 1, normal: 2, hard: 3 };
    stats[difficulty]++;
    stats.total += points[difficulty];
    saveStats();
    showMsg('GOAL!', '#0f0'); 
    setTimeout(generateCourse, 1000); 
    return;
  }

  // 壁判定
  if (distStart > 30) {
    const pixel = ctx.getImageData(x, y, 1, 1).data;
    if (pixel[0] > 100) {
      isPlaying = false; 
      showMsg('ビリビリ！', '#ff3366'); 
      if (navigator.vibrate) navigator.vibrate(200);
      setTimeout(generateCourse, 1000); 
      return;
    }
    trace.push({x, y});
  }
  draw();
});

function showMsg(t, c) {
  const o = document.getElementById('overlay');
  o.innerText = t; o.style.color = c; o.style.display = 'block';
  // 表示時間を調整（短めに）
  setTimeout(() => o.style.display = 'none', 600);
}

window.onload = init;
</script>
</body>
</html>
