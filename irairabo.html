<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ドキドキ棒</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; flex-direction: column; gap: 10px; width: calc(100% - 20px); }
    
    .stats-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 12px; border: 1px solid #444; font-size: 16px; }
    .title-text { color: #fff; font-weight: bold; font-size: 22px; margin-bottom: 5px; }
    
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn { height: 50px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: #fff; opacity: 0.5; transition: opacity 0.2s; }
    .btn.active { opacity: 1; border: 3px solid #fff; }
    
    #btn-easy { background: #00ccff; }
    #btn-normal { background: #ffd700; color: #000; }
    #btn-hard { background: #ff4444; }
    
    .extra-btns { display: flex; gap: 10px; margin-top: 5px; }
    .secondary-btn { flex: 1; height: 40px; background: #333; color: #fff; border-radius: 8px; border: none; font-size: 14px; }
    
    canvas { display: block; }
    #overlay { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); font-size: 50px; font-weight: 900; display: none; pointer-events: none; text-shadow: 0 0 10px #000, 0 0 20px #000;}
  </style>
</head>
<body>

<div id="ui">
  <div class="stats-box">
    <div class="title-text">ドキドキ棒</div>
    <div>総合点: <span id="total-score" style="color:#00ffcc; font-weight:bold; font-size: 20px;">0</span> (E:<span id="count-easy">0</span> N:<span id="count-normal">0</span> H:<span id="count-hard">0</span>)</div>
  </div>
  <div class="controls">
    <button class="btn active" id="btn-easy" onclick="setDiff('easy')">Easy</button>
    <button class="btn" id="btn-normal" onclick="setDiff('normal')">Normal</button>
    <button class="btn" id="btn-hard" onclick="setDiff('hard')">Hard</button>
  </div>
  <div class="extra-btns">
    <button class="secondary-btn" onclick="if(!isPlaying) generateCourse()">コース変更</button>
    <button class="secondary-btn" onclick="resetStats()" style="background:#800;">リセット</button>
  </div>
</div>

<div id="overlay"></div>
<canvas id="stage"></canvas>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let stats = { easy: 0, normal: 0, hard: 0, total: 0 };
let isPlaying = false;
let difficulty = 'easy';
let nodes = []; 
let trace = [];
let lastTouchPos = null;

const MIN_WIDTH = 42; 
const MAX_WIDTH = 90;

function loadStats() {
  const saved = localStorage.getItem('dokidoki_stats');
  if (saved) stats = JSON.parse(saved);
  updateDisplay();
}

function updateDisplay() {
  document.getElementById('count-easy').innerText = stats.easy;
  document.getElementById('count-normal').innerText = stats.normal;
  document.getElementById('count-hard').innerText = stats.hard;
  document.getElementById('total-score').innerText = stats.total;
}

function saveStats() {
  localStorage.setItem('dokidoki_stats', JSON.stringify(stats));
  updateDisplay();
}

function setDiff(d) {
  difficulty = d;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + d).classList.add('active');
  generateCourse();
}

function resetStats() {
  if (confirm("記録をリセットしますか？")) {
    stats = { easy: 0, normal: 0, hard: 0, total: 0 };
    saveStats();
    generateCourse();
  }
}

function init() {
  resizeCanvas();
  loadStats();
  generateCourse();
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function getRandomWidth() {
  return MIN_WIDTH + Math.random() * (MAX_WIDTH - MIN_WIDTH);
}

// 全格子点を巡回するハミルトンパス（一筆書き）を深さ優先探索で生成
function generateHamiltonianPath(cols, rows) {
  const visited = new Array(rows).fill(null).map(() => new Array(cols).fill(false));
  const path = [];
  const totalPoints = cols * rows;

  // ランダムなスタート行（左端の列）
  const startR = Math.floor(Math.random() * rows);
  
  function dfs(r, c) {
    visited[r][c] = true;
    path.push({ r, c });

    if (path.length === totalPoints) return true;

    // シャッフルした隣接方向（上下左右）
    const dirs = [
      { r: r - 1, c: c },
      { r: r + 1, c: c },
      { r: r, c: c - 1 },
      { r: r, c: c + 1 }
    ].sort(() => Math.random() - 0.5);

    for (let d of dirs) {
      if (d.r >= 0 && d.r < rows && d.c >= 0 && d.c < cols && !visited[d.r][d.c]) {
        if (dfs(d.r, d.c)) return true;
      }
    }

    visited[r][c] = false;
    path.pop();
    return false;
  }

  // 成功するまで再試行
  let attempts = 0;
  while (attempts < 100) {
    attempts++;
    for (let r = 0; r < rows; r++) visited[r].fill(false);
    path.length = 0;
    const initialR = Math.floor(Math.random() * rows);
    if (dfs(initialR, 0)) return path;
  }

  // 万が一見つからなければフォールバック（蛇行巡回）
  path.length = 0;
  for (let c = 0; c < cols; c++) {
    if (c % 2 === 0) {
      for (let r = 0; r < rows; r++) path.push({ r, c });
    } else {
      for (let r = rows - 1; r >= 0; r--) path.push({ r, c });
    }
  }
  return path;
}

function generateCourse() {
  nodes = [];
  const w = canvas.width, h = canvas.height;
  
  const uiElement = document.getElementById('ui');
  const uiBottom = uiElement ? uiElement.getBoundingClientRect().bottom + 30 : 220;
  const playableHeight = h - uiBottom - 80;

  if (difficulty === 'easy') {
    // Easy: 左から右へ3列。直前の点と同じ高さは選ばない。
    const rows = 3; // 上・中・下
    const yList = [
      uiBottom + playableHeight * 0.15,
      uiBottom + playableHeight * 0.5,
      uiBottom + playableHeight * 0.85
    ];
    const xList = [70, w / 2, w - 70];

    let lastRow = Math.floor(Math.random() * rows);
    nodes.push({ x: xList[0], y: yList[lastRow], w: Math.max(65, getRandomWidth()) });

    for (let c = 1; c < 3; c++) {
      let nextRow;
      do {
        nextRow = Math.floor(Math.random() * rows);
      } while (nextRow === lastRow); // 直前と同じ高さは避ける

      nodes.push({ x: xList[c], y: yList[nextRow], w: Math.max(65, getRandomWidth()) });
      lastRow = nextRow;
    }

  } else {
    // Normal: 4×3, Hard: 4×4 の格子上の全点を巡回（一筆書き）
    const cols = 4;
    const rows = difficulty === 'normal' ? 3 : 4;

    const pathCoords = generateHamiltonianPath(cols, rows);

    // 格子点のピクセル座標計算
    nodes = pathCoords.map(p => {
      const x = 70 + (w - 140) * (p.c / (cols - 1));
      const y = uiBottom + playableHeight * (0.15 + (0.7 / (rows - 1)) * p.r);
      return { x, y, w: getRandomWidth() };
    });
  }

  trace = [];
  isPlaying = false;
  lastTouchPos = null;
  draw();
}

// 線分ごとの立体的なパイプ風（金属）グラデーション生成
function drawPipeSegment(p1, p2, width, diff) {
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;
  const len = Math.hypot(dx, dy);
  if (len === 0) return;

  // 線分に対して垂直なベクトルを求める（パイプの太さ方向にグラデーションをかけるため）
  const nx = -dy / len;
  const ny = dx / len;

  const halfW = width / 2 + 9; // 外枠の半幅

  // 線分と直交する方向にグラデーションを作成
  const grad = ctx.createLinearGradient(
    (p1.x + p2.x) / 2 - nx * halfW,
    (p1.y + p2.y) / 2 - ny * halfW,
    (p1.x + p2.x) / 2 + nx * halfW,
    (p1.y + p2.y) / 2 + ny * halfW
  );

  if (diff === 'easy') {
    grad.addColorStop(0.0, '#003355');
    grad.addColorStop(0.3, '#00aacc');
    grad.addColorStop(0.5, '#ffffff'); // 金属のハイライト（光沢）
    grad.addColorStop(0.7, '#00aacc');
    grad.addColorStop(1.0, '#002233');
  } else if (diff === 'normal') {
    grad.addColorStop(0.0, '#4a3500');
    grad.addColorStop(0.3, '#d4af37');
    grad.addColorStop(0.5, '#ffffff'); // 金色のハイライト
    grad.addColorStop(0.7, '#d4af37');
    grad.addColorStop(1.0, '#332400');
  } else {
    grad.addColorStop(0.0, '#440000');
    grad.addColorStop(0.3, '#cc2222');
    grad.addColorStop(0.5, '#ffffff'); // 銅・赤金属のハイライト
    grad.addColorStop(0.7, '#cc2222');
    grad.addColorStop(1.0, '#220000');
  }

  ctx.strokeStyle = grad;
  ctx.lineWidth = width + 18;
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // 1. 金属パイプ枠線の描画（各線分に立体グラデーション）
  for (let i = 0; i < nodes.length - 1; i++) {
    const p1 = nodes[i];
    const p2 = nodes[i + 1];
    const segmentWidth = (p1.w + p2.w) / 2;
    drawPipeSegment(p1, p2, segmentWidth, difficulty);
  }

  // 2. 黒いくり抜き通路の描画
  for (let i = 0; i < nodes.length - 1; i++) {
    const p1 = nodes[i];
    const p2 = nodes[i + 1];
    const segmentWidth = (p1.w + p2.w) / 2;

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = segmentWidth;
    ctx.stroke();
  }

  // 3. 軌跡の描画
  if (trace.length > 0) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    trace.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
  }

  // 4. スタート（S）とゴール（G）
  const start = nodes[0];
  const goal = nodes[nodes.length - 1];

  ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.arc(start.x, start.y, 24, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(goal.x, goal.y, 24, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#000'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('S', start.x, start.y);
  ctx.fillText('G', goal.x, goal.y);
}

function distToSegmentSq(p, p1, p2) {
  const l2 = (p2.x - p1.x) ** 2 + (p2.y - p1.y) ** 2;
  if (l2 === 0) return { dSq: (p.x - p1.x) ** 2 + (p.y - p1.y) ** 2, t: 0 };
  let t = ((p.x - p1.x) * (p2.x - p1.x) + (p.y - p1.y) * (p2.y - p1.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  const dSq = (p.x - (p1.x + t * (p2.x - p1.x))) ** 2 + (p.y - (p1.y + t * (p2.y - p1.y))) ** 2;
  return { dSq, t };
}

function isInsideCourse(x, y) {
  let minDistanceSq = Infinity;
  let currentWidthAtPos = MIN_WIDTH;

  for (let i = 0; i < nodes.length - 1; i++) {
    const p1 = nodes[i];
    const p2 = nodes[i + 1];
    const { dSq, t } = distToSegmentSq({ x, y }, p1, p2);

    if (dSq < minDistanceSq) {
      minDistanceSq = dSq;
      currentWidthAtPos = p1.w + t * (p2.w - p1.w);
    }
  }

  const safeRadius = (currentWidthAtPos / 2) * 0.85;
  return minDistanceSq <= safeRadius ** 2;
}

canvas.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];
  lastTouchPos = { x: touch.clientX, y: touch.clientY };
});

canvas.addEventListener('touchmove', (e) => {
  const x = e.touches[0].clientX, y = e.touches[0].clientY;
  const distStart = Math.hypot(x - nodes[0].x, y - nodes[0].y);
  
  if (distStart < 30 && !isPlaying) { 
    isPlaying = true; 
    trace = []; 
    showMsg('START!', '#fff'); 
    lastTouchPos = { x, y };
  }
  if (!isPlaying) return;

  if (Math.hypot(x - nodes[nodes.length-1].x, y - nodes[nodes.length-1].y) < 25) {
    isPlaying = false;
    const points = { easy: 1, normal: 2, hard: 3 };
    stats[difficulty]++;
    stats.total += points[difficulty];
    saveStats();
    showMsg('GOAL!', '#0f0'); 
    setTimeout(generateCourse, 1000); 
    return;
  }

  if (distStart > 30) {
    const prev = lastTouchPos || { x, y };
    const dist = Math.hypot(x - prev.x, y - prev.y);
    const steps = Math.max(1, Math.ceil(dist / 3));

    for (let i = 1; i <= steps; i++) {
      const checkX = prev.x + (x - prev.x) * (i / steps);
      const checkY = prev.y + (y - prev.y) * (i / steps);

      if (!isInsideCourse(checkX, checkY)) {
        isPlaying = false; 
        showMsg('ビリビリ！', '#ff3366'); 
        if (navigator.vibrate) navigator.vibrate(200);
        setTimeout(generateCourse, 1000); 
        return;
      }
    }
    trace.push({x, y});
  }

  lastTouchPos = { x, y };
  draw();
});

canvas.addEventListener('touchend', () => {
  lastTouchPos = null;
});

window.addEventListener('resize', () => {
  resizeCanvas();
  generateCourse();
});

function showMsg(t, c) {
  const o = document.getElementById('overlay');
  o.innerText = t; o.style.color = c; o.style.display = 'block';
  setTimeout(() => o.style.display = 'none', 600);
}

window.onload = init;
</script>
</body>
</html>
