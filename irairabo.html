<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ドキドキ棒</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050508; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; flex-direction: column; gap: 10px; width: calc(100% - 20px); }
    
    .stats-box { background: rgba(10, 15, 25, 0.85); padding: 15px; border-radius: 12px; border: 1px solid #334466; font-size: 16px; backdrop-filter: blur(5px); }
    .title-text { color: #fff; font-weight: bold; font-size: 22px; margin-bottom: 5px; letter-spacing: 1px; }
    
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn { height: 50px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: #fff; opacity: 0.5; transition: opacity 0.2s; }
    .btn.active { opacity: 1; border: 2px solid #fff; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
    
    #btn-easy { background: #00ccff; }
    #btn-normal { background: #ffd700; color: #000; }
    #btn-hard { background: #ff4444; }
    
    .extra-btns { display: flex; gap: 10px; margin-top: 5px; }
    .secondary-btn { flex: 1; height: 40px; background: #1a2233; color: #fff; border-radius: 8px; border: 1px solid #445577; font-size: 14px; }
    
    canvas { display: block; }
    #overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 42px; font-weight: 900; display: none; text-align: center; width: 100%; pointer-events: none; text-shadow: 0 0 10px #000, 0 0 20px #000; z-index: 20; }
    .sub-msg { font-size: 18px; font-weight: normal; color: #ccc; margin-top: 15px; }
  </style>
</head>
<body>

<div id="ui">
  <div class="stats-box">
    <div class="title-text">ドキドキ棒</div>
    <div>総合点: <span id="total-score" style="color:#00ffcc; font-weight:bold; font-size: 20px;">0</span> (E:<span id="count-easy">0</span> N:<span id="count-normal">0</span> H:<span id="count-hard">0</span>)</div>
  </div>
  <div class="controls">
    <button class="btn active" id="btn-easy" onclick="setDiff('easy')">Easy</button>
    <button class="btn" id="btn-normal" onclick="setDiff('normal')">Normal</button>
    <button class="btn" id="btn-hard" onclick="setDiff('hard')">Hard</button>
  </div>
  <div class="extra-btns">
    <button class="secondary-btn" onclick="if(!isPlaying && !isCleared) generateCourse()">コース変更</button>
    <button class="secondary-btn" onclick="resetStats()" style="background:#551111; border-color:#aa3333;">リセット</button>
  </div>
</div>

<div id="overlay">
  <div id="main-msg"></div>
  <div id="sub-msg" class="sub-msg"></div>
</div>
<canvas id="stage"></canvas>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let stats = { easy: 0, normal: 0, hard: 0, total: 0 };
let isPlaying = false;
let isCleared = false;
let difficulty = 'easy';
let nodes = []; 
let trace = [];
let lastTouchPos = null;

// 1秒ごとの壁開閉ギミック用
let wallTimer = null;
let isWallClosed = false;
let wallSegments = [];

// 0.5秒ごとの奇数点伸縮ギミック用
let widthChangeTimer = null;
let currentOddWidthOffset = 0; 
let widthExpanding = false; 

const MIN_WIDTH = 40; 
const MAX_WIDTH = 80;

function loadStats() {
  const saved = localStorage.getItem('dokidoki_stats');
  if (saved) stats = JSON.parse(saved);
  updateDisplay();
}

function updateDisplay() {
  document.getElementById('count-easy').innerText = stats.easy;
  document.getElementById('count-normal').innerText = stats.normal;
  document.getElementById('count-hard').innerText = stats.hard;
  document.getElementById('total-score').innerText = stats.total;
}

function saveStats() {
  localStorage.setItem('dokidoki_stats', JSON.stringify(stats));
  updateDisplay();
}

function setDiff(d) {
  if (isCleared) return;
  difficulty = d;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + d).classList.add('active');
  generateCourse();
}

function resetStats() {
  if (confirm("記録をリセットしますか？")) {
    stats = { easy: 0, normal: 0, hard: 0, total: 0 };
    saveStats();
    generateCourse();
  }
}

function init() {
  resizeCanvas();
  loadStats();
  generateCourse();
  gameLoop();
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function getRandomWidth(min, max) {
  return min + Math.random() * (max - min);
}

function generateHamiltonianPath(cols, rows) {
  const visited = new Array(rows).fill(null).map(() => new Array(cols).fill(false));
  const path = [];
  const totalPoints = cols * rows;

  function dfs(r, c) {
    visited[r][c] = true;
    path.push({ r, c });
    if (path.length === totalPoints) return true;

    const dirs = [
      { r: r - 1, c: c },
      { r: r + 1, c: c },
      { r: r, c: c - 1 },
      { r: r, c: c + 1 }
    ].sort(() => Math.random() - 0.5);

    for (let d of dirs) {
      if (d.r >= 0 && d.r < rows && d.c >= 0 && d.c < cols && !visited[d.r][d.c]) {
        if (dfs(d.r, d.c)) return true;
      }
    }
    visited[r][c] = false;
    path.pop();
    return false;
  }

  let attempts = 0;
  while (attempts < 100) {
    attempts++;
    for (let r = 0; r < rows; r++) visited[r].fill(false);
    path.length = 0;
    if (dfs(Math.floor(Math.random() * rows), 0)) return path;
  }

  path.length = 0;
  for (let c = 0; c < cols; c++) {
    if (c % 2 === 0) {
      for (let r = 0; r < rows; r++) path.push({ r, c });
    } else {
      for (let r = rows - 1; r >= 0; r--) path.push({ r, c });
    }
  }
  return path;
}

function generateCourse() {
  if (wallTimer) clearInterval(wallTimer);
  if (widthChangeTimer) clearInterval(widthChangeTimer);

  wallSegments = [];
  isWallClosed = false;
  isCleared = false;
  currentOddWidthOffset = 0;
  widthExpanding = false;
  hideOverlay();

  nodes = [];
  const w = canvas.width, h = canvas.height;
  const uiElement = document.getElementById('ui');
  const uiBottom = uiElement ? uiElement.getBoundingClientRect().bottom + 30 : 220;
  const playableHeight = h - uiBottom - 80;

  if (difficulty === 'easy') {
    const cols = 3, rows = 3;
    const pathCoords = generateHamiltonianPath(cols, rows);
    const count = Math.floor(Math.random() * 3) + 7;
    const slicedCoords = pathCoords.slice(0, count);

    nodes = slicedCoords.map(p => ({
      x: 70 + (w - 140) * (p.c / (cols - 1)),
      y: uiBottom + playableHeight * (0.15 + (0.7 / (rows - 1)) * p.r),
      w: Math.max(65, getRandomWidth(MIN_WIDTH + 30 , MAX_WIDTH))
    }));

  } else if (difficulty === 'normal') {
    const cols = 4, rows = 4;
    const pathCoords = generateHamiltonianPath(cols, rows);
    const count = Math.floor(Math.random() * 5) + 12;
    const slicedCoords = pathCoords.slice(0, count);

    nodes = slicedCoords.map(p => ({
      x: 70 + (w - 140) * (p.c / (cols - 1)),
      y: uiBottom + playableHeight * (0.15 + (0.7 / (rows - 1)) * p.r),
      w: getRandomWidth(MIN_WIDTH + 10, MAX_WIDTH - 10)
    }));

  } else {
    // Hard: 5×4 = 20点
    const cols = 4, rows = 5;
    const pathCoords = generateHamiltonianPath(cols, rows);

    nodes = pathCoords.map(p => ({
      x: 70 + (w - 140) * (p.c / (cols - 1)),
      y: uiBottom + playableHeight * (0.15 + (0.7 / (rows - 1)) * p.r),
      w: getRandomWidth(35, 50)
    }));

    // 太さが固定（偶数インデックス）の区間に2箇所壁をセット
    const evenIndices = [];
    for (let i = 2; i < nodes.length - 2; i += 2) {
      evenIndices.push(i);
    }
    evenIndices.sort(() => Math.random() - 0.5);
    wallSegments = evenIndices.slice(0, 2);

    wallTimer = setInterval(() => {
      isWallClosed = !isWallClosed;
    }, 1000);

    widthChangeTimer = setInterval(() => {
      if (widthExpanding) {
        currentOddWidthOffset += 1;
        if (currentOddWidthOffset >= 6) widthExpanding = false;
      } else {
        currentOddWidthOffset -= 1;
        if (currentOddWidthOffset <= -10) widthExpanding = true;
      }
    }, 500);
  }

  trace = [];
  isPlaying = false;
  lastTouchPos = null;
}

function getNodeWidth(index) {
  const baseW = nodes[index].w;
  if (difficulty === 'hard' && index % 2 !== 0) {
    return Math.max(18, baseW + currentOddWidthOffset);
  }
  return baseW;
}

// レーザーバリア風の壁描画（頂点白・シャープなデザイン）
function drawWall(p1, p2, width) {
  if (!isWallClosed) return;

  const mx = (p1.x + p2.x) / 2;
  const my = (p1.y + p2.y) / 2;
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;

  ctx.save();
  ctx.translate(mx, my);
  ctx.rotate(Math.atan2(dy, dx));

  const wallThickness = 12;
  const halfW = width / 2;

  // 赤色のネオン発光背景
  ctx.shadowColor = '#ff0044';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ff0044';
  ctx.fillRect(-wallThickness / 2, -halfW, wallThickness, width);

  // 白いシャープな両端ライン
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-wallThickness / 2, -halfW - 2, wallThickness, 4);
  ctx.fillRect(-wallThickness / 2, halfW - 2, wallThickness, 4);

  // 中央の白コア線
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-2, -halfW + 4, 4, width - 8);

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 難易度に応じた壁・エッジの色設定
  let themeColor = '#00ccff';
  if (difficulty === 'normal') themeColor = '#ffd700';
  if (difficulty === 'hard') themeColor = '#ff4444';

  // --- ポリゴン領域の輪郭線（頂点白・シャープエッジ）計算 ---
  const leftPoints = [];
  const rightPoints = [];

  for (let i = 0; i < nodes.length; i++) {
    const p = nodes[i];
    const w = getNodeWidth(i);
    let nx = 0, ny = 0;

    if (i === 0) {
      const dx = nodes[1].x - p.x, dy = nodes[1].y - p.y;
      const len = Math.hypot(dx, dy);
      nx = -dy / len; ny = dx / len;
    } else if (i === nodes.length - 1) {
      const dx = p.x - nodes[i - 1].x, dy = p.y - nodes[i - 1].y;
      const len = Math.hypot(dx, dy);
      nx = -dy / len; ny = dx / len;
    } else {
      // 隣接する2セグメントの法線平均でシャープに接続
      const dx1 = p.x - nodes[i - 1].x, dy1 = p.y - nodes[i - 1].y;
      const len1 = Math.hypot(dx1, dy1);
      const nx1 = -dy1 / len1, ny1 = dx1 / len1;

      const dx2 = nodes[i + 1].x - p.x, dy2 = nodes[i + 1].y - p.y;
      const len2 = Math.hypot(dx2, dy2);
      const nx2 = -dy2 / len2, ny2 = dx2 / len2;

      nx = (nx1 + nx2) / 2;
      ny = (ny1 + ny2) / 2;
      const nlen = Math.hypot(nx, ny);
      if (nlen > 0) { nx /= nlen; ny /= nlen; }
    }

    leftPoints.push({ x: p.x + nx * (w / 2), y: p.y + ny * (w / 2) });
    rightPoints.push({ x: p.x - nx * (w / 2), y: p.y - ny * (w / 2) });
  }

  // 1. コース全体の黒くり抜き（内側）
  ctx.beginPath();
  ctx.moveTo(leftPoints[0].x, leftPoints[0].y);
  for (let i = 1; i < leftPoints.length; i++) ctx.lineTo(leftPoints[i].x, leftPoints[i].y);
  for (let i = rightPoints.length - 1; i >= 0; i--) ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
  ctx.closePath();
  ctx.fillStyle = '#0a0d14';
  ctx.fill();

  // 2. 発光シャープエッジ（白い輪郭線 + テーマカラー影）
  ctx.save();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.shadowColor = themeColor;
  ctx.shadowBlur = 8;

  // 左エッジ
  ctx.beginPath();
  ctx.moveTo(leftPoints[0].x, leftPoints[0].y);
  for (let i = 1; i < leftPoints.length; i++) ctx.lineTo(leftPoints[i].x, leftPoints[i].y);
  ctx.stroke();

  // 右エッジ
  ctx.beginPath();
  ctx.moveTo(rightPoints[0].x, rightPoints[0].y);
  for (let i = 1; i < rightPoints.length; i++) ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
  ctx.stroke();
  ctx.restore();

  // 3. シャッター壁の描画（Hard限定）
  if (difficulty === 'hard') {
    wallSegments.forEach(idx => {
      if (idx < nodes.length - 1) {
        const w1 = getNodeWidth(idx);
        const w2 = getNodeWidth(idx + 1);
        drawWall(nodes[idx], nodes[idx + 1], (w1 + w2) / 2);
      }
    });
  }

  // 4. トレース軌跡
  if (trace.length > 0) {
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    trace.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.restore();
  }

  // 5. スタート/ゴール点
  const start = nodes[0];
  const goal = nodes[nodes.length - 1];

  ctx.save();
  ctx.shadowBlur = 10;
  
  ctx.fillStyle = '#00ffcc'; ctx.shadowColor = '#00ffcc';
  ctx.beginPath(); ctx.arc(start.x, start.y, 20, 0, Math.PI*2); ctx.fill();
  
  ctx.fillStyle = '#ff0055'; ctx.shadowColor = '#ff0055';
  ctx.beginPath(); ctx.arc(goal.x, goal.y, 20, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#000'; ctx.font = '900 18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('S', start.x, start.y);
  ctx.fillText('G', goal.x, goal.y);
}

function distToSegmentSq(p, p1, p2) {
  const l2 = (p2.x - p1.x) ** 2 + (p2.y - p1.y) ** 2;
  if (l2 === 0) return { dSq: (p.x - p1.x) ** 2 + (p.y - p1.y) ** 2, t: 0 };
  let t = ((p.x - p1.x) * (p2.x - p1.x) + (p.y - p1.y) * (p2.y - p1.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  const dSq = (p.x - (p1.x + t * (p2.x - p1.x))) ** 2 + (p.y - (p1.y + t * (p2.y - p1.y))) ** 2;
  return { dSq, t };
}

function isInsideCourse(x, y) {
  let minDistanceSq = Infinity;
  let currentWidthAtPos = MIN_WIDTH;

  for (let i = 0; i < nodes.length - 1; i++) {
    const p1 = nodes[i];
    const p2 = nodes[i + 1];
    const { dSq, t } = distToSegmentSq({ x, y }, p1, p2);

    const w1 = getNodeWidth(i);
    const w2 = getNodeWidth(i + 1);
    const segW = w1 + t * (w2 - w1);

    if (difficulty === 'hard' && isWallClosed && wallSegments.includes(i)) {
      if (t >= 0.35 && t <= 0.65) {
        if (dSq <= (segW / 2) ** 2) {
          return false;
        }
      }
    }

    if (dSq < minDistanceSq) {
      minDistanceSq = dSq;
      currentWidthAtPos = segW;
    }
  }

  const safeRadius = (currentWidthAtPos / 2) * 0.85;
  return minDistanceSq <= safeRadius ** 2;
}

function gameLoop() {
  draw();
  requestAnimationFrame(gameLoop);
}

function handleTouchStart(e) {
  if (isCleared) {
    generateCourse();
    return;
  }

  const touch = e.touches ? e.touches[0] : e;
  lastTouchPos = { x: touch.clientX, y: touch.clientY };
}

function handleTouchMove(e) {
  if (isCleared) return;

  const touch = e.touches ? e.touches[0] : e;
  const x = touch.clientX, y = touch.clientY;
  const start = nodes[0];
  const goal = nodes[nodes.length - 1];

  const distStart = Math.hypot(x - start.x, y - start.y);
  
  if (distStart < 30 && !isPlaying) { 
    isPlaying = true; 
    trace = []; 
    showMsg('START!', '', '#fff'); 
    lastTouchPos = { x, y };
  }
  if (!isPlaying) return;

  if (Math.hypot(x - goal.x, y - goal.y) < 25) {
    isPlaying = false;
    isCleared = true;

    const points = { easy: 1, normal: 2, hard: 3 };
    stats[difficulty]++;
    stats.total += points[difficulty];
    saveStats();

    const diffTitle = difficulty.toUpperCase();
    showMsg(`${diffTitle} CLEAR!`, '画面をタップして次のコースへ', '#00ffcc');
    return;
  }

  if (distStart > 30) {
    const prev = lastTouchPos || { x, y };
    const dist = Math.hypot(x - prev.x, y - prev.y);
    const steps = Math.max(1, Math.ceil(dist / 3));

    for (let i = 1; i <= steps; i++) {
      const checkX = prev.x + (x - prev.x) * (i / steps);
      const checkY = prev.y + (y - prev.y) * (i / steps);

      if (!isInsideCourse(checkX, checkY)) {
        isPlaying = false; 
        showMsg('ビリビリ！', '', '#ff3366'); 
        if (navigator.vibrate) navigator.vibrate(200);
        setTimeout(generateCourse, 1000); 
        return;
      }
    }
    trace.push({x, y});
  }

  lastTouchPos = { x, y };
}

canvas.addEventListener('touchstart', handleTouchStart);
canvas.addEventListener('touchmove', handleTouchMove);
canvas.addEventListener('touchend', () => { lastTouchPos = null; });

canvas.addEventListener('mousedown', handleTouchStart);
canvas.addEventListener('mousemove', (e) => {
  if (e.buttons === 1) handleTouchMove(e);
});
canvas.addEventListener('mouseup', () => { lastTouchPos = null; });

window.addEventListener('resize', () => { resizeCanvas(); generateCourse(); });

function showMsg(main, sub, c) {
  const o = document.getElementById('overlay');
  const m = document.getElementById('main-msg');
  const s = document.getElementById('sub-msg');
  
  m.innerText = main;
  m.style.color = c;
  s.innerText = sub || '';
  o.style.display = 'block';

  if (!isCleared) {
    setTimeout(hideOverlay, 600);
  }
}

function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

window.onload = init;
</script>
</body>
</html>
