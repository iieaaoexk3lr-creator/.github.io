<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webカメラ指先心拍計 - 病院モニター風</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1117; /* 病院のモニター風にダークモード化 */
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #161b22;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-top: 0;
            color: #58a6ff;
        }
        
        /* LINE・インアプリブラウザ警告エリア */
        .line-warning {
            display: none;
            background-color: #381e1e;
            border: 2px solid #f85149;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            color: #f85149;
            font-size: 0.9rem;
            font-weight: bold;
            line-height: 1.5;
        }

        /* 使い方の説明パネル */
        .instruction-box {
            background-color: #1f242c;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #8b949e;
        }
        .instruction-box h3 {
            margin: 0 0 8px 0;
            color: #58a6ff;
            font-size: 0.95rem;
        }
        .instruction-box ol {
            margin: 0;
            padding-left: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #8b949e;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            font-size: 1rem;
            color: #c9d1d9;
            box-sizing: border-box;
        }

        /* 【新規】モニターレイアウト（心拍計・タイマー・カメラ） */
        .monitor-panel {
            background: #000;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .monitor-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        /* 【新規】経過時間タイマー */
        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            color: #8b949e;
            background: #161b22;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #30363d;
        }

        .video-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #58a6ff;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .current-bpm {
            text-align: center;
            font-size: 3.5rem;
            font-weight: bold;
            color: #39ff14; /* 病院っぽいネオングリーン */
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        .current-bpm span {
            font-size: 1.2rem;
            color: #8b949e;
        }

        /* 【新規】病院風リアルタイム心電図グラフ */
        .chart-container {
            width: 100%;
            height: 120px;
            margin-top: 10px;
            background: #050505;
            border-radius: 6px;
            padding: 5px;
            box-sizing: border-box;
        }

        /* 結果表示エリア */
        #result-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            color: #c9d1d9;
        }
        #result-card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            border-bottom: 2px solid #30363d;
            padding-bottom: 6px;
            color: #58a6ff;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
            margin-top: 12px;
        }
        .stat-box {
            background: #21262d;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #8b949e;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff7b72;
        }
        
        #status {
            text-align: center;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 15px;
        }

        /* ボタン類 */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-start { background-color: #238636; color: white; }
        .btn-save { background-color: #1f6feb; color: white; }
        .btn-reset { background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    </style>
</head>
<body>

<div class="container">
    <h1>指先脈波モニター</h1>
    
    <div id="lineWarning" class="line-warning">
        ⚠️ 警告: LINE等のアプリ内ブラウザでは動きません。<br>
        画面右上などのメニューから「ブラウザで開く」を選び、SafariやChromeで開き直してください。
    </div>

    <div class="instruction-box">
        <h3>💡 測定のコツ</h3>
        <ol>
            <li>カメラとライトを指の腹で同時にピタッと塞ぎます。</li>
            <li><strong>強く押し付けすぎず、そっと触れる程度</strong>にすると血流の変化（グラフの波）が出やすくなります。</li>
        </ol>
    </div>
    
    <div class="input-group">
        <label for="userName">測定者氏名</label>
        <input type="text" id="userName" placeholder="名前を入力してください" value="ゲスト">
    </div>

    <div class="monitor-panel">
        <div class="monitor-top">
            <div class="timer-display" id="timerDisplay">TIME: 00:00</div>
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline muted></video>
            </div>
        </div>
        
        <div class="current-bpm" id="displayBpm">-- <span>BPM</span></div>
        
        <div class="chart-container">
            <canvas id="pulseChart"></canvas>
        </div>
    </div>

    <canvas id="hiddenCanvas" style="display:none;"></canvas>
    <div id="status">「測定開始」ボタンを押してください</div>

    <div id="result-card">
        <h2>測定結果レポート</h2>
        <div><strong>氏名:</strong> <span id="reportName">ゲスト</span></div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">最高心拍</div>
                <div id="maxBpm" class="stat-value">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">最低心拍</div>
                <div id="minBpm" class="stat-value">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">全体平均</div>
                <div id="avgBpm" class="stat-value">--</div>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button class="btn-start" id="startBtn">測定開始</button>
        <button class="btn-save" id="saveBtn">結果を画像で保存</button>
        <button class="btn-reset" id="resetBtn">すべてをリセット</button>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI要素
    const userNameInput = document.getElementById('userName');
    const reportName = document.getElementById('reportName');
    const startBtn = document.getElementById('startBtn');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const displayBpm = document.getElementById('displayBpm');
    const maxBpmText = document.getElementById('maxBpm');
    const minBpmText = document.getElementById('minBpm');
    const avgBpmText = document.getElementById('avgBpm');
    const statusText = document.getElementById('status');
    const lineWarning = document.getElementById('lineWarning');
    const timerDisplay = document.getElementById('timerDisplay');

    let stream = null;
    let animationId = null;
    let isMeasuring = false;

    // タイマー用変数
    let startTime = 0;
    let timerInterval = null;

    // 心拍計算用データ
    let rValues = [];
    let timestamps = [];
    let bpmHistory = [];
    
    // 【新規】Chart.jsの初期化（病院モニター風グラフ設定）
    const chartCtx = document.getElementById('pulseChart').getContext('2d');
    const maxGraphPoints = 60; // 画面内に表示する点の数
    const pulseChart = new Chart(chartCtx, {
        type: 'line',
        data: {
            labels: Array(maxGraphPoints).fill(''),
            datasets: [{
                label: '脈波(血流変化)',
                data: Array(maxGraphPoints).fill(0),
                borderColor: '#39ff14', // ネオングリーン
                borderWidth: 2,
                pointRadius: 0, // 点を非表示にして滑らかに
                tension: 0.4    // 線をなめらかにカーブさせる
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: { display: false } // 波形の変化だけ見せるため軸は非表示
            }
        }
    });

    // LINE等のインアプリブラウザ判定
    window.addEventListener('DOMContentLoaded', () => {
        const ua = navigator.userAgent.toLowerCase();
        if (ua.indexOf('line') > -1 || ua.indexOf('fban') > -1 || ua.indexOf('fbav') > -1 || ua.indexOf('instagram') > -1) {
            lineWarning.style.display = 'block';
            alert('LINEなどのアプリ内ブラウザでは動作しません。標準ブラウザで開き直してください。');
        }
    });

    // 名前入力の同期
    userNameInput.addEventListener('input', () => {
        reportName.textContent = userNameInput.value || 'ゲスト';
    });

    // 測定開始・停止
    startBtn.addEventListener('click', async () => {
        if (isMeasuring) {
            stopMeasurement();
        } else {
            await startMeasurement();
        }
    });

    // リセットボタン
    resetBtn.addEventListener('click', () => {
        stopMeasurement();
        clearInterval(timerInterval);
        timerDisplay.textContent = "TIME: 00:00";
        userNameInput.value = 'ゲスト';
        reportName.textContent = 'ゲスト';
        displayBpm.innerHTML = '-- <span>BPM</span>';
        maxBpmText.textContent = '--';
        minBpmText.textContent = '--';
        avgBpmText.textContent = '--';
        bpmHistory = [];
        
        // グラフの初期化
        pulseChart.data.datasets[0].data = Array(maxGraphPoints).fill(0);
        pulseChart.update();
        
        statusText.textContent = "リセットされました。「測定開始」を押してください。";
    });

    // 画像保存ボタン
    saveBtn.addEventListener('click', () => {
        const resultCard = document.getElementById('result-card');
        statusText.textContent = "画像を生成中...";
        
        html2canvas(resultCard, { backgroundColor: '#161b22' }).then(canvas => {
            const link = document.createElement('a');
            const name = userNameInput.value || 'ゲスト';
            link.download = `sinpaku-${name}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            statusText.textContent = "結果画像を保存しました！";
        }).catch(err => {
            console.error(err);
            statusText.textContent = "画像の保存に失敗しました。";
        });
    });

    // 測定開始
    async function startMeasurement() {
        try {
            const constraints = { video: { facingMode: 'environment' } };
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
                await track.applyConstraints({ advanced: [{ torch: true }] });
            }

            isMeasuring = true;
            startBtn.textContent = '測定停止';
            startBtn.style.backgroundColor = '#f85149';
            statusText.textContent = "解析中... 指先でカメラをしっかり覆ってください。";
            
            rValues = [];
            timestamps = [];

            // 【新規】タイマーの作動
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            
            loop();
        } catch (err) {
            console.error(err);
            alert('カメラの起動に失敗しました。標準ブラウザでお試しください。');
        }
    }

    // 測定停止
    function stopMeasurement() {
        isMeasuring = false;
        startBtn.textContent = '測定開始';
        startBtn.style.backgroundColor = '#238636';
        statusText.textContent = "測定を停止しました。";

        if (animationId) cancelAnimationFrame(animationId);
        clearInterval(timerInterval); // タイマー停止
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
    }

    // 【新規】タイマー表示更新関数
    function updateTimer() {
        const elapsedMs = Date.now() - startTime;
        const totalSec = Math.floor(elapsedMs / 1000);
        const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
        const sec = String(totalSec % 60).padStart(2, '0');
        timerDisplay.textContent = `TIME: ${min}:${sec}`;
    }

    // メイン解析ループ
    function loop() {
        if (!isMeasuring) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = 50; 
            canvas.height = 50; 
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            let rSum = 0;
            for (let i = 0; i < data.length; i += 4) {
                rSum += data[i]; 
            }
            const rAvg = rSum / (data.length / 4);
            
            const now = performance.now();
            rValues.push(rAvg);
            timestamps.push(now);

            // 【新規】リアルタイム波形グラフのデータ更新
            pulseChart.data.datasets[0].data.push(rAvg);
            pulseChart.data.datasets[0].data.shift();
            pulseChart.update('none'); // パフォーマンス優先で描画アニメーションを切る

            if (rValues.length > 100) {
                rValues.shift();
                timestamps.shift();
                calculateBPM();
            }
        }
        animationId = requestAnimationFrame(loop);
    }

    // BPM（心拍数）計算（※感度を少し上げました）
    function calculateBPM() {
        const avgR = rValues.reduce((a, b) => a + b, 0) / rValues.length;
        let lastPeakTime = 0;
        let peakIntervals = [];

        for (let i = 1; i < rValues.length - 1; i++) {
            // 【感度調整】しきい値を「avgR + 0.2」から「avgR + 0.08」に引き下げ、小さな変化も検知
            if (rValues[i] > rValues[i-1] && rValues[i] > rValues[i+1] && rValues[i] > avgR + 0.08) {
                const time = timestamps[i];
                if (lastPeakTime > 0) {
                    const interval = time - lastPeakTime;
                    if (interval > 400 && interval < 1200) {
                        peakIntervals.push(interval);
                    }
                }
                lastPeakTime = time;
            }
        }

        if (peakIntervals.length >= 2) {
            const avgInterval = peakIntervals.reduce((a, b) => a + b, 0) / peakIntervals.length;
            const bpm = Math.round(60000 / avgInterval);

            if (bpm >= 45 && bpm <= 160) {
                displayBpm.innerHTML = `${bpm} <span>BPM</span>`;
                updateStatistics(bpm);
            }
        }
    }

    // 統計の更新
    function updateStatistics(currentBpm) {
        bpmHistory.push(currentBpm);

        const max = Math.max(...bpmHistory);
        const min = Math.min(...bpmHistory);
        const sum = bpmHistory.reduce((a, b) => a + b, 0);
        const avg = Math.round(sum / bpmHistory.length);

        maxBpmText.textContent = max;
        minBpmText.textContent = min;
        avgBpmText.textContent = avg;
    }
</script>
</body>
</html>
