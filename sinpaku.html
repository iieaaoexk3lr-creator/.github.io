<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webカメラ指先心拍計 - フルレポート版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #161b22;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-top: 0;
            color: #58a6ff;
        }
        
        /* LINE・インアプリブラウザ警告エリア */
        .line-warning {
            display: none;
            background-color: #381e1e;
            border: 2px solid #f85149;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            color: #f85149;
            font-size: 0.9rem;
            font-weight: bold;
            line-height: 1.5;
        }

        /* 使い方の説明パネル */
        .instruction-box {
            background-color: #1f242c;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #8b949e;
        }
        .instruction-box h3 {
            margin: 0 0 8px 0;
            color: #58a6ff;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #8b949e;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            font-size: 1rem;
            color: #c9d1d9;
            box-sizing: border-box;
        }

        /* モニターレイアウト */
        .monitor-panel {
            background: #000;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .monitor-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            color: #8b949e;
            background: #161b22;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #30363d;
        }

        .video-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #58a6ff;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .current-bpm {
            text-align: center;
            font-size: 3.5rem;
            font-weight: bold;
            color: #39ff14;
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        .current-bpm span {
            font-size: 1.2rem;
            color: #8b949e;
        }

        /* リアルタイム心電図グラフ */
        .chart-container {
            width: 100%;
            height: 120px;
            margin-top: 10px;
            background: #050505;
            border-radius: 6px;
            padding: 5px;
            box-sizing: border-box;
        }
        
        #status {
            text-align: center;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 15px;
        }

        /* 【大幅変更】結果表示エリア（画像保存対象） */
        #result-card {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            color: #c9d1d9;
        }
        #result-card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 2px solid #30363d;
            padding-bottom: 8px;
            color: #58a6ff;
            text-align: center;
        }
        .report-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.95rem;
            background: #21262d;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            text-align: center;
            margin-bottom: 15px;
        }
        .stat-box {
            background: #21262d;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .stat-box.full-width {
            grid-column: span 2;
            background: #1f242c;
            border-color: #58a6ff;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff7b72;
        }
        .stat-value.highlight {
            color: #39ff14;
            font-size: 1.8rem;
        }
        /* レポート画像に埋め込む用の静止グラフ領域 */
        .report-chart-title {
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 5px;
        }
        .report-chart-container {
            width: 100%;
            height: 90px;
            background: #000;
            border-radius: 6px;
            border: 1px solid #30363d;
        }

        /* ボタン類 */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-start { background-color: #238636; color: white; }
        .btn-save { background-color: #1f6feb; color: white; }
        .btn-reset { background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    </style>
</head>
<body>

<div class="container">
    <h1>指先脈波モニター</h1>
    
    <div id="lineWarning" class="line-warning">
        ⚠️ 警告: LINE等のアプリ内ブラウザでは動きません。標準ブラウザで開き直してください。
    </div>

    <div class="instruction-box">
        <h3>💡 測定のコツ</h3>
        <ol style="margin:0; padding-left:20px; font-size:0.85rem;">
            <li>カメラとライトを指の腹で同時にそっと塞ぎます。</li>
            <li>押し付けすぎず、グラフの波が一番大きく上下に揺れる強さを探してください。</li>
        </ol>
    </div>
    
    <div class="input-group">
        <label for="userName">測定者氏名</label>
        <input type="text" id="userName" placeholder="名前を入力してください" value="ゲスト">
    </div>

    <div class="monitor-panel">
        <div class="monitor-top">
            <div class="timer-display" id="timerDisplay">TIME: 00:00</div>
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline muted></video>
            </div>
        </div>
        
        <div class="current-bpm" id="displayBpm">-- <span>BPM</span></div>
        
        <div class="chart-container">
            <canvas id="pulseChart"></canvas>
        </div>
    </div>

    <canvas id="hiddenCanvas" style="display:none;"></canvas>
    <div id="status">「測定開始」ボタンを押してください</div>

    <div id="result-card">
        <h2>脈波測定結果レポート</h2>
        <div class="report-meta">
            <div><strong>氏名:</strong> <span id="reportName">ゲスト</span></div>
            <div><strong>測定時間:</strong> <span id="reportDuration">0秒</span></div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-box full-width">
                <div class="stat-label">終了時のリアルタイムBPM</div>
                <div id="lastBpm" class="stat-value highlight">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">最高心拍</div>
                <div id="maxBpm" class="stat-value">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">最低心拍</div>
                <div id="minBpm" class="stat-value">--</div>
            </div>
            <div class="stat-box full-width" style="background:#1f242c;">
                <div class="stat-label">全体平均心拍</div>
                <div id="avgBpm" class="stat-value" style="color:#58a6ff;">--</div>
            </div>
        </div>

        <div class="report-chart-title">📊 終了時の波形記録</div>
        <div class="report-chart-container">
            <canvas id="reportChart"></canvas>
        </div>
    </div>

    <div class="btn-container">
        <button class="btn-start" id="startBtn">測定開始</button>
        <button class="btn-save" id="saveBtn">結果を画像で保存</button>
        <button class="btn-reset" id="resetBtn">すべてをリセット</button>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI要素
    const userNameInput = document.getElementById('userName');
    const reportName = document.getElementById('reportName');
    const reportDuration = document.getElementById('reportDuration');
    const startBtn = document.getElementById('startBtn');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const displayBpm = document.getElementById('displayBpm');
    const lastBpmText = document.getElementById('lastBpm');
    const maxBpmText = document.getElementById('maxBpm');
    const minBpmText = document.getElementById('minBpm');
    const avgBpmText = document.getElementById('avgBpm');
    const statusText = document.getElementById('status');
    const lineWarning = document.getElementById('lineWarning');
    const timerDisplay = document.getElementById('timerDisplay');

    let stream = null;
    let animationId = null;
    let isMeasuring = false;

    // タイマー用
    let startTime = 0;
    let elapsedSeconds = 0;
    let timerInterval = null;

    // アルゴリズム用データ群
    let rawValues = []; 
    let smoothedValues = [];
    let bpmHistory = [];
    const maxPoints = 60; 

    // 【1】動的波形用グラフの初期化
    const chartCtx = document.getElementById('pulseChart').getContext('2d');
    const pulseChart = new Chart(chartCtx, {
        type: 'line',
        data: {
            labels: Array(maxPoints).fill(''),
            datasets: [{
                data: Array(maxPoints).fill(0),
                borderColor: '#39ff14',
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.3
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { display: false }, y: { display: false } }
        }
    });

    // 【2】レポート用静止グラフの初期化
    const reportChartCtx = document.getElementById('reportChart').getContext('2d');
    const reportChart = new Chart(reportChartCtx, {
        type: 'line',
        data: {
            labels: Array(maxPoints).fill(''),
            datasets: [{
                data: Array(maxPoints).fill(0),
                borderColor: '#58a6ff', // レポート側は綺麗な青色
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.3
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { display: false }, y: { display: false } }
        }
    });

    // アプリ内ブラウザ判定
    window.addEventListener('DOMContentLoaded', () => {
        const ua = navigator.userAgent.toLowerCase();
        if (ua.indexOf('line') > -1 || ua.indexOf('fban') > -1 || ua.indexOf('fbav') > -1 || ua.indexOf('instagram') > -1) {
            lineWarning.style.display = 'block';
        }
    });

    userNameInput.addEventListener('input', () => {
        reportName.textContent = userNameInput.value || 'ゲスト';
    });

    startBtn.addEventListener('click', async () => {
        if (isMeasuring) { stopMeasurement(); } else { await startMeasurement(); }
    });

    // リセットボタン
    resetBtn.addEventListener('click', () => {
        stopMeasurement();
        clearInterval(timerInterval);
        elapsedSeconds = 0;
        timerDisplay.textContent = "TIME: 00:00";
        userNameInput.value = 'ゲスト';
        reportName.textContent = 'ゲスト';
        reportDuration.textContent = '0秒';
        displayBpm.innerHTML = '-- <span>BPM</span>';
        lastBpmText.textContent = '--';
        maxBpmText.textContent = '--';
        minBpmText.textContent = '--';
        avgBpmText.textContent = '--';
        bpmHistory = [];
        rawValues = [];
        smoothedValues = [];
        pulseChart.data.datasets[0].data = Array(maxPoints).fill(0);
        pulseChart.update();
        reportChart.data.datasets[0].data = Array(maxPoints).fill(0);
        reportChart.update();
        statusText.textContent = "リセットされました。";
    });

    // 画像保存ボタン
    saveBtn.addEventListener('click', () => {
        // 保存する直前に、現在の動的波形をレポート用グラフにコピーして焼き付ける
        reportChart.data.datasets[0].data = [...pulseChart.data.datasets[0].data];
        reportChart.update('none');

        const resultCard = document.getElementById('result-card');
        statusText.textContent = "画像を生成中...";
        
        // 暗い背景が保たれるようにオプションを指定
        html2canvas(resultCard, { backgroundColor: '#161b22', useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            const name = userNameInput.value || 'ゲスト';
            link.download = `sinpaku-${name}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            statusText.textContent = "結果画像を保存しました！";
        }).catch(err => {
            console.error(err);
            statusText.textContent = "画像の保存に失敗しました。";
        });
    });

    // 測定開始
    async function startMeasurement() {
        try {
            const constraints = { video: { facingMode: 'environment' } };
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
                await track.applyConstraints({ advanced: [{ torch: true }] });
            }

            isMeasuring = true;
            startBtn.textContent = '測定停止';
            startBtn.style.backgroundColor = '#f85149';
            statusText.textContent = "解析中...";
            
            rawValues = [];
            smoothedValues = [];
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            
            loop();
        } catch (err) {
            console.error(err);
            alert('カメラの起動に失敗しました。標準ブラウザでお試しください。');
        }
    }

    function stopMeasurement() {
        isMeasuring = false;
        startBtn.textContent = '測定開始';
        startBtn.style.backgroundColor = '#238636';
        statusText.textContent = "測定を終了しました。結果を保存できます。";
        clearInterval(timerInterval);
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
    }

    function updateTimer() {
        elapsedSeconds++;
        const min = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
        const sec = String(elapsedSeconds % 60).padStart(2, '0');
        timerDisplay.textContent = `TIME: ${min}:${sec}`;
        reportDuration.textContent = `${elapsedSeconds}秒`; // レポート領域に秒数を反映
    }

    // 核心となる解析ループ
    let lastBPMUpdateTime = 0;
    let crossTimestamps = [];

    function loop() {
        if (!isMeasuring) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = 30; canvas.height = 30; // 処理高速化のためコンパクトに
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            // R(赤)だけでなく、G(緑)も混ぜることで皮膚の色の補正がかかり、脈動が浮き彫りになります
            let totalValue = 0;
            for (let i = 0; i < data.length; i += 4) {
                totalValue += (data[i] - data[i+1]); // 赤から緑を引くと、血流変化が強調される
            }
            const avgValue = totalValue / (data.length / 4);
            
            rawValues.push(avgValue);
            if (rawValues.length > 150) rawValues.shift();

            // 新アルゴリズム①: 簡単な移動平均フィルタ（細かいガタガタノイズを除去）
            if (rawValues.length >= 5) {
                let sum = 0;
                for(let j = rawValues.length - 5; j < rawValues.length; j++) sum += rawValues[j];
                const smoothed = sum / 5;
                smoothedValues.push(smoothed);
                if (smoothedValues.length > 120) smoothedValues.shift();

                // 画面上のリアルタイム動的グラフを更新
                pulseChart.data.datasets[0].data.push(smoothed);
                pulseChart.data.datasets[0].data.shift();
                pulseChart.update('none');

                // 新アルゴリズム②: ゼロ交差（ベースライン交差）法によるBPM算出
                // データの平均線を波が「下から上へ突き抜けた瞬間」の間隔を計算します。
                if (smoothedValues.length >= 60) {
                    const baseLine = smoothedValues.reduce((a,b)=>a+b, 0) / smoothedValues.length;
                    const lastIdx = smoothedValues.length - 1;
                    
                    // 前のフレームが平均線以下で、現在のフレームが平均線を超えたか？
                    if (smoothedValues[lastIdx - 1] <= baseLine && smoothedValues[lastIdx] > baseLine) {
                        const nowTime = performance.now();
                        crossTimestamps.push(nowTime);
                        if (crossTimestamps.length > 10) crossTimestamps.shift();

                        if (crossTimestamps.length >= 2) {
                            const lastInterval = crossTimestamps[crossTimestamps.length - 1] - crossTimestamps[crossTimestamps.length - 2];
                            // 脈拍として妥当な間隔（450ms〜1200ms）のみ採用
                            if (lastInterval > 430 && lastInterval < 1200) {
                                const calculatedBpm = Math.round(60000 / lastInterval);
                                
                                // 頻繁な画面のチラつきを抑えるため、0.5秒に1回以上のみ数値を更新
                                if (nowTime - lastBPMUpdateTime > 500) {
                                    displayBpm.innerHTML = `${calculatedBpm} <span>BPM</span>`;
                                    lastBpmText.textContent = calculatedBpm; // レポート用「最後の瞬間のBPM」
                                    updateStatistics(calculatedBpm);
                                    lastBPMUpdateTime = nowTime;
                                }
                            }
                        }
                    }
                }
            }
        }
        animationId = requestAnimationFrame(loop);
    }

    function updateStatistics(currentBpm) {
        bpmHistory.push(currentBpm);
        const max = Math.max(...bpmHistory);
        const min = Math.min(...bpmHistory);
        const sum = bpmHistory.reduce((a, b) => a + b, 0);
        const avg = Math.round(sum / bpmHistory.length);

        maxBpmText.textContent = max;
        minBpmText.textContent = min;
        avgBpmText.textContent = avg;
    }
</script>
</body>
</html>
