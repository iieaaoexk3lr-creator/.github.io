<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 ポップ空耳カラオケ＋往復翻訳</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background: #ffeefc; font-family: 'Arial Rounded MT Bold', 'Hiragino Maru Gothic ProN', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; color: #555; }
        header { background: #ff9a9e; padding: 15px; text-align: center; color: white; border-bottom: 5px solid #ff6f61; }
        h1 { margin: 0; font-size: 1.6rem; text-shadow: 2px 2px 0px #ff6f61; }
        .status { font-size: 0.9rem; margin-top: 5px; opacity: 0.9; }
        
        .main-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; padding: 10px; box-sizing: border-box; }
        
        /* 上段：テロップエリア */
        #telop-area { flex: 1; background: #fff; margin-bottom: 10px; border-radius: 20px; border: 4px dashed #ff9a9e; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .telop-line { font-size: 1.8rem; font-weight: bold; color: #ff6f61; height: 2.6rem; margin: 5px 0; text-align: center; transition: all 0.2s ease; word-break: break-all; width: 90%; }
        .telop-line:empty::before { content: "・・・"; color: #ddd; }
        .translating { color: #a1c4fd !important; font-size: 1.4rem; } /* 翻訳中のスタイル */

        /* 下段：履歴エリア */
        #history-area { flex: 2; background: #fff; border-radius: 20px; border: 4px solid #a1c4fd; padding: 15px; overflow-y: auto; box-sizing: border-box; position: relative; }
        #history-title { color: #a1c4fd; margin: 0 0 10px 0; font-size: 1.1rem; border-bottom: 2px dashed #a1c4fd; padding-bottom: 5px; }
        .log-item { background: #f0f9ff; margin: 8px 0; padding: 12px; border-radius: 12px; border-left: 5px solid #a1c4fd; font-size: 1.1rem; font-weight: bold; line-height: 1.4; animation: popIn 0.3s ease; }
        .log-item .original { font-size: 0.85rem; color: #999; font-weight: normal; margin-bottom: 3px; display: block; }

        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* ボタンコントロール（グリッドで等間隔に配置） */
        .btn-group { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            padding: 15px; 
            background: #fff; 
            border-top: 2px solid #ffeefc; 
            box-sizing: border-box;
        }
        button { 
            border: none; 
            padding: 14px 10px; 
            border-radius: 50px; 
            font-weight: bold; 
            font-size: 0.95rem; 
            cursor: pointer; 
            color: white; 
            box-shadow: 0 4px 0px rgba(0,0,0,0.15); 
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        button:disabled { background: #ccc !important; box-shadow: 0 4px 0px #aaa !important; cursor: not-allowed; transform: none !important; }
        
        #start-btn { background: #ff6f61; }
        #stop-btn { background: #9b59b6; }
        #save-img-btn { background: #a1c4fd; color: #333; }
        #save-audio-btn { background: #2ecc71; }
        #reset-btn { background: #e67e22; }
        #menu-btn { background: #95a5a6; }
        
        button:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

<header>
    <h1>🎤 ポップ空耳カラオケ</h1>
    <div id="status" class="status">いつでも歌い始めてね！</div>
</header>

<div class="main-container">
    <div id="telop-area">
        <div id="line1" class="telop-line"></div>
        <div id="line2" class="telop-line"></div>
    </div>

    <div id="history-area">
        <h3 id="history-title">🌟 迷言空耳往復翻訳コレクション</h3>
        <div id="log-list"></div>
    </div>
</div>

<div class="btn-group">
    <button id="start-btn">🎵 歌唱スタート</button>
    <button id="stop-btn" disabled>🛑 終了</button>
    <button id="save-img-btn" disabled>📸 画面を画像保存</button>
    <button id="save-audio-btn" disabled>💾 音声を保存</button>
    <button id="reset-btn">🔄 リセット</button>
    <button id="menu-btn">🏠 メニューへ</button>
</div>

<script>
    // ★ あなたのGoogle Apps Script (GAS) のWebアプリURLをここに貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/xxxx/exec"; 

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let lines = ["", ""];
    let localStream = null;

    const line1 = document.getElementById('line1');
    const line2 = document.getElementById('line2');
    const logList = document.getElementById('log-list');
    const statusDiv = document.getElementById('status');

    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const saveImgBtn = document.getElementById('save-img-btn');
    const saveAudioBtn = document.getElementById('save-audio-btn');
    const resetBtn = document.getElementById('reset-btn');
    const menuBtn = document.getElementById('menu-btn');

    // ★ GASを使って往復翻訳（日→英→日）を行う関数
    async function translateLoop(text) {
        if (!text || GAS_URL.includes("xxxx")) return text;
        try {
            // 1回目: 日本語から英語へ
            let resEnc = await fetch(`${GAS_URL}?text=${encodeURIComponent(text)}&source=ja&target=en`);
            let jsonEnc = await resEnc.json();
            let enText = jsonEnc.text;

            // 2回目: 英語から日本語へ（ここでバグる）
            let resDec = await fetch(`${GAS_URL}?text=${encodeURIComponent(enText)}&source=en&target=ja`);
            let jsonDec = await resDec.json();
            return jsonDec.text;
        } catch (err) {
            console.error("翻訳エラー:", err);
            return text; // エラー時は元の文字をそのまま返す
        }
    }

    if (!SpeechRecognition) {
        alert("ブラウザが音声認識に対応していません。Google Chrome等でお試しください。");
    } else {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true; 
        recognition.interimResults = false; 

        recognition.onresult = async (e) => {
            const resultIndex = e.resultIndex;
            const rawTranscript = e.results[resultIndex][0].transcript;
            
            // 画面の上段テロップには、まずAIが聞き取った生の空耳を出す
            lines[0] = lines[1];
            lines[1] = rawTranscript;
            
            line1.innerText = lines[0];
            line2.innerText = lines[1];

            // 押し出された1行目（lines[0]）を往復翻訳にかけてから履歴に送る
            if(lines[0]) {
                const targetText = lines[0];
                
                // 履歴欄に「翻訳中...」の枠を先に作っておく
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = `<span class="original">元: ${targetText}</span><span class="translating">🔄 翻訳システムが暴走中...</span>`;
                logList.appendChild(div);
                
                const historyArea = document.getElementById('history-area');
                historyArea.scrollTop = historyArea.scrollHeight;

                // 裏で非同期にGAS翻訳を実行
                const translatedText = await translateLoop(targetText);
                
                // 翻訳が終わったら中身を書き換える
                div.innerHTML = `<span class="original">元: ${targetText}</span> 🎭 ${translatedText}`;
            }
        };

        recognition.onend = () => {
            if (isRecording) {
                try { recognition.start(); } catch(err) {}
            }
        };

        recognition.onerror = (event) => { console.log("エラー緩和:", event.error); };
    }

    // 🎵 歌唱スタート
    startBtn.onclick = async () => {
        isRecording = true;
        audioChunks = []; 
        lines = ["", ""];
        line1.innerText = "";
        line2.innerText = "";
        logList.innerHTML = "";

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(localStream);
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };
            mediaRecorder.start(1000);
            recognition.start();

            statusDiv.innerText = "🛑 録音＆空耳・往復翻訳中！思いっきり歌って！";
            startBtn.disabled = true;
            stopBtn.disabled = false;
            saveImgBtn.disabled = true;
            saveAudioBtn.disabled = true;
            resetBtn.disabled = true;

        } catch (err) {
            alert("マイクの許可が必要です。");
            isRecording = false;
        }
    };

    // 🛑 終了
    stopBtn.onclick = async () => {
        isRecording = false;
        try { recognition.stop(); } catch(e){}
        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); 
        if (localStream) localStream.getTracks().forEach(track => track.stop());

        // 最後に残った2行目も翻訳して履歴へ
        if(lines[1]) {
            const targetText = lines[1];
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `<span class="original">元: ${targetText}</span><span class="translating">🔄 翻訳システムが暴走中...</span>`;
            logList.appendChild(div);
            
            const translatedText = await translateLoop(targetText);
            div.innerHTML = `<span class="original">元: ${targetText}</span> 🎭 ${translatedText}`;
        }

        statusDiv.innerText = "いつでも次の曲をどうぞ！";
        startBtn.disabled = false;
        stopBtn.disabled = true;
        saveImgBtn.disabled = false;
        saveAudioBtn.disabled = false; 
        resetBtn.disabled = false;
    };

    // 📸 画像保存
    saveImgBtn.onclick = () => {
        html2canvas(document.getElementById('history-area')).then(canvas => {
            const link = document.createElement('a');
            link.download = 'soramimi_translate_log.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    };

    // 💾 音声保存
    saveAudioBtn.onclick = () => {
        if (audioChunks.length === 0) return;
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const audioUrl = URL.createObjectURL(audioBlob);
        const link = document.createElement('a');
        link.download = 'soramimi_song.webm'; 
        link.href = audioUrl;
        link.click();
    };

    // 🔄 リセット
    resetBtn.onclick = () => {
        if (confirm("歌詞ログと録音データをすべて消去します。よろしいですか？")) {
            audioChunks = [];
            lines = ["", ""];
            line1.innerText = "";
            line2.innerText = "";
            logList.innerHTML = "";
            saveImgBtn.disabled = true;
            saveAudioBtn.disabled = true;
            statusDiv.innerText = "データをリセットしました。いつでも歌い始めてね！";
        }
    };

    // 🏠 メニューへ
    menuBtn.onclick = () => {
        if (isRecording) return;
        window.location.href = "index.html";
    };
</script>
</body>
</html>
