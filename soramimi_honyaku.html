<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポップ空耳カラオケ＋往復翻訳システム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #ffb6c1;       /* パステルピンク */
            --primary-dark: #e87a90;
            --secondary: #5da7db;     /* 水色 */
            --secondary-dark: #3a8bc0;
            --bg: #f4f9f9;            /* 薄い水色系の背景 */
            --text: #333333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-dark);
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px dashed var(--primary);
            padding-bottom: 10px;
        }

        /* リアルタイム2行テロップエリア */
        .telop-area {
            background: #222;
            color: #fff;
            border-radius: 12px;
            padding: 20px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            border: 4px solid var(--primary);
            overflow: hidden;
        }

        .telop-line {
            height: 1.8rem;
            line-height: 1.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: #ffeb3b; /* カラオケ風の黄色文字 */
        }
        .telop-line.old {
            color: #bbb;
            font-size: 1.1rem;
        }

        /* 履歴エリア */
        .history-wrapper {
            background: #fafafa;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .history-wrapper h2 {
            font-size: 1rem;
            color: #777;
            margin-bottom: 10px;
        }
        .history-area {
            height: 200px;
            overflow-y: auto;
        }
        .history-item {
            border-bottom: 1px dashed #ddd;
            padding: 8px 0;
            font-size: 0.95rem;
        }
        .original-text {
            color: #888;
            font-size: 0.85rem;
        }
        .translated-text {
            color: var(--primary-dark);
            font-weight: bold;
            margin-top: 2px;
        }

        /* コントロールボタン（CSS Grid 2列配置） */
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: var(--white);
        }

        button:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        #btn-start { background-color: var(--primary); box-shadow: 0 4px 0 var(--primary-dark); }
        #btn-start:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }

        #btn-stop { background-color: #aaa; box-shadow: 0 4px 0 #777; }
        #btn-stop:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }

        #btn-save-img { background-color: var(--secondary); box-shadow: 0 4px 0 var(--secondary-dark); }
        #btn-save-img:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }

        #btn-save-audio { background-color: #6c757d; box-shadow: 0 4px 0 #495057; }
        #btn-save-audio:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎤 空耳往復翻訳カラオケ 🎭</h1>

    <div class="telop-area">
        <div id="telop-1" class="telop-line old">ここに空耳が表示されます</div>
        <div id="telop-2" class="telop-line">歌ってみよう！</div>
    </div>

    <div class="history-wrapper" id="capture-area">
        <h2>🎭 錬成された迷言履歴</h2>
        <div class="history-area" id="history-list">
            </div>
    </div>

    <div class="controls">
        <button id="btn-start">▶ 歌唱開始</button>
        <button id="btn-stop" disabled>■ 終了</button>
        <button id="btn-save-img" disabled>📸 画像保存</button>
        <button id="btn-save-audio" disabled>💾 音声保存</button>
    </div>
</div>

<script>
    // --- 設定 ---
    // 実稼働させる場合は、ここにあなたのデプロイしたGASのURLを設定してください
    const GAS_URL = ""; 

    // --- 状態管理・変数 ---
    let recognition;
    let mediaRecorder;
    let audioChunks = [];
    let isRunning = false;
    let audioBlob = null;

    // DOM要素の取得
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const btnSaveImg = document.getElementById('btn-save-img');
    const btnSaveAudio = document.getElementById('btn-save-audio');
    const telop1 = document.getElementById('telop-1');
    const telop2 = document.getElementById('telop-2');
    const historyList = document.getElementById('history-list');

    // --- 音声認識の初期化 ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false; // 確定した結果のみ取得
        recognition.continuous = false;    // 単発モード（0.05秒再起動ロジックのため）

        // 音声認識が確定した時の処理
        recognition.onresult = (event) => {
            const resultText = event.results[0][0].transcript;
            if (resultText.trim() !== "") {
                processNewPhrase(resultText);
            }
        };

        // エンドレス再起動ロジック
        recognition.onend = () => {
            if (isRunning) {
                setTimeout(() => {
                    try { recognition.start(); } catch(e) { console.log(e); }
                }, 50); // 0.05秒で超高速自動再起動
            }
        };
    } else {
        alert("お使いのブラウザは音声認識に対応していません。Chrome等でお試しください。");
        btnStart.disabled = true;
    }

    // --- 歌唱開始処理 ---
    btnStart.addEventListener('click', async () => {
        audioChunks = [];
        audioBlob = null;
        isRunning = true;

        // ボタンの状態制御
        btnStart.disabled = true;
        btnStop.disabled = false;
        btnSaveImg.disabled = true;
        btnSaveAudio.disabled = true;

        // 1. 裏面完全一本録音の開始
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };
            mediaRecorder.onstop = () => {
                audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                btnSaveAudio.disabled = false; // 音声保存を有効化
            };
            mediaRecorder.start();
        } catch (err) {
            console.error("マイクの取得に失敗しました:", err);
            alert("マイクの許可が必要です。");
            resetButtons();
            return;
        }

        // 2. 音声認識の開始
        try {
            recognition.start();
            telop1.textContent = "";
            telop2.textContent = "🎵 録音中... 歌ってください！";
        } catch(e) {
            console.error(e);
        }
    });

    // --- 終了処理 ---
    btnStop.addEventListener('click', () => {
        isRunning = false;
        
        // 音声認識と録音の完全ストップ
        if (recognition) recognition.stop();
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop()); // マイクアイコンを消す
        }

        btnStart.disabled = false;
        btnStop.disabled = true;
        btnSaveImg.disabled = false; // 画像保存を有効化
        
        telop1.textContent = "歌唱終了";
        telop2.textContent = "お疲れ様でした！";
    });

    // --- フレーズ処理・テロップ更新・GAS連携 ---
    function processNewPhrase(text) {
        // 1. リアルタイム2行テロップの更新
        telop1.textContent = telop2.textContent;
        telop1.classList.add('old');
        telop2.textContent = text;

        // 2. 履歴エリアに初期状態（ローディング）を追加
        const item = document.createElement('div');
        item.className = 'history-item';
        
        const originalDiv = document.createElement('div');
        originalDiv.className = 'original-text';
        originalDiv.textContent = `🎙️ 空耳: ${text}`;
        
        const translatedDiv = document.createElement('div');
        translatedDiv.className = 'translated-text';
        translatedDiv.textContent = "⏳ 翻訳錬成中...";
        
        item.appendChild(originalDiv);
        item.appendChild(translatedDiv);
        historyList.appendChild(item);
        
        // 自動スクロール
        const historyArea = document.querySelector('.history-area');
        historyArea.scrollTop = historyArea.scrollHeight;

        // 3. 非同期でGAS往復翻訳を叩く
        fetchTranslation(text, translatedDiv);
    }

    // 非同期型翻訳システム（GAS接続 / なければモック対応）
    async function fetchTranslation(text, targetElement) {
        if (!GAS_URL) {
            // GAS_URLがない場合は擬似的な「崩壊モック」で時間差上書き
            setTimeout(() => {
                const mocks = ["※突然のパッション", "概念としてのメロンパン", "たぶん、そういう意味ではない", "大体合ってる気がする"];
                const mockText = text.split('').reverse().join('') + ` (${mocks[Math.floor(Math.random()*mocks.length)]})`;
                targetElement.textContent = `🎭 往復: ${mockText}`;
            }, 1500);
            return;
        }

        try {
            const response = await fetch(`${GAS_URL}?text=${encodeURIComponent(text)}`);
            const data = await response.json();
            targetElement.textContent = `🎭 往復: ${data.translated}`;
        } catch (error) {
            console.error("翻訳通信エラー:", error);
            targetElement.textContent = `❌ 翻訳に失敗しました`;
        }
    }

    // --- メディアエクスポート機能 ---
    // 📸 画面（履歴エリア）を画像保存
    btnSaveImg.addEventListener('click', () => {
        const target = document.getElementById('capture-area');
        html2canvas(target).then(canvas => {
            const link = document.createElement('a');
            link.download = `soramimi_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    });

    // 💾 音声を保存
    btnSaveAudio.addEventListener('click', () => {
        if (!audioBlob) return;
        const url = URL.createObjectURL(audioBlob);
        const link = document.createElement('a');
        link.download = `karaoke_sing_${Date.now()}.webm`;
        link.href = url;
        link.click();
    });

    function resetButtons() {
        isRunning = false;
        btnStart.disabled = false;
        btnStop.disabled = true;
        btnSaveImg.disabled = true;
        btnSaveAudio.disabled = true;
    }
</script>

</body>
</html>
