<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラオケ・リクエスト・バトル</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, where, updateDoc, deleteDoc, getDocs, writeBatch, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
            authDomain: "gamehistory-m84.firebaseapp.com",
            databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
            projectId: "gamehistory-m84",
            storageBucket: "gamehistory-m84.firebasestorage.app",
            messagingSenderId: "475761727837",
            appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
            measurementId: "G-3636W6LC4F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentRoom = "";
        let myName = "";
        let players = [];

        const themeCategories = {
            normal: ["夏の曲", "冬の曲", "春の曲", "秋の曲", "アニメ曲", "色入りの曲", "アイドル曲", "数字がある曲", "全てひらがなの曲", "全てカタカナの曲", "1980年代の曲", "1990年代の曲", "2000年代の曲", "2010年代の曲"]
        };

        window.joinRoom = async () => {
            const r = document.getElementById('roomInput').value;
            const n = document.getElementById('nameInput').value;
            if(!r || !n) return alert("ルーム名と名前を入力してください");
            currentRoom = r; myName = n;

            await setDoc(doc(db, "REQUEST_Players", `${currentRoom}_${myName}`), {
                REQUEST_playerName: myName, REQUEST_roomId: currentRoom, REQUEST_score: 0
            });
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            document.getElementById('displayRoomName').innerText = `Room: ${currentRoom}`;
            initSync();
        };

        function initSync() {
            onSnapshot(query(collection(db, "REQUEST_Players"), where("REQUEST_roomId", "==", currentRoom)), (snap) => {
                players = snap.docs.map(d => d.data());
                document.getElementById('memberCount').innerText = `${players.length}名`;
                renderRanking();
            });
            onSnapshot(query(collection(db, "REQUEST_Songs"), where("REQUEST_roomId", "==", currentRoom)), (snap) => {
                const list = document.getElementById('songList'); list.innerHTML = "";
                snap.docs.forEach(d => list.appendChild(createSongCard(d.id, d.data())));
            });
            onSnapshot(doc(db, "REQUEST_Rooms", currentRoom), (d) => {
                if(d.exists()) document.getElementById('themeText').innerText = `お題：${d.data().REQUEST_currentTheme || "なし"}`;
            });
        }

        window.addSong = async () => {
            const title = document.getElementById('songInput').value;
            if(!title) return;
            // 重複チェック
            const q = query(collection(db, "REQUEST_Songs"), where("REQUEST_roomId", "==", currentRoom), where("REQUEST_songTitle", "==", title));
            const snap = await getDocs(q);
            if(!snap.empty) return alert("その曲は既に提案されています");

            await addDoc(collection(db, "REQUEST_Songs"), {
                REQUEST_roomId: currentRoom, REQUEST_songTitle: title,
                REQUEST_requesterName: myName, REQUEST_targetName: null
            });
            document.getElementById('songInput').value = "";
        };

        window.assignSongs = async () => {
            const q = query(collection(db, "REQUEST_Songs"), where("REQUEST_roomId", "==", currentRoom));
            const snap = await getDocs(q);
            const songs = snap.docs;
            if(songs.length === 0 || songs.length !== players.length) return alert("全員分のリクエストが必要です");

            const batch = writeBatch(db);
            const shuffledPlayers = [...players].sort(() => Math.random() - 0.5);
            
            songs.forEach((doc, idx) => {
                batch.update(doc.ref, { REQUEST_targetName: shuffledPlayers[idx].REQUEST_playerName });
            });
            await batch.commit();
        };

        window.updateResult = async (songId, reqName, targetName, isSuccess) => {
            const batch = writeBatch(db);
            const p1 = players.find(p => p.REQUEST_playerName === reqName);
            const p2 = players.find(p => p.REQUEST_playerName === targetName);
            if(p1) batch.update(doc(db, "REQUEST_Players", `${currentRoom}_${reqName}`), { REQUEST_score: (p1.REQUEST_score || 0) + (isSuccess ? 1 : -1) });
            if(p2) batch.update(doc(db, "REQUEST_Players", `${currentRoom}_${targetName}`), { REQUEST_score: (p2.REQUEST_score || 0) + (isSuccess ? 2 : -1) });
            batch.delete(doc(db, "REQUEST_Songs", songId));
            await batch.commit();
        };

        window.resetScores = async () => {
            if(!confirm("リセットしますか？")) return;
            const batch = writeBatch(db);
            players.forEach(p => batch.update(doc(db, "REQUEST_Players", `${currentRoom}_${p.REQUEST_playerName}`), { REQUEST_score: 0 }));
            await batch.commit();
        };

        window.setTheme = (t) => {
            if (t === 'random') updateThemeInFirestore(themeCategories.normal[Math.floor(Math.random() * themeCategories.normal.length)]);
            else if (t === 'custom') { const theme = prompt("お題:"); if(theme) updateThemeInFirestore(theme); }
            else if (t === 'list') {
                const p = document.getElementById('themeListPanel'); p.innerHTML = "";
                themeCategories.normal.forEach(val => {
                    const b = document.createElement('button'); b.innerText = val; b.className = 'theme-btn';
                    b.onclick = () => updateThemeInFirestore(val); p.appendChild(b);
                });
                p.style.display = 'block';
            }
        };

        async function updateThemeInFirestore(theme) {
            await setDoc(doc(db, "REQUEST_Rooms", currentRoom), { REQUEST_currentTheme: theme }, { merge: true });
            document.getElementById('themeListPanel').style.display = 'none';
        }

        function createSongCard(id, data) {
            const div = document.createElement('div'); div.className = 'song-card';
            div.innerHTML = `<div>🎤 ${data.REQUEST_targetName || "割り当て待機中..."}</div>
                <div style="font-size:1.4rem; font-weight:bold;">${data.REQUEST_songTitle}</div>
                <div style="font-size:0.8rem; color:#ff007f;">提案者: ${data.REQUEST_requesterName}</div>
                ${data.REQUEST_targetName ? `<div class="btn-group"><button class="btn-success" onclick="updateResult('${id}','${data.REQUEST_requesterName}','${data.REQUEST_targetName}',true)">成功</button><button class="btn-fail" onclick="updateResult('${id}','${data.REQUEST_requesterName}','${data.REQUEST_targetName}',false)">失敗</button></div>` : ""}`;
            return div;
        }

        function renderRanking() {
            const list = document.getElementById('playerRanking'); list.innerHTML = "";
            players.sort((a,b) => b.REQUEST_score - a.REQUEST_score).forEach(p => {
                const item = document.createElement('div'); item.style = "display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333; font-size:1.2rem;";
                item.innerHTML = `<span>${p.REQUEST_playerName}</span><span style="color:#00ffcc; font-weight:bold;">${p.REQUEST_score} pt</span>`;
                list.appendChild(item);
            });
        }
        window.togglePanel = () => { const p = document.getElementById('themeControlPanel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; };
    </script>
    <style>
        :root { --bg: #121214; --card: #1e1e24; --primary: linear-gradient(135deg, #ff007f, #7928ca); --secondary: linear-gradient(135deg, #00f2fe, #4facfe); --danger: linear-gradient(135deg, #ff416c, #ff4b2b); }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        input { background: #121214; border: 2px solid #333; color: #fff; padding: 15px; border-radius: 12px; width: 100%; box-sizing: border-box; font-size: 1.2rem; margin-bottom: 15px; }
        button { border: none; border-radius: 12px; color: #fff; padding: 15px; font-weight: bold; cursor: pointer; }
        .song-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #333; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-success { background: var(--secondary); flex: 2; }
        .btn-fail { background: #333; flex: 1; }
        .theme-btn { background: #2d2d35; margin: 5px; padding: 8px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <div id="loginScreen">
        <h1 style="background: var(--primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">KARAOKE REQ</h1>
        <input type="text" id="roomInput" placeholder="ルーム名">
        <input type="text" id="nameInput" placeholder="名前">
        <button onclick="joinRoom()" style="background: var(--primary); width: 100%;">入室</button>
    </div>
    <div id="mainScreen" style="display: none;">
        <div style="display:flex; justify-content:space-between;">
            <div id="displayRoomName" style="font-weight:bold;"></div>
            <button onclick="location.href='index.html'" style="background:#555; font-size:0.8rem;">メニューへ</button>
        </div>
        <div id="themeBox" style="background:var(--card); padding:10px; border-radius:10px; margin:10px 0;">
            <div id="themeText">お題：なし</div>
            <button onclick="togglePanel()" class="theme-btn">⚙ お題設定</button>
            <div id="themeControlPanel" style="display:none;">
                <button onclick="setTheme('random')" class="theme-btn">ランダム</button>
                <button onclick="setTheme('list')" class="theme-btn">リスト選択</button>
                <button onclick="setTheme('custom')" class="theme-btn">直接入力</button>
            </div>
            <div id="themeListPanel" style="display:none;"></div>
        </div>
        <input type="text" id="songInput" placeholder="曲名">
        <button onclick="addSong()" style="background: var(--primary); width: 100%;">提案</button>
        <button onclick="assignSongs()" style="background: #00ffcc; color:#000; width: 100%; margin-top:10px;">全リクエストを確定・割り振り</button>
        <button onclick="location.reload()" style="background: #444; width: 100%; margin-top:10px;">最新の状態に更新</button>
        
        <h2 style="font-size: 1rem; color: #ff007f;">指令リスト</h2>
        <div id="songList"></div>
        <div style="background:#1e1e24; padding:10px; border-radius:10px;">
            <div style="display:flex; justify-content:space-between;"><h2>🏆 スコア (<span id="memberCount">0</span>名)</h2>
            <button onclick="resetScores()" style="background:#555; font-size:0.7rem;">リセット</button></div>
            <div id="playerRanking"></div>
        </div>
    </div>
</div>
</body>
</html>
