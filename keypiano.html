<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <title>2段リアルピアノ・完全音域拡張版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        /* 縦画面時の警告 */
        @media screen and (orientation: portrait) {
            #portrait-warning { display: flex !important; }
        }
        #portrait-warning {
            display: none; position: fixed; top:0; left:0; width:100vw; height:100vh;
            background: #111; z-index: 9999; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* ヘッダー */
        header {
            background: #222;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 2px solid #333;
            z-index: 100;
        }
        .title { font-size: 13px; font-weight: bold; color: #ffcc00; }
        select {
            background: #444; color: #fff; border: 1px solid #666;
            padding: 4px 8px; border-radius: 4px; font-size: 13px;
            cursor: pointer; font-weight: bold;
        }

        /* メイン画面（上下2段） */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            padding: 4px;
            gap: 6px;
            overflow: hidden;
        }

        /* 鍵盤の段（横スクロール可能） */
        .keyboard-row {
            flex: 1;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .keyboard-row::-webkit-scrollbar { display: none; }

        /* ピアノ全体の土台。インラインブロックにして中身の合計幅を維持 */
        .piano-container {
            position: relative;
            display: inline-block;
            height: 100%;
            white-space: nowrap; /* 白鍵を横一列に強制配置 */
        }

        /* 白鍵スタイル（幅85px固定） */
        .white-key {
            display: inline-block;
            width: 85px;
            height: 100%;
            background: linear-gradient(to bottom, #f0f0f0 0%, #ffffff 100%);
            border: 1px solid #ccc;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 4px rgba(0,0,0,0.3);
            position: relative;
            cursor: pointer;
            vertical-align: top;
            z-index: 1; /* 黒鍵(z-index: 10)より下に配置 */
        }
        .white-key.active, .white-key:active {
            background: linear-gradient(to bottom, #e0e0e0 0%, #d8d8d8 100%);
            box-shadow: inset 0 4px 5px rgba(0,0,0,0.2);
        }

        /* 黒鍵スタイル。白鍵の上に浮かせるため absolute 配置 */
        .black-key {
            position: absolute;
            top: 0;
            width: 50px; /* 白鍵の幅(85px)に合わせたサイズ */
            height: 62%; /* 白鍵より少し短く */
            background: linear-gradient(to bottom, #111 0%, #333 100%);
            border: 1px solid #000;
            border-radius: 0 0 4px 4px;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.6);
            z-index: 10; /* 白鍵より上層に配置して確実に表示 */
            cursor: pointer;
        }
        .black-key.active, .black-key:active {
            background: linear-gradient(to bottom, #000 0%, #1c1c1c 100%);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* 音名ラベル */
        .key-label {
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #555;
            pointer-events: none;
        }
        .black-key .key-label {
            color: #ff9900;
            bottom: 6px;
            font-size: 10px;
        }

        #fs-guide {
            position: fixed; bottom: 10px; right: 10px; 
            background: rgba(0,0,0,0.7); padding: 4px 8px; 
            border-radius: 4px; font-size: 10px; color: #ccc; z-index: 30;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="portrait-warning">
        <h2>🎹 横画面専用キーボード</h2>
        <p style="margin-top: 10px; color: #aaa;">スマホを横向きにすると、押しやすい2段鍵盤が登場します。</p>
    </div>

    <div class="app-container">
        <header>
            <div class="title">🎹 2段リアルキーボード (音域独立・黒鍵修正版)</div>
            <div>
                <select id="inst-select">
                    <option value="piano">1. ピアノ (Piano)</option>
                    <option value="bell">2. 打楽器 (グロッケン)</option>
                    <option value="wood">3. 打楽器 (木魚/ウッドブロック)</option>
                    <option value="drum">4. 太鼓 (スネア風)</option>
                    <option value="taiko">5. 和太鼓 (Taiko)</option>
                    <option value="flute">6. 笛 (フルート風)</option>
                    <option value="shakuhachi">7. 和楽器 (尺八風)</option>
                    <option value="koto">8. 和楽器 (琴風)</option>
                    <option value="organ">9. オルガン (Organ)</option>
                    <option value="retro">10. 8bitピコピコ音</option>
                </select>
            </div>
        </header>

        <main id="main-board">
            <!-- 上段（超高音域：下段から綺麗に繋がる） -->
            <div class="keyboard-row" id="upper-row"></div>
            <!-- 下段（低〜中音域） -->
            <div class="keyboard-row" id="lower-row"></div>
        </main>
    </div>

    <div id="fs-guide">画面タップでフルスクリーン化</div>

    <script>
        // 周波数計算用の基準 (C4 = 261.63Hz)
        function getFreqFromC4(semitones) {
            return 261.63 * Math.pow(2, semitones / 12);
        }

        // 指定した半音ステップ位置から、白鍵を「whiteKeyCount」の数だけ生成する関数
        // 自動的に該当する位置に黒鍵も生成して挟み込みます。
        function generatePianoRange(startSemitone, whiteKeyCount) {
            let list = [];
            let currentSemitone = startSemitone;
            let whiteIndex = 0;

            while (whiteIndex < whiteKeyCount) {
                // 12音のどこにいるか判定 (0=C, 1=C#, 2=D, 3=D# ... 11=B)
                let norm = (currentSemitone % 12 + 12) % 12;
                
                let name = "";
                let hasBlack = false;
                
                switch(norm) {
                    case 0:  name = "C"; hasBlack = true; break;
                    case 2:  name = "D"; hasBlack = true; break;
                    case 4:  name = "E"; hasBlack = false; break;
                    case 5:  name = "F"; hasBlack = true; break;
                    case 7:  name = "G"; hasBlack = true; break;
                    case 9:  name = "A"; hasBlack = true; break;
                    case 11: name = "B"; hasBlack = false; break;
                }

                // 現在のオクターブ番号を計算して音名に付与 (例: C4, G5など)
                let octave = Math.floor(currentSemitone / 12) + 4;
                let fullLabel = name + octave;

                // 白鍵を追加
                list.push({ name: fullLabel, isBlack: false, freq: getFreqFromC4(currentSemitone) });
                
                // 黒鍵の判定（ただし最後の白鍵の右側にははみ出さないように制限）
                if (hasBlack && (whiteIndex < whiteKeyCount - 1)) {
                    list.push({ name: name + "#" + octave, isBlack: true, freq: getFreqFromC4(currentSemitone + 1) });
                }

                // 次の白鍵へ進むステップ数 (E->F と B->C は半音、他は全音)
                if (norm === 4 || norm === 11) {
                    currentSemitone += 1;
                } else {
                    currentSemitone += 2;
                }
                whiteIndex++;
            }
            return list;
        }

        // 重複の解消ロジック:
        // 下段: C4（基準ド）から右に白鍵11枚 ＝ 【C4 から F5 まで】
        const lowerNotes = generatePianoRange(0, 11); 

        // 上段: 下段の最後の白鍵(F5)の次の白鍵である【G5】からスタートし、右に白鍵11枚 ＝ 【G5 から C7 まで】
        // これで上下の段の音が一切被らず、完璧に一本の地続きになります。
        const upperNotes = generatePianoRange(7, 11); 

        let audioCtx = null;
        let currentInstrument = 'piano';

        // 鍵盤を描画するコアロジック
        function renderPianoRow(containerEl, keyDataList) {
            // 土台コンテナを作成
            const container = document.createElement('div');
            container.className = 'piano-container';

            let whiteKeyCount = 0;

            keyDataList.forEach((note) => {
                const key = document.createElement('div');
                key.dataset.freq = note.freq;

                const label = document.createElement('div');
                label.className = 'key-label';
                label.textContent = note.name;
                key.appendChild(label);

                // タッチ・クリック発音イベント
                const playEvent = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    initAudio();
                    playInstrumentSound(note.freq);
                    key.classList.add('active');
                    setTimeout(() => key.classList.remove('active'), 100);
                };
                key.addEventListener('touchstart', playEvent, {passive: false});
                key.addEventListener('mousedown', playEvent);

                if (!note.isBlack) {
                    key.className = 'white-key';
                    container.appendChild(key);
                    whiteKeyCount++;
                } else {
                    // 黒鍵の絶対配置計算を修正
                    // これまでの白鍵の総幅 (whiteKeyCount * 85px) から、黒鍵の幅の半分(25px)戻した位置に正確に重ねる
                    key.className = 'black-key';
                    let leftPosition = (whiteKeyCount * 85) - 25;
                    key.style.left = `${leftPosition}px`;
                    container.appendChild(key); // 白鍵と同じ親の中に配置
                }
            });

            containerEl.appendChild(container);
        }

        // 上段・下段をそれぞれ構築
        renderPianoRow(document.getElementById('upper-row'), upperNotes);
        renderPianoRow(document.getElementById('lower-row'), lowerNotes);

        document.getElementById('inst-select').addEventListener('change', (e) => {
            currentInstrument = e.target.value;
        });

        // --- フルスクリーン・オーディオ制御 ---
        function requestFullScreen() {
            const docEl = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (docEl.requestFullscreen) docEl.requestFullscreen();
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
            }
        }
        document.body.addEventListener('touchstart', requestFullScreen, { once: true });
        document.body.addEventListener('click', requestFullScreen, { once: true });

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        // 各楽器のシンセサイズエンジン
        function playInstrumentSound(frequency) {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            
            osc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            filter.type = 'lowpass';

            if (currentInstrument === 'piano') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(frequency, now);
                filter.frequency.setValueAtTime(1400, now); filter.frequency.exponentialRampToValueAtTime(250, now + 0.5);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.7, now + 0.005);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
                osc.start(now); osc.stop(now + 1.3);
            } else if (currentInstrument === 'bell') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(frequency, now);
                const mOsc = audioCtx.createOscillator(); const mGain = audioCtx.createGain();
                mOsc.type = 'triangle'; mOsc.frequency.setValueAtTime(frequency * 4.1, now);
                mGain.gain.setValueAtTime(0.2, now); mGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
                mOsc.connect(mGain); mGain.connect(audioCtx.destination);
                mOsc.start(now); mOsc.stop(now + 0.06);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.6, now + 0.002);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
                osc.start(now); osc.stop(now + 2.1);
            } else if (currentInstrument === 'wood') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(frequency, now);
                filter.frequency.setValueAtTime(750, now);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.8, now + 0.002);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
                osc.start(now); osc.stop(now + 0.1);
            } else if (currentInstrument === 'drum') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(frequency * 2, now);
                osc.frequency.exponentialRampToValueAtTime(frequency * 0.5, now + 0.1);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.8, now + 0.005);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
                osc.start(now); osc.stop(now + 0.2);
            } else if (currentInstrument === 'taiko') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(frequency * 1.5, now);
                osc.frequency.linearRampToValueAtTime(55, now + 0.08); filter.frequency.setValueAtTime(250, now);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.9, now + 0.005);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                osc.start(now); osc.stop(now + 0.5);
            } else if (currentInstrument === 'flute') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(frequency, now);
                const vib = audioCtx.createOscillator(); const vGain = audioCtx.createGain();
                vib.frequency.value = 5.8; vGain.gain.value = 3.5;
                vib.connect(vGain); vGain.connect(osc.frequency); vib.start(now); vib.stop(now + 0.8);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.5, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now + 0.4); gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
                osc.start(now); osc.stop(now + 0.8);
            } else if (currentInstrument === 'shakuhachi') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(frequency, now);
                filter.type = 'bandpass'; filter.frequency.setValueAtTime(frequency, now);
                osc.frequency.linearRampToValueAtTime(frequency + 12, now + 0.08); osc.frequency.linearRampToValueAtTime(frequency, now + 0.2);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.6, now + 0.06);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
                osc.start(now); osc.stop(now + 0.9);
            } else if (currentInstrument === 'koto') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(frequency, now);
                filter.frequency.setValueAtTime(1100, now); filter.frequency.exponentialRampToValueAtTime(180, now + 0.3);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.6, now + 0.003);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.75);
                osc.start(now); osc.stop(now + 0.8);
            } else if (currentInstrument === 'organ') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(frequency, now);
                filter.frequency.setValueAtTime(1800, now);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.4, now + 0.02);
                gainNode.gain.setValueAtTime(0.4, now + 0.5); gainNode.gain.linearRampToValueAtTime(0.0001, now + 0.58);
                osc.start(now); osc.stop(now + 0.6);
            } else if (currentInstrument === 'retro') {
                osc.type = 'square'; osc.frequency.setValueAtTime(frequency, now);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.3, now + 0.005);
                gainNode.gain.setValueAtTime(0.3, now + 0.2); gainNode.gain.linearRampToValueAtTime(0.0001, now + 0.24);
                osc.start(now); osc.stop(now + 0.25);
            }
        }
    </script>
</body>
</html>
