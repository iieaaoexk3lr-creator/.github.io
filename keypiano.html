<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2段マルチ音源タイピングキーボード</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        /* 縦画面時の警告 */
        @media screen and (orientation: portrait) {
            #portrait-warning { display: flex !important; }
        }
        #portrait-warning {
            display: none; position: fixed; top:0; left:0; width:100vw; height:100vh;
            background: #111; z-index: 9999; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* ヘッダー設定エリア */
        header {
            background: #222;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 2px solid #333;
            z-index: 10;
        }
        .title { font-size: 14px; font-weight: bold; color: #ffcc00; }
        .instrument-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        select {
            background: #444; color: #fff; border: 1px solid #666;
            padding: 6px 12px; border-radius: 4px; font-size: 14px;
            cursor: pointer; font-weight: bold;
        }

        /* キーボードメイン（2段配置） */
        main {
            flex: 1;
            display: flex;
            flex-direction: column; /* 上下に分割 */
            background: #000;
            padding: 4px;
            gap: 6px;
        }

        /* 各段の鍵盤コンテナ（横スクロール可能にして指のサイズを死守） */
        .keyboard-row {
            flex: 1;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        /* スクロールバーを非表示にする（外観重視） */
        .keyboard-row::-webkit-scrollbar { display: none; }

        /* 鍵盤スタイル（成人男性の人差し指幅＝約22mm ≒ 約80px〜85pxで固定） */
        .key {
            flex: 0 0 82px; /* 横幅を約22mm相当にがっちり固定 */
            margin: 0 2px;
            background: linear-gradient(to bottom, #eaeaea, #ffffff);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 3px 3px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 12px;
            transition: all 0.05s;
        }
        
        /* 黒鍵（半音階）用のデザイン差別化 */
        .key.black-key {
            background: linear-gradient(to bottom, #222, #444);
            color: #ff9900;
        }

        /* 押した（タイプした）時の沈む演出 */
        .key:active, .key.active {
            transform: scale(0.96) translateY(2px);
            box-shadow: 0 1px 1px rgba(0,0,0,0.2);
            background: linear-gradient(to bottom, #bbb, #ddd);
        }
        .key.black-key:active, .key.black-key.active {
            background: linear-gradient(to bottom, #000, #222);
        }

        .key-name {
            color: #333; font-size: 11px; font-weight: bold; pointer-events: none;
        }
        .key.black-key .key-name { color: #aaa; }
        
        .row-indicator {
            position: absolute; top: 2px; left: 6px; font-size: 9px; color: #bbb; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="portrait-warning">
        <h2>🎹 横画面専用キーボード</h2>
        <p style="margin-top: 10px; color: #aaa;">スマホを横向きにすると、押しやすい2段鍵盤が登場します。</p>
    </div>

    <div class="app-container">
        <header>
            <div class="title">🎵 Multi-Tone Type Keyboard</div>
            <div class="instrument-selector">
                <label for="inst-select" style="font-size: 12px; color: #ccc;">音色選択:</label>
                <select id="inst-select">
                    <option value="piano">1. ピアノ (Piano)</option>
                    <option value="bell">2. 打楽器 (グロッケン)</option>
                    <option value="wood">3. 打楽器 (木魚/ウッドブロック)</option>
                    <option value="drum">4. 太鼓 (スネア風コズミック)</option>
                    <option value="taiko">5. 和太鼓 (Taiko)</option>
                    <option value="flute">6. 笛 (フルート風)</option>
                    <option value="shakuhachi">7. 和楽器 (尺八風)</option>
                    <option value="koto">8. 和楽器 (琴風)</option>
                    <option value="organ">9. オルガン (Organ)</option>
                    <option value="retro">10. 8bitピコピコ音</option>
                </select>
            </div>
        </header>

        <main>
            <!-- 上段（高音域：C5 〜 C6#） -->
            <div class="keyboard-row" id="upper-row"></div>
            <!-- 下段（低〜中音域：C4 〜 C5#） -->
            <div class="keyboard-row" id="lower-row"></div>
        </main>
    </div>

    <script>
        // 音名定義（C4〜C6までの半音階データ）
        const notes = [
            { name: "C4", freq: 261.63, black: false }, { name: "C#4", freq: 277.18, black: true },
            { name: "D4", freq: 293.66, black: false }, { name: "D#4", freq: 311.13, black: true },
            { name: "E4", freq: 329.63, black: false },
            { name: "F4", freq: 349.23, black: false }, { name: "F#4", freq: 369.99, black: true },
            { name: "G4", freq: 392.00, black: false }, { name: "G#4", freq: 415.30, black: true },
            { name: "A4", freq: 440.00, black: false }, { name: "A#4", freq: 466.16, black: true },
            { name: "B4", freq: 493.88, black: false },
            
            { name: "C5", freq: 523.25, black: false }, { name: "C#5", freq: 554.37, black: true },
            { name: "D5", freq: 587.33, black: false }, { name: "D#5", freq: 622.25, black: true },
            { name: "E5", freq: 659.25, black: false },
            { name: "F5", freq: 698.46, black: false }, { name: "F#5", freq: 739.99, black: true },
            { name: "G5", freq: 783.99, black: false }, { name: "G#5", freq: 830.61, black: true },
            { name: "A5", freq: 880.00, black: false }, { name: "A#5", freq: 932.33, black: true },
            { name: "B5", freq: 987.77, black: false },
            
            { name: "C6", freq: 1046.50, black: false }, { name: "C#6", freq: 1109.73, black: true }
        ];

        let audioCtx = null;
        let currentInstrument = 'piano';

        // 2段に音を振り分け (下段に中低音C4〜B4、上段に高音C5〜C6#)
        const lowerNotes = notes.slice(0, 12);
        const upperNotes = notes.slice(12);

        const upperRowEl = document.getElementById('upper-row');
        const lowerRowEl = document.getElementById('lower-row');
        const instSelect = document.getElementById('inst-select');

        // 鍵盤の生成関数
        function createKeyboard(rowElement, noteList, rowLabel) {
            noteList.forEach(note => {
                const key = document.createElement('div');
                key.className = `key ${note.black ? 'black-key' : ''}`;
                key.dataset.freq = note.freq;

                const name = document.createElement('div');
                name.className = 'key-name';
                name.textContent = note.name;
                key.appendChild(name);

                // タッチ/クリック時に一発でタイプ発音するイベント
                key.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    triggerPlay(key, note.freq);
                });
                key.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    triggerPlay(key, note.freq);
                });

                rowElement.appendChild(key);
            });
        }

        createKeyboard(upperRowEl, upperNotes, "上段 (高音)");
        createKeyboard(lowerRowEl, lowerNotes, "下段 (中低音)");

        instSelect.addEventListener('change', (e) => {
            currentInstrument = e.target.value;
        });

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function triggerPlay(element, freq) {
            initAudio();
            playInstrumentSound(freq);
            
            // タップ視覚効果の補助
            element.classList.add('active');
            setTimeout(() => element.classList.remove('active'), 100);
        }

        // --- 10種類の音色合成エンジン ---
        function playInstrumentSound(frequency) {
            const now = audioCtx.currentTime;
            
            // 基本構造のノード作成
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            
            osc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(10000, now);

            switch (currentInstrument) {
                
                case 'piano': // 1. ピアノ
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frequency, now);
                    // 倍音を少し模倣するためにローパスを絞る
                    filter.frequency.setValueAtTime(1500, now);
                    filter.frequency.exponentialRampToValueAtTime(300, now + 0.5);
                    
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.7, now + 0.005);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
                    osc.start(now); osc.stop(now + 1.3);
                    break;

                case 'bell': // 2. 打楽器（グロッケン/鉄琴風）
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frequency, now);
                    // 高周波の金属的なアタック倍音を別ラインで一瞬だけブレンド
                    const metalOsc = audioCtx.createOscillator();
                    const metalGain = audioCtx.createGain();
                    metalOsc.type = 'triangle';
                    metalOsc.frequency.setValueAtTime(frequency * 4.1, now); // 非整数倍音
                    metalGain.gain.setValueAtTime(0.3, now);
                    metalGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
                    metalOsc.connect(metalGain); metalGain.connect(audioCtx.destination);
                    metalOsc.start(now); metalOsc.stop(now + 0.06);

                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.6, now + 0.002);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 2.0); // 長い余韻
                    osc.start(now); osc.stop(now + 2.1);
                    break;

                case 'wood': // 3. 打楽器（木魚/ウッドブロック）
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(frequency, now);
                    filter.frequency.setValueAtTime(800, now); // ポコポコしたこもった音
                    
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.8, now + 0.002);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.08); // 一瞬で消える
                    osc.start(now); osc.stop(now + 0.1);
                    break;

                case 'drum': // 4. 太鼓 (スネア・パーカッション風)
                    osc.type = 'sine';
                    // 叩いた瞬間にピッチを高速で急降下させる（太鼓の膜のテンション変化）
                    osc.frequency.setValueAtTime(frequency * 2, now);
                    osc.frequency.exponentialRampToValueAtTime(frequency * 0.5, now + 0.1);
                    
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.8, now + 0.005);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                    osc.start(now); osc.stop(now + 0.25);
                    break;

                case 'taiko': // 5. 和太鼓
                    osc.type = 'sine';
                    // 超低音へピッチを落とし、ドォンという重低音を作る
                    osc.frequency.setValueAtTime(frequency * 1.5, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.08); 
                    
                    filter.frequency.setValueAtTime(300, now); // 高音成分を全カット

                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.9, now + 0.005);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                    osc.start(now); osc.stop(now + 0.5);
                    break;

                case 'flute': // 6. 笛（フルート風）
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frequency, now);
                    // 笛特有の吹き始めの「かすれ」と「ビブラート」を模倣
                    const vibrato = audioCtx.createOscillator();
                    const vibratoGain = audioCtx.createGain();
                    vibrato.frequency.value = 6; // 6Hzの揺れ
                    vibratoGain.gain.value = 4; // 揺れの深さ
                    vibrato.connect(vibratoGain); vibratoGain.connect(osc.frequency);
                    vibrato.start(now); vibrato.stop(now + 0.8);

                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.5, now + 0.1); // じわっと立ち上がる
                    gainNode.gain.setValueAtTime(0.5, now + 0.4);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.7); // 吹き終わりの余韻
                    osc.start(now); osc.stop(now + 0.8);
                    break;

                case 'shakuhachi': // 7. 和楽器（尺八風）
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(frequency, now);
                    // 尺八の「ムラ息」を再現するため強めのフィルター制限
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(frequency, now);
                    
                    // 吹き始めに大きなピッチの揺らぎ
                    osc.frequency.linearRampToValueAtTime(frequency + 15, now + 0.08);
                    osc.frequency.linearRampToValueAtTime(frequency, now + 0.2);

                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.6, now + 0.06);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
                    osc.start(now); osc.stop(now + 1.0);
                    break;

                case 'koto': // 8. 和楽器（琴風）
                    // ギターに似ているが、アタックが硬く、減衰がやや直線的
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(frequency, now);
                    filter.frequency.setValueAtTime(1200, now);
                    filter.frequency.exponentialRampToValueAtTime(200, now + 0.3);

                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.6, now + 0.003); // 非常に鋭いアタック
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
                    osc.start(now); osc.stop(now + 0.9);
                    break;

                case 'organ': // 9. オルガン
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(frequency, now);
                    filter.frequency.setValueAtTime(2000, now);
                    
                    // 離すまで音が減衰しない特性（簡易的に長めの持続音に）
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.4, now + 0.02);
                    gainNode.gain.setValueAtTime(0.4, now + 0.5);
                    gainNode.gain.linearRampToValueAtTime(0.0001, now + 0.6);
                    osc.start(now); osc.stop(now + 0.65);
                    break;

                case 'retro': // 10. 8bitピコピコ音
                    osc.type = 'square'; // ファミコン風の矩形波
                    osc.frequency.setValueAtTime(frequency, now);
                    
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.3, now + 0.005);
                    gainNode.gain.setValueAtTime(0.3, now + 0.2);
                    gainNode.gain.linearRampToValueAtTime(0.0001, now + 0.25);
                    osc.start(now); osc.stop(now + 0.3);
                    break;
            }
        }
    </script>
</body>
</html>
