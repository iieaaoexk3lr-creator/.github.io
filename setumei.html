<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>歌って話して説明クイズ</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 20px;
  }

  #question {
    font-size: 2.5rem;
    margin: 30px 0;
    font-weight: bold;
  }

  #score {
    font-size: 2rem;
    margin-bottom: 20px;
    color: #00ffcc;
  }

  button {
    font-size: 1.3rem;
    padding: 12px 25px;
    margin: 8px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  .correctEffect {
    display: none;
    font-size: 3rem;
    color: #00ffcc;
    animation: sparkle 0.8s ease-out forwards;
  }

  .wrongEffect {
    display: none;
    font-size: 3rem;
    color: #ff4444;
    animation: wrongflash 0.6s ease-out forwards;
  }

  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1); }
  }

  @keyframes wrongflash {
    0% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.2); }
    100% { opacity: 0; transform: scale(1); }
  }

  @media (max-width: 600px) {
    #question { font-size: 2rem; }
    button { font-size: 1.1rem; padding: 10px 18px; }
  }
</style>
</head>
<body>

<h1>説明クイズ企画</h1>

<div id="score">ポイント：0</div>

<div id="question"></div>

<!-- エフェクト -->
<div id="correctEffect" class="correctEffect">✨正解✨</div>
<div id="wrongEffect" class="wrongEffect">❌</div>

<!-- ボタン -->
<button onclick="markCorrect()">正解</button>
<button onclick="markWrong()">不正解</button>
<button onclick="nextQuestion()">次の問題</button>
<button onclick="resetScore()">ポイントリセット</button>
<button onclick="location.href='menu.html'">メニューへ戻る</button>

<script>
  const questions = [
    "りんごのうた",
    "飛行機",
    "東京",
    "イルカ",
    "北風小僧のかんたろう",
    "雪の華",
  ];

  let current = 0;
  let score = 0;

  const questionDiv = document.getElementById("question");
  const scoreDiv = document.getElementById("score");
  const correctEffect = document.getElementById("correctEffect");
  const wrongEffect = document.getElementById("wrongEffect");

  function showQuestion() {
    questionDiv.textContent = questions[current];
  }

  function markCorrect() {
    score += 10;
    scoreDiv.textContent = "ポイント：" + score;
    showEffect(correctEffect);
  }

  function markWrong() {
    showEffect(wrongEffect);
  }

  function passQuestion() {
    showEffect(wrongEffect);
  }

  function nextQuestion() {
    current++;
    if (current >= questions.length) {
      questionDiv.textContent = "全問終了！お疲れさま！";
      return;
    }
    showQuestion();
  }

  function resetScore() {
    score = 0;
    scoreDiv.textContent = "ポイント：0";
  }

  function showEffect(effect) {
    effect.style.display = "block";
    setTimeout(() => {
      effect.style.display = "none";
    }, 800);
  }

  showQuestion();
</script>

</body>
</html>
