<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Score Board & Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap');
        body {
            font-family: 'Noto+Sans+JP', sans-serif;
            background-color: #1a202c;
            color: #f7fafc;
        }
        .score-hidden {
            filter: blur(12px);
            user-select: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #708090); color: #000; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #8b4513); color: #000; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        
        <!-- 管理者ログインエリア -->
        <div class="mb-6 flex justify-end items-center gap-2">
            <input type="password" id="adminKeyInput" placeholder="管理キーを入力" class="bg-gray-800 text-white px-4 py-1.5 rounded-lg border border-gray-700 text-sm focus:outline-none focus:border-blue-500">
            <button id="authBtn" class="bg-gray-700 hover:bg-gray-600 px-4 py-1.5 rounded-lg text-sm font-bold transition-all">ログイン</button>
        </div>

        <!-- 管理者コントロールパネル (初期状態は非表示 hidden) -->
        <div id="adminPanel" class="hidden bg-gray-800/80 border-2 border-blue-500 rounded-3xl p-6 mb-10 shadow-2xl">
            <h2 class="text-2xl font-black text-blue-400 mb-4">🛠️ 管理者操作パネル</h2>
            
            <!-- 全体コントロール -->
            <div class="flex flex-wrap gap-4 mb-6 border-b border-gray-700 pb-4">
                <button id="toggleMode" class="bg-blue-600 hover:bg-blue-700 px-6 py-2.5 rounded-xl text-lg font-bold transition-all shadow">
                    モード切替 (個人/グループ)
                </button>
                <button id="toggleScores" class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-xl text-lg font-bold transition-all shadow">
                    スコア公開/秘匿の切替
                </button>
            </div>

            <!-- 新規追加フォーム -->
            <div class="flex flex-wrap gap-2 items-center">
                <input type="text" id="newNameInput" placeholder="新しい名前（個人名またはチーム名）" class="bg-gray-700 text-white px-4 py-2.5 rounded-xl border border-gray-600 font-bold focus:outline-none focus:border-blue-500 w-full sm:w-80">
                <button id="addParticipantBtn" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-2.5 rounded-xl font-bold text-lg transition-all shadow w-full sm:w-auto">
                    追加する
                </button>
            </div>
        </div>

        <!-- メインヘッダー表示 -->
        <div class="text-center md:text-left mb-10">
            <h1 class="text-5xl md:text-6xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 inline-block">
                SCORE BOARD
            </h1>
            <p id="currentModeLabel" class="text-xl text-gray-400 font-bold mt-2">読み込み中...</p>
        </div>

        <!-- スコアボード表示グリッド -->
        <div id="boardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- ここに動的にカードが生成されます -->
        </div>
    </div>

    <!-- Firebase SDK (Version 9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        // --- 提供された Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
            authDomain: "gamehistory-m84.firebaseapp.com",
            databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
            projectId: "gamehistory-m84",
            storageBucket: "gamehistory-m84.firebasestorage.app",
            messagingSenderId: "475761727837",
            appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
            measurementId: "G-3636W6LC4F"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 簡易的な管理キー設定 ---
        const ADMIN_SECRET = "admin123"; // 必要に応じて好きなパスワードに変えてください
        let isAdmin = false;

        // --- アプリケーション状態 ---
        let state = {
            mode: 'individual',
            showScores: false,
            data: []
        };

        // --- DOM要素 ---
        const adminKeyInput = document.getElementById('adminKeyInput');
        const authBtn = document.getElementById('authBtn');
        const adminPanel = document.getElementById('adminPanel');
        const boardGrid = document.getElementById('boardGrid');
        const toggleModeBtn = document.getElementById('toggleMode');
        const toggleScoresBtn = document.getElementById('toggleScores');
        const currentModeLabel = document.getElementById('currentModeLabel');
        const newNameInput = document.getElementById('newNameInput');
        const addParticipantBtn = document.getElementById('addParticipantBtn');

        // --- 認証ロジック ---
        authBtn.onclick = () => {
            if (adminKeyInput.value === ADMIN_SECRET) {
                isAdmin = true;
                adminPanel.classList.remove('hidden');
                adminKeyInput.disabled = true;
                authBtn.disabled = true;
                authBtn.innerText = "ログイン中";
                authBtn.className = "bg-emerald-600 px-4 py-1.5 rounded-lg text-sm font-bold text-white";
                render(); // 管理者用UI（入力フォーム等）を反映させるため再描画
            } else {
                alert("管理キーが違います。");
            }
        };

        // --- スコア再計算ヘルパー ---
        function calculateTotal(scores) {
            return scores.reduce((sum, s) => sum + (parseInt(s) || 0), 0);
        }

        // --- スコア更新用（管理者用関数） ---
        window.updateScoreValue = (id, gameIndex, value) => {
            const path = state.mode === 'individual' ? `participants/${id}` : `groups/${id}`;
            const target = state.data.find(item => item.id === id);
            if (!target) return;

            let newScores = [...target.scores];
            newScores[gameIndex] = parseInt(value) || 0;
            let newTotal = calculateTotal(newScores);

            db.ref(path).update({
                scores: newScores,
                total: newTotal
            });
        };

        // --- メンバー削除用（管理者用関数） ---
        window.deleteItem = (id) => {
            if(confirm("本当に削除しますか？")) {
                const path = state.mode === 'individual' ? `participants/${id}` : `groups/${id}`;
                db.ref(path).remove();
            }
        };

        // --- 画面描画ロジック ---
        function render() {
            boardGrid.innerHTML = '';
            currentModeLabel.innerText = `${state.mode === 'individual' ? '👥 個人戦モード (4〜30人)' : '🚩 グループ戦モード (2〜6グループ)'} ｜ スコア：${state.showScores ? '🔓 公開中' : '🔒 秘匿中'}`;
            
            // スコア順でソート
            const sortedData = [...state.data].sort((a, b) => b.total - a.total);

            sortedData.forEach((item, index) => {
                const isTop3 = index < 3;
                const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : 'glass-card';
                const textCol = isTop3 ? 'text-gray-900' : 'text-white';
                const opacityCol = isTop3 ? 'opacity-70' : 'opacity-50';
                
                const card = document.createElement('div');
                card.className = `${rankClass} p-6 rounded-3xl shadow-2xl flex flex-col justify-between transition-all duration-300`;
                
                // 各ゲームの入力/表示エリアの組み立て
                let gamesHtml = '';
                for(let i=0; i<3; i++) {
                    const currentScore = item.scores && item.scores[i] !== undefined ? item.scores[i] : 0;
                    
                    gamesHtml += `
                        <div class="text-center bg-black/20 rounded-xl p-2">
                            <div class="text-xs uppercase ${opacityCol} font-bold mb-1">Game ${i+1}</div>
                            ${isAdmin ? `
                                <input type="number" value="${currentScore}" 
                                    onchange="updateScoreValue('${item.id}', ${i}, this.value)" 
                                    class="w-full bg-white/20 text-center font-black text-xl rounded p-1 focus:outline-none focus:bg-white/40 ${textCol}">
                            ` : `
                                <div class="text-2xl font-black ${state.showScores ? '' : 'score-hidden'}">${currentScore}</div>
                            `}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl font-black ${opacityCol}">#${index + 1}</span>
                            <span class="text-3xl font-black truncate max-w-[180px] ${textCol}">${item.name}</span>
                        </div>
                        ${isAdmin ? `
                            <button onclick="deleteItem('${item.id}')" class="text-xs bg-red-900/50 hover:bg-red-900 text-red-200 px-2 py-1 rounded">削除</button>
                        ` : ''}
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2 mb-6">
                        ${gamesHtml}
                    </div>
                    
                    <div class="border-t border-white/20 pt-4 flex justify-between items-baseline">
                        <span class="text-lg font-bold ${opacityCol} uppercase">Total</span>
                        <span class="text-5xl font-black ${state.showScores ? '' : 'score-hidden'} ${textCol}">${item.total}</span>
                    </div>
                `;
                boardGrid.appendChild(card);
            });
        }

        // --- Firebase データ同期（リアルタイム受信） ---
        db.ref('gameState').on('value', (snap) => {
            const val = snap.val() || {};
            state.mode = val.mode || 'individual';
            state.showScores = val.showScores || false;
            
            const path = state.mode === 'individual' ? 'participants' : 'groups';
            db.ref(path).on('value', (dataSnap) => {
                const dataRaw = dataSnap.val() || {};
                state.data = Object.keys(dataRaw).map(key => {
                    return {
                        id: key,
                        name: dataRaw[key].name,
                        scores: dataRaw[key].scores || [0, 0, 0],
                        total: dataRaw[key].total || 0
                    };
                });
                render();
            });
        });

        // --- 管理者アクション（データベース書き込み） ---
        
        // モード切替
        toggleModeBtn.onclick = () => {
            const nextMode = state.mode === 'individual' ? 'group' : 'individual';
            db.ref('gameState/mode').set(nextMode);
        };

        // スコア公開・秘匿
        toggleScoresBtn.onclick = () => {
            db.ref('gameState/showScores').set(!state.showScores);
        };

        // 新規メンバー追加
        addParticipantBtn.onclick = () => {
            const name = newNameInput.value.trim();
            if(!name) return;

            const path = state.mode === 'individual' ? 'participants' : 'groups';
            const newRef = db.ref(path).push();
            newRef.set({
                name: name,
                scores: [0, 0, 0],
                total: 0
            }).then(() => {
                newNameInput.value = '';
            });
        };
    </script>
</body>
</html>
