<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>連動型デジタルペンライト</title>
    <link rel="stylesheet" href="penlight.css">
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <!-- メイン発光エリア -->
        <main class="light-field" id="lightField">
            <div class="fullscreen-guide">画面中央をタップでURLバー非表示</div>
            <!-- 現在の権限状態を画面上に小さく表示（デバッグ・確認用） -->
            <div class="status-badge" id="statusBadge">参加者モード</div>
            <div class="penlight-glow-body" id="penlightBody"></div>
        </main>

        <!-- 左側カラーバー -->
        <nav class="side-color-bar left-bar ui-element"></nav>

        <!-- 右側カラーバー -->
        <nav class="side-color-bar right-bar ui-element"></nav>

        <!-- ★ボトムコントロールメニュー（スライドスクロール式・システムバー回避） -->
        <footer class="bottom-controls-menu ui-element" id="bottomMenu">
            <div class="scroll-wrapper">
                <!-- 管理者切り替え用のトグルスイッチ -->
                <div class="menu-item-wrapper toggle-container">
                    <label class="switch-label">
                        <input type="checkbox" id="adminToggle">
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-text">管理者</span>
                </div>
                
                <button class="menu-btn" id="btnBlink">点滅</button>
                <button class="menu-btn" id="btnPulse">明滅</button>
                <button class="menu-btn" id="btnPattern" disabled>虹: 一瞬</button>
                <button class="menu-btn sync-btn" id="btnSync">同期 🔄</button>
                <button class="menu-btn hide-btn" id="btnHide">非表示</button>
                <button class="menu-btn off-btn" id="btnOff">OFF</button>
            </div>
        </footer>

    </div>

    <!-- Firebase SDKの読み込み（Type=moduleでjs側から初期化します） -->
    <script type="module" src="penlight.js"></script>
</body>
</html>
