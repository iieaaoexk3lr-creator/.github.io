<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>両利き対応・高機能デジタルペンライト</title>
    <link rel="stylesheet" href="penlight.css">
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <!-- メイン発光エリア（ここをタップするとUIの表示/非表示、および全画面化をコントロール） -->
        <main class="light-field" id="lightField">
            <div class="fullscreen-guide">画面中央をタップでURLバー非表示</div>
            <div class="penlight-glow-body" id="penlightBody"></div>
        </main>

        <!-- 左側カラーバー（縦並び） -->
        <nav class="side-color-bar left-bar ui-element">
            <!-- JSでボタンを自動生成します -->
        </nav>

        <!-- 右側カラーバー（縦並び） -->
        <nav class="side-color-bar right-bar ui-element">
            <!-- JSでボタンを自動生成します -->
        </nav>

        <!-- ボトムコントロールメニュー（スマホの戻るボタン対策で少し上に配置） -->
        <footer class="bottom-controls-menu ui-element" id="bottomMenu">
            <button class="menu-btn" id="btnBlink">点滅</button>
            <button class="menu-btn" id="btnPulse">明滅</button>
            <button class="menu-btn" id="btnPattern" disabled>虹パターン: 一瞬</button>
            <button class="menu-btn hide-btn" id="btnHide">非表示</button>
            <button class="menu-btn off-btn" id="btnOff">OFF</button>
        </footer>

    </div>

    <script src="penlight.js"></script>
</body>
</html>
