<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ジャストフィット・デジタルペンライト</title>
    <link rel="stylesheet" href="penlight.css">
</head>
<body>
    <!-- 全画面化の対象となるメインコンテナ -->
    <div class="phone-container" id="fullscreenContainer">
        
        <!-- 発光エリア（ここをタップするとブラウザが全画面化してURLバーが消えます） -->
        <main class="light-section" id="lightSection">
            <div class="fullscreen-tip">画面タッチでURLバーを非表示（全画面）</div>
            
            <div class="glow-container">
                <!-- どんなスマホの縦幅でも上から下までピッタリ埋めるライト本体 -->
                <div class="penlight-head" id="penlightHead"></div>
            </div>
        </main>

        <!-- 現在選択中の色表示ピルボタン -->
        <div class="active-color-pill-container" id="pillContainer">
            <button class="active-color-pill" id="colorPickerTrigger">
                <span class="color-indicator-dot" id="pillDot"></span>
                <span id="pillText">赤 (単色)</span>
            </button>
        </div>

        <!-- ボトムカラー選択シート -->
        <div class="color-picker-overlay" id="colorPickerOverlay">
            <div class="picker-sheet">
                <div class="sheet-header">
                    <div class="handle-bar"></div>
                    <h3>色・モードの選択</h3>
                    <p class="lock-notice">※虹色中は固定されます。⚫黒を選ぶと解除され他の色を選べます。</p>
                </div>
                
                <div class="sheet-content">
                    <div class="color-grid" id="colorGrid">
                        <button class="color-btn active" data-name="赤" data-color="#FF0000" style="background-color: #FF0000;"></button>
                        <button class="color-btn" data-name="オレンジ" data-color="#FF7F00" style="background-color: #FF7F00;"></button>
                        <button class="color-btn" data-name="黄" data-color="#FFFF00" style="background-color: #FFFF00;"></button>
                        <button class="color-btn" data-name="黄緑" data-color="#7FFF00" style="background-color: #7FFF00;"></button>
                        <button class="color-btn" data-name="緑" data-color="#00FF00" style="background-color: #00FF00;"></button>
                        <button class="color-btn" data-name="水色" data-color="#00FFFF" style="background-color: #00FFFF;"></button>
                        <button class="color-btn" data-name="青" data-color="#0000FF" style="background-color: #0000FF;"></button>
                        <button class="color-btn" data-name="紫" data-color="#8B00FF" style="background-color: #8B00FF;"></button>
                        <button class="color-btn" data-name="ピンク" data-color="#FF69B4" style="background-color: #FF69B4;"></button>
                        <button class="color-btn" data-name="白" data-color="#FFFFFF" style="background-color: #FFFFFF;"></button>
                        <button class="color-btn black-btn" data-name="黒 (解除)" data-color="#050505" style="background-color: #000000;"></button>
                        <button class="color-btn rainbow-btn" id="rainbowBtn" data-name="虹色 (ロック)">🌈</button>
                    </div>

                    <div class="mode-grid">
                        <button class="mode-btn" id="blinkBtn">点滅</button>
                        <button class="mode-btn" id="pulseBtn">明滅</button>
                        <button class="mode-btn off-btn" id="offBtn">OFF</button>
                        <button class="mode-btn close-sheet-btn" id="closeSheetBtn">閉じる</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="penlight.js"></script>
</body>
</html>
