<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ステージ演出 ＆ コントローラー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      transition: background-color 0.3s;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* メイン操作バー */
    .control-bar {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 92%;
      max-width: 500px;
      background: rgba(20, 20, 35, 0.9);
      padding: 12px 16px;
      border-radius: 30px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 100;
    }

    button {
      background: #2a2a40;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: all 0.2s;
      flex: 1;
      margin: 0 4px;
      text-align: center;
      white-space: nowrap;
    }
    button:hover { background: #3b3b5c; }
    button.active { 
      background: #6200ee; 
      border-color: #bb86fc;
      box-shadow: 0 0 12px rgba(187, 134, 252, 0.6);
    }

    /* 設定パネル */
    .panel {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(25, 25, 45, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      padding: 20px;
      width: 90%;
      max-width: 420px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 1000;
      max-height: 70vh;
      overflow-y: auto;
    }
    .panel.open { display: flex; }

    .panel-title {
      font-size: 13px;
      color: #03dac6;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 4px;
      margin-top: 4px;
      font-weight: bold;
    }

    .grid-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-btns button { margin: 0; }
    .grid-btns button.selected {
      background: #03dac6;
      color: #000;
    }

    .color-btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .color-btns button {
      padding: 8px 2px;
      font-size: 11px;
      margin: 0;
    }
    .color-btns button.selected {
      border: 2px solid #03dac6;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      color: #ccc;
    }
    input[type="range"] { width: 100%; cursor: pointer; }
    input[type="text"], input[type="color"] {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
    }
    input[type="color"] {
      height: 36px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="stage"></canvas>

  <!-- メイン操作バー -->
  <div class="control-bar">
    <button id="btnFxPanel" onclick="togglePanel('fxPanel')">🎉 演出設定</button>
    <button id="btnFeaturePanel" onclick="togglePanel('featurePanel')">⚙️ 機能 / 同期</button>
  </div>

  <!-- 1. 演出パネル -->
  <div id="fxPanel" class="panel">
    <div class="panel-title">1. パーティクル種類</div>
    <div class="grid-btns">
      <button class="type-btn selected" onclick="setParticleType('confetti_rect', this)">⏹️ 四角紙吹雪</button>
      <button class="type-btn" onclick="setParticleType('confetti_tri', this)">🔺 三角紙吹雪</button>
      <button class="type-btn" onclick="setParticleType('heart', this)">💖 ハート</button>
      <button class="type-btn" onclick="setParticleType('star', this)">★ 星</button>
      <button class="type-btn" onclick="setParticleType('bubble', this)">🫧 泡</button>
      <button class="type-btn" onclick="setParticleType('note', this)">🎵 音符 (4種順繰り)</button>
    </div>

    <div class="panel-title">2. カラー設定</div>
    <div class="color-btns">
      <button class="color-btn selected" onclick="setColorTheme('vivid', this)">🌈 ビビッド</button>
      <button class="color-btn" onclick="setColorTheme('pastel', this)">🍬 パステル</button>
      <button class="color-btn" onclick="setColorTheme('gold', this)">✨ ゴールド</button>
      <button class="color-btn" onclick="setColorTheme('pink', this)">💖 ピンク</button>
    </div>
    <div class="control-group" style="margin-top: 4px;">
      <label>指定カラー (原色一括設定)</label>
      <input type="color" id="customParticleColor" value="#ff0000" oninput="setCustomParticleColor(this.value)">
    </div>

    <div class="panel-title">3. 移動方向</div>
    <div class="grid-btns">
      <button class="dir-btn selected" onclick="setDirection('down', this)">⬇️ 落下</button>
      <button class="dir-btn" onclick="setDirection('up', this)">⬆️ 上昇</button>
    </div>

    <div class="panel-title">4. パラメータ詳細調整</div>
    <div class="control-group">
      <label>基準表示数 (個数): <span id="valCount">10</span></label>
      <input type="range" min="5" max="150" value="10" oninput="updateBaseCount(+this.value)">
    </div>
    <div class="control-group">
      <label>移動速度: <span id="valSpeed">5</span></label>
      <input type="range" min="1" max="15" value="5" oninput="state.speed = +this.value; document.getElementById('valSpeed').innerText=this.value;">
    </div>
    <div class="control-group">
      <label>サイズ (最大200px): <span id="valSize">40</span>px</label>
      <input type="range" min="10" max="200" value="40" oninput="state.size = +this.value; document.getElementById('valSize').innerText=this.value;">
    </div>
    <div class="control-group">
      <label>ドリフト (横流れ幅): <span id="valDrift">2.0</span></label>
      <input type="range" min="0" max="10" step="0.5" value="2.0" oninput="state.drift = +this.value; document.getElementById('valDrift').innerText=this.value;">
    </div>
    <div class="control-group">
      <label>自転速度: <span id="valRotateSpeed">2.0</span></label>
      <input type="range" min="0" max="10" step="0.5" value="2.0" oninput="state.rotateSpeed = +this.value; document.getElementById('valRotateSpeed').innerText=this.value;">
    </div>
    <div class="control-group">
      <label>ひらひら揺れ幅: <span id="valWobble">1.5</span></label>
      <input type="range" min="0" max="5" step="0.1" value="1.5" oninput="state.wobble = +this.value; document.getElementById('valWobble').innerText=this.value;">
    </div>
  </div>

  <!-- 2. 機能・環境・スポットライト詳細パネル -->
  <div id="featurePanel" class="panel">
    <div class="panel-title">💡 スポットライト設定</div>
    <button id="btnSpotlightToggle" onclick="toggleSpotlight()" style="margin-bottom: 6px;">💡 スポットライト OFF</button>
    
    <div class="grid-btns">
      <button class="spot-pos-btn selected" onclick="setSpotlightPos('top', this)">⬆️ 上から照らす</button>
      <button class="spot-pos-btn" onclick="setSpotlightPos('bottom', this)">⬇️ 下から照らす</button>
    </div>
    <div class="control-group">
      <label>ライト色</label>
      <input type="color" id="spotColor" value="#ffffdd" oninput="updateSpotColor(this.value)">
    </div>
    <div class="control-group">
      <label>光の濃淡 (不透明度): <span id="valSpotAlpha">0.6</span></label>
      <input type="range" min="0.1" max="1.0" step="0.05" value="0.6" oninput="state.spotlightAlpha = +this.value; document.getElementById('valSpotAlpha').innerText=this.value;">
    </div>
    <div class="control-group">
      <label>光の幅 (照射角度)</label>
      <input type="range" min="0.1" max="0.8" step="0.05" value="0.3" oninput="state.spotlightWidth = +this.value">
    </div>
    <div class="control-group">
      <label>首振り速度</label>
      <input type="range" min="1" max="10" value="3" oninput="state.spotlightSpeed = this.value * 0.005">
    </div>

    <div class="panel-title">🎨 ステージ背景設定</div>
    <div class="control-group">
      <label>背景カラー</label>
      <input type="color" id="bgColor" value="#0d0d1a" onchange="changeBgColor(this.value)">
    </div>

    <div class="panel-title">🔗 リアルタイム同期</div>
    <div class="control-group">
      <label>ルームID</label>
      <input type="text" id="roomId" value="STAGE_ROOM_01">
    </div>
    <button onclick="connectSync()">接続して設定を同期</button>

    <div class="panel-title">📺 画面モード</div>
    <button onclick="toggleFullscreen()">全画面表示切り替え</button>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // カラーパレット定義
    const colorThemes = {
      vivid: ['#f44336', '#e91e63', '#9c27b0', '#2196f3', '#4caf50', '#ffeb3b', '#ff9800'],
      pastel: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8baff'],
      gold: ['#ffd700', '#ffae00', '#fff8dc', '#daa520', '#b8860b'],
      pink: ['#ffb7c5', '#ffc0cb', '#ff69b4', '#ff1493', '#ffffff']
    };

    // システム状態パラメータ
    const state = {
      spotlight: false,
      spotlightPos: 'top',
      spotlightColor: '#ffffdd',
      spotlightAlpha: 0.6,
      spotlightSpeed: 0.015,
      spotlightWidth: 0.3,
      particleType: 'confetti_rect',
      direction: 'down',
      speed: 5,
      size: 40,
      drift: 2.0,
      rotateSpeed: 2.0,
      wobble: 1.5,
      baseCount: 10,
      targetCount: 10,
      currentColors: colorThemes.vivid
    };

    // 2秒ごとに目標数を±2ゆらす処理
    setInterval(() => {
      const variation = Math.floor(Math.random() * 5) - 2;
      state.targetCount = Math.max(1, state.baseCount + variation);
    }, 2000);

    // 音符サイクルのグローバルカウンター（0:二分, 1:四分, 2:八分, 3:十六分）
    let noteCycleCounter = 0;

    // --- 高速ベクター描画ヘルパー ---
    function drawStar(ctx, r) {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 2));
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawHeart(ctx, sz) {
      ctx.beginPath();
      const topCurveHeight = sz * 0.3;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, 0, -sz / 2, 0, -sz / 2, topCurveHeight);
      ctx.bezierCurveTo(-sz / 2, (sz + topCurveHeight) / 2, 0, sz, 0, sz);
      ctx.bezierCurveTo(0, sz, sz / 2, (sz + topCurveHeight) / 2, sz / 2, topCurveHeight);
      ctx.bezierCurveTo(sz / 2, 0, 0, 0, 0, topCurveHeight);
      ctx.closePath();
      ctx.fill();
    }

    function drawTriangle(ctx, sz) {
      ctx.beginPath();
      ctx.moveTo(0, -sz / 2);
      ctx.lineTo(sz / 2, sz / 2);
      ctx.lineTo(-sz / 2, sz / 2);
      ctx.closePath();
      ctx.fill();
    }

    // 4種類の音符を描画（角丸・超軽量処理）
    function drawMusicNote(ctx, sz, noteType) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(2, sz * 0.1);

      // 1. 符頭
      ctx.beginPath();
      ctx.ellipse(-sz * 0.2, sz * 0.2, sz * 0.25, sz * 0.18, -Math.PI / 6, 0, Math.PI * 2);
      
      if (noteType === 0) {
        // 二分音符：白抜き
        ctx.stroke();
      } else {
        // 四分・八分・十六分音符：黒塗り
        ctx.fill();
      }

      // 2. 符幹（棒）
      ctx.beginPath();
      ctx.moveTo(sz * 0.02, sz * 0.15);
      ctx.lineTo(sz * 0.02, -sz * 0.45);
      ctx.stroke();

      // 3. 符尾（旗）
      if (noteType === 2) {
        // 八分音符：旗1本
        ctx.beginPath();
        ctx.moveTo(sz * 0.02, -sz * 0.45);
        ctx.quadraticCurveTo(sz * 0.25, -sz * 0.25, sz * 0.2, -0.05);
        ctx.stroke();
      } else if (noteType === 3) {
        // 十六分音符：旗2本
        ctx.beginPath();
        ctx.moveTo(sz * 0.02, -sz * 0.45);
        ctx.quadraticCurveTo(sz * 0.25, -sz * 0.25, sz * 0.2, -0.05);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sz * 0.02, -sz * 0.3);
        ctx.quadraticCurveTo(sz * 0.25, -sz * 0.1, sz * 0.2, 0.1);
        ctx.stroke();
      }
    }

    // --- パーティクルクラス ---
    class Particle {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        const offset = Math.random() * 300 + 50;
        this.y = initial ? Math.random() * canvas.height : (state.direction === 'down' ? -offset : canvas.height + offset);
        this.color = state.currentColors[Math.floor(Math.random() * state.currentColors.length)];
        this.rotation = Math.random() * 360;
        this.driftDir = (Math.random() - 0.5) * 2;
        this.rotDir = (Math.random() - 0.5) * 2;
        this.oscillation = Math.random() * Math.PI * 2;
        this.oscillationSpeed = 0.02 + Math.random() * 0.03;
        this.isWaiting = false;

        // 音符の種類（0:二分, 1:四分, 2:八分, 3:十六分）を順番に割り当てる
        this.noteType = noteCycleCounter;
        noteCycleCounter = (noteCycleCounter + 1) % 4;
      }

      update() {
        if (this.isWaiting) return;

        const spd = state.speed * 0.6;
        if (state.direction === 'down') {
          this.y += spd;
          if (this.y > canvas.height + 100) {
            if (particles.filter(p => !p.isWaiting).length > state.targetCount) {
              this.isWaiting = true;
            } else {
              this.reset();
            }
          }
        } else {
          this.y -= spd;
          if (this.y < -100) {
            if (particles.filter(p => !p.isWaiting).length > state.targetCount) {
              this.isWaiting = true;
            } else {
              this.reset();
            }
          }
        }

        this.oscillation += this.oscillationSpeed;
        this.x += (Math.sin(this.oscillation) * state.wobble) + (this.driftDir * state.drift * 0.5);
        this.rotation += this.rotDir * state.rotateSpeed;

        if (this.x < -100) this.x = canvas.width + 100;
        if (this.x > canvas.width + 100) this.x = -100;
      }

      draw() {
        if (this.isWaiting) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        const sz = state.size;

        ctx.fillStyle = this.color;
        ctx.strokeStyle = this.color;

        switch (state.particleType) {
          case 'confetti_rect':
            ctx.fillRect(-sz/2, (-sz/2) * Math.cos(this.oscillation), sz, sz);
            break;

          case 'confetti_tri':
            drawTriangle(ctx, sz);
            break;

          case 'heart':
            ctx.translate(0, -sz/2);
            drawHeart(ctx, sz);
            break;

          case 'star':
            drawStar(ctx, sz / 2);
            break;

          case 'bubble':
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, sz/2, 0, Math.PI*2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fill();
            break;

          case 'note':
            drawMusicNote(ctx, sz, this.noteType);
            break;
        }
        ctx.restore();
      }
    }

    let particles = Array.from({ length: 150 }, () => new Particle());

    function updateBaseCount(newCount) {
      state.baseCount = newCount;
      state.targetCount = newCount;
      document.getElementById('valCount').innerText = newCount;
    }

    // --- スポットライト描画 ---
    let spotAngle = 0;
    function drawSpotlight() {
      if (!state.spotlight) return;
      spotAngle += state.spotlightSpeed;

      const isTop = state.spotlightPos === 'top';
      const originX = canvas.width / 2;
      const originY = isTop ? 0 : canvas.height;
      const targetY = isTop ? canvas.height : 0;

      const sweepWidth = canvas.width * 0.4;
      const targetX = canvas.width / 2 + Math.sin(spotAngle) * sweepWidth;

      const grad = ctx.createRadialGradient(
        originX, originY, 10,
        targetX, targetY, canvas.width * state.spotlightWidth
      );

      let hex = state.spotlightColor.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const r = parseInt(hex.substring(0, 2), 16) || 255;
      const g = parseInt(hex.substring(2, 4), 16) || 255;
      const b = parseInt(hex.substring(4, 6), 16) || 220;

      grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${state.spotlightAlpha})`);
      grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      const beamRadius = canvas.width * state.spotlightWidth;
      ctx.lineTo(targetX - beamRadius, targetY);
      ctx.lineTo(targetX + beamRadius, targetY);
      ctx.closePath();
      ctx.fill();
    }

    // --- アニメーションメインループ ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSpotlight();

      const activeParticles = particles.filter(p => !p.isWaiting);
      if (activeParticles.length < state.targetCount) {
        const waitingParticle = particles.find(p => p.isWaiting);
        if (waitingParticle) {
          waitingParticle.isWaiting = false;
          waitingParticle.reset();
        }
      }

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(loop);
    }
    loop();

    // --- UI・イベントコントロール ---
    function toggleSpotlight() {
      state.spotlight = !state.spotlight;
      const btn = document.getElementById('btnSpotlightToggle');
      if (state.spotlight) {
        btn.innerText = '💡 スポットライト ON';
        btn.classList.add('active');
      } else {
        btn.innerText = '💡 スポットライト OFF';
        btn.classList.remove('active');
      }
    }

    function updateSpotColor(colorHex) {
      state.spotlightColor = colorHex;
    }

    function togglePanel(id) {
      const target = document.getElementById(id);
      const isOpen = target.classList.contains('open');

      document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
      document.getElementById('btnFxPanel').classList.remove('active');
      document.getElementById('btnFeaturePanel').classList.remove('active');

      if (!isOpen) {
        target.classList.add('open');
        if (id === 'fxPanel') document.getElementById('btnFxPanel').classList.add('active');
        if (id === 'featurePanel') document.getElementById('btnFeaturePanel').classList.add('active');
      }
    }

    function setParticleType(type, btn) {
      state.particleType = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function setColorTheme(themeName, btn) {
      state.currentColors = colorThemes[themeName];
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      particles.forEach(p => {
        p.color = state.currentColors[Math.floor(Math.random() * state.currentColors.length)];
      });
    }

    function setCustomParticleColor(colorHex) {
      state.currentColors = [colorHex];
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
      particles.forEach(p => {
        p.color = colorHex;
      });
    }

    function setDirection(dir, btn) {
      state.direction = dir;
      document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function setSpotlightPos(pos, btn) {
      state.spotlightPos = pos;
      document.querySelectorAll('.spot-pos-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function changeBgColor(color) {
      document.body.style.backgroundColor = color;
    }

    function connectSync() {
      const room = document.getElementById('roomId').value;
      alert(`ルーム「${room}」に接続して現在の演出設定を同期しました。`);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
