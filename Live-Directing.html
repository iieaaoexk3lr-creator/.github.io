<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ペンライト・ライブ制御 UI</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
    }

    /* 発光・背景レイヤー */
    #lightScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ff0055;
      transition: background-color 0.15s ease;
      z-index: 1;
    }

    /* メイン操作パネル */
    .controls-panel {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: rgba(20, 20, 30, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      color: #fff;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* カラーパレット */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .color-btn {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }

    .color-btn:active {
      transform: scale(0.9);
    }

    .color-btn.active {
      border-color: #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    /* 操作ボタン類 */
    .button-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s ease;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* 下部ステータス & 同期バー */
    .sync-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: rgba(20, 20, 30, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
    }

    .sync-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
    }

    .sync-status.online {
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }

    .sync-status.offline {
      background: #ff4444;
      box-shadow: none;
    }

    .sync-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .action-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .sync-btn-highlight {
      background: #3b82f6;
    }

    /* UI非表示状態クラス */
    .ui-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translate(-50%, 10px) !important;
    }

    /* UI隠し中の復帰用ミニボタン */
    #restoreUiBtn {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 20;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      backdrop-filter: blur(8px);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #restoreUiBtn.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- 発光スクリーン -->
  <div id="lightScreen"></div>

  <!-- UI隠し中の復帰ボタン -->
  <button id="restoreUiBtn">👁️ UI表示</button>

  <!-- メイン操作パネル -->
  <div class="controls-panel" id="controlsPanel">
    <div class="panel-title">Color Select</div>
    <div class="color-grid">
      <button class="color-btn active" style="background: #ff0055;" data-color="#ff0055"></button>
      <button class="color-btn" style="background: #00e5ff;" data-color="#00e5ff"></button>
      <button class="color-btn" style="background: #00ff66;" data-color="#00ff66"></button>
      <button class="color-btn" style="background: #ffbb00;" data-color="#ffbb00"></button>
      <button class="color-btn" style="background: #aa00ff;" data-color="#aa00ff"></button>
    </div>

    <div class="button-group">
      <button class="btn" id="toggleUiBtn">🙈 UIを隠す</button>
      <button class="btn" id="fullscreenBtn">⛶ 全画面</button>
    </div>
  </div>

  <!-- 下部同期ステータスバー -->
  <div class="sync-bar" id="syncBar">
    <div class="sync-info">
      <span class="sync-status online" id="syncStatus"></span>
      <span class="sync-label" id="syncText">同期中</span>
    </div>

    <div style="display: flex; gap: 6px;">
      <button class="action-btn" id="syncToggleBtn">同期離脱</button>
      <button class="action-btn sync-btn-highlight" id="syncPushBtn">📡 一括同期</button>
    </div>
  </div>

  <script>
    // --- 1. Firebase 初期化設定 ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const directRef = db.ref('lightState');

    // --- 2. 状態管理変数 ---
    let state = {
      color: '#ff0055'
    };
    let isSyncEnabled = true;
    let isUiVisible = true;

    // DOM要素
    const lightScreen = document.getElementById('lightScreen');
    const controlsPanel = document.getElementById('controlsPanel');
    const syncBar = document.getElementById('syncBar');
    const syncStatus = document.getElementById('syncStatus');
    const syncText = document.getElementById('syncText');
    const syncToggleBtn = document.getElementById('syncToggleBtn');
    const toggleUiBtn = document.getElementById('toggleUiBtn');
    const restoreUiBtn = document.getElementById('restoreUiBtn');
    const syncPushBtn = document.getElementById('syncPushBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // --- 3. UI更新表示関数 ---
    function updateUI() {
      lightScreen.style.backgroundColor = state.color;
      
      // パレットの選択状態更新
      document.querySelectorAll('.color-btn').forEach(btn => {
        if (btn.dataset.color.toLowerCase() === state.color.toLowerCase()) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // --- 4. Firebase 同期処理 ---
    function startSync() {
      directRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data && isSyncEnabled) {
          state = data;
          updateUI();
        }
        syncStatus.className = "sync-status online";
        syncText.textContent = "同期中";
      });
    }

    function stopSync() {
      directRef.off(); // リアルタイム受信の停止
      syncStatus.className = "sync-status offline";
      syncText.textContent = "同期離脱中";
    }

    // 初期化時に同期開始
    startSync();

    // --- 5. イベントリスナー定義 ---

    // [カラー選択]
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        state.color = btn.dataset.color;
        updateUI();
      });
    });

    // [同期離脱 / 再開ボタン]
    syncToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isSyncEnabled = !isSyncEnabled;

      if (isSyncEnabled) {
        startSync();
        syncToggleBtn.textContent = "同期離脱";
        syncToggleBtn.style.background = "rgba(255, 255, 255, 0.15)";
      } else {
        stopSync();
        syncToggleBtn.textContent = "同期再開";
        syncToggleBtn.style.background = "#d32f2f";
      }
    });

    // [一括同期送信（親機・ステージ操作用）]
    syncPushBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      directRef.set(state);
    });

    // [UI非表示 切り替えロジック]
    function setUiVisibility(visible) {
      isUiVisible = visible;
      if (visible) {
        controlsPanel.classList.remove('ui-hidden');
        syncBar.classList.remove('ui-hidden');
        restoreUiBtn.classList.remove('visible');
      } else {
        controlsPanel.classList.add('ui-hidden');
        syncBar.classList.add('ui-hidden');
        restoreUiBtn.classList.add('visible');
      }
    }

    toggleUiBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setUiVisibility(false);
    });

    restoreUiBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setUiVisibility(true);
    });

    // 画面のダブルタップでUI復帰
    let lastTapTime = 0;
    document.body.addEventListener('click', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTapTime;
      
      if (tapLength < 300 && tapLength > 0) {
        setUiVisibility(!isUiVisible);
      }
      lastTapTime = currentTime;
    });

    // [全画面切替]
    fullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
  </script>
</body>
</html>
