<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Digital Live Directing - スマホ縦持ち版</title>
  
  <!-- Firebase SDK の読み込み -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    /* 演出キャンバス */
    #stageCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    /* スマホ片手操作（親指ゾーン）UI */
    .control-dock {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 16px);
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: rgba(18, 18, 28, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 12px 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .dock-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    /* 演出切り替え＆カラーポップアップ呼び出しボタン */
    .effect-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: #8e8e93;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .effect-btn.active {
      color: #ffffff;
    }

    .icon-badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: relative;
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .effect-btn.active .icon-badge {
      border-color: var(--theme-color, #ff007f);
      box-shadow: 0 0 12px var(--theme-color, #ff007f);
      background: rgba(255, 255, 255, 0.15);
    }

    .color-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--theme-color, #ff007f);
      border: 2px solid #12121c;
    }

    .btn-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    /* カラー選択ポップアップ */
    .color-picker-popover {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(25, 25, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    .color-picker-popover.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    .color-option {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .sync-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      color: #aaa;
    }

    .sync-status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffcc00;
      box-shadow: 0 0 6px #ffcc00;
    }

    .sync-status.online {
      background: #4cd964;
      box-shadow: 0 0 6px #4cd964;
    }
  </style>
</head>
<body>

  <canvas id="stageCanvas"></canvas>

  <!-- カラーポップアップ -->
  <div id="colorPickerPopover" class="color-picker-popover">
    <div class="color-option" style="background:#ff007f;" data-color="#ff007f"></div>
    <div class="color-option" style="background:#00f0ff;" data-color="#00f0ff"></div>
    <div class="color-option" style="background:#ffbd00;" data-color="#ffbd00"></div>
    <div class="color-option" style="background:#a000ff;" data-color="#a000ff"></div>
    <div class="color-option" style="background:#00ff66;" data-color="#00ff66"></div>
    <div class="color-option" style="background:#ffffff;" data-color="#ffffff"></div>
  </div>

  <!-- 下部操作ドック -->
  <div class="control-dock">
    <div class="dock-row">
      <button class="effect-btn active" id="btn-spotlight" data-target="spotlight">
        <div class="icon-badge">🔦<span class="color-dot" id="dot-spotlight"></span></div>
        <span class="btn-label">スポット</span>
      </button>
      <button class="effect-btn active" id="btn-heart" data-target="heart">
        <div class="icon-badge">💖<span class="color-dot" id="dot-heart"></span></div>
        <span class="btn-label">ハート</span>
      </button>
      <button class="effect-btn active" id="btn-note" data-target="note">
        <div class="icon-badge">🎵<span class="color-dot" id="dot-note"></span></div>
        <span class="btn-label">音符</span>
      </button>
      <button class="effect-btn" id="btn-star" data-target="star">
        <div class="icon-badge">⭐<span class="color-dot" id="dot-star"></span></div>
        <span class="btn-label">星</span>
      </button>
    </div>

    <div class="sync-bar">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="sync-status" id="syncStatus"></span>
        <span id="syncText">Firebase接続中...</span>
      </div>
      <span style="font-size: 10px; opacity: 0.6;">タップで色選択</span>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Firebase 初期化＆設定
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
      authDomain: "gamehistory-m84.firebaseapp.com",
      databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
      projectId: "gamehistory-m84",
      storageBucket: "gamehistory-m84.firebasestorage.app",
      messagingSenderId: "475761727837",
      appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
      measurementId: "G-3636W6LC4F"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    // 「Live-Directing」という名前のノードで同期管理
    const directRef = db.ref('Live-Directing');

    // --- ローカル状態管理 ---
    let state = {
      spotlight: { active: true, color: '#ff007f' },
      heart: { active: true, color: '#ff007f' },
      note: { active: true, color: '#00f0ff' },
      star: { active: false, color: '#ffbd00' }
    };

    // Firebaseからのリアルタイム変更検知
    directRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        state = data;
        updateUI();
      }
      document.getElementById('syncStatus').classList.add('online');
      document.getElementById('syncText').textContent = "Live-Directing: クラウド同期中";
    });

    // 変更があったときにFirebaseへ書き込み
    function pushStateToFirebase() {
      directRef.set(state);
    }

    // ==========================================
    // 2. 演出描画ロジック（Canvas）
    // ==========================================
    const canvas = document.getElementById('stageCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];

    class Particle {
      constructor(type, x, y, customColor) {
        this.type = type;
        this.x = x || Math.random() * w;
        this.y = y || h + 30;
        this.color = customColor || state[type].color;
        this.size = Math.random() * 24 + 20;
        this.vy = -(Math.random() * 2 + 1.5);
        this.vx = (Math.random() - 0.5) * 1.2;
        this.alpha = 1;
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.03;
      }

      update() {
        this.y += this.vy;
        this.x += Math.sin(this.y * 0.01) * 0.8 + this.vx;
        this.rotation += this.vRot;
        if (this.y < h * 0.2) this.alpha -= 0.01;
      }

      draw(ctx) {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 12;

        if (this.type === 'heart') {
          ctx.beginPath();
          const s = this.size * 0.5;
          ctx.moveTo(0, -s * 0.3);
          ctx.bezierCurveTo(-s, -s, -s, s * 0.5, 0, s);
          ctx.bezierCurveTo(s, s * 0.5, s, -s, 0, -s * 0.3);
          ctx.fill();
        } else if (this.type === 'note') {
          ctx.font = `${this.size * 1.2}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🎵', 0, 0);
        } else if (this.type === 'star') {
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.size, -Math.sin((18 + i * 72) * Math.PI / 180) * this.size);
            ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.size / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (this.size / 2));
          }
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
    }

    let lightAngle = 0;
    function drawSpotlights() {
      if (!state.spotlight.active) return;
      lightAngle += 0.015;
      const swing1 = Math.sin(lightAngle) * 0.25;
      const swing2 = Math.cos(lightAngle * 0.8) * 0.25;

      const beams = [
        { x: w * 0.2, angle: -0.15 + swing1 },
        { x: w * 0.5, angle: swing2 },
        { x: w * 0.8, angle: 0.15 - swing1 }
      ];

      beams.forEach(b => {
        ctx.save();
        ctx.translate(b.x, h);
        ctx.rotate(b.angle);

        const grad = ctx.createLinearGradient(0, 0, 0, -h * 1.1);
        grad.addColorStop(0, state.spotlight.color);
        grad.addColorStop(0.2, state.spotlight.color);
        grad.addColorStop(1, 'transparent');

        ctx.fillStyle = grad;
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = 0.35;

        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(-w * 0.35, -h * 1.1);
        ctx.lineTo(w * 0.35, -h * 1.1);
        ctx.lineTo(15, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
    }

    let lastSpawn = 0;
    function animate(time) {
      ctx.clearRect(0, 0, w, h);
      drawSpotlights();

      if (time - lastSpawn > 300) {
        ['heart', 'note', 'star'].forEach(type => {
          if (state[type] && state[type].active) {
            particles.push(new Particle(type));
          }
        });
        lastSpawn = time;
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.alpha <= 0 || p.y < -50) particles.splice(i, 1);
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // タップ時バースト
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.control-dock') || e.target.closest('.color-picker-popover')) return;
      ['heart', 'note', 'star'].forEach(type => {
        if (state[type] && state[type].active) {
          for (let i = 0; i < 3; i++) {
            const p = new Particle(type, e.clientX + (Math.random() - 0.5) * 40, e.clientY + (Math.random() - 0.5) * 40);
            p.vy = (Math.random() - 0.5) * 4;
            particles.push(p);
          }
        }
      });
    });

    // ==========================================
    // 3. UIとインタラクション
    // ==========================================
    let currentTargetForColor = null;
    const popover = document.getElementById('colorPickerPopover');

    function updateUI() {
      Object.keys(state).forEach(key => {
        const btn = document.getElementById(`btn-${key}`);
        const dot = document.getElementById(`dot-${key}`);
        if (btn && dot && state[key]) {
          btn.classList.toggle('active', state[key].active);
          btn.style.setProperty('--theme-color', state[key].color);
          dot.style.setProperty('--theme-color', state[key].color);
        }
      });
    }

    document.querySelectorAll('.effect-btn').forEach(btn => {
      const target = btn.dataset.target;

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentTargetForColor === target && popover.classList.contains('show')) {
          popover.classList.remove('show');
          currentTargetForColor = null;
          return;
        }

        // 状態変更 ＆ Firebaseへ即時送信
        state[target].active = !state[target].active;
        
        const rect = btn.getBoundingClientRect();
        popover.style.left = `${rect.left + rect.width / 2}px`;
        popover.classList.add('show');
        currentTargetForColor = target;

        updateUI();
        pushStateToFirebase();
      });
    });

    document.querySelectorAll('.color-option').forEach(opt => {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        const chosenColor = opt.dataset.color;
        if (currentTargetForColor && state[currentTargetForColor]) {
          state[currentTargetForColor].color = chosenColor;
          updateUI();
          pushStateToFirebase();
        }
        popover.classList.remove('show');
        currentTargetForColor = null;
      });
    });

    document.addEventListener('click', () => {
      popover.classList.remove('show');
      currentTargetForColor = null;
    });
  </script>
</body>
</html>
