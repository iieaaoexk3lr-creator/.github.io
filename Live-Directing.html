<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ステージ演出 ＆ コントローラー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      transition: background-color 0.3s;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* 横長＆スマホ対応メイン操作バー */
    .control-bar {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 92%;
      max-width: 680px;
      background: rgba(20, 20, 35, 0.9);
      padding: 12px 16px;
      border-radius: 30px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 100; /* 最前面パネル(1000)の下、キャンバスの上 */
    }

    button {
      background: #2a2a40;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: all 0.2s;
      flex: 1;
      margin: 0 4px;
      text-align: center;
      white-space: nowrap;
    }
    button:hover { background: #3b3b5c; }
    button.active { background: #6200ee; border-color: #bb86fc; }

    /* 最前面に表示される設定パネル */
    .panel {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(25, 25, 45, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 1000; /* 奥に隠れないよう最前面に指定 */
      max-height: 70vh;
      overflow-y: auto;
    }
    .panel.open { display: flex; }

    .panel-title {
      font-size: 13px;
      color: #03dac6;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 4px;
      margin-top: 4px;
      font-weight: bold;
    }

    .grid-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-btns button { margin: 0; }
    .grid-btns button.selected {
      background: #03dac6;
      color: #000;
    }

    .color-btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .color-btns button {
      padding: 8px 2px;
      font-size: 11px;
      margin: 0;
    }
    .color-btns button.selected {
      border: 2px solid #03dac6;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      color: #ccc;
    }
    input[type="range"] { width: 100%; cursor: pointer; }
    input[type="text"], input[type="color"] {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
    }
    input[type="color"] {
      height: 36px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="stage"></canvas>

  <!-- 横長・位置調整済みのメイン操作バー -->
  <div class="control-bar">
    <button id="btnSpotlight" onclick="toggleSpotlight()">💡 スポットライト</button>
    <button id="btnFxPanel" onclick="togglePanel('fxPanel')">🎉 演出設定</button>
    <button id="btnFeaturePanel" onclick="togglePanel('featurePanel')">⚙️ 機能 / 同期</button>
  </div>

  <!-- 1. 演出パネル (最前面 z-index:1000) -->
  <div id="fxPanel" class="panel">
    <div class="panel-title">1. パーティクル種類</div>
    <div class="grid-btns">
      <button class="type-btn selected" onclick="setParticleType('confetti', this)">🎉 紙吹雪 (角・角削)</button>
      <button class="type-btn" onclick="setParticleType('heart', this)">💖 ハート</button>
      <button class="type-btn" onclick="setParticleType('star', this)">★ 星</button>
      <button class="type-btn" onclick="setParticleType('bubble', this)">🫧 泡</button>
    </div>

    <div class="panel-title">2. カラーテーマ</div>
    <div class="color-btns">
      <button class="color-btn selected" onclick="setColorTheme('vivid', this)">🌈 ビビッド</button>
      <button class="color-btn" onclick="setColorTheme('pastel', this)">🍬 パステル</button>
      <button class="color-btn" onclick="setColorTheme('gold', this)">✨ ゴールド</button>
      <button class="color-btn" onclick="setColorTheme('pink', this)">💖 ピンク</button>
    </div>

    <div class="panel-title">3. 移動方向</div>
    <div class="grid-btns">
      <button class="dir-btn selected" onclick="setDirection('down', this)">⬇️ 落下</button>
      <button class="dir-btn" onclick="setDirection('up', this)">⬆️ 上昇</button>
    </div>

    <div class="panel-title">4. パラメータ詳細調整</div>
    <div class="control-group">
      <label>表示数 (個数): <span id="valCount">100</span></label>
      <input type="range" min="10" max="300" value="100" oninput="updateCount(+this.value)">
    </div>
    <div class="control-group">
      <label>移動速度: <span id="valSpeed">5</span></label>
      <input type="range" min="1" max="15" value="5" oninput="state.speed = +this.value; document.getElementById('valSpeed').innerText=this.value;">
    </div>
    <div class="control-group">
      <label>サイズ (特大対応): <span id="valSize">20</span>px</label>
      <input type="range" min="8" max="100" value="20" oninput="state.size = +this.value; document.getElementById('valSize').innerText=this.value;">
    </div>
    <div class="control-group">
      <label>横揺れ幅: <span id="valWobble">1.5</span></label>
      <input type="range" min="0" max="5" step="0.1" value="1.5" oninput="state.wobble = +this.value; document.getElementById('valWobble').innerText=this.value;">
    </div>
  </div>

  <!-- 2. 機能・環境・スポットライト詳細パネル -->
  <div id="featurePanel" class="panel">
    <div class="panel-title">💡 スポットライト設定</div>
    <div class="grid-btns">
      <button class="spot-pos-btn selected" onclick="setSpotlightPos('top', this)">⬆️ 上から照らす</button>
      <button class="spot-pos-btn" onclick="setSpotlightPos('bottom', this)">⬇️ 下から照らす</button>
    </div>
    <div class="control-group">
      <label>ライト色</label>
      <input type="color" id="spotColor" value="#ffffdd" onchange="state.spotlightColor = this.value">
    </div>
    <div class="control-group">
      <label>光の幅 (照射角度)</label>
      <input type="range" min="0.1" max="0.8" step="0.05" value="0.3" oninput="state.spotlightWidth = +this.value">
    </div>
    <div class="control-group">
      <label>首振り速度</label>
      <input type="range" min="1" max="10" value="3" oninput="state.spotlightSpeed = this.value * 0.005">
    </div>

    <div class="panel-title">🎨 ステージ背景設定</div>
    <div class="control-group">
      <label>背景カラー</label>
      <input type="color" id="bgColor" value="#0d0d1a" onchange="changeBgColor(this.value)">
    </div>

    <div class="panel-title">🔗 リアルタイム同期</div>
    <div class="control-group">
      <label>ルームID</label>
      <input type="text" id="roomId" value="STAGE_ROOM_01">
    </div>
    <button onclick="connectSync()">接続して設定を同期</button>

    <div class="panel-title">📺 画面モード</div>
    <button onclick="toggleFullscreen()">全画面表示切り替え</button>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // カラーパレット定義
    const colorThemes = {
      vivid: ['#f44336', '#e91e63', '#9c27b0', '#2196f3', '#4caf50', '#ffeb3b', '#ff9800'],
      pastel: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8baff'],
      gold: ['#ffd700', '#ffae00', '#fff8dc', '#daa520', '#b8860b'],
      pink: ['#ffb7c5', '#ffc0cb', '#ff69b4', '#ff1493', '#ffffff']
    };

    // システム状態パラメータ
    const state = {
      spotlight: false,
      spotlightPos: 'top', // 'top' | 'bottom'
      spotlightColor: '#ffffdd',
      spotlightSpeed: 0.015,
      spotlightWidth: 0.3,
      particleType: 'confetti',
      direction: 'down',
      speed: 5,
      size: 20,
      wobble: 1.5,
      count: 100,
      currentColors: colorThemes.vivid
    };

    // --- 描画ヘルパー関数 (図形) ---
    // 1. シンプルな星 (★)
    function drawStar(ctx, r) {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 2));
      }
      ctx.closePath();
      ctx.fill();
    }

    // 2. ハート (💖)
    function drawHeart(ctx, sz) {
      ctx.beginPath();
      const topCurveHeight = sz * 0.3;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, 0, -sz / 2, 0, -sz / 2, topCurveHeight);
      ctx.bezierCurveTo(-sz / 2, (sz + topCurveHeight) / 2, 0, sz, 0, sz);
      ctx.bezierCurveTo(0, sz, sz / 2, (sz + topCurveHeight) / 2, sz / 2, topCurveHeight);
      ctx.bezierCurveTo(sz / 2, 0, 0, 0, 0, topCurveHeight);
      ctx.closePath();
      ctx.fill();
    }

    // 3. 三角形
    function drawTriangle(ctx, sz) {
      ctx.beginPath();
      ctx.moveTo(0, -sz / 2);
      ctx.lineTo(sz / 2, sz / 2);
      ctx.lineTo(-sz / 2, sz / 2);
      ctx.closePath();
      ctx.fill();
    }

    // --- パーティクルクラス ---
    class Particle {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : (state.direction === 'down' ? -30 : canvas.height + 30);
        this.color = state.currentColors[Math.floor(Math.random() * state.currentColors.length)];
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 4;
        this.oscillation = Math.random() * Math.PI * 2;
        this.oscillationSpeed = 0.02 + Math.random() * 0.03;
        // 紙吹雪用の四角 / 三角フラグ
        this.shape = Math.random() > 0.5 ? 'rect' : 'triangle';
      }

      update() {
        const spd = state.speed * 0.6;
        if (state.direction === 'down') {
          this.y += spd;
          if (this.y > canvas.height + 40) this.reset();
        } else {
          this.y -= spd;
          if (this.y < -40) this.reset();
        }
        this.oscillation += this.oscillationSpeed;
        this.x += Math.sin(this.oscillation) * state.wobble;
        this.rotation += this.rotationSpeed;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        const sz = state.size;

        ctx.fillStyle = this.color;
        ctx.strokeStyle = this.color;

        switch (state.particleType) {
          case 'confetti':
            if (this.shape === 'rect') {
              ctx.fillRect(-sz/2, (-sz/2) * Math.cos(this.oscillation), sz, sz);
            } else {
              drawTriangle(ctx, sz);
            }
            break;

          case 'heart':
            ctx.translate(0, -sz/2);
            drawHeart(ctx, sz);
            break;

          case 'star':
            drawStar(ctx, sz / 2);
            break;

          case 'bubble':
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, sz/2, 0, Math.PI*2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fill();
            break;
        }
        ctx.restore();
      }
    }

    let particles = Array.from({ length: state.count }, () => new Particle());

    function updateCount(newCount) {
      state.count = newCount;
      document.getElementById('valCount').innerText = newCount;
      while (particles.length < newCount) particles.push(new Particle());
      while (particles.length > newCount) particles.pop();
    }

    // --- スポットライト描画 (発光点固定・首振りアニメーション) ---
    let spotAngle = 0;
    function drawSpotlight() {
      if (!state.spotlight) return;
      spotAngle += state.spotlightSpeed;

      const isTop = state.spotlightPos === 'top';
      const originX = canvas.width / 2; // 中央固定
      const originY = isTop ? 0 : canvas.height;
      const targetY = isTop ? canvas.height : 0;

      // ライトの向き(角度)をゆらゆら動かす
      const sweepWidth = canvas.width * 0.4;
      const targetX = canvas.width / 2 + Math.sin(spotAngle) * sweepWidth;

      const grad = ctx.createRadialGradient(
        originX, originY, 10,
        targetX, targetY, canvas.width * state.spotlightWidth
      );

      // hexカラーをrgbaに変換してグラデーション作成
      const hex = state.spotlightColor;
      const r = parseInt(hex.slice(1,3), 16) || 255;
      const g = parseInt(hex.slice(3,5), 16) || 255;
      const b = parseInt(hex.slice(5,7), 16) || 220;

      grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.6)`);
      grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      const beamRadius = canvas.width * state.spotlightWidth;
      ctx.lineTo(targetX - beamRadius, targetY);
      ctx.lineTo(targetX + beamRadius, targetY);
      ctx.closePath();
      ctx.fill();
    }

    // --- アニメーションメインループ ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSpotlight();

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(loop);
    }
    loop();

    // --- UI・イベントコントロール ---
    function toggleSpotlight() {
      state.spotlight = !state.spotlight;
      document.getElementById('btnSpotlight').classList.toggle('active', state.spotlight);
    }

    function togglePanel(id) {
      const target = document.getElementById(id);
      const isOpen = target.classList.contains('open');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
      if (!isOpen) target.classList.add('open');
    }

    function setParticleType(type, btn) {
      state.particleType = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function setColorTheme(themeName, btn) {
      state.currentColors = colorThemes[themeName];
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      particles.forEach(p => {
        p.color = state.currentColors[Math.floor(Math.random() * state.currentColors.length)];
      });
    }

    function setDirection(dir, btn) {
      state.direction = dir;
      document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function setSpotlightPos(pos, btn) {
      state.spotlightPos = pos;
      document.querySelectorAll('.spot-pos-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function changeBgColor(color) {
      document.body.style.backgroundColor = color;
    }

    function connectSync() {
      const room = document.getElementById('roomId').value;
      alert(`ルーム「${room}」に接続して現在の演出設定を同期しました。`);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
