<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ステージ演出 ＆ コントローラー（フル機能版）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      transition: background-color 0.3s;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* メイン操作バー (画面下部常時表示) */
    .control-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(20, 20, 35, 0.85);
      padding: 10px 18px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 100;
    }

    button {
      background: #2a2a40;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover { background: #3b3b5c; }
    button.active { background: #6200ee; border-color: #bb86fc; }

    /* 設定パネル */
    .panel {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(25, 25, 45, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 18px;
      width: 360px;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 99;
      max-height: 75vh;
      overflow-y: auto;
    }
    .panel.open { display: flex; }

    .panel-title {
      font-size: 13px;
      color: #03dac6;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
      margin-top: 6px;
      font-weight: bold;
    }

    .grid-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-btns button.selected {
      background: #03dac6;
      color: #000;
    }

    .color-btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .color-btns button {
      padding: 6px 4px;
      font-size: 11px;
    }
    .color-btns button.selected {
      border: 2px solid #03dac6;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      color: #ccc;
    }
    input[type="range"] { width: 100%; }
    input[type="text"], input[type="color"] {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
    }
    input[type="color"] {
      height: 36px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="stage"></canvas>

  <!-- 常時表示するメインツールバー -->
  <div class="control-bar">
    <button id="btnSpotlight" onclick="toggleSpotlight()">💡 スポットライト</button>
    <button id="btnFxPanel" onclick="togglePanel('fxPanel')">🎉 演出設定</button>
    <button id="btnFeaturePanel" onclick="togglePanel('featurePanel')">⚙️ 機能 / 同期</button>
  </div>

  <!-- 1. 演出パネル (パーティクル・色・アニメーション制御) -->
  <div id="fxPanel" class="panel">
    <div class="panel-title">1. パーティクル種類</div>
    <div class="grid-btns">
      <button class="type-btn selected" onclick="setParticleType('confetti', this)">🎉 紙吹雪</button>
      <button class="type-btn" onclick="setParticleType('sakura', this)">🌸 桜</button>
      <button class="type-btn" onclick="setParticleType('bubble', this)">🫧 泡</button>
      <button class="type-btn" onclick="setParticleType('star', this)">✨ 星</button>
    </div>

    <div class="panel-title">2. カラーテーマ</div>
    <div class="color-btns">
      <button class="color-btn selected" onclick="setColorTheme('vivid', this)">🌈 ビビッド</button>
      <button class="color-btn" onclick="setColorTheme('pastel', this)">🍬 パステル</button>
      <button class="color-btn" onclick="setColorTheme('gold', this)">✨ ゴールド</button>
      <button class="color-btn" onclick="setColorTheme('sakura', this)">🌸 さくら</button>
    </div>

    <div class="panel-title">3. 移動方向</div>
    <div class="grid-btns">
      <button class="dir-btn selected" onclick="setDirection('down', this)">⬇️ 落下</button>
      <button class="dir-btn" onclick="setDirection('up', this)">⬆️ 上昇</button>
    </div>

    <div class="panel-title">4. パラメータ詳細調整</div>
    <div class="control-group">
      <label>表示数 (個数): <span id="valCount">100</span></label>
      <input type="range" min="10" max="300" value="100" oninput="updateCount(+this.value)">
    </div>
    <div class="control-group">
      <label>移動速度: <span id="valSpeed">5</span></label>
      <input type="range" min="1" max="15" value="5" oninput="state.speed = +this.value; document.getElementById('valSpeed').innerText=this.value;">
    </div>
    <div class="control-group">
      <label>サイズ: <span id="valSize">12</span></label>
      <input type="range" min="4" max="40" value="12" oninput="state.size = +this.value; document.getElementById('valSize').innerText=this.value;">
    </div>
    <div class="control-group">
      <label>横揺れ幅: <span id="valWobble">1.5</span></label>
      <input type="range" min="0" max="5" step="0.1" value="1.5" oninput="state.wobble = +this.value; document.getElementById('valWobble').innerText=this.value;">
    </div>
  </div>

  <!-- 2. 機能・同期・環境パネル -->
  <div id="featurePanel" class="panel">
    <div class="panel-title">💡 スポットライト設定</div>
    <div class="control-group">
      <label>首振り速度</label>
      <input type="range" min="1" max="10" value="2" oninput="state.spotlightSpeed = this.value * 0.005">
    </div>
    <div class="control-group">
      <label>光の幅</label>
      <input type="range" min="0.1" max="0.6" step="0.05" value="0.3" oninput="state.spotlightWidth = +this.value">
    </div>

    <div class="panel-title">🎨 ステージ背景設定</div>
    <div class="control-group">
      <label>背景カラー</label>
      <input type="color" id="bgColor" value="#0d0d1a" onchange="changeBgColor(this.value)">
    </div>

    <div class="panel-title">🔗 リアルタイム同期</div>
    <div class="control-group">
      <label>ルームID</label>
      <input type="text" id="roomId" value="STAGE_ROOM_01">
    </div>
    <button onclick="connectSync()">接続して設定を同期</button>

    <div class="panel-title">📺 画面モード</div>
    <button onclick="toggleFullscreen()">全画面表示切り替え</button>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // カラーパレット定義
    const colorThemes = {
      vivid: ['#f44336', '#e91e63', '#9c27b0', '#2196f3', '#4caf50', '#ffeb3b', '#ff9800'],
      pastel: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8baff'],
      gold: ['#ffd700', '#ffae00', '#fff8dc', '#daa520', '#b8860b'],
      sakura: ['#ffb7c5', '#ffc0cb', '#e8a2af', '#ff69b4', '#ffffff']
    };

    // システム状態パラメータ（全機能統合）
    const state = {
      spotlight: false,
      spotlightSpeed: 0.01,
      spotlightWidth: 0.3,
      particleType: 'confetti',
      direction: 'down',
      speed: 5,
      size: 12,
      wobble: 1.5,
      count: 100,
      currentColors: colorThemes.vivid
    };

    // --- パーティクルクラス ---
    class Particle {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : (state.direction === 'down' ? -20 : canvas.height + 20);
        this.color = state.currentColors[Math.floor(Math.random() * state.currentColors.length)];
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 4;
        this.oscillation = Math.random() * Math.PI * 2;
        this.oscillationSpeed = 0.02 + Math.random() * 0.03;
      }

      update() {
        const spd = state.speed * 0.6;
        if (state.direction === 'down') {
          this.y += spd;
          if (this.y > canvas.height + 20) this.reset();
        } else {
          this.y -= spd;
          if (this.y < -20) this.reset();
        }
        this.oscillation += this.oscillationSpeed;
        this.x += Math.sin(this.oscillation) * state.wobble;
        this.rotation += this.rotationSpeed;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        const sz = state.size;

        switch (state.particleType) {
          case 'confetti':
            ctx.fillStyle = this.color;
            ctx.fillRect(-sz/2, (-sz/2) * Math.cos(this.oscillation), sz, sz);
            break;

          case 'sakura':
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, sz/2, sz/4, Math.PI/4, 0, Math.PI*2);
            ctx.fill();
            break;

          case 'bubble':
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, sz/2, 0, Math.PI*2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.fill();
            break;

          case 'star':
            ctx.font = `${sz * 1.5}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✨', 0, 0);
            break;
        }
        ctx.restore();
      }
    }

    let particles = Array.from({ length: state.count }, () => new Particle());

    function updateCount(newCount) {
      state.count = newCount;
      document.getElementById('valCount').innerText = newCount;
      while (particles.length < newCount) particles.push(new Particle());
      while (particles.length > newCount) particles.pop();
    }

    // --- スポットライト描画 ---
    let spotAngle = 0;
    function drawSpotlight() {
      if (!state.spotlight) return;
      spotAngle += state.spotlightSpeed;
      const x = canvas.width / 2 + Math.sin(spotAngle) * (canvas.width * 0.25);
      
      const grad = ctx.createRadialGradient(x, 0, 10, x, canvas.height, canvas.width * state.spotlightWidth);
      grad.addColorStop(0, 'rgba(255, 255, 220, 0.4)');
      grad.addColorStop(1, 'rgba(255, 255, 220, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(x - 150, canvas.height);
      ctx.lineTo(x + 150, canvas.height);
      ctx.closePath();
      ctx.fill();
    }

    // --- アニメーションメインループ ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSpotlight();

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(loop);
    }
    loop();

    // --- UI・イベントコントロール ---
    function toggleSpotlight() {
      state.spotlight = !state.spotlight;
      document.getElementById('btnSpotlight').classList.toggle('active', state.spotlight);
    }

    function togglePanel(id) {
      const target = document.getElementById(id);
      const isOpen = target.classList.contains('open');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
      if (!isOpen) target.classList.add('open');
    }

    function setParticleType(type, btn) {
      state.particleType = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function setColorTheme(themeName, btn) {
      state.currentColors = colorThemes[themeName];
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      particles.forEach(p => {
        p.color = state.currentColors[Math.floor(Math.random() * state.currentColors.length)];
      });
    }

    function setDirection(dir, btn) {
      state.direction = dir;
      document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function changeBgColor(color) {
      document.body.style.backgroundColor = color;
    }

    function connectSync() {
      const room = document.getElementById('roomId').value;
      alert(`ルーム「${room}」に現在の設定情報を同期しました。`);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
