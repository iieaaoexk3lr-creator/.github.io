<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超連打★フェスティバル</title>
    <style>
        :root {
            --primary: #ff007f;
            --secondary: #00f0ff;
            --bg-grad: linear-gradient(135deg, #11001c, #22003b);
            --panel-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: var(--bg-grad);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
        }

        /* メイン表示エリア */
        .game-header {
            text-align: center;
            margin-top: 20px;
        }

        h1 {
            font-size: 2rem;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            margin-bottom: 10px;
            color: #fff;
        }

        .timer-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--secondary);
            text-shadow: 0 0 8px var(--secondary);
        }

        .main-display {
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .counter {
            font-size: 4rem;
            font-weight: 900;
            text-shadow: 0 0 15px #fff;
            transition: transform 0.05s ease;
        }

        .cheer-msg {
            font-size: 1.5rem;
            color: #ffeb3b;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,235,59,0.8);
            min-height: 2rem;
            transform: scale(0);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cheer-msg.pop {
            transform: scale(1);
        }

        /* 連打ボタン */
        .tap-zone {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, var(--primary), #b0005d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 0 30px var(--primary), inset 0 0 15px rgba(255,255,255,0.5);
            cursor: pointer;
            transition: transform 0.05s ease;
            border: 4px solid #fff;
        }

        .tap-zone:active {
            transform: scale(0.92);
            background: radial-gradient(circle, #ff3399, var(--primary));
        }

        .tap-zone.disabled {
            background: #444;
            box-shadow: none;
            border-color: #666;
            cursor: not-allowed;
            transform: none !important;
        }

        /* リザルトモーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(135deg, #2b004a, #4a0044);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--secondary);
            box-shadow: 0 0 25px var(--secondary);
            max-width: 90%;
            width: 320px;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal h2 {
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .result-item {
            margin: 15px 0;
            font-size: 1.2rem;
        }
        .result-val {
            font-size: 2rem;
            font-weight: bold;
            color: #ffeb3b;
            display: block;
        }

        .btn-restart {
            margin-top: 15px;
            padding: 10px 25px;
            background: var(--secondary);
            border: none;
            border-radius: 25px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 10px var(--secondary);
        }

        /* 管理パネル */
        .admin-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.2);
            width: 100%;
            max-width: 500px;
            border-radius: 15px 15px 0 0;
            padding: 15px 20px;
            margin-top: 20px;
        }

        .panel-title {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }

        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.8rem;
            color: #ddd;
        }

        select, input[type="text"] {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        /* スイッチの装飾 */
        .switch-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .switch-label input {
            display: none;
        }

        .toggle-btn {
            width: 40px;
            height: 20px;
            background: #555;
            border-radius: 10px;
            position: relative;
            transition: 0.3s;
        }

        .toggle-btn::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }

        input:checked + .toggle-btn {
            background: var(--secondary);
        }

        input:checked + .toggle-btn::after {
            left: 22px;
        }

        /* パーティクル（紙吹雪用） */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: fly 0.6s ease-out forwards;
        }

        @keyframes fly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(0.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-header">
        <h1>超連打★FESTIVAL</h1>
        <div class="timer-display" id="timerDisplay">TIME: --.-s</div>
    </div>

    <div class="main-display">
        <div class="counter" id="counter">READY</div>
        <div class="cheer-msg" id="cheerMsg"></div>
    </div>

    <div class="tap-zone" id="tapBtn">TAP!</div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>FINISH!!</h2>
            <div class="result-item">連打総数<span class="result-val" id="resTotal">0回</span></div>
            <div class="result-item">秒間平均 (CPS)<span class="result-val" id="resCps">0.00</span></div>
            <button class="btn-restart" id="restartBtn">もう一回遊ぶ</button>
        </div>
    </div>

    <div class="admin-panel">
        <div class="panel-title">🛠️ GAME CONFIG (管理パネル)</div>
        <div class="control-group">
            <div class="control-item">
                <label>制限時間</label>
                <select id="timeSetting">
                    <option value="5">5秒</option>
                    <option value="10" selected>10秒</option>
                    <option value="20">20秒</option>
                    <option value="30">30秒</option>
                </select>
            </div>
            <div class="control-item" style="justify-content: flex-end;">
                <label class="switch-label">
                    <span>打数をリアルタイム表示</span>
                    <input type="checkbox" id="showCountSetting" checked>
                    <div class="toggle-btn"></div>
                </label>
            </div>
        </div>
        <div class="control-group" style="grid-template-columns: 1fr;">
            <label class="switch-label">
                <span>面白応援メッセージを表示する</span>
                <input type="checkbox" id="showCheerSetting" checked>
                <div class="toggle-btn"></div>
            </label>
        </div>
    </div>

    <script>
        // ゲーム状態変数
        let count = 0;
        let isPlaying = false;
        let isEnded = false;
        let timeLimit = 10;
        let timeLeft = 10;
        let timerId = null;

        // DOM要素
        const tapBtn = document.getElementById('tapBtn');
        const counter = document.getElementById('counter');
        const timerDisplay = document.getElementById('timerDisplay');
        const cheerMsg = document.getElementById('cheerMsg');
        const resultModal = document.getElementById('resultModal');
        const resTotal = document.getElementById('resTotal');
        const resCps = document.getElementById('resCps');
        const restartBtn = document.getElementById('restartBtn');

        // 設定要素
        const timeSetting = document.getElementById('timeSetting');
        const showCountSetting = document.getElementById('showCountSetting');
        const showCheerSetting = document.getElementById('showCheerSetting');

        // 応援メッセージの定義 (連打数ごとの閾値とテキスト)
        const cheerThresholds = [
            { score: 5, text: "お、始まったね！👍" },
            { score: 15, text: "その調子！加速していこう！🚀" },
            { score: 30, text: "いいぞ！指がノってきた！🔥" },
            { score: 50, text: "速い速い！画面が震えてる！⚡" },
            { score: 75, text: "神速！残像が見えるぞ…！✨" },
            { score: 100, text: "限界突破！指壊れるーー！！😱" },
            { score: 130, text: "もう誰もあなたを止められない…🤖" }
        ];

        // 初期化
        function initGame() {
            count = 0;
            isPlaying = false;
            isEnded = false;
            timeLimit = parseFloat(timeSetting.value);
            timeLeft = timeLimit;
            
            tapBtn.classList.remove('disabled');
            tapBtn.textContent = "TAP!";
            counter.textContent = "READY";
            timerDisplay.textContent = `TIME: ${timeLeft.toFixed(1)}s`;
            cheerMsg.textContent = "";
            cheerMsg.classList.remove('pop');
            resultModal.style.display = 'none';
        }

        // ゲーム開始
        function startGame() {
            isPlaying = true;
            let startTime = performance.now();
            
            timerId = setInterval(() => {
                let elapsedTime = (performance.now() - startTime) / 1000;
                timeLeft = timeLimit - elapsedTime;

                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endGame();
                }
                timerDisplay.textContent = `TIME: ${timeLeft.toFixed(1)}s`;
            }, 50);
        }

        // ゲーム終了
        function endGame() {
            isPlaying = false;
            isEnded = true;
            clearInterval(timerId);
            tapBtn.classList.add('disabled');
            tapBtn.textContent = "FINISH!";
            
            // スコア集計
            let cps = count / timeLimit;
            resTotal.textContent = `${count} 回`;
            resCps.textContent = `${cps.toFixed(2)} 回/秒`;
            
            // モーダル表示
            setTimeout(() => {
                resultModal.style.display = 'flex';
            }, 300);
        }

        // タップ時の処理
        function handleTap(e) {
            if (isEnded) return;
            
            // 初回タップで始動
            if (!isPlaying) {
                startGame();
            }

            count++;
            
            // 演出: ボタンのサイズを一瞬変更
            tapBtn.style.transform = "scale(0.95)";
            setTimeout(() => { if(!isEnded) tapBtn.style.transform = "none"; }, 5);

            // カウント表示切り替え切り替え
            if (showCountSetting.checked) {
                counter.textContent = count;
                // 数字をちょっと跳ねさせる
                counter.style.transform = "scale(1.1)";
                setTimeout(() => { counter.style.transform = "scale(1)"; }, 50);
            } else {
                counter.textContent = "??";
            }

            // 応援メッセージの処理
            if (showCheerSetting.checked) {
                // 現在のカウントに対応する一番高いメッセージを探す
                const availableMsg = [...cheerThresholds].reverse().find(t => count >= t.score);
                if (availableMsg && cheerMsg.textContent !== availableMsg.text) {
                    cheerMsg.textContent = availableMsg.text;
                    cheerMsg.classList.remove('pop');
                    void cheerMsg.offsetWidth; // 変化をブラウザに再認識させるハック
                    cheerMsg.classList.add('pop');
                }
            } else {
                cheerMsg.textContent = "";
            }

            // 華やかなエフェクト（紙吹雪パーティクル）
            createParticles(e);
        }

        // パーティクル生成 (スマホのマルチタッチ対応用)
        function createParticles(e) {
            const rect = tapBtn.getBoundingClientRect();
            // タッチイベントかクリックイベントかで座標取得を変更
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                
                // ランダムな色と形
                const colors = ['#ff007f', '#00f0ff', '#ffeb3b', '#ff5722', '#00ff00'];
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.width = Math.random() * 8 + 6 + 'px';
                p.style.height = p.style.width;
                p.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                
                // 開始位置（タップされた場所）
                p.style.left = clientX + 'px';
                p.style.top = clientY + 'px';
                
                // 飛び散る方向（ランダムなX, Yの移動量）
                const mx = (Math.random() - 0.5) * 150 + 'px';
                const my = (Math.random() - 0.5) * 150 + 'px';
                p.style.setProperty('--mx', mx);
                p.style.setProperty('--my', my);
                
                document.body.appendChild(p);
                
                // アニメーション終了後に削除
                setTimeout(() => p.remove(), 600);
            }
        }

        // イベントリスナーの登録
        // PCとスマホ両方で快適に動作させるため、mousedownとtouchstartの両方をケア（多重カウント防止付き）
        const triggerEvent = ('ontouchstart' in window) ? 'touchstart' : 'mousedown';
        tapBtn.addEventListener(triggerEvent, (e) => {
            e.preventDefault(); // スマホのダブルタップズームなどを防止
            handleTap(e);
        });

        // 管理パネルの変更を即座に反映
        timeSetting.addEventListener('change', initGame);
        showCountSetting.addEventListener('change', () => {
            if(!isPlaying && !isEnded) return;
            counter.textContent = showCountSetting.checked ? count : "??";
        });
        showCheerSetting.addEventListener('change', () => {
            if (!showCheerSetting.checked) cheerMsg.textContent = "";
        });

        restartBtn.addEventListener('click', initGame);

        // 初回読み込み時の初期化
        initGame();
    </script>
</body>
</html>
