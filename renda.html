<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>激突★ポップン連打スタジアム・超実況</title>
    <style>
        :root {
            --primary: #ff3377;
            --secondary: #33efff;
            --yellow: #ffee00;
            --bg-color: #230046;
            --panel-bg: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', 'Impact', sans-serif;
        }

        body {
            background: radial-gradient(circle, #44006c, #190033);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow: hidden;
        }

        /* ポップなヘッダー */
        .game-header {
            text-align: center;
            margin-top: 10px;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--yellow);
            text-shadow: 3px 3px 0px var(--primary), -2px -2px 0px #000;
            letter-spacing: 2px;
            transform: rotate(-2deg);
            margin-bottom: 10px;
        }

        .timer-display {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
            background: var(--primary);
            padding: 4px 20px;
            border-radius: 50px;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            display: inline-block;
        }

        /* カウンター＆応援ポップアウト */
        .main-display {
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .counter {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--secondary);
            text-shadow: 4px 4px 0px #000, -2px -2px 0px #000, 0 0 20px rgba(51,239,255,0.6);
            transition: transform 0.05s ease;
        }

        .cheer-msg {
            font-size: 1.2rem;
            color: var(--yellow);
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            min-height: 2.4rem;
            text-align: center;
            transform: scale(0) rotate(0deg);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.4);
            background: rgba(0,0,0,0.75);
            padding: 4px 15px;
            border-radius: 12px;
            border: 2px solid var(--yellow);
            max-width: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cheer-msg.pop {
            transform: scale(1) rotate(2deg);
        }

        /* 連打エリア */
        .tap-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        /* ポップンボタン */
        .tap-zone {
            background: radial-gradient(circle, #ff0055, #bb003b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--yellow);
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000;
            box-shadow: 0 15px 0px #770022, 0 20px 30px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: transform 0.05s ease, background 0.2s, box-shadow 0.05s ease;
            border: 5px solid #000;
            text-align: center;
        }

        /* サイズモード */
        .tap-zone.mode-normal {
            width: 210px;
            height: 210px;
        }

        .tap-zone.mode-single {
            width: 105px;
            height: 105px;
            font-size: 1.3rem;
            box-shadow: 0 8px 0px #770022, 0 10px 15px rgba(0,0,0,0.6);
        }
        .tap-zone.mode-single:active {
            transform: translateY(6px) scale(0.95);
            box-shadow: 0 2px 0px #770022;
        }

        .tap-zone.mode-all {
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            width: calc(100% - 20px) !important;
            height: calc(100% - 20px) !important;
            border-radius: 30px;
            border: 5px dashed var(--yellow);
            box-shadow: inset 0 0 40px rgba(255,0,0,0.4), 0 10px 20px rgba(0,0,0,0.5);
            font-size: 3.5rem;
            background: #a20036;
        }
        .tap-zone.mode-all:active {
            transform: scale(0.98);
        }

        .tap-zone.mode-normal:active {
            transform: translateY(10px) scale(0.96);
            box-shadow: 0 5px 0px #770022, 0 8px 15px rgba(0,0,0,0.6);
        }

        .tap-zone.disabled {
            background: #555 !important;
            box-shadow: 0 5px 0px #222 !important;
            border-color: #333 !important;
            color: #888 !important;
            text-shadow: none !important;
            cursor: not-allowed;
            transform: none !important;
        }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: #fff;
            color: #000;
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            border: 5px solid #000;
            box-shadow: 10px 10px 0px var(--secondary);
            max-width: 90%;
            width: 320px;
            animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.3);
        }

        @keyframes modalPop {
            from { transform: scale(0.6) rotate(-5deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .modal h2 {
            font-size: 2.2rem;
            color: var(--primary);
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 20px;
            transform: scale(1.1);
        }

        .result-item {
            margin: 15px 0;
            font-size: 1.3rem;
            font-weight: bold;
        }
        .result-val {
            font-size: 2.5rem;
            font-weight: 900;
            color: #00b5cc;
            display: block;
            text-shadow: 2px 2px 0px #000;
        }

        .btn-restart {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--yellow);
            border: 4px solid #000;
            border-radius: 15px;
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
        }
        .btn-restart:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        /* 管理パネル */
        .admin-panel {
            background: #000;
            border: 3px solid var(--secondary);
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 15px;
            margin-top: 10px;
            z-index: 10;
            box-shadow: 0 -5px 20px rgba(0,239,255,0.2);
        }

        .panel-title {
            font-size: 0.9rem;
            color: var(--secondary);
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 1px;
        }

        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.8rem;
            color: #fff;
        }

        input[type="number"], select {
            background: #222;
            border: 2px solid #fff;
            color: var(--yellow);
            padding: 8px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            width: 100%;
            text-align: center;
        }
        input[type="number"]:focus {
            border-color: var(--primary);
        }

        .switch-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #444;
            cursor: pointer;
            font-size: 0.8rem;
            height: 42px;
        }

        .switch-label input {
            display: none;
        }

        .toggle-btn {
            width: 44px;
            height: 22px;
            background: #444;
            border-radius: 11px;
            position: relative;
            transition: 0.2s;
            border: 2px solid #000;
        }

        .toggle-btn::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            top: 1px;
            left: 2px;
            transition: 0.2s;
        }

        input:checked + .toggle-btn {
            background: var(--primary);
        }

        input:checked + .toggle-btn::after {
            left: 22px;
        }

        /* 擬音エフェクト */
        .particle {
            position: absolute;
            pointer-events: none;
            font-size: 1.5rem;
            font-weight: 900;
            text-shadow: 2px 2px 0px #000;
            animation: fly 0.5s ease-out forwards;
            z-index: 5;
        }

        @keyframes fly {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(1.3) rotate(var(--mr)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-header">
        <h1>POPN★TAP!</h1>
        <div class="timer-display" id="timerDisplay">TIME: --.-s</div>
    </div>

    <div class="main-display">
        <div class="counter" id="counter">READY</div>
        <div class="cheer-msg" id="cheerMsg"></div>
    </div>

    <div class="tap-container">
        <div class="tap-zone mode-normal" id="tapBtn">TAP!</div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>BOOM!!</h2>
            <div class="result-item">叩いた総数<span class="result-val" id="resTotal">0回</span></div>
            <div class="result-item">秒間平均連打<span class="result-val" id="resCps">0.00</span></div>
            <button class="btn-restart" id="restartBtn">RETRY!</button>
        </div>
    </div>

    <div class="admin-panel">
        <div class="panel-title">⭐ CONTROL PANEL ⭐</div>
        
        <div class="control-group">
            <div class="control-item">
                <label>制限時間 (秒数入力)</label>
                <input type="number" id="timeSetting" value="10" min="1" max="999" step="0.1">
            </div>
            <div class="control-item">
                <label>サイズモード</label>
                <select id="modeSetting">
                    <option value="single">極小 (一本指)</option>
                    <option value="normal" selected>通常 (いつもの)</option>
                    <option value="all">最大 (全画面パッド)</option>
                </select>
            </div>
        </div>

        <div class="control-group">
            <label class="switch-label">
                <span>リアルタイム打数</span>
                <input type="checkbox" id="showCountSetting" checked>
                <div class="toggle-btn"></div>
            </label>
            <label class="switch-label">
                <span>応援テキスト表示</span>
                <input type="checkbox" id="showCheerSetting" checked>
                <div class="toggle-btn"></div>
            </label>
        </div>

        <div class="control-group" style="grid-template-columns: 1fr;">
            <label class="switch-label">
                <span>📢 機械合成音声で実況・応援を喋らせる</span>
                <input type="checkbox" id="voiceSetting" checked>
                <div class="toggle-btn"></div>
            </label>
        </div>
    </div>

    <script>
        let count = 0;
        let isPlaying = false;
        let isEnded = false;
        let timeLimit = 10;
        let timeLeft = 10;
        let timerId = null;
        let lastCheerText = ""; // 応援の重複発声防止用
        let startTime = 0;

        const tapBtn = document.getElementById('tapBtn');
        const counter = document.getElementById('counter');
        const timerDisplay = document.getElementById('timerDisplay');
        const cheerMsg = document.getElementById('cheerMsg');
        const resultModal = document.getElementById('resultModal');
        const resTotal = document.getElementById('resTotal');
        const resCps = document.getElementById('resCps');
        const restartBtn = document.getElementById('restartBtn');

        const timeSetting = document.getElementById('timeSetting');
        const modeSetting = document.getElementById('modeSetting');
        const showCountSetting = document.getElementById('showCountSetting');
        const showCheerSetting = document.getElementById('showCheerSetting');
        const voiceSetting = document.getElementById('voiceSetting');

        const hitWords = ['💥TAP!', '🔥BANG!', '⭐POP!', '⚡ZAP!', '✨CLAP!'];

        // 【新システム】経過秒数と現在の打数（ペース）に基づく応援パターン
        const cheerPool = {
            // ① 秒間10発以上の神速ペース
            god: [
                "限界突破！指壊れるーー！！😱",
                "神速！残像が見えるぞ…！✨",
                "異次元の連打マスター！🤖",
                "画面が壊れちゃう！止まらない！⚡",
                "人間をやめるなー！！凄すぎる！🚀"
            ],
            // ② 秒間5発以上の快速ペース
            fast: [
                "その調子！加速していこう！🚀",
                "いいぞ！ノリノリじゃん！🔥",
                "速い速い！ハイパー加速！⚡",
                "そのスピードを維持だ！素晴らしい！✨",
                "指がノってきた！突っ走れ！👊"
            ],
            // ③ 秒間5発未満のまったりペース（または開始直後）
            normal: [
                "お、始まったね！オラオラいこうぜ！👍",
                "いい滑り出しッ！もっといける！⭐",
                "リズムを掴んで！ここから本番！🎵",
                "まだまだ伸びるぞ！叩きまくれ！💥",
                "さあ指を動かそう！限界に挑戦だ！🔥"
            ]
        };

        function speak(text) {
            if (!voiceSetting.checked) return;
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 1.5;
            utterance.pitch = 1.3;
            window.speechSynthesis.speak(utterance);
        }

        function initGame() {
            count = 0;
            isPlaying = false;
            isEnded = false;
            lastCheerText = "";

            let inputTime = parseFloat(timeSetting.value);
            if (isNaN(inputTime) || inputTime <= 0) inputTime = 10;
            timeLimit = inputTime;
            timeLeft = timeLimit;
            
            tapBtn.classList.remove('disabled');
            tapBtn.textContent = modeSetting.value === 'all' ? "ココを猛連打!!" : "TAP!";
            counter.textContent = "READY";
            timerDisplay.textContent = `TIME: ${timeLeft.toFixed(1)}s`;
            cheerMsg.textContent = "";
            cheerMsg.classList.remove('pop');
            resultModal.style.display = 'none';

            tapBtn.classList.remove('mode-single', 'mode-normal', 'mode-all');
            if (modeSetting.value === 'single') {
                tapBtn.classList.add('mode-single');
            } else if (modeSetting.value === 'all') {
                tapBtn.classList.add('mode-all');
            } else {
                tapBtn.classList.add('mode-normal');
            }
        }

        function startGame() {
            isPlaying = true;
            startTime = performance.now();
            
            timerId = setInterval(() => {
                let elapsedTime = (performance.now() - startTime) / 1000;
                timeLeft = timeLimit - elapsedTime;

                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endGame();
                    return;
                }
                timerDisplay.textContent = `TIME: ${timeLeft.toFixed(1)}s`;

                // 定期的なペースチェック（1秒おきなどに実況が勝手に変わる楽しさ用）
                if (elapsedTime > 0.5) {
                    checkAndTriggerCheer(count, elapsedTime);
                }
            }, 50);
        }

        // 【核心ロジック】何秒で何打しているか(CPS)を計算して応援を切り替える
        function checkAndTriggerCheer(currentCount, seconds) {
            if (seconds <= 0) return;
            
            // 現在の秒間連打数 (Clicks Per Second)
            let currentCps = currentCount / seconds;
            let selectedText = "";

            // ペース判定
            if (currentCps >= 10) {
                // 打数(currentCount)の下一桁などを利用してプールから半ランダムに選ぶ
                selectedText = cheerPool.god[currentCount % cheerPool.god.length];
            } else if (currentCps >= 5) {
                selectedText = cheerPool.fast[currentCount % cheerPool.fast.length];
            } else {
                selectedText = cheerPool.normal[currentCount % cheerPool.normal.length];
            }

            // 前と同じセリフじゃなければ画面更新＆発声
            if (selectedText && selectedText !== lastCheerText) {
                lastCheerText = selectedText;
                cheerMsg.textContent = selectedText;
                
                if (showCheerSetting.checked) {
                    cheerMsg.classList.remove('pop');
                    void cheerMsg.offsetWidth;
                    cheerMsg.classList.add('pop');
                }
                speak(selectedText);
            }
        }

        function endGame() {
            isPlaying = false;
            isEnded = true;
            clearInterval(timerId);
            tapBtn.classList.add('disabled');
            tapBtn.textContent = "FINISH!";
            
            let cps = count / timeLimit;
            resTotal.textContent = `${count} 撃`;
            resCps.textContent = `${cps.toFixed(2)} 回/秒`;
            
            speak(`タイムアップ！叩いた総数は${count}回、秒間平均は${cps.toFixed(1)}回だ！お疲れ様！`);

            setTimeout(() => {
                resultModal.style.display = 'flex';
            }, 300);
        }

        function handleTap(e) {
            if (isEnded) return;
            if (!isPlaying) startGame();

            count++;
            
            if (showCountSetting.checked) {
                counter.textContent = count;
                counter.style.transform = "scale(1.15)";
                setTimeout(() => { counter.style.transform = "scale(1)"; }, 40);
            } else {
                counter.textContent = "!?";
            }

            // タップした瞬間にも即座にペース判定を行う（タイムラグを無くすため）
            let elapsedTime = (performance.now() - startTime) / 1000;
            checkAndTriggerCheer(count, elapsedTime);

            if (e.touches) {
                for (let i = 0; i < e.touches.length; i++) {
                    if(i === e.touches.length - 1) createPopEffects(e.touches[i].clientX, e.touches[i].clientY);
                }
            } else {
                createPopEffects(e.clientX, e.clientY);
            }
        }

        function createPopEffects(x, y) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.textContent = hitWords[Math.floor(Math.random() * hitWords.length)];
            
            const colors = ['#ffee00', '#33efff', '#ff3377', '#00ff66', '#ff9900'];
            p.style.color = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            
            const mx = (Math.random() - 0.5) * 180 + 'px';
            const my = (Math.random() - 0.5) * 180 - 50 + 'px';
            const mr = (Math.random() - 0.5) * 60 + 'deg';
            p.style.setProperty('--mx', mx);
            p.style.setProperty('--my', my);
            p.style.setProperty('--mr', mr);
            
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 500);
        }

        tapBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap(e);
        });
        tapBtn.addEventListener('mousedown', (e) => {
            if ('ontouchstart' in window) return;
            e.preventDefault();
            handleTap(e);
        });

        timeSetting.addEventListener('input', initGame);
        modeSetting.addEventListener('change', initGame);
        showCountSetting.addEventListener('change', () => {
            if(!isPlaying && !isEnded) return;
            counter.textContent = showCountSetting.checked ? count : "!?";
        });
        showCheerSetting.addEventListener('change', () => {
            if (!showCheerSetting.checked) cheerMsg.classList.remove('pop');
        });
        voiceSetting.addEventListener('change', () => {
            if (!voiceSetting.checked) window.speechSynthesis.cancel();
        });

        restartBtn.addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
