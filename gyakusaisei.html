<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>逆再生レコーダー</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 20px;
  }

  button {
    font-size: 1.6rem;
    padding: 15px 30px;
    margin: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    width: 80%;
    max-width: 300px;
  }

  #status {
    font-size: 1.6rem;
    margin-top: 20px;
    min-height: 40px;
  }

  audio {
    margin-top: 20px;
    width: 95%;
  }

  @media (max-width: 600px) {
    button {
      font-size: 1.4rem;
      padding: 14px 20px;
      width: 90%;
    }
    h1 { font-size: 1.8rem; }
    #status { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<h1>録音して逆再生する</h1>

<button id="recordBtn">🎤 録音開始</button>
<button id="stopBtn" disabled>■ 停止</button>
<button onclick="location.href='dengon.html'">伝言ページへ戻る</button>

<div id="status">録音してみよう</div>

<audio id="reverseAudio" controls></audio>

<script>
let mediaRecorder;
let audioChunks = [];
let audioContext = new (window.AudioContext || window.webkitAudioContext)();

const recordBtn = document.getElementById("recordBtn");
const stopBtn = document.getElementById("stopBtn");
const statusDiv = document.getElementById("status");
const reverseAudio = document.getElementById("reverseAudio");

// 録音開始
recordBtn.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = processReverse;

    mediaRecorder.start();

    recordBtn.disabled = true;
    stopBtn.disabled = false;
    statusDiv.textContent = "録音中…";
  } catch (e) {
    statusDiv.textContent = "録音が許可されていません";
  }
};

// 録音停止
stopBtn.onclick = () => {
  mediaRecorder.stop();
  recordBtn.disabled = false;
  stopBtn.disabled = true;
  statusDiv.textContent = "逆再生を作成中…";
};

// 逆再生処理
async function processReverse() {
  const blob = new Blob(audioChunks, { type: "audio/webm" });
  const arrayBuffer = await blob.arrayBuffer();

  const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

  const reversedBuffer = audioContext.createBuffer(
    audioBuffer.numberOfChannels,
    audioBuffer.length,
    audioBuffer.sampleRate
  );

  for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
    const input = audioBuffer.getChannelData(i);
    const output = reversedBuffer.getChannelData(i);

    for (let j = 0; j < input.length; j++) {
      output[j] = input[input.length - j - 1];
    }
  }

  const wavBlob = await bufferToWave(reversedBuffer);

  reverseAudio.src = URL.createObjectURL(wavBlob);
  statusDiv.textContent = "逆再生音声ができたよ！";
}

// AudioBuffer → WAV Blob
function bufferToWave(abuffer) {
  return new Promise(resolve => {
    const numOfChan = abuffer.numberOfChannels;
    const length = abuffer.length * numOfChan * 2 + 44;
    const buffer = new ArrayBuffer(length);
    const view = new DataView(buffer);

    let pos = 0;

    writeUTFBytes(view, pos, "RIFF"); pos += 4;
    view.setUint32(pos, length - 8, true); pos += 4;
    writeUTFBytes(view, pos, "WAVE"); pos += 4;
    writeUTFBytes(view, pos, "fmt "); pos += 4;
    view.setUint32(pos, 16, true); pos += 4;
    view.setUint16(pos, 1, true); pos += 2;
    view.setUint16(pos, numOfChan, true); pos += 2;
    view.setUint32(pos, abuffer.sampleRate, true); pos += 4;
    view.setUint32(pos, abuffer.sampleRate * numOfChan * 2, true); pos += 4;
    view.setUint16(pos, numOfChan * 2, true); pos += 2;
    view.setUint16(pos, 16, true); pos += 2;
    writeUTFBytes(view, pos, "data"); pos += 4;
    view.setUint32(pos, length - pos - 4, true); pos += 4;

    for (let i = 0; i < abuffer.length; i++) {
      for (let ch = 0; ch < numOfChan; ch++) {
        const sample = abuffer.getChannelData(ch)[i];
        const s = Math.max(-1, Math.min(1, sample));
        view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        pos += 2;
      }
    }

    resolve(new Blob([buffer], { type: "audio/wav" }));
  });
}

function writeUTFBytes(view, offset, string) {
  for (let i = 0; i < string.length; i++) {
    view.setUint8(offset + i, string.charCodeAt(i));
  }
}
</script>

</body>
</html>
