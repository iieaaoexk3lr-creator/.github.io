<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アモアス通話リモコン（完全部屋切替式）</title>
  <script src="https://meet.jit.si/external_api.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 12px; }
    
    /* 入室画面 */
    #room-login {
      max-width: 320px;
      margin: 40px auto;
      padding: 20px;
      background: #222;
      border-radius: 12px;
      border: 1px solid #444;
    }
    #room-login input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #555;
      margin-bottom: 12px;
      background: #333;
      color: #fff;
      text-align: center;
    }
    #room-login button {
      width: 100%;
      padding: 12px;
      background: #27ae60;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #main-app { display: none; }

    .status-box { 
      font-size: 14px; 
      color: #f1c40f; 
      margin-bottom: 12px; 
      font-weight: bold; 
      padding: 8px;
      background: #222;
      border-radius: 6px;
    }
    .room-title { font-size: 13px; color: #aaa; margin-bottom: 8px; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 340px;
      margin: 0 auto;
    }

    .btn-grid button {
      padding: 16px 6px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      transition: all 0.15s ease;
      outline: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
    }

    .btn-grid button:active { transform: scale(0.95); }

    .btn-play { background: #c0392b; }  /* 赤：ゲーム中 */
    .btn-meet { background: #27ae60; }  /* 緑：会議・ロビー */
    .btn-reset { background: #2980b9; } /* 青：決着 */
    .btn-ghost { background: #8e44ad; } /* 紫：天界 */

    button.active {
      border-color: #fff !important;
      box-shadow: 0 0 12px #fff;
      transform: scale(0.98);
    }

    /* クリックの邪魔にならない安全な非表示レイアウト */
    #meet { 
      width: 0; 
      height: 0; 
      overflow: hidden; 
      position: absolute; 
      top: -9999px; 
      left: -9999px; 
    }
  </style>
</head>
<body>

  <!-- 1. 入室画面 -->
  <div id="room-login">
    <h3 style="margin-bottom: 12px;">通話ルームに入室</h3>
    <input type="text" id="room-input" placeholder="部屋名 (例: team1)" />
    <button onclick="enterRoom()">入室する</button>
  </div>

  <!-- 2. メイン操作画面 -->
  <div id="main-app">
    <div class="room-title" id="room-display">部屋名: -</div>
    <div class="status-box" id="status">接続中...</div>

    <div class="btn-grid">
      <button id="btn-play" class="btn-play" onclick="setGameState('MUTE_ROOM')">
        🎮 ゲーム開始<span>(ミュート部屋へ移動)</span>
      </button>
      <button id="btn-meet" class="btn-meet" onclick="setGameState('LIVE_ROOM')">
        📣 会議 / ロビー<span>(通話部屋へ移動)</span>
      </button>
      <button id="btn-reset" class="btn-reset" onclick="setGameState('RESET_GAME')">
        🔄 決着<span>(全員を会議部屋へ戻す)</span>
      </button>
      <button id="btn-ghost" class="btn-ghost" onclick="clickGhost()">
        💀 やられた<span>(自分だけ天界へ移動)</span>
      </button>
    </div>
  </div>

  <!-- Jitsi埋め込み用 -->
  <div id="meet"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
      authDomain: "gamehistory-m84.firebaseapp.com",
      databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
      projectId: "gamehistory-m84",
      storageBucket: "gamehistory-m84.firebasestorage.app",
      messagingSenderId: "475761727837",
      appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
      measurementId: "G-3636W6LC4F"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const domain = 'meet.jit.si';
    let currentRoomName = '';
    let stateRef = null;
    let api = null;
    let isGhost = false;
    let currentConnectedRoom = '';

    function enterRoom() {
      const input = document.getElementById('room-input').value.trim();
      if (!input) {
        alert('部屋名を入力してください');
        return;
      }

      currentRoomName = input;

      document.getElementById('room-login').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('room-display').innerText = '部屋名: ' + currentRoomName;

      stateRef = db.ref('tu-wa/' + currentRoomName);

      // 初期状態を監視開始
      listenToFirebase();
    }

    function listenToFirebase() {
      stateRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data || !data.current_state) {
          // 初期値がない場合は会議ルームからスタート
          switchRoom('LIVE');
          return;
        }

        const state = data.current_state;

        if (state === 'MUTE_ROOM') {
          // 幽霊でなければ、無音（ミュート専用）部屋へ移動
          if (!isGhost) {
            switchRoom('MUTE');
          }
        } else if (state === 'LIVE_ROOM') {
          // 幽霊でなければ、生者通話部屋へ移動
          if (!isGhost) {
            switchRoom('LIVE');
          }
        } else if (state === 'RESET_GAME') {
          // 決着を押されたら天界フラグを解除して、全員で生者通話部屋へ復帰
          isGhost = false;
          switchRoom('LIVE');
        }
      });
    }

    // Firebase経由で全体の部屋状態を更新
    function setGameState(newState) {
      if (stateRef) {
        stateRef.set({
          current_state: newState,
          updatedAt: Date.now()
        });
      }
    }

    // 「やられた」ボタン（自分のみ天界部屋へ切り替え）
    function clickGhost() {
      if (isGhost) return;
      isGhost = true;
      switchRoom('GHOST');
    }

    // 部屋切替のコア処理
    function switchRoom(targetType) {
      const fullRoomName = 'tu-wa_' + currentRoomName + '_' + targetType;

      // すでに同じ部屋に接続している場合は無駄に切り替えない
      if (currentConnectedRoom === fullRoomName && api) return;

      // 既存の接続を切断
      if (api) {
        try { api.dispose(); } catch (e) {}
        api = null;
      }

      currentConnectedRoom = fullRoomName;

      // タイプ別の初期設定
      const startMuted = (targetType === 'MUTE');

      api = new JitsiMeetExternalAPI(domain, {
        roomName: fullRoomName,
        parentNode: document.querySelector('#meet'),
        configOverwrite: { 
          startWithAudioMuted: startMuted,
          startWithVideoMuted: true
        }
      });

      // 状態表示とボタン表示の変更
      if (targetType === 'MUTE') {
        document.getElementById('status').innerText = '状態：🎮 ゲーム中（無音部屋に接続中）';
        setActiveButton('btn-play');
      } else if (targetType === 'LIVE') {
        document.getElementById('status').innerText = '状態：📣 会議 / ロビー（生者通話中）';
        setActiveButton('btn-meet');
      } else if (targetType === 'GHOST') {
        document.getElementById('status').innerText = '状態：💀 天界（幽霊同士で会話中）';
        setActiveButton('btn-ghost');
      }
    }

    function setActiveButton(activeId) {
      const buttons = document.querySelectorAll('.btn-grid button');
      buttons.forEach(btn => btn.classList.remove('active'));
      const target = document.getElementById(activeId);
      if (target) target.classList.add('active');
    }
  </script>
</body>
</html>
