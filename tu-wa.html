<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amongus-Jitsiコントローラー</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #222; color: white; }
        .container { max-width: 400px; margin: auto; }
        input { width: 90%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: none; font-size: 16px; }
        button { width: 100%; padding: 15px; margin: 8px 0; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; }
        
        /* ボタンのカラーリング */
        #btn-play { background-color: #2e7d32; } /* 緑：ゲーム中 */
        #btn-meet { background-color: #1976d2; } /* 青：会議 */
        #btn-ghost { background-color: #7b1fa2; } /* 紫：幽霊 */
        #btn-finish { background-color: #d32f2f; } /* 赤：決着 */
        
        #status { margin-top: 20px; padding: 15px; border: 1px solid #444; border-radius: 10px; background: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>AmongUs通話部屋</h2>
    <input type="text" id="roomName" placeholder="部屋の名前を入力" value="AmongUsParty">

    <!-- 4つのボタンを復活させました -->
    <button id="btn-play" onclick="switchRoom('MUTE')">🎮 ゲーム中（無音）</button>
    <button id="btn-meet" onclick="switchRoom('LIVE')">📣 会議 / ロビー</button>
    <button id="btn-ghost" onclick="switchRoom('GHOST')">💀 天界（幽霊）</button>
    <button id="btn-finish" onclick="switchRoom('FINISH')">🏁 決着！</button>

    <div id="status">ボタンを押すと、新しいタブで会議室が開きます。</div>
</div>

<script>
    function switchRoom(targetType) {
        // 部屋名の生成
        const baseName = document.getElementById('roomName').value || 'DefaultRoom';
        const fullRoomName = 'tu-wa_' + baseName + '_' + targetType;
        const jitsiUrl = `https://meet.jit.si/${fullRoomName}`;

        // 別タブで開く（これが警告回避のキーです）
        window.open(jitsiUrl, '_blank');

        // UI表示の更新
        const statusDiv = document.getElementById('status');
        const labels = {
            'MUTE': '状態：🎮 ゲーム中（無音部屋）',
            'LIVE': '状態：📣 会議 / ロビー（会話中）',
            'GHOST': '状態：💀 天界（幽霊会話中）',
            'FINISH': '状態：🏁 決着画面（会話中）'
        };
        statusDiv.innerText = labels[targetType] || '切り替えました';
    }
</script>

</body>
</html>
