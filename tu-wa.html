<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アモアス通話リモコン（バグ修正版）</title>
  <!-- Jitsi Meet API -->
  <script src="https://meet.jit.si/external_api.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 8px; }
    
    #room-login {
      max-width: 320px;
      margin: 40px auto;
      padding: 20px;
      background: #222;
      border-radius: 12px;
      border: 1px solid #444;
    }
    #room-login input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #555;
      margin-bottom: 12px;
      background: #333;
      color: #fff;
      text-align: center;
    }
    #room-login button {
      width: 100%;
      padding: 12px;
      background: #27ae60;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #main-app { display: none; }

    .status-box { font-size: 12px; color: #f1c40f; margin-bottom: 8px; font-weight: bold; }
    .room-title { font-size: 14px; color: #aaa; margin-bottom: 8px; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      max-width: 320px;
      margin: 0 auto;
    }

    .btn-grid button {
      padding: 12px 4px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
      outline: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }

    .btn-play { background: #c0392b; }  /* 赤：ゲーム開始 */
    .btn-meet { background: #27ae60; }  /* 緑：会議・ロビー */
    .btn-reset { background: #2980b9; } /* 青：決着 */
    .btn-ghost { background: #8e44ad; } /* 紫：天界 */

    button.active {
      border-color: #fff !important;
      box-shadow: 0 0 12px #fff, inset 0 0 8px rgba(255,255,255,0.5);
      transform: scale(0.98);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 8px #fff, inset 0 0 4px rgba(255,255,255,0.5); }
      100% { box-shadow: 0 0 18px #fff, 0 0 10px #fff, inset 0 0 10px rgba(255,255,255,0.8); }
    }

    #meet { width: 1px; height: 1px; opacity: 0; position: absolute; }
  </style>
</head>
<body>

  <!-- 1. 部屋名入力エリア -->
  <div id="room-login">
    <h3 style="margin-bottom: 12px;">通話ルームに入室</h3>
    <input type="text" id="room-input" placeholder="部屋名を入力 (例: room123)" />
    <button onclick="enterRoom()">入室する</button>
  </div>

  <!-- 2. メイン操作エリア -->
  <div id="main-app">
    <div class="room-title" id="room-display">部屋名: -</div>
    <div class="status-box" id="status">初期化中...</div>

    <div class="btn-grid">
      <button id="btn-play" class="btn-play" onclick="setGameState('PLAY_START')">
        🎮 ゲーム開始<span>(生者全員ミュート)</span>
      </button>
      <button id="btn-meet" class="btn-meet" onclick="setGameState('MEETING_START')">
        📣 会議 / ロビー<span>(各自マイクON)</span>
      </button>
      <button id="btn-reset" class="btn-reset" onclick="setGameState('RESET_GAME')">
        🔄 決着<span>(天界含む全員復帰)</span>
      </button>
      <button id="btn-ghost" class="btn-ghost" onclick="clickGhost()">
        💀 やられた<span>(天界ルームへ移動)</span>
      </button>
    </div>
  </div>

  <div id="meet"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
      authDomain: "gamehistory-m84.firebaseapp.com",
      databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
      projectId: "gamehistory-m84",
      storageBucket: "gamehistory-m84.firebasestorage.app",
      messagingSenderId: "475761727837",
      appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
      measurementId: "G-3636W6LC4F"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const domain = 'meet.jit.si';
    let currentRoomName = '';
    let stateRef = null;
    let api = null;
    let isGhost = false;

    function enterRoom() {
      const input = document.getElementById('room-input').value.trim();
      if (!input) {
        alert('部屋名を入力してください');
        return;
      }

      currentRoomName = input;

      document.getElementById('room-login').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('room-display').innerText = '部屋名: ' + currentRoomName;

      stateRef = db.ref('tu-wa/' + currentRoomName);

      // Firebase監視開始
      listenToFirebase();

      // 初期化（生者部屋）
      joinRoom(currentRoomName + '_LIVE', false);
    }

    function listenToFirebase() {
      stateRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data || !data.current_state) return;

        const state = data.current_state;

        if (state === 'PLAY_START') {
          if (!isGhost) {
            if (api) api.executeCommand('setAudioMute', true);
            setActiveButton('btn-play');
            document.getElementById('status').innerText = '状態：ゲーム中（全員ミュート）';
          }
        } else if (state === 'MEETING_START') {
          if (!isGhost) {
            if (api) api.executeCommand('setAudioMute', false);
            setActiveButton('btn-meet');
            document.getElementById('status').innerText = '状態：会議 / ロビー（会話OK）';
          }
        } else if (state === 'RESET_GAME') {
          // 決着が押された場合：全員が生者ルームへ復帰
          isGhost = false;
          joinRoom(currentRoomName + '_LIVE', false);
        }
      });
    }

    // 全員同期用（タイムスタンプを付与してFirebaseの更新イベントを確実に発火させる）
    function setGameState(newState) {
      if (stateRef) {
        stateRef.set({
          current_state: newState,
          updatedAt: Date.now()
        });
      }
    }

    // 「やられた」ボタン（自分だけ天界へ移動）
    function clickGhost() {
      if (isGhost) return; // すでに天界にいる場合は連打防止
      isGhost = true;
      joinRoom(currentRoomName + '_GHOST', false);
    }

    // Jitsi接続＆切替関数
    function joinRoom(roomName, startMuted) {
      if (api) {
        try { api.dispose(); } catch (e) {}
        api = null;
      }

      api = new JitsiMeetExternalAPI(domain, {
        roomName: 'tu-wa_' + roomName,
        parentNode: document.querySelector('#meet'),
        configOverwrite: { startWithAudioMuted: startMuted }
      });

      api.addEventListener('videoConferenceJoined', () => {
        if (roomName.includes('_GHOST')) {
          document.getElementById('status').innerText = '状態：👻 天界（幽霊同士で会話中）';
          setActiveButton('btn-ghost');
        } else {
          document.getElementById('status').innerText = '状態：生者（会話OK）';
          setActiveButton('btn-meet');
        }
      });
    }

    function setActiveButton(activeId) {
      const buttons = document.querySelectorAll('.btn-grid button');
      buttons.forEach(btn => btn.classList.remove('active'));
      const target = document.getElementById(activeId);
      if (target) target.classList.add('active');
    }
  </script>
</body>
</html>
