<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汎用 通話＆個人戦績リモコン</title>
  
  <!-- LiveKit Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <!-- JOSE (JWT生成用) -->
  <script src="https://cdn.jsdelivr.net/npm/jose@4.14.4/dist/browser/index.umd.min.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 12px; }
    
    #login-screen {
      max-width: 320px; margin: 40px auto; padding: 20px;
      background: #222; border-radius: 12px; border: 1px solid #444;
    }
    #login-screen input {
      width: 100%; padding: 12px; font-size: 16px; border-radius: 6px;
      border: 1px solid #555; margin-bottom: 12px; background: #333; color: #fff; text-align: center;
    }
    #login-screen button {
      width: 100%; padding: 12px; background: #27ae60; color: #fff;
      font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer;
    }

    #main-app { display: none; }
    .status-box { 
      font-size: 14px; color: #f1c40f; margin-bottom: 12px; 
      font-weight: bold; padding: 10px; background: #222; border-radius: 6px;
    }
    .room-title { font-size: 13px; color: #aaa; margin-bottom: 8px; }

    /* 通話ユーティリティバー（スピーカー・自分マイク） */
    .util-bar {
      display: flex; gap: 8px; max-width: 360px; margin: 0 auto 12px;
    }
    .util-btn {
      flex: 1; padding: 10px; font-size: 12px; font-weight: bold;
      border: 1px solid #444; border-radius: 8px; background: #2c3e50; color: white; cursor: pointer;
    }
    .util-btn.off { background: #7f8c8d; }

    /* 参加者＆個人戦績リスト */
    .user-list-box {
      max-width: 360px; margin: 0 auto 12px; background: #222;
      border: 1px solid #444; border-radius: 8px; padding: 10px; text-align: left;
    }
    .user-list-title { font-size: 12px; color: #aaa; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; display: flex; justify-content: space-between; }
    .user-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 6px; border-bottom: 1px solid #2a2a2a; font-size: 13px; border-radius: 6px; transition: background 0.2s;
    }
    .user-item.speaking { background: #1e3725; border-left: 4px solid #2ecc71; } /* 発言中ハイライト */
    .user-item:last-child { border-bottom: none; }
    
    .user-info { display: flex; align-items: center; gap: 6px; }
    .win-badge {
      background: #f39c12; color: #000; font-weight: bold; font-size: 11px;
      padding: 2px 6px; border-radius: 10px;
    }

    .user-actions { display: flex; gap: 4px; }
    .user-actions button {
      padding: 5px 8px; font-size: 10px; font-weight: bold;
      border: none; border-radius: 4px; cursor: pointer; color: white;
    }
    .btn-win-add { background: #f39c12; }
    .btn-win-add:active { transform: scale(0.9); }
    .btn-force-mute { background: #c0392b; }
    .btn-force-mute.muted { background: #27ae60; }

    .btn-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      max-width: 360px; margin: 0 auto;
    }

    .btn-grid button {
      padding: 12px 6px; font-size: 12px; font-weight: bold;
      border: 2px solid transparent; border-radius: 10px; cursor: pointer;
      color: white; transition: all 0.15s ease; outline: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      line-height: 1.3;
    }

    .btn-grid button:active { transform: scale(0.95); }

    .btn-start { background: #27ae60; }
    .btn-mute  { background: #e67e22; }
    .btn-allmute { background: #c0392b; }
    .btn-dead  { background: #7f8c8d; }
    .btn-ghost { background: #8e44ad; }
    .btn-reset { background: #2980b9; grid-column: span 2; }

    button.active {
      border-color: #fff !important;
      box-shadow: 0 0 12px #fff;
      transform: scale(0.98);
    }

    span { font-size: 10px; font-weight: normal; margin-top: 2px; opacity: 0.85; }
  </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-screen">
    <h3 style="margin-bottom: 12px;">汎用 通話＆個人戦績リモコン</h3>
    <input type="text" id="room-input" placeholder="部屋名 (例: room1)" />
    <input type="text" id="name-input" placeholder="あなたの名前" />
    <button onclick="enterRoom()">接続する</button>
  </div>

  <!-- 操作画面 -->
  <div id="main-app">
    <div class="room-title" id="room-display">部屋名: -</div>
    <div class="status-box" id="status">初期化中...</div>

    <!-- 通話機能ユーティリティバー -->
    <div class="util-bar">
      <button id="btn-self-mic" class="util-btn" onclick="toggleSelfMic()">🎤 マイク: ON</button>
      <button id="btn-speaker" class="util-btn" onclick="toggleSpeaker()">🔊 スピーカー: ON</button>
    </div>

    <!-- 参加者＆個人戦績リストエリア -->
    <div class="user-list-box">
      <div class="user-list-title">
        <span>🏆 参加者・個人戦績</span>
        <span style="font-size:10px; color:#2ecc71;">■ 発言中</span>
      </div>
      <div id="user-list-container"></div>
    </div>

    <div class="btn-grid">
      <button id="btn-start" class="btn-start" onclick="actionStart()">
        🎤 通話開始 / 解禁<span>(生者部屋・マイクON)</span>
      </button>
      <button id="btn-mute" class="btn-mute" onclick="actionMute()">
        🔇 ミュート<span>(自分のみマイクOFF)</span>
      </button>
      <button id="btn-allmute" class="btn-allmute" onclick="actionAllMute()">
        🛑 全体ミュート<span>(全員マイク強制OFF)</span>
      </button>
      <button id="btn-dead" class="btn-dead" onclick="actionDead()">
        💀 やられた<span>(生者の声を聴くだけ)</span>
      </button>
      <button id="btn-ghost" class="btn-ghost" onclick="actionGhost()">
        👻 幽霊部屋<span>(幽霊同士で会話)</span>
      </button>
      <button id="btn-reset" class="btn-reset" onclick="actionReset()">
        🔄 全員初期化・復帰<span>(全員を生者部屋・会話可に戻す)</span>
      </button>
    </div>
  </div>

  <div id="audio-container" style="display:none;"></div>

  <script>
    const LIVEKIT_URL = "wss://tu-wa-o1g4cyfi.livekit.cloud";
    const LIVEKIT_API_KEY = "APIycbMDVJPz54b";
    const LIVEKIT_API_SECRET = "g7g4xG5ueKeLAJ9kSqpnqsk0FwTPe2vDZhmKtLx04M4B";

    const firebaseConfig = {
      apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
      authDomain: "gamehistory-m84.firebaseapp.com",
      databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
      projectId: "gamehistory-m84",
      storageBucket: "gamehistory-m84.firebasestorage.app",
      messagingSenderId: "475761727837",
      appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
      measurementId: "G-3636W6LC4F"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoomName = "";
    let userName = "";
    let currentLiveKitRoom = null;
    let stateRef = null;
    let userPresenceRef = null;

    let isMicEnabled = true;
    let isSpeakerEnabled = true;
    let speakingUsers = new Set(); // 発言中のユーザー

    async function generateToken(roomName, participantName) {
      const secret = new TextEncoder().encode(LIVEKIT_API_SECRET);
      return await new jose.SignJWT({
        video: { room: roomName, roomJoin: true, canPublish: true, canSubscribe: true }
      })
        .setProtectedHeader({ alg: 'HS256' })
        .setIssuer(LIVEKIT_API_KEY)
        .setSubject(participantName)
        .setExpirationTime('2h')
        .sign(secret);
    }

    async function connectToLiveKit(channelType, enableMic) {
      const targetRoomName = `tuwa_${currentRoomName}_${channelType}`;
      updateUserPresence(channelType);

      if (currentLiveKitRoom && currentLiveKitRoom.name === targetRoomName) {
        await setMicState(enableMic);
        return;
      }

      if (currentLiveKitRoom) {
        await currentLiveKitRoom.disconnect();
        currentLiveKitRoom = null;
      }

      document.getElementById('status').innerText = '接続切り替え中...';

      try {
        const token = await generateToken(targetRoomName, userName);
        const room = new LiveKit.Room({ adaptiveStream: true, dynacast: true });

        room.on(LiveKit.RoomEvent.TrackSubscribed, (track, publication, participant) => {
          if (track.kind === LiveKit.Track.Kind.Audio) {
            const el = track.attach();
            el.dataset.identity = participant.identity;
            el.muted = !isSpeakerEnabled;
            document.getElementById('audio-container').appendChild(el);
          }
        });

        room.on(LiveKit.RoomEvent.TrackUnsubscribed, (track) => {
          track.detach().forEach(el => el.remove());
        });

        // 発言中インジケーターの監視
        room.on(LiveKit.RoomEvent.ActiveSpeakersChanged, (speakers) => {
          speakingUsers.clear();
          speakers.forEach(s => speakingUsers.add(s.identity));
          renderUserList();
        });

        await room.connect(LIVEKIT_URL, token);
        await setMicState(enableMic);
        currentLiveKitRoom = room;

      } catch (err) {
        console.error("LiveKit接続エラー:", err);
        document.getElementById('status').innerText = '接続エラーが発生しました';
      }
    }

    function enterRoom() {
      const roomInput = document.getElementById('room-input').value.trim();
      const nameInput = document.getElementById('name-input').value.trim();

      if (!roomInput || !nameInput) {
        alert('部屋名と名前を入力してください');
        return;
      }

      currentRoomName = roomInput;
      userName = nameInput;

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('room-display').innerText = `部屋名: ${currentRoomName} (${userName})`;

      stateRef = db.ref('tu-wa-v2/' + currentRoomName);
      
      userPresenceRef = db.ref(`tu-wa-v2/${currentRoomName}/users/${userName}`);
      userPresenceRef.onDisconnect().remove();

      listenToFirebase();
      listenToUserPresence();
      
      actionStart();
    }

    function updateUserPresence(roomType) {
      if (userPresenceRef) {
        userPresenceRef.transaction((current) => {
          return {
            type: roomType,
            isForceMuted: current ? (current.isForceMuted || false) : false,
            wins: current ? (current.wins || 0) : 0, // 勝利数を保持
            updatedAt: Date.now()
          };
        });
      }
    }

    // ユーザーリストのリアルタイム同期とレンダリング
    let cachedUsers = {};
    function listenToUserPresence() {
      const usersRef = db.ref(`tu-wa-v2/${currentRoomName}/users`);
      usersRef.on('value', (snapshot) => {
        cachedUsers = snapshot.val() || {};
        
        // 自分に対する「強制消音」を適用
        if (cachedUsers[userName]) {
          const myForceMute = cachedUsers[userName].isForceMuted;
          if (myForceMute && isMicEnabled) {
            setMicState(false);
            document.getElementById('status').innerText = '状態：🔇 強制消音されました';
          }
        }

        renderUserList();
      });
    }

    function renderUserList() {
      const container = document.getElementById('user-list-container');
      container.innerHTML = '';

      // 勝利数の多い順（降順）にソートして並べる
      const sortedKeys = Object.keys(cachedUsers).sort((a, b) => {
        const winsA = cachedUsers[a].wins || 0;
        const winsB = cachedUsers[b].wins || 0;
        return winsB - winsA;
      });

      sortedKeys.forEach(targetName => {
        const userData = cachedUsers[targetName];
        const isSpeaking = speakingUsers.has(targetName);
        const isMuted = userData.isForceMuted;
        const wins = userData.wins || 0;
        const isSelf = targetName === userName;

        const userRow = document.createElement('div');
        userRow.className = `user-item ${isSpeaking ? 'speaking' : ''}`;

        userRow.innerHTML = `
          <div class="user-info">
            <span class="win-badge">🏆 ${wins}勝</span>
            <span>
              ${targetName} ${isSelf ? '(自分)' : ''} 
              ${userData.type === 'GHOST' ? '👻' : '🚶‍♂️'}
              ${isMuted ? '🔇' : ''}
            </span>
          </div>
          <div class="user-actions">
            <button class="btn-win-add" onclick="addWin('${targetName}')">🏆+1勝</button>
            <button class="btn-force-mute ${isMuted ? 'muted' : ''}" onclick="toggleForceMute('${targetName}', ${!isMuted})">
              ${isMuted ? '解禁' : '発言禁止'}
            </button>
          </div>
        `;
        container.appendChild(userRow);
      });
    }

    // 個人の勝利数を+1加算する
    function addWin(targetName) {
      const userWinRef = db.ref(`tu-wa-v2/${currentRoomName}/users/${targetName}/wins`);
      userWinRef.transaction((currentWins) => {
        return (currentWins || 0) + 1;
      });
    }

    // 他のプレイヤーの強制ミュート
    function toggleForceMute(targetName, forceMuteState) {
      db.ref(`tu-wa-v2/${currentRoomName}/users/${targetName}/isForceMuted`).set(forceMuteState);
    }

    // --- マイク / スピーカー機能 ---
    async function setMicState(enable) {
      isMicEnabled = enable;
      if (currentLiveKitRoom) {
        await currentLiveKitRoom.localParticipant.setMicrophoneEnabled(enable);
      }
      const btn = document.getElementById('btn-self-mic');
      btn.innerText = `🎤 マイク: ${enable ? 'ON' : 'OFF'}`;
      btn.classList.toggle('off', !enable);
    }

    function toggleSelfMic() {
      setMicState(!isMicEnabled);
    }

    function toggleSpeaker() {
      isSpeakerEnabled = !isSpeakerEnabled;
      const audioEls = document.querySelectorAll('#audio-container audio');
      audioEls.forEach(el => el.muted = !isSpeakerEnabled);

      const btn = document.getElementById('btn-speaker');
      btn.innerText = `🔊 スピーカー: ${isSpeakerEnabled ? 'ON' : 'OFF'}`;
      btn.classList.toggle('off', !isSpeakerEnabled);
    }

    // --- 全体命令監視 ---
    function listenToFirebase() {
      stateRef.child('global_state').on('value', async (snapshot) => {
        const globalState = snapshot.val();
        if (!globalState) return;

        if (globalState === 'ALL_MUTE') {
          if (currentLiveKitRoom && currentLiveKitRoom.name.includes('_LIVE')) {
            await setMicState(false);
          }
          document.getElementById('status').innerText = '状態：🛑 全体ミュート中（全員マイクOFF）';
          setActiveButton('btn-allmute');
        } else if (globalState === 'RESET') {
          // 強制ミュートの解除
          Object.keys(cachedUsers).forEach(name => {
            db.ref(`tu-wa-v2/${currentRoomName}/users/${name}/isForceMuted`).set(false);
          });
          await connectToLiveKit('LIVE', true);
          document.getElementById('status').innerText = '状態：🎤 会話可能（生者部屋）';
          setActiveButton('btn-start');
        }
      });
    }

    // --- 各操作ボタン ---
    async function actionStart() {
      if (stateRef) stateRef.child('global_state').set('START');
      await connectToLiveKit('LIVE', true);
      document.getElementById('status').innerText = '状態：🎤 会話可能（生者部屋）';
      setActiveButton('btn-start');
    }

    async function actionMute() {
      await setMicState(false);
      document.getElementById('status').innerText = '状態：🔇 ミュート中（自分のみマイクOFF）';
      setActiveButton('btn-mute');
    }

    async function actionAllMute() {
      if (currentLiveKitRoom && currentLiveKitRoom.name.includes('_LIVE')) {
        await setMicState(false);
      }
      document.getElementById('status').innerText = '状態：🛑 全体ミュート中（全員マイクOFF）';
      setActiveButton('btn-allmute');
      if (stateRef) stateRef.child('global_state').set('ALL_MUTE');
    }

    async function actionDead() {
      await connectToLiveKit('LIVE', false);
      document.getElementById('status').innerText = '状態：💀 死亡（生者の声を観戦中・発言不可）';
      setActiveButton('btn-dead');
    }

    async function actionGhost() {
      await connectToLiveKit('GHOST', true);
      document.getElementById('status').innerText = '状態：👻 幽霊部屋（幽霊同士で会話中）';
      setActiveButton('btn-ghost');
    }

    function actionReset() {
      if (stateRef) stateRef.child('global_state').set('RESET');
    }

    function setActiveButton(activeId) {
      const buttons = document.querySelectorAll('.btn-grid button');
      buttons.forEach(btn => btn.classList.remove('active'));
      const target = document.getElementById(activeId);
      if (target) target.classList.add('active');
    }
  </script>
</body>
</html>
