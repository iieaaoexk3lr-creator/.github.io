<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アモアス通話リモコン</title>
  <script src="https://meet.jit.si/external_api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 8px; }
    
    .status-box { font-size: 12px; color: #f1c40f; margin-bottom: 8px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 2×2のグリッドレイアウト */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 横に半分ずつ2つ並べる */
      gap: 6px;
      max-width: 320px;
      margin: 0 auto;
    }

    button {
      padding: 12px 4px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
      outline: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }

    .btn-play { background: #c0392b; }  /* 赤：ゲーム開始 */
    .btn-meet { background: #27ae60; }  /* 緑：会議 */
    .btn-reset { background: #2980b9; } /* 青：決着 */
    .btn-ghost { background: #8e44ad; } /* 紫：天界 */

    /* 選択中のボタンを光らせる（アニメーション付き） */
    button.active {
      border-color: #fff !important;
      box-shadow: 0 0 12px #fff, inset 0 0 8px rgba(255,255,255,0.5);
      transform: scale(0.98);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 8px #fff, inset 0 0 4px rgba(255,255,255,0.5); }
      100% { box-shadow: 0 0 18px #fff, 0 0 10px #fff, inset 0 0 10px rgba(255,255,255,0.8); }
    }

    #meet { width: 1px; height: 1px; opacity: 0; }
  </style>
</head>
<body>

  <div class="status-box" id="status">接続中...</div>

  <div class="btn-grid">
    <button id="btn-play" class="btn-play" onclick="sendSignal('PLAY_START')">
      🎮 ゲーム開始<span>(生者ミュート)</span>
    </button>
    <button id="btn-meet" class="btn-meet" onclick="sendSignal('MEETING_START')">
      📣 会議<span>(マイクON)</span>
    </button>
    <button id="btn-reset" class="btn-reset" onclick="sendSignal('RESET_GAME')">
      🔄 決着<span>(全員復活)</span>
    </button>
    <button id="btn-ghost" class="btn-ghost" onclick="goToGhostRoom()">
      💀 やられた<span>(天界移動)</span>
    </button>
  </div>

  <div id="meet"></div>

  <script>
    const domain = 'meet.jit.si';
    let api = null;
    let currentRoom = '';

    // 接続初期化
    goToLiveRoom();

    function goToLiveRoom() {
      document.getElementById('status').innerText = '状態：生者ルーム（プレイ中）';
      joinRoom('AmongUs_Live_Room_2026', true);
      setActiveButton('btn-play'); // 初期状態は「ゲーム開始（ミュート）」を発光
    }

    function goToGhostRoom() {
      document.getElementById('status').innerText = '状態：👻 天界（常時通話OK）';
      joinRoom('AmongUs_Ghost_Room_2026', false);
      setActiveButton('btn-ghost'); // 天界移動時は「やられた」を発光
    }

    function joinRoom(roomName, isMuted) {
      if (api) api.dispose();
      currentRoom = roomName;

      api = new JitsiMeetExternalAPI(domain, {
        roomName: roomName,
        parentNode: document.querySelector('#meet'),
        configOverwrite: { startWithAudioMuted: isMuted }
      });

      api.addEventListener('endpointTextMessageReceived', function(event) {
        handleSignal(event.data.eventData.text);
      });
    }

    function sendSignal(command) {
      if (api) {
        api.executeCommand('sendEndpointTextMessage', '', command);
      }
      handleSignal(command);
    }

    function handleSignal(command) {
      if (command === 'PLAY_START' && currentRoom === 'AmongUs_Live_Room_2026') {
        api.executeCommand('setAudioMute', true);
        setActiveButton('btn-play');
        document.getElementById('status').innerText = '状態：生者（ミュート中）';
      } else if (command === 'MEETING_START' && currentRoom === 'AmongUs_Live_Room_2026') {
        api.executeCommand('setAudioMute', false);
        setActiveButton('btn-meet');
        document.getElementById('status').innerText = '状態：生者（会話中）';
      } else if (command === 'RESET_GAME') {
        goToLiveRoom();
      }
    }

    // ボタンの発光表示を切り替える関数
    function setActiveButton(activeId) {
      const buttons = document.querySelectorAll('.btn-grid button');
      buttons.forEach(btn => btn.classList.remove('active'));
      const target = document.getElementById(activeId);
      if (target) target.classList.add('active');
    }
  </script>
</body>
</html>
