<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アモアス通話リモコン（Jitsi UI表示版）</title>
  <script src="https://meet.jit.si/external_api.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 8px; }
    
    /* 入室画面 */
    #room-login {
      max-width: 320px;
      margin: 30px auto;
      padding: 20px;
      background: #222;
      border-radius: 12px;
      border: 1px solid #444;
    }
    #room-login input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #555;
      margin-bottom: 12px;
      background: #333;
      color: #fff;
      text-align: center;
    }
    #room-login button {
      width: 100%;
      padding: 12px;
      background: #27ae60;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #main-app { display: none; }

    .status-box { 
      font-size: 13px; 
      color: #f1c40f; 
      margin-bottom: 8px; 
      font-weight: bold; 
      padding: 6px;
      background: #222;
      border-radius: 6px;
    }
    .room-title { font-size: 12px; color: #aaa; margin-bottom: 6px; }

    /* ボタン配置 */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-width: 400px;
      margin: 0 auto 12px auto;
    }

    .btn-grid button {
      padding: 12px 4px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: all 0.15s ease;
      outline: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }

    .btn-grid button:active { transform: scale(0.95); }

    .btn-play { background: #c0392b; }  /* 赤：ゲーム中 */
    .btn-meet { background: #27ae60; }  /* 緑：会議・ロビー */
    .btn-reset { background: #2980b9; } /* 青：決着 */
    .btn-ghost { background: #8e44ad; } /* 紫：天界 */

    button.active {
      border-color: #fff !important;
      box-shadow: 0 0 10px #fff;
      transform: scale(0.98);
    }

    /* 埋め込みJitsi画面エリア */
    #meet-container {
      width: 100%;
      max-width: 500px;
      height: 280px; /* 操作UIが見やすい高さ */
      margin: 0 auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #444;
    }

    #meet {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- 1. 入室画面 -->
  <div id="room-login">
    <h3 style="margin-bottom: 12px;">通話ルームに入室</h3>
    <input type="text" id="room-input" placeholder="部屋名 (例: team1)" />
    <button onclick="enterRoom()">入室する</button>
  </div>

  <!-- 2. メイン操作画面 -->
  <div id="main-app">
    <div class="room-title" id="room-display">部屋名: -</div>
    <div class="status-box" id="status">接続中...</div>

    <!-- リモコンボタン -->
    <div class="btn-grid">
      <button id="btn-play" class="btn-play" onclick="setGameState('MUTE_ROOM')">
        🎮 ゲーム開始<span>(無音部屋へ移動)</span>
      </button>
      <button id="btn-meet" class="btn-meet" onclick="setGameState('LIVE_ROOM')">
        📣 会議 / ロビー<span>(通話部屋へ移動)</span>
      </button>
      <button id="btn-reset" class="btn-reset" onclick="setGameState('RESET_GAME')">
        🔄 決着<span>(全員を会議部屋へ)</span>
      </button>
      <button id="btn-ghost" class="btn-ghost" onclick="clickGhost()">
        💀 やられた<span>(自分だけ天界へ)</span>
      </button>
    </div>

    <!-- 3. Jitsi UI 埋め込みエリア -->
    <div id="meet-container">
      <div id="meet"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
      authDomain: "gamehistory-m84.firebaseapp.com",
      databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
      projectId: "gamehistory-m84",
      storageBucket: "gamehistory-m84.firebasestorage.app",
      messagingSenderId: "475761727837",
      appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
      measurementId: "G-3636W6LC4F"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const domain = 'meet.jit.si';
    let currentRoomName = '';
    let stateRef = null;
    let api = null;
    let isGhost = false;
    let currentConnectedRoom = '';

    function enterRoom() {
      const input = document.getElementById('room-input').value.trim();
      if (!input) {
        alert('部屋名を入力してください');
        return;
      }

      currentRoomName = input;

      document.getElementById('room-login').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('room-display').innerText = '部屋名: ' + currentRoomName;

      stateRef = db.ref('tu-wa/' + currentRoomName);
      listenToFirebase();
    }

    function listenToFirebase() {
      stateRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data || !data.current_state) {
          switchRoom('LIVE');
          return;
        }

        const state = data.current_state;

        if (state === 'MUTE_ROOM') {
          if (!isGhost) switchRoom('MUTE');
        } else if (state === 'LIVE_ROOM') {
          if (!isGhost) switchRoom('LIVE');
        } else if (state === 'RESET_GAME') {
          isGhost = false;
          switchRoom('LIVE');
        }
      });
    }

    function setGameState(newState) {
      if (stateRef) {
        stateRef.set({
          current_state: newState,
          updatedAt: Date.now()
        });
      }
    }

    function clickGhost() {
      if (isGhost) return;
      isGhost = true;
      switchRoom('GHOST');
    }

    function switchRoom(targetType) {
      const fullRoomName = 'tu-wa_' + currentRoomName + '_' + targetType;

      if (currentConnectedRoom === fullRoomName && api) return;

      if (api) {
        try { api.dispose(); } catch (e) {}
        api = null;
      }

      currentConnectedRoom = fullRoomName;
      const startMuted = (targetType === 'MUTE');

      // Jitsi埋め込み設定（操作バー・設定メニューを表示）
      api = new JitsiMeetExternalAPI(domain, {
        roomName: fullRoomName,
        parentNode: document.querySelector('#meet'),
        configOverwrite: { 
          startWithAudioMuted: startMuted,
          startWithVideoMuted: true, // カメラは初期OFF
          prejoinPageEnabled: false,  // 入室前確認画面をスキップ
          // 表示するツールバー（マイク・設定・切断等）
          toolbarButtons: ['microphone', 'settings', 'hangup']
        },
        interfaceConfigOverwrite: {
          SHOW_JITSI_WATERMARK: false,
          MOBILE_APP_PROMPT: false
        }
      });

      if (targetType === 'MUTE') {
        document.getElementById('status').innerText = '状態：🎮 ゲーム中（無音部屋）';
        setActiveButton('btn-play');
      } else if (targetType === 'LIVE') {
        document.getElementById('status').innerText = '状態：📣 会議 / ロビー（会話中）';
        setActiveButton('btn-meet');
      } else if (targetType === 'GHOST') {
        document.getElementById('status').innerText = '状態：💀 天界（幽霊会話中）';
        setActiveButton('btn-ghost');
      }
    }

    function setActiveButton(activeId) {
      const buttons = document.querySelectorAll('.btn-grid button');
      buttons.forEach(btn => btn.classList.remove('active'));
      const target = document.getElementById(activeId);
      if (target) target.classList.add('active');
    }
  </script>
</body>
</html>
