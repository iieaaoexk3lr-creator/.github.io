<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バラエティ・パーティー - カラオケ企画</title>
<style>
  :root {
    --bg-color: #0b0d17;
    --card-bg: #161a2e;
    --text-main: #ffffff;
    --color-variety: #9d50bb; /* パープル */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Avenir Next', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    text-align: center;
    padding: 40px 15px 100px 15px;
    background-image: radial-gradient(circle at 50% 50%, rgba(157, 80, 187, 0.03) 0%, transparent 50%);
  }

  .container { max-width: 550px; margin: 0 auto; }

  h1 {
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 30px;
    color: #d4b1ff; /* 文字色が見えやすいように少し明るめの紫 */
    text-shadow: 0 0 15px rgba(157, 80, 187, 0.3);
  }

  .item-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 40px;
  }

  /* ボタン共通スタイル */
  a.btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    border-radius: 18px;
    padding: 18px 10px;
    height: 110px;
    font-size: 1rem;
    line-height: 1.3;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(5px);
  }

  a.btn span:first-child {
    font-size: 1.8rem;
    margin-bottom: 10px;
  }

  a.btn:hover {
    transform: translateY(-5px) scale(1.02);
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.15);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5);
    border-bottom: 4px solid var(--color-variety);
    color: #d4b1ff;
  }

  a.btn:active { transform: translateY(-2px) scale(0.97); }

  /* 戻るボタン */
  .back-menu {
    display: inline-block;
    padding: 14px 32px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #b0b8d0;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .back-menu:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  @media (max-width: 450px) {
    .item-grid { grid-template-columns: 1fr; }
    a.btn {
      height: 75px;
      flex-direction: row;
      justify-content: flex-start;
      padding: 0 24px;
      gap: 18px;
    }
    a.btn span:first-child { margin-bottom: 0; font-size: 1.6rem; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🥳 バラエティ・パーティー</h1>

    <a href="setumei.html" class="btn"><span>🎤</span><span>説明クイズ</span></a>
    <a href="pictimage.html" class="btn"><span>🎨</span><span>この絵は何？</span></a>
    <a href="ito.html" class="btn"><span>🎨</span><span>イト？</span></a>
    <a href="irairabo.html.html" class="btn"><span>🫪</span><span>ドキドキ棒</span></a>   
    <a href="CSVquiz.html" class="btn"><span>👨‍🎓</span><span>クイズ</span></a>
    <a href="jinroQ.html" class="btn"><span>🐺</span><span>人狼クイズ</span></a>
    <a href="renda.html" class="btn"><span>🐺</span><span>ボタン連打ゲーム</span></a>
  </div>

  <a href="index.html" class="back-menu">◀ メニューに戻る</a>
</div>

</body>
</html>
