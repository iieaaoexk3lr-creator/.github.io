<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>意思電信ゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --danger: #ea4335; --admin: #f8f9fa; --accent: #673ab7; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; color: #333; margin:0; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: 10px auto; position: relative; }
        h1 { font-size: 1.6rem; color: var(--primary); margin: 0 0 10px 0; }
        
        .mode-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; margin-bottom: 10px; font-size: 0.85rem; }
        .mode-match { background: #e8f0fe; color: var(--primary); }
        .mode-unmatch { background: #fce4ec; color: #d81b60; }
        .mode-majority { background: #e8f5e9; color: var(--success); }
        .mode-minority { background: #f3e5f5; color: var(--accent); }

        .odai-display { background: #fff9c4; padding: 15px; border-radius: 12px; margin: 15px 0; font-weight: bold; font-size: 1.1rem; border: 2px solid #fbc02d; color: #856404; min-height: 1.5rem; }
        
        .input-group { display: flex; gap: 5px; margin-bottom: 5px; }
        select, input { padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; width: 100%; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 5px; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .icon-btn { width: 50px; background:#6c757d; color:white; margin:0; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        #sendBtn { background: var(--primary); color: white; font-size: 18px; margin-top: 15px; }

        /* 管理パネル */
        #adminPanel { display: none; background: var(--admin); padding: 20px; border-radius: 15px; margin-top: 20px; border: 2px solid #ddd; text-align: left; }
        
        #setupArea { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; display: flex; align-items: center; justify-content: center; z-index: 100; overflow-y: auto; }
        .answer-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; align-items: center; }
        .winner-row { background: #e8f5e9; font-weight: bold; }
        .odai-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; text-align: left; }
    </style>
</head>
<body>

<!-- 入室画面 -->
<div id="setupArea">
    <div class="card">
        <h1>意思電信ゲーム</h1>
        <input type="text" id="roomInput" placeholder="部屋の合言葉" style="margin-bottom:10px;">
        <input type="text" id="nameInputInitial" placeholder="名前">
        <button id="joinBtn" style="background: var(--primary); color: white;">入室する</button>
    </div>
</div>

<!-- メイン画面 -->
<div class="card">
    <h1>意思電信ゲーム</h1>
    <div id="modeDisplay" class="mode-badge mode-match">一致モード</div>

    <div id="odaiDisplay" class="odai-display">お題を待っています...</div>
    
    <div id="odaiInputArea">
        <div class="input-group">
            <select id="genreSelect" style="flex: 1;">
                <option value="all">全ジャンル</option>
                <option value="食べ物">食べ物</option>
                <option value="生き物">生き物</option>
                <option value="日常">日常</option>
                <option value="カラオケ">カラオケ</option>
                <option value="カスタム">カスタム</option>
            </select>
            <button id="randomOdaiBtn" class="icon-btn">🎲</button>
        </div>
        <input type="text" id="odaiInput" placeholder="お題を自由に入力">
        <button id="setOdaiBtn" style="background:#444; color:white;">お題を決定！</button>
    </div>

    <div id="gamePlayArea">
        <input type="text" id="answerInput" placeholder="回答を入力...">
        <button id="sendBtn">回答を送信</button>
    </div>
    
    <div id="resultArea" style="margin-top:20px;"></div>

    <button id="toggleAdminBtn" style="background:#eee; color:#666; margin-top:30px;">管理進行</button>

    <!-- 管理画面 -->
    <div id="adminPanel">
        <h3 style="margin-top:0;">ADMIN</h3>
        <button id="modeBtn" style="background:var(--accent); color:white;">モード切替</button>
        <button id="revealBtn" style="background:var(--success); color:white;">結果公開</button>
        <button id="resetBtn" style="background:var(--danger); color:white;">リセット</button>
        <button id="saveMasterBtn" style="background:#6c757d; color:white;">このお題をDB保存</button>
        <button id="closeAdminBtn" style="background:#ccc; color:#333;">閉じる</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, setDoc, addDoc, doc, onSnapshot, query, orderBy, getDocs, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD5ZZ0LKTthtZ3WbZ-rKpocumbalrYBuHU",
        authDomain: "zenin-itchi-game.firebaseapp.com",
        projectId: "zenin-itchi-game",
        storageBucket: "zenin-itchi-game.firebasestorage.app",
        messagingSenderId: "1063543597468",
        appId: "1:1063543597468:web:e3f3c1caf9158e25544059"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let roomId = "", userName = "", currentMode = "match";
    const modes = ["match", "unmatch", "majority", "minority"];
    const modeLabels = { match: "一致モード", unmatch: "不一致モード", majority: "多数派勝利モード", minority: "少数派勝利モード" };

    // 管理パネル開閉
    document.getElementById('toggleAdminBtn').onclick = () => document.getElementById('adminPanel').style.display = "block";
    document.getElementById('closeAdminBtn').onclick = () => document.getElementById('adminPanel').style.display = "none";

    document.getElementById('joinBtn').onclick = async () => {
        roomId = document.getElementById('roomInput').value.trim();
        userName = document.getElementById('nameInputInitial').value.trim();
        if (!roomId || !userName) return alert("入力してください");
        document.getElementById('setupArea').style.display = "none";
        startGame();
    };

    function updateGenreDropdown(mode) {
        const select = document.getElementById('genreSelect');
        const hasBinary = Array.from(select.options).some(o => o.value === "二者択一");
        if ((mode === "majority" || mode === "minority") && !hasBinary) {
            const opt = document.createElement("option");
            opt.value = "二者択一"; opt.text = "二者択一";
            select.add(opt);
        } else if ((mode === "match" || mode === "unmatch") && hasBinary) {
            for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].value === "二者択一") select.remove(i);
            }
        }
    }

    function startGame() {
        const configRef = doc(db, "rooms", roomId, "settings", "main");
        const answersRef = collection(db, "rooms", roomId, "answers");

        onSnapshot(configRef, (docSnap) => {
            if (!docSnap.exists()) return;
            const config = docSnap.data();
            currentMode = config.mode || "match";
            updateGenreDropdown(currentMode);
            
            document.getElementById('modeDisplay').innerText = modeLabels[currentMode];
            document.getElementById('modeDisplay').className = `mode-badge mode-${currentMode}`;
            document.getElementById('odaiDisplay').innerText = config.text ? `お題：${config.text}` : "お題を待機中...";
            document.getElementById('odaiInputArea').style.display = config.text ? "none" : "block";

            onSnapshot(query(answersRef, orderBy("time", "asc")), (snapshot) => {
                if (config.revealed) {
                    const ansData = snapshot.docs.map(d => d.data());
                    const counts = {}; ansData.forEach(a => counts[a.text] = (counts[a.text] || 0) + 1);
                    let winners = [];
                    if (currentMode === "match") winners = (new Set(ansData.map(d=>d.text))).size === 1 ? ansData.map(d=>d.text) : [];
                    else if (currentMode === "unmatch") winners = (new Set(ansData.map(d=>d.text))).size === ansData.length ? ansData.map(d=>d.text) : [];
                    else if (currentMode === "majority") { const max = Math.max(...Object.values(counts)); Object.keys(counts).forEach(k => { if(counts[k] === max) winners.push(k); }); }
                    else if (currentMode === "minority") { const min = Math.min(...Object.values(counts)); Object.keys(counts).forEach(k => { if(counts[k] === min) winners.push(k); }); }

                    document.getElementById('resultArea').innerHTML = ansData.map(d => `
                        <div class="answer-item ${winners.includes(d.text) ? 'winner-row' : ''}">
                            <span>${d.name} ${winners.includes(d.text) ? '👑' : ''}</span><b>${d.text}</b>
                        </div>`).join("");
                } else { document.getElementById('resultArea').innerHTML = ""; }
            });
        });

        document.getElementById('randomOdaiBtn').onclick = async () => {
            const genre = document.getElementById('genreSelect').value;
            let q = collection(db, "master_odai");
            if (genre !== "all") q = query(q, where("category", "==", genre));
            else q = query(q, where("category", "!=", "二者択一")); // 全ジャンル時は二者択一を除外
            const snap = await getDocs(q);
            const list = snap.docs.map(d => d.data().text);
            if(list.length > 0) document.getElementById('odaiInput').value = list[Math.floor(Math.random() * list.length)];
        };

        document.getElementById('setOdaiBtn').onclick = () => setDoc(configRef, { text: document.getElementById('odaiInput').value.trim(), revealed: false }, { merge: true });
        document.getElementById('sendBtn').onclick = () => setDoc(doc(db, "rooms", roomId, "answers", userName), { name: userName, text: document.getElementById('answerInput').value.trim(), time: Date.now() });
        document.getElementById('modeBtn').onclick = () => { let next = modes[(modes.indexOf(currentMode) + 1) % modes.length]; setDoc(configRef, { mode: next }, { merge: true }); };
        document.getElementById('revealBtn').onclick = () => setDoc(configRef, { revealed: true }, { merge: true });
        document.getElementById('resetBtn').onclick = async () => {
            const snap = await getDocs(answersRef);
            const batch = writeBatch(db); snap.docs.forEach(d => batch.delete(d.ref));
            batch.set(configRef, { text: "", revealed: false }); await batch.commit();
        };
        document.getElementById('saveMasterBtn').onclick = async () => {
            const text = document.getElementById('odaiInput').value.trim();
            const cat = document.getElementById('genreSelect').value;
            if(!text || cat === "all") return alert("入力しジャンルを選択");
            await addDoc(collection(db, "master_odai"), { text, category: cat }); alert("保存しました");
        };
    }
</script>
</body>
</html>
