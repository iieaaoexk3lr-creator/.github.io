<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全員一致ゲーム</title>
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --danger: #ea4335; --admin: #fff3cd; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; color: #333; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        h1 { font-size: 1.5rem; color: var(--primary); margin: 0; }
        .room-label { font-size: 0.8rem; background: #eee; padding: 2px 10px; border-radius: 10px; margin-bottom: 10px; display: inline-block; }
        
        .mode-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; margin-bottom: 10px; font-size: 0.85rem; }
        .mode-match { background: #e8f0fe; color: var(--primary); }
        .mode-unmatch { background: #fce4ec; color: #d81b60; }

        .odai-display { background: #fff9c4; padding: 15px; border-radius: 12px; margin: 15px 0; font-weight: bold; font-size: 1.1rem; border: 2px solid #fbc02d; color: #856404; min-height: 1.5rem; }
        input { width: 100%; padding: 12px; box-sizing: border-box; margin: 8px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 5px; }
        #sendBtn { background: var(--primary); color: white; }
        
        #adminPanel { display: none; background: var(--admin); padding: 15px; border-radius: 15px; margin-top: 20px; border: 1px solid #ffeeba; }
        #resetBtn { background: var(--danger); color: white; margin-top: 10px; }

        .counter-box { display: flex; justify-content: space-around; margin: 10px 0; font-size: 0.85rem; font-weight: bold; color: #666; }
        .counter-val { color: var(--primary); font-size: 1.2rem; }
        
        .answer-item { display: flex; justify-content: space-between; background: #f8f9fa; border: 1px solid #eee; padding: 10px 15px; border-radius: 10px; margin: 6px 0; font-weight: bold; }
        #setupArea { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; display: flex; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

<div id="setupArea">
    <div class="card">
        <h1>全員一致ゲーム</h1>
        <p style="font-size: 0.9rem; color: #666;">合言葉を決めて入室</p>
        <input type="text" id="roomInput" placeholder="合言葉 (例: 忘年会)">
        <input type="text" id="nameInputInitial" placeholder="あなたの名前">
        <button id="joinBtn" style="background: var(--primary); color: white;">入室する</button>
    </div>
</div>

<div class="card">
    <div id="currentRoomLabel" class="room-label">合言葉: -</div>
    <h1>全員一致ゲーム</h1>
    <div id="modeDisplay" class="mode-badge mode-match">待機中...</div>

    <div class="counter-box">
        <div>入室中: <span id="memberCount" class="counter-val">0</span> 人</div>
        <div>回答済み: <span id="answerCount" class="counter-val">0</span> 人</div>
    </div>

    <div id="odaiDisplay" class="odai-display">お題を待っています...</div>
    
    <div id="odaiInputArea">
        <input type="text" id="odaiInput" placeholder="新しいお題を入力">
        <button id="setOdaiBtn" style="background:#6c757d; color:white;">お題を全員に送信</button>
    </div>

    <input type="text" id="answerInput" placeholder="回答を入力してください">
    <button id="sendBtn">回答を送信</button>

    <div id="resultArea"></div>

    <div id="adminPanel">
        <button id="modeBtn" style="background:#9c27b0; color:white;">モード切替（一致 ⇔ 不一致）</button>
        <button id="revealBtn" style="background:var(--success); color:white;">結果を全員に公開！</button>
        <button id="resetBtn">お題をリセット（モードは維持）</button>
    </div>

    <div id="passArea" style="margin-top:20px; font-size: 0.75rem; color: #999;">
        管理キーでメニュー表示
        <input type="password" id="passInput" placeholder="Key..." style="height:30px; width:80px;">
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, setDoc, doc, onSnapshot, query, orderBy, getDocs, writeBatch, deleteDoc, serverTimestamp } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD5ZZ0LKTthtZ3WbZ-rKpocumbalrYBuHU",
        authDomain: "zenin-itchi-game.firebaseapp.com",
        projectId: "zenin-itchi-game",
        storageBucket: "zenin-itchi-game.firebasestorage.app",
        messagingSenderId: "1063543597468",
        appId: "1:1063543597468:web:e3f3c1caf9158e25544059",
        measurementId: "G-JNZ3QL1TGT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let roomId = "";
    let userName = "";
    let currentMode = "match";

    document.getElementById('joinBtn').onclick = async () => {
        roomId = document.getElementById('roomInput').value.trim();
        userName = document.getElementById('nameInputInitial').value.trim();
        if (!roomId || !userName) return alert("入力してください");
        
        document.getElementById('setupArea').style.display = "none";
        document.getElementById('currentRoomLabel').innerText = `合言葉: ${roomId} / 名前: ${userName}`;
        
        // 入室を記録（プレゼンス代わり）
        const memberRef = doc(db, "rooms", roomId, "members", userName);
        await setDoc(memberRef, { lastSeen: serverTimestamp() });

        startGame();
    };

    function startGame() {
        const configRef = doc(db, "rooms", roomId, "settings", "main");
        const answersRef = collection(db, "rooms", roomId, "answers");
        const membersRef = collection(db, "rooms", roomId, "members");

        // メンバー数の監視
        onSnapshot(membersRef, (snap) => {
            document.getElementById('memberCount').innerText = snap.size;
        });

        onSnapshot(configRef, (docSnap) => {
            if (!docSnap.exists()) {
                setDoc(configRef, { mode: "match", revealed: false, text: "" });
                return;
            }
            const config = docSnap.data();
            currentMode = config.mode;
            
            document.getElementById('modeDisplay').innerText = config.mode === "unmatch" ? "ミッション：全員バラバラ" : "ミッション：全員一致";
            document.getElementById('modeDisplay').className = config.mode === "unmatch" ? "mode-badge mode-unmatch" : "mode-badge mode-match";
            document.getElementById('odaiDisplay').innerText = config.text ? `お題：${config.text}` : "お題を待っています...";
            document.getElementById('odaiInputArea').style.display = config.text ? "none" : "block";

            onSnapshot(query(answersRef, orderBy("time", "asc")), (snapshot) => {
                const answersData = snapshot.docs.map(doc => doc.data());
                document.getElementById('answerCount').innerText = answersData.length;
                
                if (config.revealed) {
                    const answers = answersData.map(d => d.text);
                    let isSuccess = (config.mode === "unmatch") 
                        ? answers.length > 0 && (new Set(answers)).size === answers.length
                        : answers.length > 0 && answers.every(v => v === answers[0]);

                    let html = answersData.map(d => `<div class="answer-item"><span>${d.name}</span><span>${d.text}</span></div>`).join("");
                    html += isSuccess ? `<h2 style="color:var(--success)">SUCCESS！✨</h2>` : `<h2 style="color:var(--danger)">FAILED...💦</h2>`;
                    document.getElementById('resultArea').innerHTML = html;
                } else {
                    document.getElementById('resultArea').innerHTML = "";
                }
            });
        });

        document.getElementById('setOdaiBtn').onclick = () => {
            const val = document.getElementById('odaiInput').value.trim();
            if(val) setDoc(configRef, { text: val }, { merge: true });
        };
        document.getElementById('modeBtn').onclick = () => setDoc(configRef, { mode: currentMode === "match" ? "unmatch" : "match" }, { merge: true });
        document.getElementById('revealBtn').onclick = () => setDoc(configRef, { revealed: true }, { merge: true });
        document.getElementById('sendBtn').onclick = () => {
            const text = document.getElementById('answerInput').value.trim();
            if (text) setDoc(doc(db, "rooms", roomId, "answers", userName), { name: userName, text, time: Date.now() });
            document.getElementById('answerInput').value = "";
            alert("送信しました");
        };

        // リセット処理（モードを維持）
        document.getElementById('resetBtn').onclick = async () => {
            if (!confirm("お題と回答をリセットしますか？（モードは維持されます）")) return;
            const snap = await getDocs(answersRef);
            const batch = writeBatch(db);
            snap.docs.forEach(d => batch.delete(d.ref));
            // モード(currentMode)を再セットすることで維持
            batch.set(configRef, { text: "", revealed: false, mode: currentMode });
            await batch.commit();
        };
    }

    document.getElementById('passInput').addEventListener('input', (e) => {
        if (e.target.value === "0001") {
            document.getElementById('adminPanel').style.display = "block";
            document.getElementById('passArea').style.display = "none";
        }
    });
</script>
</body>
</html>
