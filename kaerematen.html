<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全員一致/不一致ゲーム・完全同期版</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; color: #333; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        h1 { font-size: 1.5rem; color: #1a73e8; margin-bottom: 5px; }
        .mode-badge { display: inline-block; padding: 5px 15px; border-radius: 15px; font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; }
        .mode-match { background: #e8f0fe; color: #1a73e8; }
        .mode-unmatch { background: #fce4ec; color: #d81b60; }
        .odai-display { background: #fff9c4; padding: 15px; border-radius: 10px; margin: 15px 0; font-weight: bold; font-size: 1.2rem; border: 2px solid #fbc02d; color: #856404; min-height: 1.2rem; }
        input { width: 100%; padding: 12px; box-sizing: border-box; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; margin-top: 5px; }
        #sendBtn { background: #1a73e8; color: white; }
        #setOdaiBtn { background: #6c757d; color: white; }
        #modeBtn { background: #9c27b0; color: white; display: none; }
        #revealBtn { background: #34a853; color: white; display: none; }
        #resetBtn { background: #ea4335; color: white; margin-top: 20px; font-size: 12px; opacity: 0.7; }
        .answer-item { display: flex; justify-content: space-between; background: #f8f9fa; border: 1px solid #eee; padding: 8px 15px; border-radius: 10px; margin: 5px; font-weight: bold; }
        .pass-section { margin-top: 15px; font-size: 0.9rem; background: #fff3cd; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>全員一致ゲーム</h1>
    <div id="modeDisplay" class="mode-badge mode-match">読込中...</div>

    <input type="text" id="userName" placeholder="あなたの名前">
    <div id="odaiDisplay" class="odai-display">お題を待っています...</div>
    
    <div id="odaiInputArea">
        <input type="text" id="odaiInput" placeholder="新しいお題を入力">
        <button id="setOdaiBtn">お題を全員に送信</button>
    </div>

    <div id="status">接続中...</div>
    <input type="text" id="answerInput" placeholder="回答を入力してください">
    
    <div class="btn-group">
        <button id="sendBtn">回答を送信/上書き</button>
        <div class="pass-section" id="passArea">
            管理用キーを入力：
            <input type="password" id="passInput" placeholder="Key...">
        </div>
        <button id="modeBtn">モード切替（一致⇔不一致）</button>
        <button id="revealBtn">結果を全員に公開！</button>
    </div>

    <div id="resultArea"></div>
    <button id="resetBtn">リセット(キー)</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, setDoc, doc, onSnapshot, query, orderBy, getDocs, writeBatch } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD5ZZ0LKTthtZ3WbZ-rKpocumbalrYBuHU",
        authDomain: "zenin-itchi-game.firebaseapp.com",
        projectId: "zenin-itchi-game",
        storageBucket: "zenin-itchi-game.firebasestorage.app",
        messagingSenderId: "1063543597468",
        appId: "1:1063543597468:web:e3f3c1caf9158e25544059",
        measurementId: "G-JNZ3QL1TGT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "answers");
    const configDocRef = doc(db, "config", "main"); // 参照先をシンプルに固定

    // --- 名前保持 ---
    const nameInput = document.getElementById('userName');
    if (localStorage.getItem('zenin_itchi_name')) nameInput.value = localStorage.getItem('zenin_itchi_name');
    nameInput.addEventListener('change', () => localStorage.setItem('zenin_itchi_name', nameInput.value));

    // --- Firebase状態監視 ---
    let currentMode = "match";
    onSnapshot(configDocRef, (docSnap) => {
        if (!docSnap.exists()) {
            // データがなければ初期値を作成
            setDoc(configDocRef, { mode: "match", revealed: false, text: "" });
            return;
        }
        const data = docSnap.data();
        currentMode = data.mode;
        
        // モード表示更新
        const modeDisp = document.getElementById('modeDisplay');
        modeDisp.innerText = data.mode === "unmatch" ? "モード：全員不一致" : "モード：全員一致";
        modeDisp.className = data.mode === "unmatch" ? "mode-badge mode-unmatch" : "mode-badge mode-match";

        // お題表示更新
        document.getElementById('odaiDisplay').innerText = data.text ? `お題：${data.text}` : "お題を待っています...";
        document.getElementById('odaiInputArea').style.display = data.text ? "none" : "block";

        // 回答判定（ネストして常に最新データと同期）
        onSnapshot(query(colRef, orderBy("time", "asc")), (snapshot) => {
            const answersData = snapshot.docs.map(doc => doc.data());
            document.getElementById('status').innerText = `現在 ${answersData.length} 人が回答済み`;
            
            if (data.revealed) {
                const answers = answersData.map(d => d.text);
                let isSuccess = false;
                if (data.mode === "unmatch") {
                    isSuccess = answers.length > 0 && (new Set(answers)).size === answers.length;
                } else {
                    isSuccess = answers.length > 0 && answers.every(v => v === answers[0]);
                }

                let html = answersData.map(d => `<div class="answer-item"><span>${d.name}</span><span>${d.text}</span></div>`).join("");
                html += isSuccess ? `<h2 style="color:green">成功！✨</h2>` : `<h2 style="color:red">失敗...💦</h2>`;
                document.getElementById('resultArea').innerHTML = html;
            } else {
                document.getElementById('resultArea').innerHTML = "";
            }
        });
    });

    // --- 管理用キー入力 ---
    document.getElementById('passInput').addEventListener('input', (e) => {
        if (e.target.value === "0001") {
            document.getElementById('modeBtn').style.display = "block";
            document.getElementById('revealBtn').style.display = "block";
            document.getElementById('passArea').style.display = "none";
        }
    });

    // --- 各種ボタン処理 ---
    document.getElementById('modeBtn').onclick = () => setDoc(configDocRef, { mode: currentMode === "match" ? "unmatch" : "match" }, { merge: true });
    document.getElementById('setOdaiBtn').onclick = () => {
        const val = document.getElementById('odaiInput').value.trim();
        if(val) setDoc(configDocRef, { text: val }, { merge: true });
    };
    document.getElementById('revealBtn').onclick = () => setDoc(configDocRef, { revealed: true }, { merge: true });
    document.getElementById('sendBtn').onclick = () => {
        const name = nameInput.value.trim();
        const text = document.getElementById('answerInput').value.trim();
        if (name && text) setDoc(doc(db, "answers", name), { name, text, time: Date.now() });
        document.getElementById('answerInput').value = "";
    };

    document.getElementById('resetBtn').onclick = async () => {
        if (prompt("キーを入力") !== "0001") return;
        const batch = writeBatch(db);
        const snap = await getDocs(colRef);
        snap.docs.forEach(d => batch.delete(d.ref));
        batch.set(configDocRef, { text: "", revealed: false, mode: "match" });
        await batch.commit();
        location.reload(); // 確実にリセットするためにリロード
    };
</script>
</body>
</html>
