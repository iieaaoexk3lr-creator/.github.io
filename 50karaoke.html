<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>50カラオケ</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 20px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    max-width: 700px;
    margin: 0 auto 20px;
  }

  .cell {
    background: #333;
    padding: 10px 0;
    border-radius: 6px;
    font-size: 1.2rem;
  }

  .empty {
    background: transparent;
  }

  .filled {
    background: #ff66cc;
    color: #000;
    font-weight: bold;
  }

  #inputs {
    margin-top: 20px;
  }

  input {
    width: 80%;
    max-width: 350px;
    padding: 10px;
    margin: 6px;
    font-size: 1.2rem;
    border-radius: 8px;
    border: none;
  }

  #count {
    font-size: 1.4rem;
    margin-top: 15px;
    color: #00ffcc;
  }

  #themeBox {
    margin: 20px auto;
    padding: 15px;
    background: #222;
    border-radius: 10px;
    max-width: 600px;
  }

  #themeText {
    font-size: 1.3rem;
    margin-bottom: 10px;
    color: #ffdd55;
  }

  #themeList {
    margin-top: 10px;
  }

  .themeItem {
    background: #444;
    padding: 8px;
    margin: 5px;
    border-radius: 8px;
    cursor: pointer;
  }

  .themeItem:hover {
    background: #666;
  }

  button {
    font-size: 1.2rem;
    padding: 10px 20px;
    margin: 6px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }
</style>
</head>

<!-- ▼ 説明文（最新版） -->
<div id="rules">
  <b>【ルール】</b><br><br>
  ・入力欄に曲名をひらがなで入力してください。<br>
  ・入力された曲名に含まれるすべての「ひらがな」が表に反映されます。<br>
  ・清音・濁音・半濁音・小さい文字（っ、ゃ、ゅ、ょ、ぁ、ぃ など）も対応しています。<br>
  ・入力を消すと枠の色も元に戻ります。<br>
  ・お題は直接入力するか「ランダム」「選択」からカテゴリ切替して選べます。
</div>

<body>

<h1>50カラオケ（五十音を曲名で埋めよう）</h1>

<!-- ▼ お題欄（デザイン維持） -->
<div id="themeBox">
  <div id="themeText">お題：なし</div>

  <!-- ▼ カテゴリ追加 -->
  <div style="margin-bottom:10px;">
    カテゴリ：
    <select id="categorySelect">
      <option value="all">すべて</option>
      <option value="normal" selected>通常</option>
      <option value="keyword">キーワード</option>
      <option value="joke">ネタ枠</option>
    </select>
  </div>

  <button onclick="setRandomTheme()">ランダムお題</button>
  <button onclick="showThemeList()">お題を選ぶ</button>
  <button onclick="setCustomTheme()">直接入力</button>
  <button onclick="clearTheme()">お題なし</button>

  <div id="themeList"></div>
</div>

<div id="grid"></div>

<div id="count">埋まっている数：0 / 81</div>

<div id="inputs"></div>

<button onclick="clearAllInputs()">入力を全部消す</button>
<button onclick="location.href='index.html'">メニューへ戻る</button>

<script>
// ▼ 五十音表（既存）
const chars = [
  "あ","い","う","え","お",
  "か","き","く","け","こ",
  "さ","し","す","せ","そ",
  "た","ち","つ","て","と",
  "な","に","ぬ","ね","の",
  "は","ひ","ふ","へ","ほ",
  "ま","み","む","め","も",
  "や","", "ゆ","", "よ",
  "ら","り","る","れ","ろ",
  "わ","", "を","", "ん",
  "が","ぎ","ぐ","げ","ご",
  "ざ","じ","ず","ぜ","ぞ",
  "だ","ぢ","づ","で","ど",
  "ば","び","ぶ","べ","ぼ",
  "ぱ","ぴ","ぷ","ぺ","ぽ",
  "ぁ","ぃ","ぅ","ぇ","ぉ",
  "ゃ","ゅ","ょ",
  "っ",
  "ゎ"
];

let filled = {};

// ▼ 五十音表生成（既存）
const grid = document.getElementById("grid");
chars.forEach(c => {
  const cell = document.createElement("div");
  cell.className = c === "" ? "cell empty" : "cell";
  cell.id = c === "" ? "" : "cell_" + c;
  cell.textContent = c;
  grid.appendChild(cell);
});

// ▼ 入力欄21個（既存）
const inputs = document.getElementById("inputs");
for (let i = 0; i < 21; i++) {
  const inp = document.createElement("input");
  inp.placeholder = "入力欄 " + (i + 1);
  inp.oninput = updateGrid;
  inputs.appendChild(inp);
}

// ▼ 五十音表更新（既存）
function updateGrid() {
  filled = {};

  document.querySelectorAll("#inputs input").forEach(inp => {
    const text = inp.value.trim();
    for (let char of text) {
      if (chars.includes(char)) filled[char] = true;
    }
  });

  chars.forEach(c => {
    if (c === "") return;
    const cell = document.getElementById("cell_" + c);
    if (filled[c]) cell.classList.add("filled");
    else cell.classList.remove("filled");
  });

  document.getElementById("count").textContent =
    "埋まっている数：" + Object.keys(filled).length + " / 81";
}

// ▼ お題カテゴリ（新規追加）
const themeCategories = {
  normal: [
    "夏の曲","冬の曲","春の曲","秋の曲",
    "アニメ曲","色入りの曲","アイドル曲","数字がある曲",
    "全てひらがなの曲","全てカタカナの曲","全て漢字の曲",
    "1980年代の曲","1990年代の曲","2000年代の曲",
    "2010年代の曲","2020年代の曲",
    "知ってる中で最新の曲",
    "6文字以上の曲","7文字以上の曲","8文字以上の曲"
  ],

  keyword: [
    "『愛』が入る曲","『恋』が入る曲","『好』が入る曲",
    "『夜』が入る曲","『日』が入る曲","『月』が入る曲",
    "『の』が入る曲","『な』が入る曲","『を』が入る曲","『に』が入る曲",
    "『春』が入る曲","『夏』が入る曲","『秋』が入る曲","『冬』が入る曲",
    "『赤』が入る曲","『青』が入る曲","『緑』が入る曲","『黄』が入る曲","『白』が入る曲","『黒』が入る曲",
    "『花』が入る曲"
  ],

  joke: [
    "タイトルが15文字以上の曲",
    "タイトルが1文字の曲",
    "誰も知らなさそうな曲",
    "喉が壊れる曲","泣ける曲",
    "普段歌わないジャンルの曲","盛り上がる曲",
    "最高に面白いネタ曲"
  ]
};

// ▼ すべてカテゴリ
function getAllThemes() {
  return [
    ...themeCategories.normal,
    ...themeCategories.keyword,
    ...themeCategories.joke
  ];
}

// ▼ ランダムお題
function setRandomTheme() {
  const cat = document.getElementById("categorySelect").value;
  let list = (cat === "all") ? getAllThemes() : themeCategories[cat];
  const t = list[Math.floor(Math.random() * list.length)];
  themeText.textContent = "お題：" + t;
}

// ▼ お題一覧表示
function showThemeList() {
  const cat = document.getElementById("categorySelect").value;
  let list = (cat === "all") ? getAllThemes() : themeCategories[cat];

  themeList.innerHTML = "";
  list.forEach(t => {
    const div = document.createElement("div");
    div.className = "themeItem";
    div.textContent = t;
    div.onclick = () => {
      themeText.textContent = "お題：" + t;
      themeList.innerHTML = "";
    };
    themeList.appendChild(div);
  });
}

// ▼ 直接入力
function setCustomTheme() {
  const t = prompt("お題を入力してください");
  if (t) themeText.textContent = "お題：" + t;
}

// ▼ お題なし
function clearTheme() {
  themeText.textContent = "お題：なし";
}

// ▼ 入力一括消去
function clearAllInputs() {
  document.querySelectorAll("#inputs input").forEach(inp => inp.value = "");
  updateGrid();
}
  function showThemeList() {
  const cat = document.getElementById("categorySelect").value;
  let list = (cat === "all") ? getAllThemes() : themeCategories[cat];

  themeList.innerHTML = "";
  list.forEach(t => {
    const div = document.createElement("div");
    div.className = "themeItem";
    div.textContent = t;
    div.onclick = () => {
      themeText.textContent = "お題：" + t;
      themeList.innerHTML = "";
      categorySelect.disabled = false; // ← 再び有効化
    };
    themeList.appendChild(div);
  });

  // ▼ 一覧を開いたらカテゴリ変更禁止
  categorySelect.disabled = true;
}

// ▼ お題一覧以外をクリックしたら閉じる
document.addEventListener("click", function(e) {
  const list = document.getElementById("themeList");
  const box = document.getElementById("themeBox");

  // お題一覧が空なら何もしない
  if (list.innerHTML.trim() === "") return;

  // クリック位置が themeBox 内なら閉じない
  if (box.contains(e.target)) return;

  // それ以外をクリックしたら閉じる
  list.innerHTML = "";
  categorySelect.disabled = false; // ← カテゴリ変更を再び有効化
});
  
</script>

</body>
</html>
