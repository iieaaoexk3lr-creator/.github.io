<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>歌Show力診断</title>

<link rel="stylesheet" href="ora.css">

</head>
<body>

<div id="app">

  <!-- ==========================
       タイトル
  =========================== -->

  <header>

    <h1>歌Show力診断</h1>

    <p>
      歌とパフォーマンスを可視化する
      カラオケ演出ツール
    </p>

  </header>

  <!-- ==========================
       設定
  =========================== -->

  <section id="settings">

    <label>

      プレイヤー名

      <input
        id="playerName"
        type="text"
        maxlength="20"
        placeholder="名前を入力"
      >

    </label>

    <div class="buttonRow">

      <button id="startBtn">
        ▶ 録画開始
      </button>

      <button
        id="stopBtn"
        disabled
      >
        ■ 録画停止
      </button>

    </div>

    <button
      id="resetBtn"
      disabled
    >
      ↺ リセット
    </button>

  </section>

  <!-- ==========================
       カメラ
  =========================== -->

  <section id="cameraSection">

    <div id="cameraWrapper">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>

      <canvas
        id="auraCanvas"
      ></canvas>

      <!-- 歌Show力 -->

      <div id="showPowerBox">

        <div class="smallLabel">
          歌Show力
        </div>

        <div id="showPower">
          0
        </div>

      </div>

      <!-- 属性 -->

      <div id="attributeBox">

        <div class="smallLabel">
          属性
        </div>

        <div id="attributeName">
          判定中...
        </div>

      </div>

    </div>

  </section>

  <!-- ==========================
       リザルト
  =========================== -->

  <section id="resultSection">

    <h2>
      リザルト
    </h2>

    <div class="resultCard">

      <div class="resultItem">

        <div class="resultLabel">
          プレイヤー
        </div>

        <div id="resultName">
          -
        </div>

      </div>

      <div class="resultItem">

        <div class="resultLabel">
          属性
        </div>

        <div id="resultAttribute">
          -
        </div>

      </div>

      <div class="resultItem">

        <div class="resultLabel">
          AI称号
        </div>

        <div id="resultTitle">
          録画終了後に表示
        </div>

      </div>

      <div class="resultItem">

        <div class="resultLabel">
          最大歌Show力
        </div>

        <div id="resultPower">
          0
        </div>

      </div>

    </div>

  </section>

  <!-- ==========================
       属性変化履歴
  =========================== -->

  <section id="historySection">

    <h2>
      属性変化履歴
    </h2>

    <div id="historyGrid">

      <div class="historyCard">

        <img
          id="history1"
          alt=""
        >

        <div
          id="historyLabel1"
          class="historyLabel"
        >
          -
        </div>

      </div>

      <div class="historyCard">

        <img
          id="history2"
          alt=""
        >

        <div
          id="historyLabel2"
          class="historyLabel"
        >
          -
        </div>

      </div>

      <div class="historyCard">

        <img
          id="history3"
          alt=""
        >

        <div
          id="historyLabel3"
          class="historyLabel"
        >
          -
        </div>

      </div>

    </div>

  </section>

  <!-- ==========================
       保存
  =========================== -->

  <section id="downloadSection">

    <button
      id="saveVideoBtn"
      disabled
    >
      動画保存
    </button>

    <button
      id="saveResultBtn"
      disabled
    >
      リザルト保存
    </button>

    <button
      id="saveSummaryBtn"
      disabled
    >
      属性履歴保存
    </button>

  </section>

</div>

<!-- ==========================
     非表示Canvas
========================== -->

<canvas
  id="recordCanvas"
  hidden
></canvas>

<canvas
  id="resultCanvas"
  hidden
></canvas>

<!-- ==========================
     スクリプト
========================== -->

<script src="ora.js"></script>

</body>
</html>
