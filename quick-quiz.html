<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Quiz - Premium System</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #1a1f35 0%, #080b12 100%);
      --card-bg: rgba(22, 31, 51, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-yellow: #ffd700;
      --accent-red: #ff3366;
      --accent-blue: #00d2ff;
      --text-color: #ffffff;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      background: var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 右上管理メニューボタン */
    .menu-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 24px;
      width: 50px;
      height: 50px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s ease;
    }
    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    /* 管理用ドロワー */
    .drawer {
      position: fixed;
      top: 0;
      right: -360px;
      width: 340px;
      height: 100%;
      background: rgba(15, 21, 37, 0.95);
      backdrop-filter: blur(15px);
      border-left: 1px solid var(--card-border);
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      z-index: 99;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 25px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .drawer.open { right: 0; }
    .drawer h3 { border-bottom: 2px solid var(--accent-blue); padding-bottom: 8px; margin-top: 40px; font-weight: 700;}
    .drawer-section { margin-bottom: 25px; }
    .drawer button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-correct { background: linear-gradient(135deg, #2e7d32, #4caf50); color: white; }
    .btn-wrong { background: linear-gradient(135deg, #c62828, #f44336); color: white; }
    .btn-reset { background: linear-gradient(135deg, #1565c0, #2196f3); color: white; }
    .drawer button:hover { opacity: 0.9; transform: translateY(-1px); }

    /* 得点手動調整リスト */
    .score-edit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.05);
      padding: 6px 10px;
      border-radius: 6px;
    }
    .score-edit-item input {
      width: 60px;
      padding: 4px;
      text-align: center;
      background: #0b0f19;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
    }

    /* 全体コンテナ */
    .container {
      width: 100%;
      max-width: 1200px;
      padding: 30px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* 得点板・演出エリア */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .team-group {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    .team-title {
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #8a99ad;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: default;
    }
    .is-admin-mode .player-card {
      cursor: pointer;
    }

    /* Base Active: 参加中状態（青発光） */
    .player-card.active-participant {
      border-color: var(--accent-blue);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      background: rgba(0, 210, 255, 0.08);
    }

    /* 回答権獲得（黄色発光：最優先） */
    .player-card.answering {
      border-color: var(--accent-yellow) !important;
      box-shadow: 0 0 25px var(--accent-yellow) !important;
      background: rgba(255, 215, 0, 0.15) !important;
      animation: pulse 0.8s infinite alternate;
    }

    /* 正解演出（赤色点滅：最優先） */
    .player-card.correct {
      border-color: var(--accent-red) !important;
      box-shadow: 0 0 35px var(--accent-red) !important;
      background: rgba(255, 51, 102, 0.2) !important;
      animation: flash-red 0.35s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }
    @keyframes flash-red {
      from { opacity: 1; }
      to { opacity: 0.4; }
    }

    .player-name { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.5px; }
    .player-score { font-size: 1.6rem; font-weight: 800; color: var(--accent-yellow); text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

    /* 早押しボタンエリア */
    .buzzer-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }

    .buzzer-btn {
      width: 100%;
      max-width: 450px;
      height: 200px;
      background: linear-gradient(145deg, #ff3366, #cc0044);
      border: none;
      border-radius: 28px;
      box-shadow: 0 12px 0 #800022, 0 20px 30px rgba(255, 51, 102, 0.4);
      color: white;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
    }
    .buzzer-btn:active:not(:disabled) {
      transform: translateY(8px);
      box-shadow: 0 4px 0 #800022, 0 10px 15px rgba(255, 51, 102, 0.4);
    }
    .buzzer-btn:disabled {
      background: #2a2e3d;
      box-shadow: 0 10px 0 #151821;
      color: #5a6275;
      cursor: not-allowed;
    }

    /* 入室モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 7, 13, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 35px;
      border-radius: 20px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .modal-content h2 { margin-top: 0; font-weight: 800; letter-spacing: 1px; color: var(--accent-blue); }
    .modal-content input, .modal-content select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .modal-content button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-blue), #0088ff);
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      color: white;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- 右上管理ボタン -->
  <button class="menu-btn" onclick="toggleDrawer()">≡</button>

  <!-- 管理者ドロワー -->
  <div class="drawer" id="drawer">
    <h3>管理コントロール</h3>
    <div class="drawer-section">
      <h4>判定操作</h4>
      <button class="btn-correct" onclick="handleJudge(true)">正解 [◯]</button>
      <button class="btn-wrong" onclick="handleJudge(false)">不正解 [✕]</button>
      <button class="btn-reset" onclick="resetBuzzer()">ボタンリセット</button>
    </div>
    <div class="drawer-section">
      <h4>得点直接調整</h4>
      <div id="scoreEditList"></div>
    </div>
    <div class="drawer-section">
      <button onclick="clearRoomData()" style="background:#444; color:white;">ルームリセット</button>
    </div>
  </div>

  <!-- 入室モーダル -->
  <div class="modal-overlay" id="entryModal">
    <div class="modal-content">
      <h2>Quick Quiz 入室</h2>
      <input type="text" id="roomId" placeholder="部屋番号 (例: 1234)">
      <input type="text" id="playerName" placeholder="個人名">
      <input type="text" id="teamName" placeholder="チーム名 (任意/個人は空欄)">
      <label style="display:flex; align-items:center; gap:8px; margin-top:10px;">
        <input type="checkbox" id="isAdmin" style="width:auto; margin:0;"> 管理者モードで入室
      </label>
      <button onclick="joinRoom()">参加する</button>
    </div>
  </div>

  <!-- メイン表示領域 -->
  <div class="container" id="mainContainer">
    <!-- 1. 演出・得点板ゾーン -->
    <div class="scoreboard" id="scoreboard"></div>

    <!-- 2. 早押しボタンゾーン -->
    <div class="buzzer-zone" id="buzzerZone">
      <button class="buzzer-btn" id="buzzerBtn" onclick="pressBuzzer()" disabled>PUSH!</button>
    </div>
  </div>

  <!-- Firebase JS SDK v9 (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
      authDomain: "gamehistory-m84.firebaseapp.com",
      databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
      projectId: "gamehistory-m84",
      storageBucket: "gamehistory-m84.firebasestorage.app",
      messagingSenderId: "475761727837",
      appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
      measurementId: "G-3636W6LC4F"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = { id: '', name: '', team: '', room: '', isAdmin: false };
    let timeOffset = 0;
    let roomRef = null;

    // ローカルストレージデータの読み込み・自動セット
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = JSON.parse(localStorage.getItem('qq_user_info') || '{}');
      if (savedUser.room) document.getElementById('roomId').value = savedUser.room;
      if (savedUser.name) document.getElementById('playerName').value = savedUser.name;
      if (savedUser.team) document.getElementById('teamName').value = savedUser.team;
      if (savedUser.isAdmin) document.getElementById('isAdmin').checked = savedUser.isAdmin;
    });

    function syncTime() {
      db.ref(".info/serverTimeOffset").on("value", (snap) => {
        timeOffset = snap.val() || 0;
      });
    }

    function joinRoom() {
      const room = document.getElementById('roomId').value.trim();
      const name = document.getElementById('playerName').value.trim();
      const team = document.getElementById('teamName').value.trim() || '個人';
      const isAdmin = document.getElementById('isAdmin').checked;

      if (!room || (!name && !isAdmin)) {
        alert('部屋番号と名前を入力してください。');
        return;
      }

      const savedUser = JSON.parse(localStorage.getItem('qq_user_info') || '{}');
      const userId = (savedUser.room === room && savedUser.id) ? savedUser.id : 'user_' + Math.random().toString(36).substr(2, 9);

      currentUser = { id: userId, name: name || '管理者', team, room, isAdmin };

      // ローカルストレージ保存（引き継ぎ用）
      localStorage.setItem('qq_user_info', JSON.stringify(currentUser));

      roomRef = db.ref(`quick-quiz/rooms/${room}`);

      if (!isAdmin) {
        roomRef.child(`players/${currentUser.id}`).update({
          name: currentUser.name,
          team: currentUser.team
        });
        // スコア初期設定（存在しない場合のみ0）
        roomRef.child(`players/${currentUser.id}/score`).transaction(s => s === null ? 0 : s);
      } else {
        document.getElementById('buzzerZone').style.display = 'none'; // 管理者はボタン非表示
        document.getElementById('mainContainer').classList.add('is-admin-mode');
      }

      document.getElementById('entryModal').style.display = 'none';
      syncTime();
      listenRoomData();
    }

    function listenRoomData() {
      roomRef.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        renderScoreboard(data.players || {}, data.state || {});
        updateBuzzerState(data.state || {});
        if (currentUser.isAdmin) {
          renderScoreEditList(data.players || {});
        }
      });
    }

    function renderScoreboard(players, state) {
      const scoreboard = document.getElementById('scoreboard');
      scoreboard.innerHTML = '';

      const teams = {};
      Object.keys(players).forEach(id => {
        const p = players[id];
        if (!teams[p.team]) teams[p.team] = { total: 0, members: [] };
        teams[p.team].members.push({ id, ...p });
        teams[p.team].total += (p.score || 0);
      });

      const answeringId = state.answeringId;
      const isCorrect = state.isCorrect;

      Object.keys(teams).forEach(teamName => {
        const teamGroup = document.createElement('div');
        teamGroup.className = 'team-group';
        teamGroup.innerHTML = `<div class="team-title"><span>${teamName}</span><span>TOTAL: ${teams[teamName].total}pt</span></div>`;

        teams[teamName].members.forEach(p => {
          const card = document.createElement('div');
          let classList = 'player-card';

          if (p.active) classList += ' active-participant'; // 青色発光
          if (answeringId === p.id) {
            classList += isCorrect ? ' correct' : ' answering'; // 黄色・赤色が優先上書き
          }

          card.className = classList;
          card.innerHTML = `
            <span class="player-name">${p.name}</span>
            <span class="player-score">${p.score || 0}</span>
          `;

          // 管理者がタップで青色発光（参加中）切替
          if (currentUser.isAdmin) {
            card.onclick = () => {
              roomRef.child(`players/${p.id}/active`).set(!p.active);
            };
          }

          teamGroup.appendChild(card);
        });

        scoreboard.appendChild(teamGroup);
      });
    }

    function updateBuzzerState(state) {
      if (currentUser.isAdmin) return;
      const btn = document.getElementById('buzzerBtn');
      const answeringId = state.answeringId;

      if (answeringId) {
        btn.disabled = true;
        btn.innerText = (answeringId === currentUser.id) ? '回答中！' : 'ロック中';
      } else {
        btn.disabled = false;
        btn.innerText = 'PUSH!';
      }
    }

    function pressBuzzer() {
      if (currentUser.isAdmin) return;
      const exactTime = Date.now() + timeOffset;
      
      roomRef.child('state').transaction((current) => {
        if (!current || !current.answeringId) {
          return { answeringId: currentUser.id, timestamp: exactTime, isCorrect: false };
        }
        return;
      });
    }

    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
    }

    function handleJudge(isCorrect) {
      if (!currentUser.isAdmin) return;

      roomRef.get().then((snap) => {
        const data = snap.val() || {};
        const answeringId = data.state?.answeringId;
        if (!answeringId) return;

        if (isCorrect) {
          roomRef.child('state/isCorrect').set(true);
          const currentScore = data.players[answeringId]?.score || 0;
          roomRef.child(`players/${answeringId}/score`).set(currentScore + 10);
          playAudioSignal(true);
          setTimeout(() => { resetBuzzer(); }, 2000);
        } else {
          playAudioSignal(false);
          resetBuzzer();
        }
      });
    }

    function resetBuzzer() {
      roomRef.child('state').set({ answeringId: null, timestamp: null, isCorrect: false });
    }

    // [管理者機能] 点数の直接調整リスト描画
    function renderScoreEditList(players) {
      const container = document.getElementById('scoreEditList');
      container.innerHTML = '';
      Object.keys(players).forEach(id => {
        const p = players[id];
        const item = document.createElement('div');
        item.className = 'score-edit-item';
        item.innerHTML = `
          <span>${p.name}</span>
          <input type="number" value="${p.score || 0}" onchange="updatePlayerScore('${id}', this.value)">
        `;
        container.appendChild(item);
      });
    }

    function updatePlayerScore(playerId, newScore) {
      roomRef.child(`players/${playerId}/score`).set(parseInt(newScore, 10) || 0);
    }

    function playAudioSignal(isCorrect) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (isCorrect) {
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1760, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      }
    }

    function clearRoomData() {
      if (confirm('部屋のデータを初期化しますか？')) {
        roomRef.remove();
      }
    }
  </script>
</body>
</html>
