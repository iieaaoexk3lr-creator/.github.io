<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ファイブボンバー強化版</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 10px;
  }

  #question {
    font-size: 1.5rem;
    margin-bottom: 20px;
  }

  #timer {
    font-size: 3rem;
    color: #ff4444;
    margin-bottom: 10px;
  }

  #answers {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .answer-box {
    width: 200px;
    height: 50px;
    background: #333;
    border-radius: 10px;
    font-size: 1.4rem;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.3s;
  }

  .correct {
    background: #28a745;
    transform: scale(1.05);
  }

  button {
    font-size: 1.2rem;
    padding: 10px 20px;
    margin: 5px;
  }

  #explosion {
    display: none;
    font-size: 4rem;
    color: yellow;
    animation: explode 0.8s ease-out forwards;
  }

  @keyframes explode {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  @media (max-width: 600px) {
    h1 { font-size: 1.6rem; }
    #timer { font-size: 2.5rem; }
    .answer-box { width: 160px; height: 45px; font-size: 1.2rem; }
    button { font-size: 1rem; padding: 8px 15px; }
  }
</style>
</head>
<body>

<h1>ファイブボンバー</h1>

<div id="question"></div>
<div id="timer"></div>

<div id="answers"></div>

<!-- STARTボタン -->
<button id="startBtn" onclick="startGame()">START</button>

<!-- 判定ボタン -->
<button onclick="markCorrect()">正解</button>
<button onclick="markWrong()">不正解</button>

<!-- リセットボタン -->
<button onclick="resetGame()">リセット</button>

<!-- メニューへ戻る -->
<button onclick="location.href='menu.html'">メニューへ戻る</button>

<div id="explosion">💥</div>

<!-- 効果音 -->
<audio id="sound-correct" src="https://soundeffect-lab.info/sound/anime/mp3/decision1.mp3"></audio>
<audio id="sound-wrong" src="https://soundeffect-lab.info/sound/anime/mp3/buzzer1.mp3"></audio>
<audio id="sound-explosion" src="https://soundeffect-lab.info/sound/anime/mp3/bomb1.mp3"></audio>

<script>
  const questions = [
    "日本の果物を5つ答えよ！",
    "アニメの主人公を5人答えよ！",
    "コンビニを5つ答えよ！",
    "スポーツを5つ答えよ！",
    "動物を5つ答えよ！",
    "色の名前を5つ答えよ！",
    "国の名前を5つ答えよ！",
    "野菜を5つ答えよ！",
    "有名人を5人答えよ！",
    "飲み物を5つ答えよ！"
  ];

  let currentQuestion = 0;
  let found = 0;
  let timeLeft = 10;
  let timerId;
  let started = false;

  const answersDiv = document.getElementById("answers");
  const explosion = document.getElementById("explosion");

  function init() {
    document.getElementById("question").textContent = questions[currentQuestion];
    answersDiv.innerHTML = "";
    found = 0;
    timeLeft = 10;
    started = false;
    document.getElementById("timer").textContent = timeLeft;
    explosion.style.display = "none";
    document.getElementById("startBtn").style.display = "inline-block";

    for (let i = 0; i < 5; i++) {
      const box = document.createElement("div");
      box.className = "answer-box";
      box.id = "box" + i;
      box.textContent = "？？？";
      answersDiv.appendChild(box);
    }
  }

  function startGame() {
    if (started) return;
    started = true;
    document.getElementById("startBtn").style.display = "none";
    startTimer();
  }

  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;
      document.getElementById("timer").textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timerId);
        triggerExplosion();
      }
    }, 1000);
  }

  function markCorrect() {
    if (!started || timeLeft <= 0) return;

    if (found < 5) {
      document.getElementById("sound-correct").play();
      const box = document.getElementById("box" + found);
      box.textContent = "正解！";
      box.classList.add("correct");
      found++;

      if (found === 5) {
        clearInterval(timerId);
        nextQuestion();
      }
    }
  }

  function markWrong() {
    if (!started) return;
    document.getElementById("sound-wrong").play();
  }

  function triggerExplosion() {
    explosion.style.display = "block";
    document.getElementById("sound-explosion").play();
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion >= questions.length) {
      document.getElementById("question").textContent = "全問クリア！お疲れさま！";
      return;
    }
    init();
  }

  function resetGame() {
    currentQuestion = 0;
    init();
  }

  init();
</script>

</body>
</html>
