<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カラフルボンバー改良版</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 { font-size: 2rem; margin-bottom: 10px; }

  #settings {
    margin-bottom: 20px;
    background: #222;
    padding: 15px;
    border-radius: 10px;
  }

  label { font-size: 1.2rem; margin-right: 10px; }

  input, select {
    font-size: 1.2rem;
    padding: 5px;
    margin: 5px;
  }

  #question { font-size: 1.5rem; margin-bottom: 20px; }

  /* タイマー数字 */
  #timerRow {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 10px;
  }

  .timer-box {
    font-size: 2rem;
    color: #ff4444;
    width: 50px;
    text-align: center;
  }

  /* 解答バー */
  #answers {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
  }

  .answer-box {
    width: 50px;
    height: 200px;
    background: #333;
    border-radius: 10px;
    font-size: 1.2rem;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 10px;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
  }

  /* 時間経過で赤く染まる部分 */
  .fill {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: rgba(255,0,0,0.6);
    transition: height 0.2s linear;
  }

  /* 正解 */
  .correct {
    background: #28a745 !important;
    transform: scale(1.05);
  }

  /* 不正解の赤点滅 */
  @keyframes wrongFlash {
    0% { background: #ff0000; }
    50% { background: #333; }
    100% { background: #ff0000; }
  }
  .wrongFlash {
    animation: wrongFlash 0.4s ease-out;
  }

  /* 成功エフェクト */
  #successEffect {
    display: none;
    font-size: 3rem;
    color: #00ffcc;
    animation: sparkle 1s ease-out forwards;
  }

  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1); }
  }

  /* 爆発 */
  #explosion {
    display: none;
    font-size: 4rem;
    color: yellow;
    animation: explode 0.8s ease-out forwards;
  }

  @keyframes explode {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  @media (max-width: 600px) {
    .answer-box { width: 40px; height: 150px; }
    .timer-box { width: 40px; font-size: 1.6rem; }
  }
</style>
</head>
<body>

<h1>カラフルボンバー改良版</h1>

<!-- 設定エリア -->
<div id="settings">
  <label>制限時間：</label>
  <input type="number" id="timeInput" value="50" min="10" max="200"> 秒

  <label>バーの本数：</label>
  <select id="barCount">
    <option>4</option>
    <option selected>5</option>
    <option>6</option>
    <option>7</option>
    <option>8</option>
    <option>9</option>
    <option>10</option>
  </select>
</div>

<div id="question">問題がここに表示されます</div>

<div id="timerRow"></div>
<div id="answers"></div>

<button id="startBtn" onclick="startGame()">START</button>
<button onclick="markCorrect()">正解</button>
<button onclick="markWrong()">不正解</button>
<button onclick="resetGame()">リセット</button>

<div id="successEffect">✨成功！✨</div>
<div id="explosion">💥</div>

<!-- 効果音 -->
<audio id="sound-correct" src="https://soundeffect-lab.info/sound/anime/mp3/decision1.mp3"></audio>
<audio id="sound-wrong" src="https://soundeffect-lab.info/sound/anime/mp3/buzzer1.mp3"></audio>
<audio id="sound-explosion" src="https://soundeffect-lab.info/sound/anime/mp3/bomb1.mp3"></audio>

<script>
  let barNum = 5;
  let timeLimit = 50;
  let timeLeft = 50;
  let found = 0;
  let timerId;
  let started = false;
  let timerStopped = [];

  const questions = [
    "色のつく曲を答えよ！",
    "アニメの曲を答えよ！",
    "動物の曲を答えよ！",
    "三文字の曲を答えよ！"
  ];

  let currentQuestion = 0;

  const timerRow = document.getElementById("timerRow");
  const answersDiv = document.getElementById("answers");

  function init() {
    barNum = Number(document.getElementById("barCount").value);
    timeLimit = Number(document.getElementById("timeInput").value);

    timeLeft = timeLimit;
    found = 0;
    started = false;
    timerStopped = Array(barNum).fill(false);

    document.getElementById("question").textContent = questions[currentQuestion];
    document.getElementById("startBtn").style.display = "inline-block";

    timerRow.innerHTML = "";
    answersDiv.innerHTML = "";

    for (let i = 0; i < barNum; i++) {
      const t = document.createElement("div");
      t.className = "timer-box";
      t.id = "timer" + i;
      t.textContent = timeLeft;
      timerRow.appendChild(t);

      const box = document.createElement("div");
      box.className = "answer-box";
      box.id = "box" + i;

      const fill = document.createElement("div");
      fill.className = "fill";
      fill.id = "fill" + i;

      box.appendChild(fill);
      box.append("？");
      answersDiv.appendChild(box);
    }
  }

  function startGame() {
    if (started) return;
    started = true;
    document.getElementById("startBtn").style.display = "none";
    startTimer();
  }

  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;

      for (let i = 0; i < barNum; i++) {
        if (!timerStopped[i]) {
          document.getElementById("timer" + i).textContent = timeLeft;

          const percent = ((timeLimit - timeLeft) / timeLimit) * 100;
          document.getElementById("fill" + i).style.height = percent + "%";
        }
      }

      if (timeLeft <= 0) {
        clearInterval(timerId);
        triggerExplosion();
      }
    }, 1000);
  }

  function markCorrect() {
    if (!started || timeLeft <= 0) return;

    document.getElementById("sound-correct").play();

    const box = document.getElementById("box" + found);
    box.classList.add("correct");
    timerStopped[found] = true;

    found++;

    if (found === barNum) {
      clearInterval(timerId);
      showSuccess();
    }
  }

  function markWrong() {
    if (!started) return;

    document.getElementById("sound-wrong").play();

    const box = document.getElementById("box" + found);
    box.classList.add("wrongFlash");

    setTimeout(() => box.classList.remove("wrongFlash"), 400);
  }

  function triggerExplosion() {
    document.getElementById("explosion").style.display = "block";
    document.getElementById("sound-explosion").play();
  }

  function showSuccess() {
    document.getElementById("successEffect").style.display = "block";
  }

  function resetGame() {
    currentQuestion = 0;
    init();
  }

  init();
</script>

</body>
</html>
