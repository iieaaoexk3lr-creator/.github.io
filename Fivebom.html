<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ファイブボンバー本物風</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 10px;
  }

  #question {
    font-size: 1.5rem;
    margin-bottom: 20px;
  }

  /* カウントダウン数字（横一列） */
  #timerRow {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 10px;
  }

  .timer-box {
    font-size: 2.5rem;
    color: #ff4444;
    width: 60px;
    text-align: center;
  }

  /* 縦長バー（横一列） */
  #answers {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 20px;
  }

  .answer-box {
    width: 60px;
    height: 200px;
    background: #333;
    border-radius: 10px;
    font-size: 1.4rem;
    display: flex;
    justify-content: center;
    align-items: center;
    writing-mode: vertical-rl;
    text-orientation: upright;
    transition: 0.3s;
  }

  .correct {
    background: #28a745;
    transform: scale(1.05);
  }

  button {
    font-size: 1.2rem;
    padding: 10px 20px;
    margin: 5px;
  }

  #explosion {
    display: none;
    font-size: 4rem;
    color: yellow;
    animation: explode 0.8s ease-out forwards;
  }

  @keyframes explode {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  @media (max-width: 600px) {
    .answer-box { width: 45px; height: 150px; }
    .timer-box { font-size: 2rem; width: 45px; }
  }
</style>
</head>
<body>

<h1>ファイブボンバー</h1>

<div id="question"></div>

<!-- カウントダウン数字（横一列） -->
<div id="timerRow"></div>

<!-- 縦長バー（横一列） -->
<div id="answers"></div>

<button id="startBtn" onclick="startGame()">START</button>
<button onclick="markCorrect()">正解</button>
<button onclick="markWrong()">不正解</button>
<button onclick="resetGame()">リセット</button>
<button onclick="location.href='menu.html'">メニューへ戻る</button>

<div id="explosion">💥</div>

<!-- 効果音 -->
<audio id="sound-correct" src="https://soundeffect-lab.info/sound/anime/mp3/decision1.mp3"></audio>
<audio id="sound-wrong" src="https://soundeffect-lab.info/sound/anime/mp3/buzzer1.mp3"></audio>
<audio id="sound-explosion" src="https://soundeffect-lab.info/sound/anime/mp3/bomb1.mp3"></audio>

<script>
  const questions = [
    "日本の果物を5つ答えよ！",
    "アニメの主人公を5人答えよ！",
    "コンビニを5つ答えよ！",
    "スポーツを5つ答えよ！",
    "動物を5つ答えよ！",
    "色の名前を5つ答えよ！",
    "国の名前を5つ答えよ！",
    "野菜を5つ答えよ！",
    "有名人を5人答えよ！",
    "飲み物を5つ答えよ！"
  ];

  let currentQuestion = 0;
  let found = 0;
  let timeLeft = 50;  // ← 初期時間を50秒に変更
  let timerId;
  let started = false;

  // 各バーのタイマーが止まったかどうか
  let timerStopped = [false, false, false, false, false];

  const answersDiv = document.getElementById("answers");
  const timerRow = document.getElementById("timerRow");
  const explosion = document.getElementById("explosion");

  function init() {
    document.getElementById("question").textContent = questions[currentQuestion];
    answersDiv.innerHTML = "";
    timerRow.innerHTML = "";
    found = 0;
    timeLeft = 50;
    started = false;
    timerStopped = [false, false, false, false, false];
    explosion.style.display = "none";
    document.getElementById("startBtn").style.display = "inline-block";

    for (let i = 0; i < 5; i++) {
      const t = document.createElement("div");
      t.className = "timer-box";
      t.id = "timer" + i;
      t.textContent = timeLeft;
      timerRow.appendChild(t);

      const box = document.createElement("div");
      box.className = "answer-box";
      box.id = "box" + i;
      box.textContent = "？";
      answersDiv.appendChild(box);
    }
  }

  function startGame() {
    if (started) return;
    started = true;
    document.getElementById("startBtn").style.display = "none";
    startTimer();
  }

  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;

      // 正解していないバーだけカウントダウン
      for (let i = 0; i < 5; i++) {
        if (!timerStopped[i]) {
          document.getElementById("timer" + i).textContent = timeLeft;
        }
      }

      if (timeLeft <= 0) {
        clearInterval(timerId);
        triggerExplosion();
      }
    }, 1000);
  }

  function markCorrect() {
    if (!started || timeLeft <= 0) return;

    if (found < 5) {
      document.getElementById("sound-correct").play();

      const box = document.getElementById("box" + found);
      box.textContent = "正解";
      box.classList.add("correct");

      // このバーのタイマーを停止
      timerStopped[found] = true;

      found++;

      if (found === 5) {
        clearInterval(timerId);
        nextQuestion();
      }
    }
  }

  function markWrong() {
    if (!started) return;
    document.getElementById("sound-wrong").play();
  }

  function triggerExplosion() {
    explosion.style.display = "block";
    document.getElementById("sound-explosion").play();
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion >= questions.length) {
      document.getElementById("question").textContent = "全問クリア！お疲れさま！";
      return;
    }
    init();
  }

  function resetGame() {
    currentQuestion = 0;
    init();
  }

  init();
</script>

</body>
</html>
