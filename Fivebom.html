<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カラフルボンバー総合版</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 { font-size: 2.4rem; margin-bottom: 10px; }

  #settings {
    margin-bottom: 20px;
    background: #222;
    padding: 15px;
    border-radius: 10px;
  }

  label { font-size: 1.3rem; margin-right: 10px; }
  input, select { font-size: 1.3rem; padding: 5px; margin: 5px; }

  #question { font-size: 1.7rem; margin-bottom: 20px; }

  #score {
    font-size: 1.6rem;
    margin: 10px 0 20px 0;
  }

  #timerRow {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 10px;
  }

  .timer-box {
    font-size: 2.2rem;
    color: #ff4444;
    width: 60px;
    text-align: center;
  }

  #answers {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 20px;
  }

  .answer-box {
    width: 70px;
    height: 260px;
    border-radius: 12px;
    font-size: 1.6rem;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 15px;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
    z-index: 1;
  }

  .answer-box span {
    position: relative;
    z-index: 2;
  }

  /* 赤い部分 */
  .fill {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: rgba(255,0,0,0.6);
    transition: height 0.2s linear;
    z-index: 3;
  }

  /* ★ 追加：最先端のグレー1mm */
  .tip {
    position: absolute;
    left: 0;
    width: 100%;
    height: 1px;      /* 1mm相当の細さ */
    background: #888; /* グレー */
    z-index: 4;
  }

  @keyframes wrongFlash {
    0% { background: #ff0000; }
    50% { background: inherit; }
    100% { background: #ff0000; }
  }
  .wrongFlash { animation: wrongFlash 0.4s ease-out; }

  #successEffect {
    display: none;
    font-size: 3rem;
    color: #00ffcc;
    animation: sparkle 1s ease-out forwards;
    pointer-events: none;
  }

  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1); }
  }

  #explosion {
    display: none;
    font-size: 4rem;
    color: yellow;
    animation: explode 0.8s ease-out forwards;
    pointer-events: none;
  }

  @keyframes explode {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  #manual {
    margin-top: 30px;
    font-size: 1.2rem;
    color: #ccc;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>カラフルボンバー</h1>

<div id="settings">
  <label>制限時間：</label>
  <input type="number" id="timeInput" value="50" min="10" max="200"> 秒

  <label>バーの本数：</label>
  <select id="barCount">
    <option>4</option>
    <option selected>5</option>
    <option>6</option>
    <option>7</option>
    <option>8</option>
    <option>9</option>
    <option>10</option>
  </select>

  <button onclick="applySettings()">SET</button>
</div>

<div id="question"></div>

<div id="score">
  正解数：0
  <button onclick="resetScore()" style="font-size:1rem;">点数リセット</button>
</div>

<div id="timerRow"></div>
<div id="answers"></div>

<button id="startBtn" onclick="startGame()">START</button>
<button onclick="markCorrect()">正解</button>
<button onclick="markWrong()">不正解</button>
<button onclick="resetGame()">リセット</button>

<button id="nextBtn" onclick="nextQuestion()" style="display:none;">次の問題へ</button>

<button onclick="location.href='index.html'">メニューへ戻る</button>

<div id="successEffect">✨成功！✨</div>
<div id="explosion">💥</div>

<script>
/* -------------------------
   WebAudio：正解音
------------------------- */
function playCorrect(){
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o1 = ctx.createOscillator();
    const g1 = ctx.createGain();
    o1.type = "sine";
    o1.frequency.setValueAtTime(784, ctx.currentTime);
    g1.gain.setValueAtTime(0.25, ctx.currentTime);
    o1.connect(g1);
    g1.connect(ctx.destination);
    o1.start();
    o1.stop(ctx.currentTime + 0.18);

    const o2 = ctx.createOscillator();
    const g2 = ctx.createGain();
    o2.type = "sine";
    o2.frequency.setValueAtTime(1046, ctx.currentTime + 0.18);
    g2.gain.setValueAtTime(0.25, ctx.currentTime + 0.18);
    o2.connect(g2);
    g2.connect(ctx.destination);
    o2.start(ctx.currentTime + 0.18);
    o2.stop(ctx.currentTime + 0.45);
}

/* -------------------------
   WebAudio：不正解音
------------------------- */
function playWrong(){
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(120, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.3);
    osc.stop(ctx.currentTime + 0.3);
}

/* -------------------------
   WebAudio：爆発音
------------------------- */
function playExplosion(){
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = 2 * ctx.sampleRate;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        output[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
    noise.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
    noise.stop(ctx.currentTime + 1);
}

/* -------------------------
   ゲーム変数
------------------------- */
let barNum = 5;
let timeLimit = 50;
let timeLeft = 50;
let found = 0;
let timerId;
let started = false;
let timerStopped = [];
let totalScore = 0;

/* ★ バーの色（5色ループ） */
const barColors = [
  "#a8d8ff", // 薄い青
  "#b8ffcc", // 薄い緑
  "#fff5a8", // 薄い黄色
  "#ffd8a8", // 薄いオレンジ
  "#ffb8b8"  // 薄い赤
];

const questions = [
 　 "色のつく曲を答えよ！",
    "アニメの曲を答えよ！",
    "動物の曲を答えよ！",
    "三文字の曲を答えよ！",
    "DAM人気TOP50に入っている曲を答えよ！",
    "演歌を答えよ！",
    "英語の曲を答えよ！",
    "ラップの入った曲を答えよ！",
    "Mrs.GREENAPPLEの曲を答えよ！",
    "ーの入った曲を答えよ！"
];

let currentQuestion = 0;

/* -------------------------
   設定反映
------------------------- */
function applySettings() {
  barNum = Number(document.getElementById("barCount").value);
  timeLimit = Number(document.getElementById("timeInput").value);
  resetGame();
}

/* -------------------------
   初期化
------------------------- */
function init() {
  timeLeft = timeLimit;
  found = 0;
  started = false;
  timerStopped = Array(barNum).fill(false);

  document.getElementById("question").textContent = questions[currentQuestion];
  document.getElementById("score").childNodes[0].textContent = "正解数：" + totalScore + " ";
  document.getElementById("startBtn").style.display = "inline-block";
  document.getElementById("nextBtn").style.display = "none";

  document.getElementById("timerRow").innerHTML = "";
  document.getElementById("answers").innerHTML = "";

  for (let i = 0; i < barNum; i++) {
    const t = document.createElement("div");
    t.className = "timer-box";
    t.id = "timer" + i;
    t.textContent = timeLeft;
    document.getElementById("timerRow").appendChild(t);

    const box = document.createElement("div");
    box.className = "answer-box";
    box.id = "box" + i;

    /* ★ バーの色を順番に設定 */
    box.style.background = barColors[i % barColors.length];

    /* 赤い fill */
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.id = "fill" + i;

    /* ★ グレーの先端 */
    const tip = document.createElement("div");
    tip.className = "tip";
    tip.id = "tip" + i;

    box.appendChild(fill);
    box.appendChild(tip);
    box.innerHTML += "<span>？</span>";
    document.getElementById("answers").appendChild(box);
  }
}

/* -------------------------
   START
------------------------- */
function startGame() {
  if (started) return;
  started = true;
  document.getElementById("startBtn").style.display = "none";
  startTimer();
}

/* -------------------------
   タイマー
------------------------- */
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;

    for (let i = 0; i < barNum; i++) {
      if (!timerStopped[i]) {
        document.getElementById("timer" + i).textContent = timeLeft;

        const percent = ((timeLimit - timeLeft) / timeLimit) * 100;
        document.getElementById("fill" + i).style.height = percent + "%";

        /* ★ グレー先端を fill の先端に追従させる */
        document.getElementById("tip" + i).style.top = percent + "%";
      }
    }

    if (timeLeft <= 0) {
      clearInterval(timerId);
      triggerExplosion();
    }
  }, 1000);
}

/* -------------------------
   正解
------------------------- */
function markCorrect() {
  if (!started) return;

  playCorrect();

  const box = document.getElementById("box" + found);

  /* ★ 背景色は変えずに 👍 だけ表示 */
  box.innerHTML = "<span>👍</span>";

  timerStopped[found] = true;
  found++;

  totalScore++;
  document.getElementById("score").childNodes[0].textContent = "正解数：" + totalScore + " ";

  if (found === barNum) {
    clearInterval(timerId);
    showSuccess();
    started = false;
    document.getElementById("nextBtn").style.display = "inline-block";
  }
}

/* -------------------------
   不正解
------------------------- */
function markWrong() {
  if (!started) return;

  playWrong();

  const box = document.getElementById("box" + found);
  box.classList.add("wrongFlash");
  setTimeout(() => box.classList.remove("wrongFlash"), 400);
}

/* -------------------------
   爆発（失敗）
------------------------- */
function triggerExplosion() {
  document.getElementById("explosion").style.display = "block";

  playExplosion();

  started = false;

  setTimeout(() => {
    document.getElementById("explosion").style.display = "none";
  }, 900);

  document.getElementById("nextBtn").style.display = "inline-block";
}

/* -------------------------
   成功
------------------------- */
function showSuccess() {
  document.getElementById("successEffect").style.display = "block";

  setTimeout(() => {
    document.getElementById("successEffect").style.display = "none";
  }, 1200);
}

/* -------------------------
   次の問題
------------------------- */
function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= questions.length) currentQuestion = 0;
  init();
}

/* -------------------------
   点数リセット
------------------------- */
function resetScore() {
  totalScore = 0;
  document.getElementById("score").childNodes[0].textContent = "正解数：" + totalScore + " ";
}

/* -------------------------
   リセット
------------------------- */
function resetGame() {
  clearInterval(timerId);
  init();
}

init();
</script>

<div id="manual">
  【操作方法】<br>
  ・START：ゲーム開始<br>
  ・正解：現在のバーを停止し👍に変更<br>
  ・不正解：バーが赤く点滅<br>
  ・SET：制限時間・バー本数を反映<br>
  ・リセット：時間停止＆UI初期化<br>
  ・次の問題へ：成功・失敗どちらでも進める<br>
</div>

</body>
</html>
