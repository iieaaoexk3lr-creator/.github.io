<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カラフルボンバー総合版</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 { font-size: 2.4rem; margin-bottom: 10px; }

  /* 設定エリア */
  #settings {
    margin-bottom: 20px;
    background: #222;
    padding: 15px;
    border-radius: 10px;
  }

  label { font-size: 1.3rem; margin-right: 10px; }

  input, select {
    font-size: 1.3rem;
    padding: 5px;
    margin: 5px;
  }

  #setBtn {
    font-size: 1.3rem;
    padding: 8px 20px;
    margin-left: 10px;
  }

  #question { font-size: 1.7rem; margin-bottom: 20px; }

  /* 正解数表示 */
  #score {
    font-size: 1.6rem;
    margin: 10px 0 20px 0;
  }

  /* タイマー数字 */
  #timerRow {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 10px;
  }

  .timer-box {
    font-size: 2.2rem;
    color: #ff4444;
    width: 60px;
    text-align: center;
  }

  /* 解答バー */
  #answers {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 20px;
  }

  .answer-box {
    width: 70px;
    height: 260px;
    background: #333;
    border-radius: 12px;
    font-size: 1.6rem;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 15px;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
  }

  /* 時間経過で赤く染まる部分 */
  .fill {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: rgba(255,0,0,0.6);
    transition: height 0.2s linear;
  }

  /* 正解 */
  .correct {
    background: #28a745 !important;
    transform: scale(1.05);
  }

  /* 不正解の赤点滅 */
  @keyframes wrongFlash {
    0% { background: #ff0000; }
    50% { background: #333; }
    100% { background: #ff0000; }
  }
  .wrongFlash {
    animation: wrongFlash 0.4s ease-out;
  }

  /* 成功エフェクト */
  #successEffect {
    display: none;
    font-size: 3rem;
    color: #00ffcc;
    animation: sparkle 1s ease-out forwards;
  }

  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1); }
  }

  /* 爆発 */
  #explosion {
    display: none;
    font-size: 4rem;
    color: yellow;
    animation: explode 0.8s ease-out forwards;
  }

  @keyframes explode {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  /* スマホUI */
  @media (max-width: 600px) {
    .answer-box { width: 55px; height: 200px; }
    .timer-box { width: 50px; font-size: 1.8rem; }
  }

  /* 操作説明 */
  #manual {
    margin-top: 30px;
    font-size: 1.2rem;
    color: #ccc;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>カラフルボンバー</h1>

<!-- 設定エリア -->
<div id="settings">
  <label>制限時間：</label>
  <input type="number" id="timeInput" value="50" min="10" max="200"> 秒

  <label>バーの本数：</label>
  <select id="barCount">
    <option>4</option>
    <option selected>5</option>
    <option>6</option>
    <option>7</option>
    <option>8</option>
    <option>9</option>
    <option>10</option>
  </select>

  <button id="setBtn" onclick="applySettings()">SET</button>
</div>

<div id="question">問題がここに表示されます</div>

<div id="score">正解数：0</div>

<div id="timerRow"></div>
<div id="answers"></div>

<button id="startBtn" onclick="startGame()">START</button>
<button onclick="markCorrect()">正解</button>
<button onclick="markWrong()">不正解</button>
<button onclick="resetGame()">リセット</button>

<div id="successEffect">✨成功！✨</div>
<div id="explosion">💥</div>

<!-- 効果音 -->
<audio id="sound-correct" src="https://soundeffect-lab.info/sound/anime/mp3/decision1.mp3"></audio>
<audio id="sound-wrong" src="https://soundeffect-lab.info/sound/anime/mp3/buzzer1.mp3"></audio>
<audio id="sound-explosion" src="https://soundeffect-lab.info/sound/anime/mp3/bomb1.mp3"></audio>

<script>
  let barNum = 5;
  let timeLimit = 50;
  let timeLeft = 50;
  let found = 0;
  let timerId;
  let started = false;
  let timerStopped = [];
  let audioUnlocked = false;

  const questions = [
    "色のつく曲を答えよ！",
    "アニメの曲を答えよ！",
    "動物の曲を答えよ！",
    "三文字の曲を答えよ！",
    "DAM人気TOP50に入っている曲を答えよ！",
    "演歌を答えよ！",
    "英語の曲を答えよ！",
    "ラップの入った曲を答えよ！",
    "Mrs.GREENAPPLEの曲を答えよ！",
    "ーの入った曲を答えよ！"
  ];

  let currentQuestion = 0;

  const timerRow = document.getElementById("timerRow");
  const answersDiv = document.getElementById("answers");

  /* 音声解禁（スマホ対応） */
  function unlockAudio() {
    if (audioUnlocked) return;

    const correct = document.getElementById("sound-correct");
    const wrong = document.getElementById("sound-wrong");
    const explosion = document.getElementById("sound-explosion");

    correct.volume = 0;
    wrong.volume = 0;
    explosion.volume = 0;

    correct.play().then(() => {
      correct.pause(); correct.currentTime = 0; correct.volume = 1;
      wrong.pause(); wrong.currentTime = 0; wrong.volume = 1;
      explosion.pause(); explosion.currentTime = 0; explosion.volume = 1;

      audioUnlocked = true;
    });
  }

  function applySettings() {
    barNum = Number(document.getElementById("barCount").value);
    timeLimit = Number(document.getElementById("timeInput").value);
    resetGame();
  }

  function init() {
    timeLeft = timeLimit;
    found = 0;
    started = false;
    timerStopped = Array(barNum).fill(false);

    document.getElementById("question").textContent = questions[currentQuestion];
    document.getElementById("score").textContent = "正解数：" + found;
    document.getElementById("startBtn").style.display = "inline-block";

    timerRow.innerHTML = "";
    answersDiv.innerHTML = "";

    for (let i = 0; i < barNum; i++) {
      const t = document.createElement("div");
      t.className = "timer-box";
      t.id = "timer" + i;
      t.textContent = timeLeft;
      timerRow.appendChild(t);

      const box = document.createElement("div");
      box.className = "answer-box";
      box.id = "box" + i;

      const fill = document.createElement("div");
      fill.className = "fill";
      fill.id = "fill" + i;

      box.appendChild(fill);
      box.append("？");
      answersDiv.appendChild(box);
    }
  }

  function startGame() {
    if (started) return;
    unlockAudio();  // ← 音声解禁
    started = true;
    document.getElementById("startBtn").style.display = "none";
    startTimer();
  }

  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;

      for (let i = 0; i < barNum; i++) {
        if (!timerStopped[i]) {
          document.getElementById("timer" + i).textContent = timeLeft;

          const percent = ((timeLimit - timeLeft) / timeLimit) * 100;
          document.getElementById("fill" + i).style.height = percent + "%";
        }
      }

      if (timeLeft <= 0) {
        clearInterval(timerId);
        triggerExplosion();
      }
    }, 1000);
  }

  function markCorrect() {
    if (!started || timeLeft <= 0) return;

    const s = document.getElementById("sound-correct");
    s.load();
    s.play();

    const box = document.getElementById("box" + found);
    box.classList.add("correct");
    box.textContent = "👍";

    timerStopped[found] = true;
    found++;

    document.getElementById("score").textContent = "正解数：" + found;

    if (found === barNum) {
      clearInterval(timerId);
      showSuccess();
    }
  }

  function markWrong() {
    if (!started) return;

    const s = document.getElementById("sound-wrong");
    s.load();
    s.play();

    const box = document.getElementById("box" + found);
    box.classList.add("wrongFlash");

    setTimeout(() => box.classList.remove("wrongFlash"), 400);
  }

  function triggerExplosion() {
    document.getElementById("explosion").style.display = "block";
    const s = document.getElementById("sound-explosion");
    s.load();
    s.play();
  }

  function showSuccess() {
    document.getElementById("successEffect").style.display = "block";
  }

  function resetGame() {
    clearInterval(timerId);
    init();
  }

  init();
</script>

<!-- 操作説明 -->
<div id="manual">
  【操作方法】<br>
  ・START：ゲーム開始<br>
  ・正解：現在のバーを停止し👍に変更<br>
  ・不正解：バーが赤く点滅<br>
  ・SET：制限時間・バー本数を反映<br>
  ・リセット：時間停止＆UI初期化<br>
</div>

</body>
</html>
