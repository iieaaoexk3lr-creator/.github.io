<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カラオケすごろく</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 20px;
  }

  #playerSelect {
    margin-bottom: 20px;
  }

  #board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 600px;
    margin: 0 auto 20px;
  }

  .cell {
    width: 70px;
    height: 70px;
    background: #333;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1rem;
    position: relative;
  }

  .start { background: #00ccff; }
  .goal { background: #ffcc00; }

  .playerToken {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    position: absolute;
    bottom: 5px;
  }

  #dice {
    font-size: 2.5rem;
    margin: 10px 0;
  }

  #question {
    font-size: 1.8rem;
    margin: 20px 0;
    min-height: 60px;
  }

  button {
    font-size: 1.2rem;
    padding: 10px 20px;
    margin: 8px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  #goalEffect {
    display: none;
    font-size: 3rem;
    color: #00ffcc;
    animation: sparkle 1s ease-out forwards;
  }

  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1); }
  }

  #goalList {
    margin-top: 20px;
    font-size: 1.4rem;
  }

  @media (max-width: 600px) {
    .cell { width: 55px; height: 55px; font-size: 0.8rem; }
    #question { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<h1>カラオケすごろく</h1>

<div id="playerSelect">
  プレイヤー人数：
  <select id="playerCount" onchange="setupPlayers()">
    <option value="1">1人</option>
    <option value="2">2人</option>
    <option value="3">3人</option>
    <option value="4">4人</option>
    <option value="5">5人</option>
    <option value="6">6人</option>
  </select>
</div>

<div id="board"></div>

<div id="dice">🎲 -</div>

<div id="question"></div>

<div id="goalEffect">✨GOAL!!✨</div>

<button onclick="rollDice()">サイコロを振る</button>
<button onclick="location.href='menu.html'">メニューへ戻る</button>

<div id="goalList"></div>

<script>
  const COLORS = ["#ff4444", "#44ff44", "#4444ff", "#ffff44", "#ff44ff", "#44ffff"];

  const questions = {
    3: "アニメソングを歌う",
    5: "90年代の曲を歌う",
    7: "バラードを歌う",
    10: "アップテンポ曲を歌う",
    12: "異性アーティストの曲を歌う",
    15: "英語の曲を歌う",
    18: "デュエット曲を歌う",
    20: "盛り上がる曲を歌う",
    25: "自由に選んで歌う"
  };

  let positions = [];
  let goalOrder = [];
  let currentPlayer = 0;
  let playerCount = 1;

  const board = document.getElementById("board");
  const questionDiv = document.getElementById("question");
  const diceDiv = document.getElementById("dice");
  const goalEffect = document.getElementById("goalEffect");
  const goalList = document.getElementById("goalList");

  function setupPlayers() {
    playerCount = Number(document.getElementById("playerCount").value);
    positions = Array(playerCount).fill(0);
    goalOrder = [];
    currentPlayer = 0;
    drawBoard();
    updateTokens();
    updateGoalList();
  }

  function drawBoard() {
    board.innerHTML = "";
    for (let i = 0; i < 30; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.id = "cell" + i;

      if (i === 0) cell.classList.add("start");
      if (i === 29) cell.classList.add("goal");

      cell.textContent = i === 0 ? "START" : i === 29 ? "GOAL" : i + 1;

      board.appendChild(cell);
    }
  }

  function updateTokens() {
    document.querySelectorAll(".playerToken").forEach(e => e.remove());

    positions.forEach((pos, i) => {
      const token = document.createElement("div");
      token.className = "playerToken";
      token.style.background = COLORS[i];
      document.getElementById("cell" + pos).appendChild(token);
    });
  }

  function rollDice() {
    if (goalOrder.includes(currentPlayer)) {
      nextTurn();
      return;
    }

    const roll = Math.floor(Math.random() * 6) + 1;
    diceDiv.textContent = "🎲 " + roll;

    positions[currentPlayer] += roll;
    if (positions[currentPlayer] >= 29) {
      positions[currentPlayer] = 29;
      handleGoal(currentPlayer);
    }

    updateTokens();
    showQuestion(positions[currentPlayer]);
    nextTurn();
  }

  function showQuestion(pos) {
    if (questions[pos]) {
      questionDiv.textContent = questions[pos];
    } else {
      questionDiv.textContent = "（何もなし）";
    }
  }

  function handleGoal(player) {
    if (!goalOrder.includes(player)) {
      goalOrder.push(player);
      goalEffect.style.display = "block";
      setTimeout(() => goalEffect.style.display = "none", 1000);
      updateGoalList();
    }
  }

  function updateGoalList() {
    goalList.innerHTML = "GOAL順：<br>" +
      goalOrder.map((p, i) => (i + 1) + "位：プレイヤー" + (p + 1)).join("<br>");
  }

  function nextTurn() {
    currentPlayer = (currentPlayer + 1) % playerCount;
  }

  setupPlayers();
</script>

</body>
</html>
