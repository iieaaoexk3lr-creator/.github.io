<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カラオケビンゴ！</title>
<style>
  body {
    background:#111;
    color:#fff;
    font-family:sans-serif;
    text-align:center;
    padding:20px;
  }
  h1{ font-size:2rem; margin-bottom:10px; }
  select,input,button{
    font-size:1rem;
    padding:6px 10px;
    margin:4px;
    border-radius:6px;
    border:none;
  }
  button{ cursor:pointer; }

  #board{
    margin:20px auto;
    display:grid;
    gap:6px;
    max-width:420px;
  }
  .cell{
    background:#333;
    border-radius:8px;
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1rem;
    padding:4px;
    word-break:break-word;
    transition:0.25s;
  }
  .editable:hover{ outline:2px solid #888; }
  .hit{
    background:#00c896;
    color:#000;
    transform:scale(1.05);
    box-shadow:0 0 10px #00ffcc;
  }
  #bingoBanner{
    margin-top:15px;
    font-size:2rem;
    color:#ffeb3b;
    text-shadow:0 0 10px #ff9800;
    display:none;
  }
  #rules{
    margin:20px auto 0;
    max-width:420px;
    text-align:left;
    background:#222;
    padding:10px;
    border-radius:8px;
    font-size:0.9rem;
    line-height:1.6;
  }
</style>
</head>
<body>

<h1>カラオケビンゴ！</h1>

<!-- ▼ 設定欄 ▼ -->
<select id="mode">
  <option value="score">点数ビンゴ</option>
  <option value="word">漢字ビンゴ</option>
</select>

<select id="sizeSelect">
  <option value="4">4×4（16マス）</option>
  <option value="5" selected>5×5（25マス）</option>
  <option value="6">6×6（36マス）</option>
</select>

<br>

<span id="scoreRangeBox">
  最低点 <input id="minScore" type="number" value="70" style="width:70px;">
  最高点 <input id="maxScore" type="number" value="100" style="width:70px;">
</span>

<br>

<button id="randomBtn">ランダム生成</button>
<button id="startBtn">START</button>
<button id="resetBtn">リセット</button>
<button onclick="location.href='index.html'">indexへ戻る</button>

<div id="bingoBanner">BINGO！！</div>

<!-- ▼ ビンゴ盤 ▼ -->
<div id="board"></div>

<!-- ▼ 説明文 ▼ -->
<div id="rules">
  【遊び方】<br>
  ・点数ビンゴ or 漢字ビンゴを選びます。<br>
  ・マス数（4×4 / 5×5 / 6×6）を選びます。<br>
  ・ランダム生成でマスを埋めます。<br>
  ・START前はマスをクリックして候補から選択できます。<br>
  ・START後は編集できません。<br>
  ・ゲーム中は一致したマスをタップして色を付けます（もう一度タップで戻る）。<br>
  ・縦・横・斜めのどれかが揃うとBINGOです。<br>
</div>

<script>
// ▼ 漢字100個
const wordPool = [
  "愛","夢","心","空","海","風","花","星","月","夜",
  "光","音","歌","声","道","雨","雪","恋","涙","虹",
  "春","夏","秋","冬","桜","陽","蒼","青","赤","白",
  "黒","金","銀","時","瞬","永","未","今","明","暗",
  "君","僕","私","人","友","家","旅","街","影","波",
  "炎","雲","森","川","山","島","絆","願","祈","想",
  "魂","詩","響","旋","舞","華","香","宙","天","地",
  "幻","零","一","二","三","四","五","六","七","八",
  "九","風","花","歌","心","愛","夢","夜","虹","光"
];

let size = 5;
let mode = "score";
let boardValues = [];
let hits = [];
let started = false;

const boardEl = document.getElementById("board");
const modeEl = document.getElementById("mode");
const sizeEl = document.getElementById("sizeSelect");
const scoreRangeBox = document.getElementById("scoreRangeBox");
const randomBtn = document.getElementById("randomBtn");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const bingoBanner = document.getElementById("bingoBanner");

// ▼ 盤初期化
function initBoard(){
  boardEl.innerHTML = "";
  boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  const total = size*size;
  boardValues = new Array(total).fill("");
  hits = new Array(total).fill(false);

  for(let i=0;i<total;i++){
    const div = document.createElement("div");
    div.className = "cell editable";
    div.dataset.index = i;
    div.onclick = () => onCellClick(i);
    boardEl.appendChild(div);
  }
  bingoBanner.style.display = "none";
}

// ▼ マスクリック
function onCellClick(i){
  if(started){
    // START後 → タップでON/OFF
    hits[i] = !hits[i];
    renderBoard();
    checkBingo();
    return;
  }

  // START前 → 候補から選択
  if(mode === "score"){
    const min = Number(document.getElementById("minScore").value);
    const max = Number(document.getElementById("maxScore").value);
    const count = size*size;
    const candidates = generateScoreCandidates(min,max,count);
    const choice = prompt("点数を選んでください：\n" + candidates.join(" / "));
    if(choice) boardValues[i] = choice;
  }else{
    const count = size*size;
    const candidates = generateKanjiCandidates(count);
    const choice = prompt("漢字を選んでください：\n" + candidates.join(" / "));
    if(choice) boardValues[i] = choice;
  }
  renderBoard();
}

// ▼ 点数候補生成
function generateScoreCandidates(min,max,count){
  const list=[];
  for(let i=0;i<count;i++){
    list.push(String(Math.floor(Math.random()*(max-min+1))+min));
  }
  return list;
}

// ▼ 漢字候補生成
function generateKanjiCandidates(count){
  const pool=[...wordPool];
  const result=[];
  for(let i=0;i<count;i++){
    if(pool.length===0) break;
    const idx=Math.floor(Math.random()*pool.length);
    result.push(pool[idx]);
    pool.splice(idx,1);
  }
  return result;
}

// ▼ ランダム生成
function randomFill(){
  if(started) return;
  const total = size*size;

  if(mode==="score"){
    const min = Number(document.getElementById("minScore").value);
    const max = Number(document.getElementById("maxScore").value);
    boardValues = generateScoreCandidates(min,max,total);
  }else{
    boardValues = generateKanjiCandidates(total);
  }
  renderBoard();
}

// ▼ START
function startGame(){
  if(started) return;

  // 空欄チェック
  if(boardValues.some(v => v === "")){
    alert("空欄のマスがあります。すべて埋めてからSTARTしてください。");
    return;
  }

  started = true;

  randomBtn.disabled = true;
  modeEl.disabled = true;
  sizeEl.disabled = true;
  document.getElementById("minScore").disabled = true;
  document.getElementById("maxScore").disabled = true;

  renderBoard();
}

// ▼ ビンゴ判定
function checkBingo(){
  const lines = [];

  // rows
  for(let r=0;r<size;r++){
    const row=[];
    for(let c=0;c<size;c++) row.push(r*size+c);
    lines.push(row);
  }
  // cols
  for(let c=0;c<size;c++){
    const col=[];
    for(let r=0;r<size;r++) col.push(r*size+c);
    lines.push(col);
  }
  // diag
  const d1=[], d2=[];
  for(let i=0;i<size;i++){
    d1.push(i*size+i);
    d2.push(i*size+(size-1-i));
  }
  lines.push(d1,d2);

  let bingo=false;
  for(const line of lines){
    if(line.every(i=>hits[i])) bingo=true;
  }

  if(bingo){
    bingoBanner.style.display="block";
  }
}

// ▼ 描画
function renderBoard(){
  const cells = boardEl.querySelectorAll(".cell");
  cells.forEach((c,idx)=>{
    c.textContent = boardValues[idx];
    c.classList.toggle("hit", hits[idx]);
    c.classList.toggle("editable", !started);
  });
}

// ▼ リセット
function resetAll(){
  started = false;
  randomBtn.disabled = false;
  modeEl.disabled = false;
  sizeEl.disabled = false;
  document.getElementById("minScore").disabled = false;
  document.getElementById("maxScore").disabled = false;
  bingoBanner.style.display="none";
  initBoard();
}

modeEl.addEventListener("change",()=>{
  mode = modeEl.value;
  scoreRangeBox.style.display = mode==="score" ? "inline" : "none";
});

sizeEl.addEventListener("change",()=>{
  size = Number(sizeEl.value);
  initBoard();
});

randomBtn.addEventListener("click",randomFill);
startBtn.addEventListener("click",startGame);
resetBtn.addEventListener("click",resetAll);

resetAll();
</script>

</body>
</html>
