<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介文ジェネレーター</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            color: #4A5568; 
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fff;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .action-btn {
            padding: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-clover { background-color: #2ECC71; } /* 緑 */
        .btn-clover:active { background-color: #27AE60; }
        
        .btn-music { background-color: #9B59B6; } /* 紫 */
        .btn-music:active { background-color: #8E44AD; }
        
        .btn-colorful { background-color: #E67E22; } /* オレンジ */
        .btn-colorful:active { background-color: #D35400; }
        
        .btn-simple { background-color: #7F8C8D; } /* グレー */
        .btn-simple:active { background-color: #718093; }

        .result-area {
            margin-top: 25px;
            display: none;
        }
        textarea#output {
            background-color: #fff;
            border: 2px solid #3498DB;
            height: 200px;
            resize: vertical;
        }
        .copy-btn {
            width: 100%;
            padding: 12px;
            background-color: #2C3E50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .copy-btn:active {
            background-color: #1A252F;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>自己紹介ジェネレーター</h1>
    
    <div class="form-group">
        <label for="name">ニックネーム</label>
        <input type="text" id="name" placeholder="例：たか">
    </div>

    <div class="form-group">
        <label for="age">年代</label>
        <input type="text" id="age" placeholder="例：20代、社会人など">
    </div>

    <div class="form-group">
        <label for="gender">性別（任意）</label>
        <select id="gender">
            <option value="">未選択（表示しない）</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
            <option value="ひみつ">ひみつ</option>
        </select>
    </div>

    <div class="form-group">
        <label for="area">地域（任意）</label>
        <input type="text" id="area" placeholder="例：東京、関西など">
    </div>

    <div class="form-group">
        <label for="music">好きな曲、歌手</label>
        <input type="text" id="music" placeholder="例：○○、△△の曲全般">
    </div>

    <div class="form-group">
        <label for="message">一言</label>
        <textarea id="message" rows="2" placeholder="例：気軽に仲良くしてください！"></textarea>
    </div>

    <label style="margin-top: 20px; font-size: 0.85rem; color: #666;">↓好みのモードをタップして文章を作成</label>
    <div class="btn-grid">
        <button class="action-btn btn-clover" onclick="generateIntro('clover')">🍀 通常モード</button>
        <button class="action-btn btn-music" onclick="generateIntro('music')">🎵 楽譜モード</button>
        <button class="action-btn btn-colorful" onclick="generateIntro('colorful')">🌈 色々モード</button>
        <button class="action-btn btn-simple" onclick="generateIntro('simple')">📝 シンプル</button>
    </div>

    <div id="resultArea" class="result-area">
        <label id="patternTitle" style="color: #666; font-size: 0.85rem; font-weight: normal; margin-bottom: 5px; display: block;"></label>
        <textarea id="output" placeholder="ここで自由に文章を編集・微調整できます"></textarea>
        <button class="copy-btn" onclick="copyToClipboard()">文章をコピーする</button>
    </div>
</div>

<script>
function generateIntro(pattern) {
    const name = document.getElementById('name').value.trim() || '未設定';
    const age = document.getElementById('age').value.trim() || '未設定';
    const gender = document.getElementById('gender').value;
    const area = document.getElementById('area').value.trim();
    const music = document.getElementById('music').value.trim() || '特になし（色々聴きます）';
    const message = document.getElementById('message').value.trim() || 'よろしくお願いします！';

    let text = "";
    let patternName = "";

    if (pattern === 'clover') {
        patternName = "【作成結果：通常（クローバー）】（自由に書き換えられます）";
        text += `【自己紹介】\n`;
        text += `🍀ニックネーム：${name}\n`;
        text += `🍀年代：${age}\n`;
        if (gender) text += `🍀性別：${gender}\n`;
        if (area) text += `🍀地域：${area}\n`;
        text += `🍀好きな曲・歌手：${music}\n`;
        text += `🍀一言：${message}`;
    } 
    else if (pattern === 'music') {
        patternName = "【作成結果：楽譜（音楽）】（自由に書き換えられます）";
        text += `♪*:･\'ﾟ♭.:*･♪ 自己紹介 ♪*:･\'ﾟ♭.:*･♪\n\n`;
        text += `♫ ニックネーム：${name}\n`;
        text += `♫ 年代：${age}\n`;
        if (gender) text += `♫ 性別：${gender}\n`;
        if (area) text += `♫ 地域：${area}\n`;
        text += `🎤 好きな曲・歌手：${music}\n`;
        text += `♫ 一言：${message}\n\n`;
        text += `よろしくおねがいします ♫꒰･◡･๑꒱`;
    } 
    else if (pattern === 'colorful') {
        patternName = "【作成結果：色々（カラフル）】（自由に書き換えられます）";
        text += `✨✨自己紹介です✨✨\n\n`;
        text += `👤 ニックネーム ＞ ${name}\n`;
        text += `🎂 年代 ＞ ${age}\n`;
        if (gender) text += `⚧ 性別 ＞ ${gender}\n`;
        if (area) text += `📍 地域 ＞ ${area}\n`;
        text += `🎧 好きな曲・歌手 ＞ ${music}\n`;
        text += `💬 一言 ＞ ${message}\n\n`;
        text += `仲良くしてくださいっ！🌈✨`;
    } 
    else if (pattern === 'simple') {
        patternName = "【作成結果：シンプル】（自由に書き換えられます）";
        text += `■自己紹介\n`;
        text += `・ニックネーム：${name}\n`;
        text += `・年代：${age}\n`;
        if (gender) text += `・性別：${gender}\n`;
        if (area) text += `・地域：${area}\n`;
        text += `・好きな曲、歌手：${music}\n`;
        text += `・一言：${message}`;
    }

    document.getElementById('patternTitle').innerText = patternName;
    document.getElementById('output').value = text;
    document.getElementById('resultArea').style.display = 'block';
    
    document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
}

function copyToClipboard() {
    const outputText = document.getElementById('output');
    outputText.select();
    outputText.setSelectionRange(0, 99999); 

    navigator.clipboard.writeText(outputText.value).then(() => {
        alert('コピーしました！貼り付けてお使いください。');
    }).catch(err => {
        alert('コピーに失敗しました。手動で選択してコピーしてください。');
    });
}
</script>

</body>
</html>
