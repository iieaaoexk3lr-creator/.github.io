<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出欠＆部屋割り（参加者用）</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --warning: #ffc000;
            --danger: #dc3545;
            --dark: #343a40;
            --light: #f8f9fa;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Sans-Serif; max-width: 480px; margin: 0 auto; padding: 12px; background: #e9ecef; color: #333; line-height: 1.5; word-break: break-all; }
        .card { background: white; padding: 15px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); box-sizing: border-box; margin-bottom: 12px; }
        h2, h3 { text-align: center; color: var(--dark); margin-top: 0; }
        h2 { font-size: 18px; margin-bottom: 15px; }
        h3 { font-size: 15px; margin-bottom: 10px; border-bottom: 2px solid var(--primary); padding-bottom: 5px; text-align: left; color: var(--primary); }
        
        /* スマホ用入力・選択ボタン */
        .input-field { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 2px solid #ced4da; border-radius: 10px; margin-bottom: 12px; text-align: center; background: var(--light); outline: none; }
        .status-selector { display: flex; gap: 8px; margin-bottom: 15px; }
        .status-btn { flex: 1; padding: 10px; border: 2px solid #ced4da; border-radius: 8px; background: white; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; }
        .status-btn.active[data-status="⭕参加"] { background: #e2f0d9; border-color: var(--success); color: #385723; }
        .status-btn.active[data-status="🔺未確定"] { background: #fff3cd; border-color: var(--warning); color: #856404; }
        .status-btn.active[data-status="❌不参加"] { background: #f8d7da; border-color: var(--danger); color: #721c24; }
        
        .btn { background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; -webkit-appearance: none; }
        
        /* 調整さん風出欠テーブル */
        .chouseisan-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 13px; background: white; border-radius: 8px; overflow: hidden; }
        .chouseisan-table th, .chouseisan-table td { padding: 8px; border: 1px solid #dee2e6; text-align: center; }
        .chouseisan-table th { background: var(--light); color: #495057; }
        .st-badge { font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; }
        .st-badge.go { background: #e2f0d9; color: #385723; }
        .st-badge.maybe { background: #fff3cd; color: #856404; }
        .st-badge.ng { background: #f8d7da; color: #721c24; }
        
        /* 部屋割りボックス */
        .room-box { background: #fff; padding: 12px; margin-bottom: 10px; border: 1px solid #dee2e6; border-radius: 10px; box-sizing: border-box; }
        .room-box.my-room { border: 2.5px solid var(--warning); background: #fffdf2; box-shadow: 0 4px 8px rgba(255,192,0,0.15); }
        .room-title-row { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 14px; margin-bottom: 6px; flex-wrap: wrap; gap: 4px; }
        .room-meta-tags { font-size: 11px; font-weight: normal; color: #666; margin-top: 2px; }
        .meta-badge { background: #e9ecef; color: #495057; padding: 1px 5px; border-radius: 4px; margin-right: 4px; display: inline-block; }
        
        /* メンバー名バッジ */
        .member-container-flex { display: flex; flex-wrap: wrap; gap: 4px; }
        .member-badge { background: #e2e3e5; color: #3e4444; padding: 4px 8px; border-radius: 6px; font-size: 13px; display: inline-block; font-weight: bold; max-width: 100%; box-sizing: border-box; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .member-badge.is-me { background: var(--warning); color: #000; border: 1px solid #e0a800; }
        
        /* マイステータス変更エリア */
        .my-status-bar { display: flex; justify-content: space-between; align-items: center; background: #e8f4fd; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: bold; margin-bottom: 15px; border: 1px solid #bee5eb; }
        .mini-select { padding: 4px; font-size: 12px; font-weight: bold; border-radius: 4px; border: 1px solid #ced4da; }
    </style>
</head>
<body>

    <div class="card" style="text-align:center; padding: 10px 15px;">
        <h2 id="mainTitle" style="margin:0;">部屋割りシステム</h2>
        <span id="myIdentityDisplay" style="font-size:12px; color:#666; display:none;"></span>
    </div>

    <div id="registerArea" class="card" style="display:none;">
        <h3>✍️ 出欠の登録</h3>
        <input type="text" id="myNameInput" class="input-field" placeholder="お名前・ニックネーム">
        <label>現在の出欠ステータス:</label>
        <div class="status-selector">
            <button class="status-btn active" data-status="⭕参加" onclick="selectStatus(this)">⭕参加</button>
            <button class="status-btn" data-status="🔺未確定" onclick="selectStatus(this)">🔺未確定</button>
            <button class="status-btn" data-status="❌不参加" onclick="selectStatus(this)">❌不参加</button>
        </div>
        <button class="btn" onclick="registerMe()">この内容で登録する</button>
    </div>

    <div id="mainDashboardArea" style="display:none;">
        
        <div class="my-status-bar">
            <span>👤 マイ出欠変更:</span>
            <select id="myStatusUpdater" class="mini-select" onchange="updateMyStatus(this.value)">
                <option value="⭕参加">⭕参加</option>
                <option value="🔺未確定">🔺未確定</option>
                <option value="❌不参加">❌帰宅・不参加</option>
            </select>
        </div>

        <div class="card">
            <h3>📊 出欠確定状況</h3>
            <table class="chouseisan-table">
                <thead>
                    <tr>
                        <th>参加者名</th>
                        <th>状態</th>
                    </tr>
                </thead>
                <tbody id="chouseisanLobby">
                    </tbody>
            </table>
        </div>

        <div class="card">
            <h3>🎉 現在の部屋割り</h3>
            <p id="subResultTip" style="font-size: 11px; color: #666; margin-top: -5px; margin-bottom: 12px;">
                黄色の <span style="background: var(--warning); padding: 1px 4px; border-radius: 4px; font-weight: bold; color:#000;">👑 あなたの部屋</span> へ移動してください。
            </p>
            <div id="roomsContainer"></div>
        </div>
    </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDfMGBuQYpuyOMGt_hEdPgR_z42d92E8Lo",
  authDomain: "heyagae-84.firebaseapp.com",
  databaseURL: "https://heyagae-84-default-rtdb.firebaseio.com",
  projectId: "heyagae-84",
  storageBucket: "heyagae-84.firebasestorage.app",
  messagingSenderId: "199911902929",
  appId: "1:199911902929:web:447aa228c15e4b80b7bff0",
  measurementId: "G-BCG3FMW3KS"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const urlParams = new URLSearchParams(window.location.search);
const groupId = urlParams.get('groupId'); 
const storageKey = `room_app_groupid_${groupId}`;

let mySavedName = "";
let chosenRegStatus = "⭕参加";

window.onload = function() {
    if (!groupId) {
        document.body.innerHTML = `<div class='card' style='margin-top:20px;'><h3>⚠️ URLエラー</h3><p style='font-size:13px;'>正しい招待URLからアクセスし直してください。</p></div>`;
        return;
    }
    startListeningResult();
};

function selectStatus(btn) {
    document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    chosenRegStatus = btn.getAttribute('data-status');
}

function initDisplay() {
    mySavedName = localStorage.getItem(storageKey);
    if (mySavedName) {
        document.getElementById('registerArea').style.display = 'none';
        document.getElementById('mainDashboardArea').style.display = 'block';
        document.getElementById('myIdentityDisplay').style.display = 'inline-block';
        document.getElementById('myIdentityDisplay').innerText = `ログイン中: ${mySavedName} さん`;
    } else {
        document.getElementById('mainDashboardArea').style.display = 'none';
        document.getElementById('myIdentityDisplay').style.display = 'none';
        document.getElementById('registerArea').style.display = 'block';
    }
}

function registerMe() {
    const name = document.getElementById('myNameInput').value.trim();
    if (!name) { alert("お名前を入力してください"); return; }
    if (name.length > 12) { alert("名前は12文字以内で入力してください"); return; }

    db.collection("multigroups").doc(groupId).collection("members").doc(name).set({
        name: name,
        status: chosenRegStatus,
        registeredAt: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => {
        localStorage.setItem(storageKey, name);
        mySavedName = name;
        document.getElementById('myStatusUpdater').value = chosenRegStatus;
        initDisplay();
    })
    .catch(err => alert("登録エラー: " + err));
}

function updateMyStatus(newStatus) {
    if (!mySavedName || !groupId) return;
    db.collection("multigroups").doc(groupId).collection("members").doc(mySavedName).update({
        status: newStatus
    }).catch(() => {
        alert("ログインセッションが切れました。再登録してください。");
        localStorage.removeItem(storageKey);
        initDisplay();
    });
}

function startListeningResult() {
    // 1. グループメインデータのリアルタイム監視
    db.collection("multigroups").doc(groupId).onSnapshot((doc) => {
        if (doc.exists) {
            const data = doc.data();
            if (data.title) document.getElementById('mainTitle').innerText = data.title;
            if (data.status === "reset") {
                localStorage.removeItem(storageKey);
                mySavedName = "";
                initDisplay();
                return;
            }
            mySavedName = localStorage.getItem(storageKey);
            if (mySavedName) {
                renderGuestRooms(data.currentResult || []);
            } else {
                initDisplay();
            }
        } else {
            initDisplay();
        }
    });

    // 2. メンバー出欠（調整さん機能）のリアルタイム監視
    db.collection("multigroups").doc(groupId).collection("members").onSnapshot((snapshot) => {
        let lobbyHtml = "";
        let amIStillValid = false;
        
        snapshot.forEach((doc) => {
            const m = doc.data();
            if (m.name === mySavedName) {
                amIStillValid = true;
                document.getElementById('myStatusUpdater').value = m.status;
            }

            let badgeClass = "st-badge go";
            if(m.status === "🔺未確定") badgeClass = "st-badge maybe";
            if(m.status === "❌不参加") badgeClass = "st-badge ng";

            lobbyHtml += `
                <tr>
                    <td style="font-weight:bold; text-align:left;">👤 ${m.name}</td>
                    <td><span class="${badgeClass}">${m.status}</span></td>
                </tr>
            `;
        });

        // 幹事からキックされた場合のセーフティ
        if (mySavedName && !amIStillValid) {
            localStorage.removeItem(storageKey);
            mySavedName = "";
            initDisplay();
            return;
        }

        document.getElementById('chouseisanLobby').innerHTML = lobbyHtml || `<tr><td colspan="2" style="color:#ccc;">登録メンバーはいません</td></tr>`;
    });
}

function renderGuestRooms(rooms) {
    let html = '';
    let hasResult = rooms.some(r => r.members && r.members.length > 0);
    
    if (!hasResult) {
        document.getElementById('subResultTip').style.display = 'none';
        document.getElementById('roomsContainer').innerHTML = `<p style="text-align:center; color:#999; font-size:13px; padding:15px 0;">幹事さんが部屋割りを準備中です...⏳</p>`;
        return;
    }
    document.getElementById('subResultTip').style.display = 'block';

    rooms.forEach(r => {
        // 特設枠は参加者用画面には表示しない
        if (r.isSpecial) return;

        const isMyRoom = r.members.includes(mySavedName);
        const boxClass = isMyRoom ? 'room-box my-room' : 'room-box';
        const titlePrefix = isMyRoom ? '👑 ' : '🏠 ';

        let metaHtml = '';
        const tags = [r.model, r.memo].filter(Boolean);
        if (tags.length > 0) {
            metaHtml = `<div class="room-meta-tags">` + tags.map(t => `<span class="meta-badge">${t}</span>`).join('') + `</div>`;
        }

        const badges = r.members.map(m => {
            const isMe = (m === mySavedName);
            return `<span class="member-badge ${isMe ? 'is-me' : ''}">${isMe ? '👑 ' : ''}${m}</span>`;
        }).join('');

        html += `
            <div class="${boxClass}">
                <div class="room-title-row">
                    <div>
                        <span style="${isMyRoom ? 'color:#7f6000;':''}">${titlePrefix}${r.name}</span>
                        ${metaHtml}
                    </div>
                    <span style="font-size:12px; color:#666;">${r.members.length} / ${r.capacity || 5}人</span>
                </div>
                <div class="member-container-flex">${badges || '<span style="color:#ccc; font-size:12px;">空き部屋</span>'}</div>
            </div>
        `;
    });
    document.getElementById('roomsContainer').innerHTML = html;
}
</script>
</body>
</html>
