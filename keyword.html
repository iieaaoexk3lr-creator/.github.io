HTML
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古今東西曲出しゲーム - リアルタイムスコアボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+JP:wght@500;800;900&display=swap');
        body {
            font-family: 'Noto+Sans+JP', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .font-numeric { font-family: 'Fredoka One', sans-serif; }
        .score-blur { filter: blur(14px); user-select: none; }
        .app-card {
            background: rgba(22, 30, 49, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="p-3 md:p-6 min-h-screen flex flex-col justify-between">

    <!-- メインコンテンツコンテナ -->
    <div class="max-w-md mx-auto w-full flex-grow flex flex-col justify-start">
        
        <!-- ナビゲーション・管理者ログイン -->
        <div class="flex justify-between items-center mb-4">
            <a href="6gatu.html" class="app-card px-4 py-2 rounded-xl text-xs font-bold text-gray-400 hover:text-white transition-all">🏠 Menu</a>
            <div class="flex items-center gap-1.5">
                <input type="password" id="adminKeyInput" placeholder="🔑" class="w-16 text-center bg-gray-900/60 text-white px-2 py-1.5 rounded-xl border border-gray-800 text-xs focus:outline-none focus:border-blue-500">
                <button id="authBtn" class="bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 text-xs font-bold px-3 py-1.5 rounded-xl border border-blue-500/30 transition-all">Login</button>
            </div>
        </div>

        <!-- 🔑 他のゲームと統一した「合言葉入力エリア」 -->
        <div class="app-card p-4 rounded-2xl mb-6 border border-blue-500/30 shadow-lg">
            <label class="text-xs font-black text-blue-400 block mb-1.5">🔑 合言葉（ルーム名）を入力</label>
            <div class="flex gap-2">
                <input type="text" id="roomKeyInput" placeholder="例: ひみつ の部屋" class="flex-grow bg-gray-900 text-white font-bold text-sm px-4 py-2.5 rounded-xl border border-gray-700 outline-none focus:border-blue-500">
                <button onclick="loadRoomData()" class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white text-xs font-black px-5 py-2.5 rounded-xl hover:opacity-90 transition-all shadow-md shadow-blue-500/10">
                    読み込み
                </button>
            </div>
        </div>

        <!-- 管理者コントロールパネル -->
        <div id="adminPanel" class="hidden app-card border-2 border-blue-500/50 rounded-3xl p-5 mb-6 shadow-2xl">
            <h2 class="text-lg font-black text-blue-400 mb-3 flex items-center gap-1">🛠️ コントロールセンター</h2>
            
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button id="toggleScores" class="bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-red-300 py-2 rounded-xl text-xs font-bold transition-all">
                    👁️ スコア公開/秘匿
                </button>
                <button onclick="resetCurrentRoom()" class="bg-gray-900 hover:bg-red-950 border border-red-900/60 py-2 rounded-xl text-xs font-bold transition-all text-red-400">
                    🧹 このルームをリセット
                </button>
            </div>

            <!-- 自動判定条件（漢字・よみがな・ボーナス） -->
            <div class="space-y-2 border-t border-gray-800 pt-3">
                <div>
                    <label class="text-[10px] font-black text-gray-400 block mb-0.5">お題ワード（一致条件：複数ある場合はカンマ「,」区切り）</label>
                    <input type="text" id="setup-keyword" placeholder="例: 赤,あか,アカ (空欄時は全曲正解)" class="w-full bg-gray-900 text-white text-xs px-3 py-2 rounded-xl border border-gray-700 font-bold focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-gray-400 block mb-0.5">★ボーナス対象曲名（一致で+3点：複数はカンマ区切り）</label>
                    <input type="text" id="setup-bonus" placeholder="例: 赤いスイートピー,あかいすいーとぴー" class="w-full bg-gray-900 text-white text-xs px-3 py-2 rounded-xl border border-gray-700 font-bold focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="syncGameSettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl font-bold text-sm transition-all shadow mt-1">
                    🎯 お題を同期して自動判定を実行
                </button>
            </div>
        </div>

        <!-- アプリヘッダータイトル -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-400">
                古今東西曲出しゲーム
            </h1>
            <div id="currentModeLabel" class="inline-block bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[11px] font-bold px-3 py-1 rounded-full mt-2">
                合言葉を入力してください
            </div>
        </div>

        <!-- 現在読み込んでいるルーム内のユーザー一覧・スコアボード -->
        <div id="boardGrid" class="space-y-4 flex-grow">
            <!-- 参加者がここにリアルタイムに並びます -->
            <div class="text-center text-xs text-gray-500 py-12">合言葉を入力して「読み込み」を押すと<br>スコアボードが展開されます。</div>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
            authDomain: "gamehistory-m84.firebaseapp.com",
            databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
            projectId: "gamehistory-m84",
            storageBucket: "gamehistory-m84.firebasestorage.app",
            messagingSenderId: "475761727837",
            appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
            measurementId: "G-3636W6LC4F"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const ADMIN_SECRET = "admin123"; 
        let isAdmin = false;
        let currentRoomKey = ""; // 現在開いている合言葉（ルーム）
        let activeFirebaseRef = null;

        let state = {
            showScores: false,
            keyword: "",
            bonus_song: "",
            players: {} // 入力された合言葉（ルーム名）の中のプレイヤーたちを格納
        };

        // 管理者ログイン
        document.getElementById('authBtn').onclick = () => {
            if (document.getElementById('adminKeyInput').value === ADMIN_SECRET) {
                isAdmin = true;
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('adminKeyInput').disabled = true;
                document.getElementById('authBtn').innerText = "管理者";
                document.getElementById('authBtn').className = "bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-3 py-1.5 rounded-xl";
                if(currentRoomKey) calculateAndRender(); 
            } else {
                alert("管理キーが違います。");
            }
        };

        // 🔑 合言葉の部屋をロードする関数
        window.loadRoomData = function() {
            const roomKey = document.getElementById('roomKeyInput').value.trim();
            if(!roomKey) {
                alert("合言葉を入力してください。");
                return;
            }
            
            currentRoomKey = roomKey;

            // 古いリスナーがあれば解除
            if(activeFirebaseRef) activeFirebaseRef.off();

            // 指定された合言葉（ルーム）のデータをリアルタイム監視開始
            activeFirebaseRef = db.ref(`game_rooms/${currentRoomKey}`);
            activeFirebaseRef.on('value', (snap) => {
                const roomData = snap.val() || {};
                
                // ルーム内に格納されているお題条件やプレイヤーリストをstateにマージ
                state.keyword = roomData.keyword || "";
                state.bonus_song = roomData.bonus_song || "";
                state.showScores = roomData.showScores || false;
                
                // プレイヤーの送信データ（submitted_songsや手動調整スコア）を整理
                state.players = roomData.players || {};

                // 管理パネル側のインプットに初期値を同期
                if(document.getElementById('setup-keyword') && !document.getElementById('setup-keyword').matches(':focus')) {
                    document.getElementById('setup-keyword').value = state.keyword;
                }
                if(document.getElementById('setup-bonus') && !document.getElementById('setup-bonus').matches(':focus')) {
                    document.getElementById('setup-bonus').value = state.bonus_song;
                }

                calculateAndRender();
            });
        };

        // 手動スコア微調整（プレイヤー個別）
        window.updateManualAdjustment = (playerKey, value) => {
            const adjustVal = parseInt(value) || 0;
            if(!currentRoomKey) return;
            db.ref(`game_rooms/${currentRoomKey}/players/${playerKey}/manualAdjust`).set(adjustVal);
        };

        // お題・ボーナス条件をこの合言葉ルームに送信
        window.syncGameSettings = function() {
            if(!currentRoomKey) {
                alert("先に合言葉を読み込んでください。");
                return;
            }
            const kw = document.getElementById('setup-keyword').value.trim();
            const bonus = document.getElementById('setup-bonus').value.trim();

            db.ref(`game_rooms/${currentRoomKey}/keyword`).set(kw);
            db.ref(`game_rooms/${currentRoomKey}/bonus_song`).set(bonus);
            alert("このルームにお題・ボーナス条件を同期しました！");
        };

        // ルームリセット
        window.resetCurrentRoom = function() {
            if(!currentRoomKey) return;
            if(confirm(`合言葉「${currentRoomKey}」の全参加者の曲データを完全に初期化します。よろしいですか？`)) {
                db.ref(`game_rooms/${currentRoomKey}/players`).remove();
            }
        };

        // 公開・秘匿のトグル
        document.getElementById('toggleScores').onclick = () => {
            if(!currentRoomKey) return;
            db.ref(`game_rooms/${currentRoomKey}/showScores`).set(!state.showScores);
        };

        // 🏆 漢字・よみがな対応 全自動判定・集計コアロジック 🏆
        function calculateAndRender() {
            const keywords = state.keyword ? state.keyword.split(',').map(k => k.trim().toLowerCase()).filter(k => k) : [];
            const bonusSongs = state.bonus_song ? state.bonus_song.split(',').map(b => b.trim().toLowerCase()).filter(b => b) : [];

            let displayArray = [];

            // ルーム内の全プレイヤーをループ処理
            Object.keys(state.players).forEach(playerKey => {
                const playerData = state.players[playerKey] || {};
                const name = playerData.name || playerKey;
                const songsData = playerData.submitted_songs || {};
                const manualAdjust = playerData.manualAdjust || 0;

                let autoScore = 0;
                let validSongNames = [];

                Object.values(songsData).forEach(song => {
                    if (!song || !song.song_name) return;
                    const cleanInput = song.song_name.trim().toLowerCase();

                    let isMatchWord = false;
                    let isBonusMatch = false;

                    // 1. お題（漢字・よみがな）部分一致判定
                    if (keywords.length === 0) {
                        isMatchWord = true;
                    } else {
                        isMatchWord = keywords.some(kw => cleanInput.includes(kw));
                    }

                    // 2. 特典ボーナス曲判定
                    if (bonusSongs.length > 0) {
                        isBonusMatch = bonusSongs.some(b => cleanInput === b || cleanInput.includes(b));
                    }

                    // 3. スコア計算
                    if (isMatchWord) {
                        autoScore += 1; // 通常正解 +1点
                        if (isBonusMatch) {
                            autoScore += 3; // ボーナス加算 +3点
                            validSongNames.push(`👑${song.song_name}(+3)`);
                        } else {
                            validSongNames.push(song.song_name);
                        }
                    }
                });

                displayArray.push({
                    key: playerKey,
                    name: name,
                    autoScore: autoScore,
                    manualAdjust: manualAdjust,
                    total: autoScore + manualAdjust,
                    songListDisplay: validSongNames.length > 0 ? validSongNames.join('、') : "一致曲はここに表示されます"
                });
            });

            // 高得点順にソート
            displayArray.sort((a, b) => b.total - a.total);

            render(displayArray);
        }

        // スマホ表示最適化レンダリング
        function render(dataList) {
            const boardGrid = document.getElementById('boardGrid');
            boardGrid.innerHTML = '';
            
            document.getElementById('currentModeLabel').innerHTML = `部屋: <span class="text-cyan-400 font-bold">${currentRoomKey}</span> ｜ お題: <span class="text-white">${state.keyword || '未設定'}</span> ｜ ${state.showScores ? '🔓 公開' : '🔒 秘匿'}`;

            if(dataList.length === 0) {
                boardGrid.innerHTML = `<div class="text-center text-xs text-gray-500 py-12">この合言葉（部屋）には、まだ参加者がいません。</div>`;
                return;
            }

            dataList.forEach((player, index) => {
                const isTop = index === 0 && player.total > 0;
                const scoreClass = (!state.showScores && !isAdmin) ? 'score-blur' : '';

                const row = document.createElement('div');
                row.className = `app-card p-4 rounded-2xl flex flex-col gap-2 transition-all relative overflow-hidden ${isTop ? 'border-l-4 border-amber-400 bg-gradient-to-r from-amber-500/5 to-transparent' : ''}`;
                
                row.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <span class="font-numeric text-lg font-black ${index==0?'text-amber-400':index==1?'text-slate-300':index==2?'text-amber-700':'text-gray-500'}">
                                ${String(index + 1).padStart(2, '0')}
                            </span>
                            <span class="text-base font-black tracking-tight text-white">${player.name}</span>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <!-- 手動微調整機能 -->
                            <div class="text-right">
                                ${isAdmin ? `
                                    <span class="text-[9px] text-gray-400 block">調整</span>
                                    <input type="number" value="${player.manualAdjust}" 
                                        onchange="updateManualAdjustment('${player.key}', this.value)" 
                                        class="w-12 text-center bg-white/10 rounded font-bold text-xs p-0.5 focus:outline-none text-cyan-400">
                                ` : `
                                    <span class="text-xs text-gray-500 font-bold">${player.manualAdjust >= 0 ? '+' : ''}${player.manualAdjust}</span>
                                `}
                            </div>
                            <!-- 総合点 -->
                            <div class="bg-gray-900/80 px-4 py-1 rounded-xl min-w-[70px] text-center border border-gray-800">
                                <span class="font-numeric text-2xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-blue-400 ${scoreClass}">
                                    ${player.total}
                                </span>
                                <span class="text-[9px] text-gray-400 block -mt-1 font-bold">PTS</span>
                            </div>
                        </div>
                    </div>

                    <!-- 曲名内訳表示 -->
                    <div class="bg-black/30 rounded-xl p-2 border border-gray-900/60">
                        <div class="text-[10px] text-gray-500 font-bold mb-0.5">📋 一致曲内訳 (自動判定: ${player.autoScore}点分)</div>
                        <p class="text-xs text-gray-300 leading-relaxed font-medium">
                            ${player.songListDisplay}
                        </p>
                    </div>
                `;
                boardGrid.appendChild(row);
            });
        }
    </script>
</body>
</html>
