<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 万能・自動翻訳クイズシステム - MCコントロール＆連動システム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght=700;900&display=swap');
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #0f0f15;
    color: #fff;
  }
  .app-gradient {
    background: linear-gradient(135deg, #8a2be2, #4a00e0);
  }
  .glass-box {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .score-hidden {
    filter: blur(12px);
    user-select: none;
  }
</style>
</head>
<body class="p-4 min-h-screen flex flex-col items-center">

  <div class="w-full max-w-xl flex flex-col min-h-screen justify-between pb-6">
    
    <div>
      <div class="mb-4 flex justify-end items-center gap-2">
        <input type="password" id="adminKeyInput" placeholder="管理キー" class="w-24 bg-gray-800 text-white px-3 py-1.5 rounded-xl border border-gray-700 text-xs focus:outline-none">
        <button id="authBtn" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">Panel</button>
      </div>

      <div id="adminPanel" class="hidden bg-gray-900 border-2 border-purple-500 rounded-3xl p-5 mb-6 shadow-2xl space-y-4">
        <h2 class="text-base font-black text-purple-400 flex justify-between items-center">
          <span>🛠️ 出題者マルチパネル</span>
          <button onclick="resetRoomData()" class="text-xs bg-red-900 px-2 py-1 rounded text-red-200">出題クリア</button>
        </h2>
        
        <div class="bg-black/30 p-3 rounded-xl border border-gray-800">
          <label class="block text-xs font-bold text-gray-400 mb-1">■ この問題の配点設定</label>
          <select id="pointPerAnswer" class="w-full text-black p-2 rounded-lg font-bold text-sm">
            <option value="10" selected>10 点</option>
            <option value="20">20 点</option>
            <option value="30">30 点</option>
            <option value="50">50 点</option>
            <option value="100">100 点</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 mb-2">🎯 出題モードを選択</label>
          <div class="grid grid-cols-2 gap-1 bg-gray-800 p-1 rounded-xl text-xs font-bold text-center">
            <label class="cursor-pointer py-1.5 rounded-lg transition-all" id="lblModeMix">
              <input type="radio" name="quizMode" value="mix" class="hidden" checked onclick="switchInputs('mix')">
              和英MIX
            </label>
            <label class="cursor-pointer py-1.5 rounded-lg transition-all text-gray-400" id="lblModeMixEJ">
              <input type="radio" name="quizMode" value="mix_ej" class="hidden" onclick="switchInputs('mix_ej')">
              英和MIX
            </label>
            <label class="cursor-pointer py-1.5 rounded-lg transition-all text-gray-400" id="lblModeEn">
              <input type="radio" name="quizMode" value="en" class="hidden" onclick="switchInputs('en')">
              全英訳
            </label>
            <label class="cursor-pointer py-1.5 rounded-lg transition-all text-gray-400" id="lblModeJa">
              <input type="radio" name="quizMode" value="ja" class="hidden" onclick="switchInputs('ja')">
              全和訳
            </label>
          </div>
        </div>

        <div class="space-y-3">
          <div id="inputGroupMix" class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-cyan-400 mb-1">前半部分：英語を入力（自動で日本語になります）</label>
              <input type="text" id="mixFirstInput" placeholder="例: Perfect" class="w-full bg-gray-800 text-white px-3 py-2 rounded-xl border border-gray-700 text-sm focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-amber-400 mb-1">後半部分：日本語を入力（自動で英語になります）</label>
              <input type="text" id="mixSecondInput" placeholder="例: 夢想家" class="w-full bg-gray-800 text-white px-3 py-2 rounded-xl border border-gray-700 text-sm focus:outline-none">
            </div>
          </div>

          <div id="inputGroupMixEJ" class="space-y-3 hidden">
            <div>
              <label class="block text-xs font-bold text-amber-400 mb-1">前半部分：日本語を入力（自動で英語になります）</label>
              <input type="text" id="mixEJFirstInput" placeholder="例: 青" class="w-full bg-gray-800 text-white px-3 py-2 rounded-xl border border-gray-700 text-sm focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-cyan-400 mb-1">後半部分：英語を入力（自動で日本語になります）</label>
              <input type="text" id="mixEJSecondInput" placeholder="例: Summer" class="w-full bg-gray-800 text-white px-3 py-2 rounded-xl border border-gray-700 text-sm focus:outline-none">
            </div>
          </div>

          <div id="inputGroupEn" class="hidden">
            <label class="block text-xs font-bold text-amber-400 mb-1">クイズの正解（日本語）を入力</label>
            <input type="text" id="enSingleInput" placeholder="例: 赤いスイートピー" class="w-full bg-gray-800 text-white px-3 py-2 rounded-xl border border-gray-700 text-sm focus:outline-none">
          </div>

          <div id="inputGroupJa" class="hidden">
            <label class="block text-xs font-bold text-cyan-400 mb-1">クイズの正解（英語）を入力</label>
            <input type="text" id="jaSingleInput" placeholder="例: We Are The Champions" class="w-full bg-gray-800 text-white px-3 py-2 rounded-xl border border-gray-700 text-sm focus:outline-none">
          </div>
        </div>

        <button id="submitQuizBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-black py-3 rounded-xl text-sm shadow transition-all active:scale-95">
          🚀 翻訳して即時出題
        </button>

        <hr class="border-gray-800">

        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1">答え公開制御</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="setAnswerVisibility(true)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs shadow">
              🔓 答えを全員に公開
            </button>
            <button onclick="setAnswerVisibility(false)" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-xl text-xs shadow">
              🔒 答えを隠す
            </button>
          </div>
        </div>
      </div>

      <div id="loginScreen" class="w-full glass-box p-8 rounded-3xl shadow-2xl my-12">
        <div class="text-center mb-8">
          <span class="text-5xl">🤖</span>
          <h1 class="text-3xl font-black mt-4 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-indigo-400">
            翻訳マルチクイズ
          </h1>
          <p class="text-sm text-gray-400 mt-1">所属するチームを選択してゲームに参加</p>
        </div>

        <div class="space-y-4">
          <div class="text-center text-xs font-bold text-purple-300 uppercase tracking-widest mb-2">どちらのチームですか？</div>
          <div class="grid grid-cols-2 gap-4">
            <button onclick="selectTeamAndLogin('Aチーム')" class="py-5 bg-gradient-to-br from-pink-600 to-red-600 hover:opacity-90 text-white font-black rounded-2xl text-xl shadow-lg transition-all active:scale-95">
              Aチーム
            </button>
            <button onclick="selectTeamAndLogin('Bチーム')" class="py-5 bg-gradient-to-br from-blue-600 to-indigo-600 hover:opacity-90 text-white font-black rounded-2xl text-xl shadow-lg transition-all active:scale-95">
              Bチーム
            </button>
          </div>
        </div>
      </div>

      <div id="gameScreen" class="hidden w-full flex flex-col">
        
        <div class="flex justify-between items-center glass-box px-4 py-2.5 rounded-2xl mb-4 text-xs font-bold">
          <div class="flex items-center gap-1 text-purple-400">🏠 選択中チーム: <span id="displayRoom" class="text-white font-black"></span></div>
          <button onclick="logoutTeam()" class="text-[10px] bg-gray-800 text-gray-400 px-2 py-0.5 rounded border border-gray-700 hover:text-white">チーム変更</button>
        </div>

        <div class="glass-box rounded-3xl p-6 text-center shadow-xl mb-6 min-h-[220px] flex flex-col justify-center border-2 border-white/10 relative">
          <div class="text-xs font-black text-gray-400 uppercase tracking-widest mb-1" id="syncStatusLabel">待機中</div>
          <div class="text-xs font-bold text-purple-400 mb-3" id="modeDisplay">問題を待機中...</div>
          
          <div class="text-2xl font-black text-white tracking-wide min-h-[48px] flex items-center justify-center mb-4 px-2 whitespace-pre-line" id="convertedQuestion">
            ーーー
          </div>
          
          <div class="text-xl font-black text-emerald-400 min-h-[36px] flex items-center justify-center border-t border-white/10 pt-4" id="answerContainer">
            <span id="answer" class="score-hidden">？ ？ ？</span>
          </div>
        </div>

        <div class="bg-black/40 border border-white/10 p-4 rounded-2xl">
          <div class="text-xs font-bold text-center text-gray-400 mb-2">手元結果入力（現在選択しているチームへ得点を送信）</div>
          <div class="grid grid-cols-2 gap-3">
            <button id="btnCorrect" onclick="markAndSubmitResult(true)" class="bg-gray-800 hover:bg-emerald-950 hover:border-emerald-500 border-2 border-gray-700 text-white font-black py-4 rounded-xl flex flex-col items-center justify-center gap-1 text-base active:scale-95 transition-all shadow">
              <span class="text-2xl">⭕</span>
              <span>正解判定にする</span>
            </button>
            <button id="btnWrong" onclick="markAndSubmitResult(false)" class="bg-gray-800 hover:bg-red-950 hover:border-red-500 border-2 border-gray-700 text-white font-black py-4 rounded-xl flex flex-col items-center justify-center gap-1 text-base active:scale-95 transition-all shadow">
              <span class="text-2xl">❌</span>
              <span>不正解（0点）</span>
            </button>
          </div>
        </div>

      </div>
    </div>

    <div class="text-center mt-8">
      <a href="6gatu.html" class="inline-block text-sm font-bold text-gray-500 hover:text-gray-300 border border-gray-800 rounded-full px-6 py-2 transition-all bg-gray-900/50">
        メニューへ戻る
      </a>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

  <script>
    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
      authDomain: "gamehistory-m84.firebaseapp.com",
      databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
      projectId: "gamehistory-m84",
      storageBucket: "gamehistory-m84.firebasestorage.app",
      messagingSenderId: "475761727837",
      appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
      measurementId: "G-3636W6LC4F"
    };
    
    firebase.initializeApp(firebaseConfig);
    const firestore = firebase.firestore();

    let currentRoom = ""; // チーム名が格納されます (Aチーム / Bチーム)
    let currentQuizId = ""; 

    // DOM要素
    const adminKeyInput = document.getElementById("adminKeyInput");
    const authBtn = document.getElementById("authBtn");
    const adminPanel = document.getElementById("adminPanel");
    const loginScreen = document.getElementById("loginScreen");
    const gameScreen = document.getElementById("gameScreen");
    const displayRoom = document.getElementById("displayRoom");
    
    const submitQuizBtn = document.getElementById("submitQuizBtn");
    const syncStatusLabel = document.getElementById("syncStatusLabel");
    const modeDisplay = document.getElementById("modeDisplay");
    const convertedQuestion = document.getElementById("convertedQuestion");
    const answerText = document.getElementById("answer");

    // 出題者認証トグル (0001)
    authBtn.onclick = () => {
      if (adminKeyInput.value === "0001") {
        adminPanel.classList.toggle("hidden");
        adminKeyInput.value = "";
      } else {
        alert("管理キーが正しくありません。");
      }
    };

    // 🚪 チーム選択ログイン処理
    window.selectTeamAndLogin = (teamName) => {
      currentRoom = teamName;
      displayRoom.textContent = currentRoom;
      
      loginScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
    };

    // チーム変更（ログアウト）
    window.logoutTeam = () => {
      currentRoom = "";
      gameScreen.classList.add("hidden");
      loginScreen.classList.remove("hidden");
    };

    // 🔄 タブ（選択モード）の切り替えデザイン制御
    window.switchInputs = (mode) => {
      const gMix = document.getElementById("inputGroupMix");
      const gMixEJ = document.getElementById("inputGroupMixEJ");
      const gEn = document.getElementById("inputGroupEn");
      const gJa = document.getElementById("inputGroupJa");
      const lblMix = document.getElementById("lblModeMix");
      const lblMixEJ = document.getElementById("lblModeMixEJ");
      const lblEn = document.getElementById("lblModeEn");
      const lblJa = document.getElementById("lblModeJa");

      gMix.classList.add("hidden");
      gMixEJ.classList.add("hidden");
      gEn.classList.add("hidden");
      gJa.classList.add("hidden");
      lblMix.className = "cursor-pointer py-1.5 rounded-lg transition-all text-gray-400";
      lblMixEJ.className = "cursor-pointer py-1.5 rounded-lg transition-all text-gray-400";
      lblEn.className = "cursor-pointer py-1.5 rounded-lg transition-all text-gray-400";
      lblJa.className = "cursor-pointer py-1.5 rounded-lg transition-all text-gray-400";

      if (mode === 'mix') {
        gMix.classList.remove("hidden");
        lblMix.className = "cursor-pointer py-1.5 rounded-lg transition-all bg-purple-600 text-white";
      } else if (mode === 'mix_ej') {
        gMixEJ.classList.remove("hidden");
        lblMixEJ.className = "cursor-pointer py-1.5 rounded-lg transition-all bg-purple-600 text-white";
      } else if (mode === 'en') {
        gEn.classList.remove("hidden");
        lblEn.className = "cursor-pointer py-1.5 rounded-lg transition-all bg-purple-600 text-white";
      } else if (mode === 'ja') {
        gJa.classList.remove("hidden");
        lblJa.className = "cursor-pointer py-1.5 rounded-lg transition-all bg-purple-600 text-white";
      }
    };
    switchInputs('mix'); // 初期設定

    // 🌐 Google翻訳関数
    async function translateWithGoogle(text, fromLang, toLang) {
      if (!text) return "";
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromLang}&tl=${toLang}&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        return data[0][0][0];
      } catch (error) {
        console.error("Google翻訳エラー:", error);
        return "（翻訳エラー）";
      }
    }

    // --- 🚀 クイズ送信処理 ---
    submitQuizBtn.onclick = async () => {
      const mode = document.querySelector('input[name="quizMode"]:checked').value;
      
      let finalOriginal = "";   
      let finalConverted = "";  
      let modeTextLabel = "";

      submitQuizBtn.disabled = true;
      submitQuizBtn.innerText = "⏳ AI翻訳＆生成中...";

      if (mode === "mix") {
        const firstInput = document.getElementById("mixFirstInput").value.trim();  
        const secondInput = document.getElementById("mixSecondInput").value.trim(); 

        if (!firstInput || !secondInput) {
          alert("前半（英語）と後半（日本語）の両方を入力してください。");
          resetQuizBtnState();
          return;
        }
        const translatedFirst = await translateWithGoogle(firstInput, "en", "ja");
        const translatedSecond = await translateWithGoogle(secondInput, "ja", "en");
        finalOriginal = `${firstInput} ＋ ${secondInput}`; 
        finalConverted = `${translatedFirst} ＋ ${translatedSecond}`; 
        modeTextLabel = "mix";

      } else if (mode === "mix_ej") {
        const firstInput = document.getElementById("mixEJFirstInput").value.trim();  
        const secondInput = document.getElementById("mixEJSecondInput").value.trim(); 

        if (!firstInput || !secondInput) {
          alert("前半（日本語）と後半（英語）の両方を入力してください。");
          resetQuizBtnState();
          return;
        }
        const translatedFirst = await translateWithGoogle(firstInput, "ja", "en");
        const translatedSecond = await translateWithGoogle(secondInput, "en", "ja");
        finalOriginal = `${firstInput} ＋ ${secondInput}`; 
        finalConverted = `${translatedFirst} ＋ ${translatedSecond}`; 
        modeTextLabel = "mix_ej";

      } else if (mode === "en") {
        const originalText = document.getElementById("enSingleInput").value.trim();
        if (!originalText) { alert("正解を入力してください。"); resetQuizBtnState(); return; }
        finalOriginal = originalText;
        finalConverted = await translateWithGoogle(originalText, "ja", "en"); 
        modeTextLabel = "en";

      } else if (mode === "ja") {
        const originalText = document.getElementById("jaSingleInput").value.trim();
        if (!originalText) { alert("正解を入力してください。"); resetQuizBtnState(); return; }
        finalOriginal = originalText;
        finalConverted = await translateWithGoogle(originalText, "en", "ja"); 
        modeTextLabel = "ja";
      }

      const timestampId = Date.now().toString();
      
      firestore.collection("rooms").doc("currentRoom").set({
        quizId: timestampId,
        original: finalOriginal,
        converted: finalConverted,
        mode: modeTextLabel,
        showAnswer: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById("mixFirstInput").value = "";
        document.getElementById("mixSecondInput").value = "";
        document.getElementById("mixEJFirstInput").value = "";
        document.getElementById("mixEJSecondInput").value = "";
        document.getElementById("enSingleInput").value = "";
        document.getElementById("jaSingleInput").value = "";
        
        resetQuizBtnState();
      }).catch((error) => {
        alert("配信エラー: " + error.message);
        resetQuizBtnState();
      });
    };

    function resetQuizBtnState() {
      submitQuizBtn.disabled = false;
      submitQuizBtn.innerText = "🚀 翻訳して即時出題";
    }

    window.setAnswerVisibility = (visible) => {
      firestore.collection("rooms").doc("currentRoom").update({ showAnswer: visible });
    };

    window.resetRoomData = () => {
      firestore.collection("rooms").doc("currentRoom").set({
        quizId: "", original: "", converted: "", mode: "", showAnswer: false
      });
    };

    // --- Firestore リアルタイム同期 ---
    firestore.collection("rooms").doc("currentRoom").onSnapshot((doc) => {
      if (!doc.exists || !doc.data().converted) {
        syncStatusLabel.textContent = "待機中";
        modeDisplay.textContent = "問題を待機中... ";
        convertedQuestion.textContent = "ーーー";
        answerText.textContent = "？ ？ ？";
        answerText.className = "score-hidden";
        currentQuizId = "";
        return;
      }

      const data = doc.data();
      currentQuizId = data.quizId || "default";
      syncStatusLabel.textContent = "🔴 LIVE 同期中";

      if (data.mode === "mix") modeDisplay.textContent = "🔀 和英MIXクイズ（前半和訳 ＋ 後半英訳）";
      else if (data.mode === "mix_ej") modeDisplay.textContent = "🔄 英和MIXクイズ（前半英訳 ＋ 後半和訳）";
      else if (data.mode === "en") modeDisplay.textContent = "🔤 自動英訳クイズ（日本語禁止！）";
      else if (data.mode === "ja") modeDisplay.textContent = "🇯🇵 自動和訳クイズ（元の英語を当てろ！）";

      convertedQuestion.textContent = data.converted;

      if (data.showAnswer) {
        answerText.textContent = data.original;
        answerText.classList.remove("score-hidden");
      } else {
        answerText.textContent = "？ ？ ？";
        answerText.classList.add("score-hidden");
      }
    });

    // --- 🚀 チームスコア可変送信処理（Firestore統合・合計点リアルタイム再計算） ---
    window.markAndSubmitResult = (isCorrect) => {
      if (!currentQuizId) {
        alert("現在クイズが配信されていません。");
        return;
      }

      // 可変配点の取得
      const pointPerAnswer = parseInt(document.getElementById("pointPerAnswer").value) || 10;
      const scoreValue = isCorrect ? pointPerAnswer : 0;
      
      if (!isCorrect) {
        if (!confirm("不正解（0点）として送信しますか？")) return;
      }

      // 統合結果画面（6gatukekka.html）と共通のチーム統合用ドキュメントID
      const docRef = firestore.collection("gameResults").doc(`${currentRoom}_総合スコア`);

      // Firestore上のスコア（score_translate）を加算
      docRef.set({
        room: currentRoom,
        name: "チーム合計",
        score_translate: firebase.firestore.FieldValue.increment(scoreValue),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).then(() => {
        // 3ゲームの総合得点（totalScore）を再計算して自動更新
        recalculateTotalScore(docRef);
        alert(`🏆 【${currentRoom}】へ翻訳クイズの得点を送信しました！\n（判定: ${isCorrect ? "⭕ 正解" : "❌ 不正解"} ＝ ＋${scoreValue}点）`);
      }).catch((error) => {
        alert("送信失敗: " + error.message);
      });
    };

    // 🏆 全ゲームの合計値を再計算して自動同期する共通ロジック
    function recalculateTotalScore(docRef) {
      docRef.get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          const bomb = data.score_bomb || 0;
          const trans = data.score_translate || 0;
          const rev = data.score_reverse || 0;
          
          // 最新の合計点をFirestoreに反映
          docRef.update({ totalScore: bomb + trans + rev });
        }
      });
    }
  </script>

</body>
</html>
