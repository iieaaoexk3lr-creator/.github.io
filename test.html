<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>高精度 音量測定・周波数アナライザー Web</title>
    <style>
        /* --- 最新のモダン・ダークテーマUI --- */
        :root {
            --bg-color: #121214;
            --surface-color: #1e1e24;
            --primary-color: #3888cc;
            --accent-color: #38ccaa;
            --text-color: #ffffff;
            --text-muted: #a0a0ab;
            --wave-color: rgba(255, 230, 100, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 16px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .description {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 700px;
            margin: 0 auto;
        }

        /* --- メインビジュアル（メーター＆キャンバス） --- */
        .visualizer-zone {
            position: relative;
            margin-bottom: 24px;
        }

        canvas {
            width: 100%;
            height: 360px;
            background-color: #0d0d11;
            border-radius: 12px;
            display: block;
        }

        /* デシベル数値表示 */
        #dB {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
            font-family: 'Courier New', Courier, monospace;
        }

        .curdb {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .maxdb {
            font-size: 1.3rem;
            color: #ef4444;
        }

        /* --- コントロール＆設定セクション --- */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #start {
            background-color: var(--accent-color);
            color: #000;
        }

        #start.recording {
            background-color: #ef4444;
            color: #fff;
        }

        #downloadBtn {
            background-color: var(--primary-color);
            color: #fff;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        /* 設定テーブル */
        .settings-panel {
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .settings-panel h3 {
            margin-bottom: 12px;
            color: var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            text-align: left;
        }

        th {
            width: 100px;
            color: var(--text-muted);
        }

        .radio-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .radio-group label {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .radio-group input {
            margin-right: 4px;
        }

        .radio-group input:checked + span {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>音量測定Web Pro</h1>
        <p class="description">
            ブラウザの高性能な音声解析エンジン（Web Audio API）を使用して、周囲の音量（デシベル）と周波数成分をリアルタイムに視覚化するツールです。緑と青のバーが「周波数ごとの音の強さ」を表し、その上に重なる黄色のシャープな線が「実際の空気の振動（生の時間軸波形）」を表します。
        </p>
    </header>

    <div class="controls">
        <button id="start">計測開始</button>
        <button id="downloadBtn">周波数グラフを保存</button>
    </div>

    <div class="visualizer-zone">
        <canvas id="canvas"></canvas>
        
        <div id="dB">
            <div class="curdb"><span id="dBmessage">0.0</span> dB</div>
            <div class="maxdb">MAX: <span id="dBmax">0.0</span> dB</div>
        </div>
    </div>

    <!-- 元ソースの機能を完全継承したマイク・解析詳細設定 -->
    <div class="settings-panel">
        <h3>アナライザー詳細設定（リアルタイム反映）</h3>
        <table>
            <tr>
                <th>音増幅</th>
                <td>
                    <div class="radio-group">
                        <label><input type="radio" name="rgin" value="1" checked><span>標準 (1x)</span></label>
                        <label><input type="radio" name="rgin" value="3"><span>中間 (3x)</span></label>
                        <label><input type="radio" name="rgin" value="10"><span>高 (10x)</span></label>
                        <label><input type="radio" name="rgin" value="30"><span>最大 (30x)</span></label>
                    </div>
                </td>
            </tr>
            <tr>
                <th>Hz範囲</th>
                <td>
                    <div class="radio-group">
                        <label><input type="radio" name="rfeq" value="512"><span>低解像度 (512)</span></label>
                        <label><input type="radio" name="rfeq" value="2048" checked><span>標準 (2048)</span></label>
                        <label><input type="radio" name="rfeq" value="4096"><span>高解像度 (4096)</span></label>
                    </div>
                </td>
            </tr>
            <tr>
                <th>流速度</th>
                <td>
                    <div class="radio-group">
                        <label><input type="radio" name="rsmo" value="0.9"><span>滑らか (0.9)</span></label>
                        <label><input type="radio" name="rsmo" value="0.65" checked><span>標準 (0.65)</span></label>
                        <label><input type="radio" name="rsmo" value="0.4"><span>俊敏 (0.4)</span></label>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>

<script>
class AudioVisualizer {
    constructor() {
        this.audioContext = null;
        this.analyzer = null;
        this.gainNode = null;
        this.stream = null;
        this.animationId = null;

        // パラメータ初期値
        this.config = {
            fftSize: 2048,
            smoothing: 0.65,
            gainValue: 1.0
        };

        // DOM キャッシュ
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.dbMessage = document.getElementById('dBmessage');
        this.dbMax = document.getElementById('dBmax');
        this.startBtn = document.getElementById('start');
        this.downloadBtn = document.getElementById('downloadBtn');

        this.maxDb = 0.0;
        this.isPlaying = false;

        this.setupEvents();
        this.resizeCanvas();
        window.addEventListener('resize', () => this.resizeCanvas());
    }

    resizeCanvas() {
        const rect = this.canvas.getBoundingClientRect();
        this.canvas.width = rect.width || 800;
        this.canvas.height = rect.height || 360;
    }

    setupEvents() {
        // 開始・停止切り替え
        this.startBtn.addEventListener('click', () => {
            if (this.isPlaying) {
                this.stop();
            } else {
                this.start();
            }
        });

        // 画像の保存
        this.downloadBtn.addEventListener('click', () => this.downloadSnapshot());

        // 設定のリアルタイム変更イベント
        document.querySelectorAll('input[name="rgin"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                this.config.gainValue = parseFloat(e.target.value);
                if (this.gainNode) this.gainNode.gain.setValueAtTime(this.config.gainValue, this.audioContext.currentTime);
            });
        });

        document.querySelectorAll('input[name="rfeq"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                this.config.fftSize = parseInt(e.target.value);
                if (this.analyzer) this.analyzer.fftSize = this.config.fftSize;
            });
        });

        document.querySelectorAll('input[name="rsmo"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                this.config.smoothing = parseFloat(e.target.value);
                if (this.analyzer) this.analyzer.smoothingTimeConstant = this.config.smoothing;
            });
        });
    }

    async start() {
        try {
            this.stream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                } 
            });

            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = this.audioContext.createMediaStreamSource(this.stream);

            // 音量増幅の仕組み
            this.gainNode = this.audioContext.createGain();
            this.gainNode.gain.setValueAtTime(this.config.gainValue, this.audioContext.currentTime);

            // アナライザーの初期化
            this.analyzer = this.audioContext.createAnalyser();
            this.analyzer.fftSize = this.config.fftSize;
            this.analyzer.smoothingTimeConstant = this.config.smoothing;

            // ルーティング接続
            source.connect(this.gainNode);
            this.gainNode.connect(this.analyzer);

            this.isPlaying = true;
            this.maxDb = 0.0;
            this.startBtn.textContent = '計測停止';
            this.startBtn.classList.add('recording');

            this.loop();
        } catch (err) {
            console.error('マイクアクセスエラー:', err);
            alert('マイクの使用許可が得られないか、入力デバイスが利用できません。');
        }
    }

    stop() {
        if (!this.isPlaying) return;
        cancelAnimationFrame(this.animationId);
        
        if (this.stream) this.stream.getTracks().forEach(track => track.stop());
        if (this.audioContext) this.audioContext.close();

        this.isPlaying = false;
        this.startBtn.textContent = '計測開始';
        this.startBtn.classList.remove('recording');
        this.dbMessage.textContent = "0.0";
    }

    loop() {
        this.animationId = requestAnimationFrame(() => this.loop());

        const bufferLength = this.analyzer.frequencyBinCount;
        const freqData = new Uint8Array(bufferLength);
        const timeData = new Uint8Array(bufferLength);

        this.analyzer.getByteFrequencyData(freqData);
        this.analyzer.getByteTimeDomainData(timeData);

        // --- 高精度デシベル計算 ---
        let sum = 0;
        for (let i = 0; i < bufferLength; i++) {
            const amplitude = (timeData[i] - 128) / 128;
            sum += amplitude * amplitude;
        }
        const rms = Math.sqrt(sum / bufferLength);
        
        // 周囲の静寂レベルを考慮したデシベルマッピング
        let db = rms > 0 ? 20 * Math.log10(rms) + 94 : 0;
        db = Math.max(0, Math.min(db, 120)); 

        if (db > this.maxDb && db > 10) {
            this.maxDb = db;
        }

        this.dbMessage.textContent = db.toFixed(1);
        this.dbMax.textContent = this.maxDb.toFixed(1);

        // 描画実行
        this.draw(freqData, timeData);
    }

    draw(freqData, timeData) {
        const width = this.canvas.width;
        const height = this.canvas.height;

        // 全体を一回クリア（背景塗り）
        this.ctx.fillStyle = '#0d0d11';
        this.ctx.fillRect(0, 0, width, height);

        // ==========================================
        // 【A層】周波数バー・グリッド（画像DLに含まれる領域）
        // ==========================================
        this.ctx.save();
        
        // 横目盛線の描画
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        this.ctx.lineWidth = 1;
        for (let i = 1; i < 5; i++) {
            let y = (height / 5) * i;
            this.ctx.beginPath();
            this.ctx.moveTo(0, y);
            this.ctx.lineTo(width, y);
            this.ctx.stroke();
        }

        // 周波数スペクトラムの描画
        const barWidth = (width / freqData.length) * 2.0;
        let x = 0;
        for (let i = 0; i < freqData.length; i++) {
            const barHeight = (freqData[i] / 255) * height;
            
            // 下から上へ伸びるスタイリッシュなグラデーション
            const gradient = this.ctx.createLinearGradient(0, height, 0, height - barHeight);
            gradient.addColorStop(0, '#38ccaa');
            gradient.addColorStop(1, '#3888cc');

            this.ctx.fillStyle = gradient;
            this.ctx.fillRect(x, height - barHeight, barWidth - 1, barHeight);
            x += barWidth;
        }
        this.ctx.restore();

        // ==========================================
        // 【B層】リアル音声波形（画像DLには含まれない）
        // ==========================================
        this.drawRealtimeWave(timeData, width, height);
    }

    // リアルタイム音声データ（生波形）を重ねて描画するメソッド
    drawRealtimeWave(timeData, width, height) {
        this.ctx.save();
        this.ctx.strokeStyle = 'rgba(255, 230, 100, 0.85)'; // シャープな黄色の線グラフ
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();

        const sliceWidth = width / timeData.length;
        let x = 0;

        for (let i = 0; i < timeData.length; i++) {
            const v = timeData[i] / 128.0; 
            const y = (v * height) / 2; // 画面中央を中心に上下にスイング

            if (i === 0) {
                this.ctx.moveTo(x, y);
            } else {
                this.ctx.lineTo(x, y);
            }
            x += sliceWidth;
        }

        this.ctx.lineTo(width, height / 2);
        this.ctx.stroke();
        this.ctx.restore();
    }

    // --- 画像ダウンロード処理（B層の波形線グラフを除外） ---
    downloadSnapshot() {
        if (!this.analyzer) {
            alert('計測を開始してからダウンロードしてください。');
            return;
        }

        // メモリ上に書き出し専用の別キャンバスを生成
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = this.canvas.width;
        exportCanvas.height = this.canvas.height;
        const exportCtx = exportCanvas.getContext('2d');

        // 最新の周波数データをサンプリング
        const bufferLength = this.analyzer.frequencyBinCount;
        const freqData = new Uint8Array(bufferLength);
        this.analyzer.getByteFrequencyData(freqData);

        // 1. 背景描画
        exportCtx.fillStyle = '#0d0d11';
        exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

        // 2. 目盛線描画
        exportCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        exportCtx.lineWidth = 1;
        for (let i = 1; i < 5; i++) {
            let y = (exportCanvas.height / 5) * i;
            exportCtx.beginPath();
            exportCtx.moveTo(0, y);
            exportCtx.lineTo(exportCanvas.width, y);
            exportCtx.stroke();
        }

        // 3. 周波数バーのみを忠実に再描画（※ここにはB層のリアルタイム線波形を描画しない）
        const barWidth = (exportCanvas.width / freqData.length) * 2.0;
        let x = 0;
        for (let i = 0; i < freqData.length; i++) {
            const barHeight = (freqData[i] / 255) * exportCanvas.height;
            const gradient = exportCtx.createLinearGradient(0, exportCanvas.height, 0, exportCanvas.height - barHeight);
            gradient.addColorStop(0, '#38ccaa');
            gradient.addColorStop(1, '#3888cc');
            exportCtx.fillStyle = gradient;
            exportCtx.fillRect(x, exportCanvas.height - barHeight, barWidth - 1, barHeight);
            x += barWidth;
        }

        // 4. トリガーダウンロード
        const link = document.createElement('a');
        link.download = `frequency-analysis-${Date.now()}.png`;
        link.href = exportCanvas.toDataURL('image/png');
        link.click();
    }
}

// 起動
const visualizer = new AudioVisualizer();
</script>

</body>
</html>
