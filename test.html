<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一画千点！曲名クイズ</title>

<style>
:root {
  --bg-color: #0b0c10;
  --card-bg: #1f2833;
  --text-color: #c5c6c7;
  --accent-blue: #66fcf1;
  --title-color: #a8dadc;
  --border-radius: 8px;
  --font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", sans-serif;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: var(--font-family);
  text-align: center;
  padding: 10px;
  margin: 0;
}

h1 {
  font-size: 1.8rem;
  margin: 15px 0 10px 0;
  color: var(--title-color);
  text-shadow: 0 0 10px rgba(168, 218, 220, 0.6);
}

hr {
  border: 0;
  height: 1px;
  background: #333;
  margin: 15px 0;
}

/* アプリ風のメインコンテナ */
.app-card {
  background: var(--card-bg);
  padding: 15px;
  border-radius: var(--border-radius);
  max-width: 420px;
  margin: 0 auto 15px auto;
  box-sizing: border-box;
}

/* 漢字表示エリア：スマホ幅からはみ出さないよう横スクロール可能に */
#container {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  flex-wrap: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  margin: 15px auto;
  padding: 10px;
  background: #121212;
  border-radius: var(--border-radius);
  min-height: 85px;
  max-width: 100%;
  box-sizing: border-box;
  -webkit-overflow-scrolling: touch; /* スムーズスクロール */
}

/* スクロールバーのカスタム（スマホで見やすく） */
#container::-webkit-scrollbar {
  height: 6px;
}
#container::-webkit-scrollbar-thumb {
  background: #444;
  border-radius: 3px;
}

svg {
  width: 65px;
  height: 65px;
  margin: 0 4px;
  flex-shrink: 0;
}

/* ボタン群の共通スマホ最適化 */
.button-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-bottom: 10px;
}

button {
  font-size: 0.95rem;
  font-weight: bold;
  padding: 10px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  min-width: 90px;
}
button:active {
  transform: scale(0.95);
}

/* ボタンごとの色分け */
.btn-nav { background: #4a4e69; color: #fff; }       /* 前・次問題 */
.btn-action { background: #343a40; color: #fff; }    /* 画数の操作 */
.btn-reveal { background: #e63946; color: #fff; }    /* 答え全表示 */
.btn-submit { background: #198754; color: #fff; width: 100%; max-width: 260px; margin: 8px auto; display: block;} /* 回答 */
.btn-reset { background: #6c757d; color: #fff; }     /* リセット */
.btn-menu { background: #2b2d42; color: var(--text-color); min-width: 120px; text-decoration: none; display: inline-block; padding: 10px 14px; border-radius: 6px; font-weight: bold; font-size: 0.95rem;}

input {
  font-size: 1.1rem;
  padding: 10px;
  margin-top: 5px;
  width: 100%;
  max-width: 260px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #000;
  color: #fff;
  box-sizing: border-box;
  text-align: center;
}

#result {
  margin-top: 10px;
  font-size: 1.1rem;
  font-weight: bold;
  min-height: 24px;
}

#scoreBox {
  margin: 10px 0;
  font-size: 1.4rem;
  font-weight: bold;
  color: var(--accent-blue);
  text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
}

/* 説明文エリア */
.rules-container {
  font-size: 0.9rem;
  color: #aaa;
  line-height: 1.6;
  padding: 15px;
  text-align: left;
  max-width: 420px;
  margin: 15px auto 10px auto;
  background: var(--card-bg);
  border-radius: var(--border-radius);
  box-sizing: border-box;
}
.rules-container b {
  color: #fff;
}
</style>
</head>
<body>

<hr style="margin-top:10px;">

<h1>一画千点！曲名クイズ</h1>

<div class="app-card">
  <div class="button-row">
    <button class="btn-nav" onclick="prevQuestion()">前の問題</button>
    <button class="btn-nav" onclick="nextQuestion()">次の問題</button>
  </div>

  <div id="container"></div>

  <div class="button-row">
    <button class="btn-action" onclick="prevStep()">1画戻る</button>
    <button class="btn-action" onclick="nextStep()">次の一画</button>
  </div>
  
  <div class="button-row">
    <button class="btn-reveal" onclick="revealAll()">答え（全表示）</button>
  </div>

  <input id="answerInput" placeholder="曲名を入力">
  <button class="btn-submit" onclick="checkAnswer()">回答</button>

  <div id="result"></div>
  <div id="scoreBox">得点：0</div>
</div>

<div class="rules-container">
  <b>■遊び方</b><br>
  画面に表示される“一画ずつの漢字”から曲名を当てるゲームです。<br>
  分かったら曲名を入力して回答してください。
  <br><br>
  <b>■ボタン説明</b><br>
  <b>▶ 次の問題 / 前の問題</b><br>
  クイズの曲を切り替えます。<br>
  <b>▶ 次の一画</b><br>
  漢字の“次の筆”が表示されます（ヒントが増えます）。<br>
  <b>▶ 1画戻る</b><br>
  表示されている一画を1つ消します。<br>
  <b>▶ 答え（全表示）</b><br>
  すべての筆を一気に表示して答えを確認できます。<br>
  <b>▶ 回答</b><br>
  入力した曲名を判定します（Enterキーでも可）。
  <br><br>
  <b>■補足</b><br>
  ・Enterキー：回答<br>
  ・スペースキー：次の一画
</div>

<div class="button-row" style="margin-top: 15px;">
  <button class="btn-reset" onclick="resetScore()">リセット</button>
  <a href="index.html" class="btn-menu">📘 メニュー</a>
</div>

<script>
const questions = [
  "残酷な天使のテーゼ",
  "世界に一つだけの花",
  "愛をこめて花束を",
  "君の知らない物語",
  "空も飛べるはず",
  "栄光の架橋",
  "天体観測",
  "小さな恋のうた",
  "夜に駆ける",
  "燦然",
  "雪の華",
  "前前前世",
  "紅蓮華",
  "残響散歌",
  "恋音と雨空",
  "全力少年",
  "革命道中",
  "道化師のソネット",
  "常緑",
  "健康祈願",
];

let currentIndex = 0;
let currentAnswer = "";
let strokeGroups = [];
let step = 0;
let score = 0;

function normalize(str) {
  return str.replace(/\s/g,"").toLowerCase();
}

function calculateScore() {
  if (step <= 1) return 5;
  if (step === 2) return 4;
  if (step === 3) return 3;
  if (step === 4) return 2;
  return 1;
}

function checkAnswer() {
  const input = document.getElementById("answerInput").value;

  if (normalize(input) === normalize(currentAnswer)) {
    let point = calculateScore();
    score += point;
    updateScore();
    document.getElementById("result").innerHTML = "<span style='color:#198754;'>正解！ +" + point + "点</span>";
  } else {
    document.getElementById("result").innerHTML = "<span style='color:#e63946;'>不正解…</span>";
  }
}

function updateScore() {
  document.getElementById("scoreBox").innerText = "得点：" + score;
}

function resetScore() {
  score = 0;
  updateScore();
  document.getElementById("result").innerText = "";
}

async function nextQuestion() {
  if (currentIndex >= questions.length) return;
  loadQuestion(currentIndex);
  currentIndex++;
}

function prevQuestion() {
  if (currentIndex <= 1) return;
  currentIndex -= 2;
  loadQuestion(currentIndex);
  currentIndex++;
}

async function loadQuestion(index) {
  const container = document.getElementById("container");
  container.innerHTML = "";
  strokeGroups = [];
  step = 0;

  currentAnswer = questions[index];
  document.getElementById("answerInput").value = "";
  document.getElementById("result").innerText = "";

  for (let char of currentAnswer) {
    const code = char.charCodeAt(0).toString(16);
    const url = "https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/" + code.padStart(5, "0") + ".svg";

    try {
      const res = await fetch(url);
      const text = await res.text();

      const wrapper = document.createElement("div");
      wrapper.innerHTML = text;
      const svg = wrapper.querySelector("svg");

      if (!svg) continue;

      const paths = svg.querySelectorAll("path");
      let group = [];

      paths.forEach(p=>{
        p.style.display="none";
        p.style.stroke="#ffffff"; /* ダークモードで見やすいように黒から【白】に変更 */
        p.style.fill="none";
        p.style.strokeWidth=4;     /* 線を少し太くして視認性向上 */
        group.push(p);
      });

      strokeGroups.push(group);
      container.appendChild(svg);
    } catch {}
  }
}

function nextStep() {
  strokeGroups.forEach(g=>{
    if(step<g.length) g[step].style.display="block";
  });
  step++;
}

function prevStep() {
  if(step<=0)return;
  step--;
  strokeGroups.forEach(g=>{
    if(step<g.length) g[step].style.display="none";
  });
}

function revealAll() {
  strokeGroups.forEach(g=>{
    g.forEach(p=>p.style.display="block");
  });
}

document.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    checkAnswer();
  }
  if(e.code==="Space"){
    e.preventDefault();
    nextStep();
  }
});

// 初回起動時に1問目を自動ロード
nextQuestion();
</script>

</body>
</html>
