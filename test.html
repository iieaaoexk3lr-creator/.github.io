<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カラオケビンゴ！</title>
<style>
  :root {
    /* ── 画面全体の背景（深紫） ── */
    --bg-color: #120826;
    --card-bg: #1f2833;
    --text-color: #c5c6c7;
    --title-color: #a8dadc;
    
    /* ── ゲーム進行中のネオンエフェクト ── */
    --accent-blue: #00f2fe;   /* 通常ヒット枠（ネオンブルー） */
    --accent-red: #ff0055;    /* ビンゴ成立枠（ネオンレッド） */
    
    /* ── カードの縁：極細のミントグリーンネオン ── */
    --neon-edge: #00f5d4; 

    /* ── 各行の【ハッキリした元のネオン枠線・文字色】 ── */
    --row1-border: #ff2a5f; /* 1行目：レッド */
    --row2-border: #00b4d8; /* 2行目：ブルー */
    --row3-border: #ffdf00; /* 3行目：イエロー */
    --row4-border: #00f5d4; /* 4行目：グリーン */
    --row5-border: #ff7000; /* 5行目：オレンジ */

    --border-radius: 10px;
    --font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 50%, #251245 0%, #120826 70%);
    color: var(--text-color);
    font-family: var(--font-family);
    text-align: center;
    padding: 10px;
    margin: 0;
    min-height: 100vh;
  }

  h1 { 
    font-size: 2rem; 
    margin: 15px 0 10px 0; 
    color: var(--title-color);
    text-shadow: 0 0 10px rgba(168, 218, 220, 0.6); 
  }

  .controls-group {
    background: rgba(31, 40, 51, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 15px;
    border-radius: 8px;
    max-width: 480px;
    margin: 0 auto 15px auto;
    box-sizing: border-box;
    transition: all 0.3s ease;
  }

  .select-row {
    margin-bottom: 10px;
  }

  select, input {
    font-size: 1rem;
    padding: 8px;
    margin: 4px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #000;
    color: #fff;
    box-sizing: border-box;
  }

  .score-config-area {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0;
  }

  #scoreRangeBox {
    font-size: 0.95rem;
    color: #aaa;
  }
  #scoreRangeBox input { width: 65px; }

  #freeToggleBtn {
    font-size: 0.85rem;
    padding: 6px 12px;
    min-width: auto;
    border-radius: 20px;
    background: #212529;
    color: #ff0055;
    border: 1px solid #ff0055;
    box-shadow: 0 0 8px rgba(255, 0, 85, 0.2);
  }
  #freeToggleBtn.active {
    background: #ff0055;
    color: #fff;
    box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
  }
  #freeToggleBtn:disabled {
    background: #333 !important;
    color: #666 !important;
    border-color: #444 !important;
    box-shadow: none !important;
    cursor: not-allowed;
  }

  .button-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 5px;
  }

  button {
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    min-width: 90px;
  }
  button:active { transform: scale(0.98); }

  #randomBtn { background: #4a4e69; color: #fff; }
  #startBtn { background: #198754; color: #fff; }
  #resetBtn { background: #6c757d; color: #fff; }
  
  .btn-menu { 
    background: #343a40; 
    color: var(--text-color); 
    min-width: 140px;
    margin-top: 15px;
    display: inline-block;
  }
  button:disabled { background: #333 !important; color: #555 !important; cursor: not-allowed; }

  /* ── ビンゴカード全体の背景枠 ── */
  #board {
    margin: 25px auto;
    display: grid;
    gap: 8px; 
    max-width: 100%;
    width: 360px; 
    aspect-ratio: 1 / 1; 
    box-sizing: border-box;
    padding: 16px;
    border-radius: 20px;

    /* [アップデート] 各行の色を混ぜ込みつつ、白を基調(各色5〜7%程度)にした淡いグラデーション */
    background: linear-gradient(to bottom, 
      rgba(255, 255, 255, 0.95) 0%,
      rgba(255, 42, 95, 0.06) 10%,   /* 1行目：淡い赤 */
      rgba(0, 180, 216, 0.05) 32%,  /* 2行目：淡い青 */
      rgba(255, 223, 0, 0.04) 55%,  /* 3行目：淡い黄 */
      rgba(0, 245, 148, 0.05) 78%,  /* 4行目：淡い緑 */
      rgba(255, 112, 0, 0.06) 90%,  /* 5行目：淡い橙 */
      rgba(255, 255, 255, 0.95) 100%
    ), #ffffff; /* ベースの下地を完全な白に固定 */

    /* 極細（1px）の緑ネオン枠と、クッキリとした発光シャドウ */
    border: 1px solid var(--neon-edge);
    box-shadow: 
      0 0 15px rgba(0, 245, 212, 0.6), 
      inset 0 0 10px rgba(0, 245, 212, 0.2),
      0 20px 40px rgba(0,0,0,0.7);
  }

  /* ── 各マスの基本スタイル ── */
  .cell {
    border-radius: var(--border-radius);
    aspect-ratio: 1 / 1; 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    
    font-size: min(1.3rem, calc(0.6rem + 1.2vw)); 
    font-weight: 900;
    padding: 4px;
    white-space: nowrap; 
    overflow: hidden;
    text-overflow: ellipsis;
    box-sizing: border-box;
    position: relative;
    transition: all 0.25s ease;
    
    /* 立体的に沈み込んで見える内側シャドウ */
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.2);
    
    /* 非選択時の文字に幅の狭い黒い縁取り（4方向シャドウ）を設定 */
    text-shadow: 
      1px  1px 0px #000,
     -1px  1px 0px #000,
      1px -1px 0px #000,
     -1px -1px 0px #000; 
  }

  /* 非選択時のデザイン：塗りつぶしは透明（全体の白基調枠の色） */
  .r1 { border: 2.5px solid var(--row1-border); color: var(--row1-border); background: transparent; }
  .r2 { border: 2.5px solid var(--row2-border); color: var(--row2-border); background: transparent; }
  .r3 { border: 2.5px solid var(--row3-border); color: var(--row3-border); background: transparent; }
  .r4 { border: 2.5px solid var(--row4-border); color: var(--row4-border); background: transparent; }
  .r5 { border: 2.5px solid var(--row5-border); color: var(--row5-border); background: transparent; }
  .r-default { border: 2.5px solid var(--row5-border); color: var(--row5-border); background: transparent; }

  /* FREEマスの特別デザイン ── */
  .free-cell {
    font-size: min(0.75rem, calc(0.4rem + 0.8vw)) !important;
    line-height: 1.2;
  }
  .free-cell span {
    font-size: min(1.1rem, calc(0.6rem + 1vw));
    display: block;
    margin-bottom: -2px;
  }

  .editable:hover { 
    outline: none;
    border-color: #fff !important; 
    box-shadow: 0 0 8px #fff;
  }

  /* ── ヒット時（選択）は「全体背景と同じ深紫×白文字×ネオンブルー枠」（文字の黒縁は解除） ── */
  .hit {
    background: #120826 !important; /* 全体背景（深紫）と同じ色 */
    color: #ffffff !important;      /* 白文字 */
    border: 2.5px solid var(--accent-blue) !important;
    transform: scale(1.03) !important;
    box-shadow: 0 0 15px var(--accent-blue), inset 0 0 8px rgba(255,255,255,0.2) !important;
    text-shadow: none !important;  
    z-index: 2;
  }

  /* リーチ時に「最後に空ければいい1マス」を囲む赤マル（〇） ── */
  .cell.reach::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    right: 3px;
    bottom: 3px;
    border: 3.5px solid #ff0055; 
    border-radius: 50%; 
    pointer-events: none; 
    box-shadow: 0 0 6px #ff0055, inset 0 0 6px #ff0055;
    animation: pulseCircle 1s infinite alternate;
    z-index: 5;
  }

  @keyframes pulseCircle {
    0% { transform: scale(0.94); opacity: 0.8; }
    100% { transform: scale(1.02); opacity: 1; }
  }

  /* ビンゴ達成ラインの枠：ネオンレッド */
  .cell.bingo-line {
    background: #a3cfbb !important; 
    color: #000000 !important;
    border-color: var(--accent-red) !important;
    box-shadow: 0 0 18px rgba(255, 0, 85, 1) !important;
    text-shadow: none !important;
    animation: pulseRed 1.5s infinite alternate;
  }
  .cell.bingo-line::before { display: none; }

  @keyframes pulseRed {
    0% { box-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
    100% { box-shadow: 0 0 20px rgba(255, 0, 85, 1); }
  }

  /* ビンゴ情報バナー */
  #bingoBanner {
    margin: 10px 0 15px 0;
    font-size: 2.3rem;
    font-weight: 900;
    color: var(--accent-red);
    text-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
    display: none;
    animation: bingoPop 0.3s ease-out;
  }
  @keyframes bingoPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  #rules {
    margin: 20px auto 10px auto;
    max-width: 420px;
    text-align: left;
    background: rgba(31, 40, 51, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 15px;
    border-radius: 8px;
    font-size: 0.9rem;
    line-height: 1.6;
    color: #aaa;
    box-sizing: border-box;
  }
  #rules b { color: #fff; }
</style>
</head>
<body>

<h1>カラオケBINGO！</h1>

<div class="controls-group">
  <div id="hideSetupContainer">
    <div class="select-row">
      <select id="mode">
        <option value="score">点数ビンゴ</option>
        <option value="word">漢字ビンゴ</option>
      </select>

      <select id="sizeSelect">
        <option value="4">4×4（16マス）</option>
        <option value="5" selected>5×5（25マス）</option>
        <option value="6">6×6（36マス）</option>
      </select>
    </div>

    <div class="score-config-area">
      <span id="scoreRangeBox">
        最低点 <input id="minScore" type="number" value="80">
        最高点 <input id="maxScore" type="number" value="99">
      </span>
      <button id="freeToggleBtn" type="button">FREE中央マス：無効</button>
    </div>
  </div>

  <div class="button-row">
    <button id="randomBtn">ランダム生成</button>
    <button id="startBtn">START</button>
    <button id="resetBtn">リセット</button>
  </div>
</div>

<div id="bingoBanner">BINGO！！</div>

<div id="board"></div>

<div id="rules">
  <b>【遊び方】</b><br>
  ・点数ビンゴ or 漢字ビンゴを選びます。<br>
  ・マス数（4×4 / 5×5 / 6×6）を選びます。<br>
  ・【5×5マス限定】フリー切替ボタンを有効にすると、中央が自動でFREEマスになり、START時に自動解放されます！<br>
  ・START前はマスをクリックして個別編集も可能です。<br>
  ・ゲーム中は一致したマスをタップしてロックします（もう一度タップで解除）。<br>
  ・<b>あと1マスで揃う列がある場合、その「最後の空きマス」に赤マル〇が表示（リーチ）</b>されます。<br>
  ・<b>揃った列は枠が赤色（ビンゴ）</b>になり、枠の中が少し濃い緑色に変化します！
</div>

<button class="btn-menu" onclick="location.href='index.html'">メニューへ戻る</button>

<script>
const wordPool = [
  "愛","夢","心","空","海","風","花","星","月","夜",
  "光","音","歌","声","道","雨","雪","恋","涙","虹",
  "春","夏","秋","冬","桜","陽","蒼","青","赤","白",
  "黒","金","銀","時","瞬","永","未","今","明","暗",
  "君","僕","私","人","友","家","旅","街","影","波",
  "炎","雲","森","川","山","島","絆","願","祈","想",
  "魂","詩","響","旋","舞","華","香","宙","天","地",
  "幻","零","一","二","三","四","五","六","七","八",
  "九","水","獣","好","電","千","万","怪","髪","桃"
];

let size = 5;
let mode = "score";
let boardValues = [];
let hits = [];
let started = false;
let isFreeEnabled = false;

const boardEl = document.getElementById("board");
const modeEl = document.getElementById("mode");
const sizeEl = document.getElementById("sizeSelect");
const scoreRangeBox = document.getElementById("scoreRangeBox");
const freeToggleBtn = document.getElementById("freeToggleBtn");
const randomBtn = document.getElementById("randomBtn");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const bingoBanner = document.getElementById("bingoBanner");
const hideSetupContainer = document.getElementById("hideSetupContainer");

function initBoard(){
  boardEl.innerHTML = "";
  boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  const total = size*size;
  boardValues = new Array(total).fill("");
  hits = new Array(total).fill(false);

  if (size !== 5) {
    isFreeEnabled = false;
    freeToggleBtn.classList.remove("active");
    freeToggleBtn.textContent = "FREE中央マス：無効";
    freeToggleBtn.disabled = true;
  } else {
    freeToggleBtn.disabled = false;
  }

  for(let i=0;i<total;i++){
    const div = document.createElement("div");
    
    const rowIndex = Math.floor(i / size);
    let rowClass = "r-default";
    if (rowIndex < 5) {
      rowClass = `r${rowIndex + 1}`;
    }
    
    div.className = `cell editable ${rowClass}`;
    div.dataset.index = i;
    div.onclick = () => onCellClick(i);
    boardEl.appendChild(div);
  }

  if (size === 5 && isFreeEnabled) {
    boardValues[12] = "FREE";
  }

  bingoBanner.style.display = "none";
  renderBoard();
}

function onCellClick(i){
  if(started){
    hits[i] = !hits[i];
    renderBoard();
    checkBingo(); 
    return;
  }

  const centerIndex = Math.floor((size * size) / 2);

  if (size === 5 && isFreeEnabled && i === centerIndex) {
    alert("現在FREE中央機能が有効なため、このマスはFREE固定です。");
    return;
  }

  inputManualValue(i);
}

/* [アップデート] 選択肢（候補）を提示するロジックを廃止し、直接入力のみにする */
function inputManualValue(i){
  if(mode === "score"){
    const choice = prompt("設定したい【点数】を入力してください：");
    if(choice) boardValues[i] = choice;
  }else{
    const choice = prompt("設定したい【漢字】を入力してください：");
    if(choice) boardValues[i] = choice;
  }
  renderBoard();
}

function generateScoreCandidates(min,max,count){
  const list=[];
  for(let i=0;i<count;i++){
    list.push(String(Math.floor(Math.random()*(max-min+1))+min));
  }
  return list;
}

function generateKanjiCandidates(count){
  const pool=[...wordPool];
  const result=[];
  for(let i=0;i<count;i++){
    if(pool.length===0) break;
    const idx=Math.floor(Math.random()*pool.length);
    result.push(pool[idx]);
    pool.splice(idx,1);
  }
  return result;
}

function randomFill(){
  if(started) return;
  const total = size*size;

  if(mode==="score"){
    const min = Number(document.getElementById("minScore").value);
    const max = Number(document.getElementById("maxScore").value);
    boardValues = generateScoreCandidates(min,max,total);
  }else{
    boardValues = generateKanjiCandidates(total);
  }

  if(size === 5 && isFreeEnabled){
    boardValues[12] = "FREE";
  }

  renderBoard();
}

function startGame(){
  if(started) return;

  if(boardValues.some(v => v === "")){
    alert("空欄のマスがあります。すべて埋めてからSTARTしてください。");
    return;
  }

  started = true;

  if (size === 5 && isFreeEnabled && boardValues[12] === "FREE") {
    hits[12] = true;
  }

  hideSetupContainer.style.display = "none";
  randomBtn.style.display = "none";
  startBtn.style.display = "none";

  renderBoard();
  checkBingo(); 
}

function checkBingo(){
  const cells = boardEl.querySelectorAll(".cell");
  
  cells.forEach(c => {
    c.classList.remove("reach", "bingo-line");
  });

  const lines = [];

  for(let r=0; r<size; r++){
    const row=[];
    for(let c=0; c<size; c++) row.push(r*size+c);
    lines.push(row);
  }
  for(let c=0; c<size; c++){
    const col=[];
    for(let r=0; r<size; r++) col.push(r*size+c);
    lines.push(col);
  }
  const d1=[], d2=[];
  for(let i=0; i<size; i++){
    d1.push(i*size+i);
    d2.push(i*size+(size-1-i));
  }
  lines.push(d1, d2);

  let bingoCount = 0;
  let bingoIndices = new Set();
  let lastEmptyIndices = new Set(); 

  for(const line of lines){
    const hitCount = line.filter(i => hits[i]).length;
    
    if (hitCount === size) {
      bingoCount++;
      line.forEach(i => bingoIndices.add(i));
    } else if (hitCount === size - 1) {
      const emptyCellIndex = line.find(i => !hits[i]);
      if (emptyCellIndex !== undefined) {
        lastEmptyIndices.add(emptyCellIndex);
      }
    }
  }

  lastEmptyIndices.forEach(i => {
    cells[i].classList.add("reach");
  });

  bingoIndices.forEach(i => {
    cells[i].classList.remove("reach"); 
    cells[i].classList.add("bingo-line");
  });

  if(bingoCount > 0){
    let text = "BINGO！！";
    if (bingoCount >= 2) text = `${bingoCount} BINGO！！！`;
    
    bingoBanner.textContent = text;
    bingoBanner.style.display = "block";
  } else {
    bingoBanner.style.display = "none";
  }
}

function renderBoard(){
  const cells = boardEl.querySelectorAll(".cell");
  if(cells.length === 0) return;
  
  cells.forEach((c,idx)=>{
    const val = boardValues[idx];
    
    if (val === "FREE") {
      c.classList.add("free-cell");
      c.innerHTML = "<span>🎤</span>FREE";
    } else {
      c.classList.remove("free-cell");
      c.textContent = val;
    }
    
    c.classList.toggle("hit", hits[idx]);
    c.classList.toggle("editable", !started);
  });
}

function resetAll(){
  started = false;
  
  hideSetupContainer.style.display = "block";
  randomBtn.style.display = "inline-block";
  startBtn.style.display = "inline-block";

  modeEl.disabled = false;
  sizeEl.disabled = false;
  document.getElementById("minScore").disabled = false;
  document.getElementById("maxScore").disabled = false;
  bingoBanner.style.display="none";
  initBoard();
}

freeToggleBtn.addEventListener("click", () => {
  if (started || size !== 5) return;

  isFreeEnabled = !isFreeEnabled;
  if (isFreeEnabled) {
    freeToggleBtn.classList.add("active");
    freeToggleBtn.textContent = "FREE中央マス：有効";
    boardValues[12] = "FREE";
  } else {
    freeToggleBtn.classList.remove("active");
    freeToggleBtn.textContent = "FREE中央マス：無効";
    boardValues[12] = "";
  }
  renderBoard();
});

modeEl.addEventListener("change",()=>{
  mode = modeEl.value;
  scoreRangeBox.style.display = mode==="score" ? "inline" : "none";
});

sizeEl.addEventListener("change",()=>{
  size = Number(sizeEl.value);
  initBoard(); 
});

randomBtn.addEventListener("click",randomFill);
startBtn.addEventListener("click",startGame);
resetBtn.addEventListener("click",resetAll);

resetAll();
</script>

</body>
</html>
