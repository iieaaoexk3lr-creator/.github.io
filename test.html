<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カラオケストラックアウト</title>
<style>
:root {
  --bg-color: #121214;
  --card-bg: #2a2a30;
  --target-bg: linear-gradient(135deg, #4facfe, #00f2fe);
  --target-broken: linear-gradient(135deg, #ff0055, #660022);
  --text-color: #e0e0e6;
  
  /* カラフルグラデーションボタン */
  --btn-cyan: linear-gradient(135deg, #00f2fe, #4facfe);
  --btn-pink: linear-gradient(135deg, #ff007f, #7928ca);
  --btn-green: linear-gradient(135deg, #00ff87, #00e0ff);
  --btn-gray: linear-gradient(135deg, #485563, #29323c);
  --btn-submit: linear-gradient(135deg, #00ff87, #60efff);

  --title-color: #ffffff;
  --border-radius: 12px;
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: var(--font-family);
  text-align: center;
  padding: 10px;
  margin: 0;
}

h1 {
  font-size: 1.8rem;
  margin: 15px 0 10px 0;
  color: var(--title-color);
  background: var(--btn-pink);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
}

hr {
  border: 0;
  height: 1px;
  background: #333;
  margin: 15px 0;
}

/* アプリ風のメインコンテナ */
.app-card {
  background: var(--card-bg);
  padding: 15px;
  border-radius: var(--border-radius);
  max-width: 420px;
  margin: 0 auto 15px auto;
  box-sizing: border-box;
  border: 1px solid #333;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

/* 3×3 盤面スマホ最適化 */
#board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 320px; /* 横幅約8cmにフィット */
  margin: 15px auto;
  justify-content: center;
  box-sizing: border-box;
}

.cell {
  aspect-ratio: 1 / 1; /* 正方形を維持 */
  background: var(--target-bg);
  color: #121214;
  border-radius: 10px;
  font-size: 2.2rem;
  font-weight: 900;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 4px 10px rgba(0, 242, 254, 0.3);
  text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
  user-select: none;
}

/* 的撃ち抜き時：回転・縮小・暗転させて消滅感を演出 */
.broken {
  background: var(--target-broken) !important;
  color: rgba(255, 255, 255, 0.1) !important;
  transform: scale(0) rotate(180deg);
  opacity: 0.1;
  box-shadow: none;
  pointer-events: none;
}

/* 入力欄 & セレクトボックス */
select, input {
  font-size: 1rem;
  font-weight: bold;
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: 2px solid #444;
  background: #000;
  color: #fff;
  width: 45%;
  box-sizing: border-box;
  text-align: center;
}
input {
  width: 60%;
  font-size: 1.2rem;
  max-width: 200px;
  border-color: #555;
}
input:focus {
  border-color: #00f2fe;
  outline: none;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 10px;
}

button {
  font-size: 0.95rem;
  font-weight: bold;
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  min-width: 95px;
  color: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
button:active {
  transform: scale(0.96);
}

/* ボタン色 */
.btn-start { background: var(--btn-pink); }
.btn-shoot { background: var(--btn-submit); color: #121214; font-size: 1.1rem; padding: 11px 20px;}
.btn-reset { background: var(--btn-gray); }
.btn-menu { background: #333; color: #fff; min-width: 120px; text-decoration: none; display: inline-block; padding: 12px 16px; border-radius: 10px; font-weight: bold; font-size: 0.95rem;}
.btn-toggle { background: #444; color: #fff; font-size: 0.85rem; padding: 8px 14px; border-radius: 8px; margin-top: 5px;}

#info {
  font-size: 1.3rem;
  font-weight: bold;
  margin: 12px 0;
  color: #00ffcc;
  text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
}

/* 説明・履歴コンテナ */
.info-container {
  font-size: 0.95rem;
  color: #aaa;
  line-height: 1.7;
  padding: 15px;
  text-align: left;
  max-width: 420px;
  margin: 15px auto 10px auto;
  background: var(--card-bg);
  border-radius: var(--border-radius);
  box-sizing: border-box;
  border: 1px solid #333;
}
.info-container b {
  color: #fff;
}

/* 履歴リスト（大きめ文字） */
#historyList {
  margin-top: 10px;
  font-size: 1.15rem; /* 文字サイズを大きめに変更 */
  color: #fff;
  max-height: 150px;
  overflow-y: auto;
  line-height: 1.8;
}

.hidden-element {
  display: none !important;
}
</style>
</head>
<body>

<hr style="margin-top:10px;">

<h1>カラオケストラックアウト</h1>

<div class="app-card">
  <div class="button-row">
    <select id="mode">
      <option value="score">点数</option>
      <option value="cal">消費カロリー</option>
      <option value="vib">ビブラート回数</option>
      <option value="shake">しゃくり回数</option>
      <option value="kobushi">こぶし回数</option>
    </select>

    <select id="triesSelect">
      <option value="9">挑戦回数：9</option>
      <option value="10">挑戦回数：10</option>
      <option value="11">挑戦回数：11</option>
      <option value="12">挑戦回数：12</option>
      <option value="13">挑戦回数：13</option>
      <option value="14">挑戦回数：14</option>
      <option value="15">挑戦回数：15</option>
    </select>
  </div>

  <button class="btn-start" onclick="startGame()">ゲーム開始 (START)</button>

  <div id="info">ゲームを開始してください</div>

  <div style="margin: 15px 0;">
    <input id="numInput" type="number" pattern="\d*" inputmode="numeric" placeholder="数字を入力">
    <button class="btn-shoot" onclick="shoot()">決定</button>
  </div>

  <div id="board"></div>
</div>

<button class="btn-toggle" onclick="toggleHistory()">挑戦履歴を表示/非表示</button>
<div id="historySection" class="info-container hidden-element">
  <b>📊 挑戦履歴</b>
  <div id="historyList"></div>
</div>

<br>

<button class="btn-toggle" onclick="toggleRules()">遊び方を表示/非表示</button>
<div id="rulesSection" class="info-container hidden-element">
  <b>■ 遊び方</b><br>
  ・カラオケのリザルト画面の数値を使って的を射抜くゲームです。<br>
  ・モード（点数やカロリーなど）と挑戦回数を選んでスタートします。<br>
  ・入力した数値の<b>「一の位」</b>と<b>「十の位」</b>の番号の的が同時に撃ち抜かれます！
  <br><br>
  <b>🎁 ボーナス特典</b><br>
  ・入力した数値の<b>下1桁（一の位）が「0」</b>だった場合、チャレンジ精神を称えて残り挑戦回数が<b>「+1回」おまけ</b>されます！
</div>

<div class="button-row" style="margin-top: 20px;">
  <button class="btn-reset" onclick="resetGame()">挑戦リセット</button>
  <a href="index.html" class="btn-menu">📘 メニューへ戻る</a>
</div>

<script>
let tries = 0;
let turn = 0;
let started = false;

// 盤面自動生成
const board = document.getElementById("board");
for (let i = 1; i <= 9; i++) {
  const div = document.createElement("div");
  div.className = "cell";
  div.id = "cell" + i;
  div.textContent = i;
  board.appendChild(div);
}

// STARTボタン
function startGame() {
  tries = Number(document.getElementById("triesSelect").value);
  turn = 0;
  started = true;

  document.getElementById("info").textContent = "残り挑戦回数：" + tries + " 回";
  document.getElementById("historyList").innerHTML = "";

  // 盤面全修復リセット
  for (let i = 1; i <= 9; i++) {
    const c = document.getElementById("cell" + i);
    c.classList.remove("broken");
  }
}

// 数字入力・決定処理
function shoot() {
  if (!started) {
    alert("STARTボタンを押してゲームを開始してください！");
    return;
  }
  if (tries <= 0) {
    document.getElementById("info").textContent = "挑戦回数が終了しました！";
    return;
  }

  const inputEl = document.getElementById("numInput");
  const num = Number(inputEl.value);
  if (!inputEl.value || isNaN(num)) return;

  turn++;

  // 下1桁が0 → 挑戦回数ボーナス +1
  let bonusText = "";
  if (num % 10 === 0) {
    tries++;
    bonusText = " <span style='color:#00ff87; font-size:0.9rem;'>[下1桁0: 回数+1!]</span>";
  }

  // 履歴リストの追加処理（文字を大きく見やすく）
  const historyList = document.getElementById("historyList");
  historyList.innerHTML = `<div><b>${turn}回目:</b> <span style="color:#00f2fe;">${num}</span>${bonusText}</div>` + historyList.innerHTML;

  // 十の位と一の位を抽出
  const ones = num % 10;
  const tens = Math.floor(num / 10) % 10;

  hitCell(ones);
  hitCell(tens);

  tries--;
  document.getElementById("info").textContent = "残り挑戦回数：" + tries + " 回";

  if (tries <= 0) {
    document.getElementById("info").innerHTML = "<span style='color:#ff0055;'>GAME OVER (終了)</span>";
  }

  inputEl.value = "";
  inputEl.focus();
}

// マスを破壊するアニメーション処理
function hitCell(n) {
  if (n >= 1 && n <= 9) {
    const cell = document.getElementById("cell" + n);
    if (!cell.classList.contains("broken")) {
      cell.classList.add("broken");
    }
  }
}

function resetGame() {
  startGame();
}

// 折りたたみ表示切り替えトグル関数
function toggleRules() {
  document.getElementById("rulesSection").classList.toggle("hidden-element");
}

function toggleHistory() {
  document.getElementById("historySection").classList.toggle("hidden-element");
}

// 入力欄でEnterキーが押されたら決定を発火させる
document.getElementById("numInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    shoot();
  }
});
</script>

</body>
</html>
