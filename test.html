<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カラフルBOMBER</title>
<style>
  :root {
    --bg-color: #05070f;
    --panel-bg: rgba(11, 14, 33, 0.9);
    --border-glow: #00ffff;
    --text-color: #ffffff;
    --text-sub: #7a8ebf;
  }

  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: radial-gradient(circle at center, #101530 0%, var(--bg-color) 100%);
    color: var(--text-color);
    text-align: center;
    padding: 20px;
    margin: 0;
    overflow-x: hidden;
  }

  h1 { 
    font-size: 3.2rem; 
    font-weight: 900;
    margin: 10px 0 20px 0; 
    letter-spacing: 6px;
    text-transform: uppercase;
    /* 鮮やかなグラデーションネオンタイトル */
    background: linear-gradient(135deg, #00ffff 0%, #ff00ff 50%, #ffff00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.6));
  }

  /* 設定エリア開閉ボタン */
  .btn-toggle-settings {
    background: #0d1126;
    color: var(--text-sub);
    border: 1px solid #1f274d;
    padding: 6px 14px;
    font-size: 0.85rem;
    border-radius: 20px;
    cursor: pointer;
    margin-bottom: 15px;
    transition: all 0.2s;
  }
  .btn-toggle-settings:hover {
    color: #fff;
    border-color: var(--border-glow);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
  }

  /* 設定エリア */
  #settings {
    display: none;
    margin: 0 auto 25px auto;
    max-width: 650px;
    background: var(--panel-bg);
    padding: 15px;
    border-radius: 16px;
    border: 2px solid #1f274d;
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.1);
  }

  label { font-size: 1.1rem; margin-right: 10px; color: var(--text-sub); }
  input, select { 
    font-size: 1.1rem; 
    padding: 6px 10px; 
    margin: 5px; 
    background: #02040a;
    color: #fff;
    border: 1px solid #2e3b75;
    border-radius: 6px;
  }

  /* お題表示 */
  #question { 
    font-size: 2.2rem; 
    font-weight: bold;
    margin: 0 auto 25px auto; 
    max-width: 800px;
    padding: 18px;
    background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(5, 9, 28, 0.95) 25%, rgba(5, 9, 28, 0.95) 75%, rgba(0,0,0,0) 100%);
    border-top: 3px solid var(--border-glow);
    border-bottom: 3px solid var(--border-glow);
    text-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
  }

  /* スコア表示（ご指定の表記へ変更） */
  #score {
    font-size: 1.6rem;
    margin: 10px 0 20px 0;
    color: #ffff00;
    font-weight: bold;
    text-shadow: 0 0 15px rgba(255, 255, 0, 0.5);
  }

  /* タイマー行 */
  #timerRow {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 5px;
  }

  .timer-box {
    font-size: 2.6rem;
    font-weight: 800;
    font-family: 'Impact', 'Arial Black', sans-serif;
    color: #ff0055;
    width: 80px;
    text-align: center;
    text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
  }

  /* 回答パイプラインエリア */
  #answers {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
  }

  /* 長さ500pxのネオンデザインバー */
  .answer-box {
    width: 80px;
    height: 500px; 
    border-radius: 10px;
    font-size: 2.4rem; 
    font-weight: 900;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
    z-index: 1;
    border: 3px solid #ffffff22;
    box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.8);
  }

  /* 文字の前面表示用 */
  .answer-box span {
    position: relative;
    z-index: 4;
    text-shadow: 0 2px 12px rgba(0,0,0,1), 0 0 8px rgba(255,255,255,0.8);
  }

  /* 【新規】上から下へせり下りてくる侵食ネオンレッド */
  .fill {
    position: absolute;
    top: 0; /* 上を固定起点にする */
    left: 0;
    width: 100%;
    height: 0%; /* 初期は0% */
    background: linear-gradient(to bottom, #ff0055 0%, #ff0000 80%, #ffcc00 100%);
    box-shadow: 0 5px 15px rgba(255, 0, 0, 0.9);
    z-index: 3;
    /* transitionを削除してタイマーとの同期をより正確＆なめらかに */
  }

  /* 不正解時の激しいネオン点滅 */
  @keyframes wrongFlash {
    0% { background: #ff0055; box-shadow: 0 0 40px #ff0055; }
    50% { background: inherit; }
    100% { background: #ff0055; box-shadow: 0 0 40px #ff0055; }
  }
  .wrongFlash { animation: wrongFlash 0.3s ease-out 2; }

  /* コントロールボタン群 */
  .controls-row {
    margin: 20px 0;
  }

  button.game-btn {
    font-size: 1.1rem;
    font-weight: bold;
    padding: 12px 26px;
    margin: 6px;
    border-radius: 30px;
    border: none;
    color: white;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s, filter 0.2s;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  button.game-btn:active { transform: scale(0.95); }
  
  #startBtn { background: linear-gradient(135deg, #00ffff 0%, #00aaff 100%); color: #05070f; font-weight: 900; }
  .btn-correct { background: linear-gradient(135deg, #00ff66 0%, #00ffff 100%); color: #05070f; font-weight: 900; }
  .btn-wrong { background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%); }
  .btn-reset { background: #25336e; border: 1px solid #3d53b0; }
  #nextBtn { background: linear-gradient(135deg, #ffff00 0%, #ff6600 100%); color: #000; font-weight: 900; }
  .btn-menu { background: #131936; color: var(--text-sub); }
  .btn-set { background: #00ffff; color: #000; padding: 5px 15px !important; border-radius: 6px !important; }

  /* エフェクトレイヤー */
  #successEffect {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 5rem;
    font-weight: 900;
    color: #00ffcc;
    text-shadow: 0 0 30px rgba(0, 255, 204, 1), 0 0 50px rgba(0, 255, 204, 0.6);
    animation: sparkle 1s ease-out forwards;
    pointer-events: none;
    z-index: 999;
  }

  @keyframes sparkle {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  }

  #explosion {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 12rem;
    animation: explode 0.8s ease-out forwards;
    pointer-events: none;
    z-index: 999;
  }

  @keyframes explode {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
    30% { opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1.6); filter: brightness(1.5); }
    100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
  }

  #manual {
    margin: 40px auto 10px auto;
    max-width: 600px;
    padding: 15px;
    background: rgba(255,255,255,0.02);
    border-radius: 10px;
    font-size: 0.95rem;
    color: var(--text-sub);
    line-height: 1.6;
    text-align: left;
    border: 1px solid #151b3d;
  }
</style>
</head>
<body>

<h1>カラフルBOMBER</h1>

<!-- 設定表示非表示の切り替えスイッチ -->
<button class="btn-toggle-settings" onclick="toggleSettingsPanel()">⚙️ ゲーム設定を開く/閉じる</button>

<div id="settings">
  <label>制限時間：</label>
  <input type="number" id="timeInput" value="50" min="1" max="200"> 秒

  <label style="margin-left: 15px;">バーの本数：</label>
  <select id="barCount">
    <option>4</option>
    <option selected>5</option>
    <option>6</option>
    <option>7</option>
    <option>8</option>
    <option>9</option>
    <option>10</option>
  </select>

  <button class="game-btn btn-set" onclick="applySettings()">SET</button>
</div>

<div id="question"></div>

<!-- スコア表記をご指定の形式に変更 -->
<div id="score">
  正解数：<span>0</span>
  <button class="game-btn btn-reset" onclick="resetScore()" style="font-size:0.8rem; padding: 4px 10px; margin-left:15px;">リセット</button>
</div>

<div id="timerRow"></div>
<div id="answers"></div>

<div class="controls-row">
  <button id="startBtn" class="game-btn" onclick="startGame()">START</button>
  <button class="game-btn btn-correct" onclick="markCorrect()">正解</button>
  <button class="game-btn btn-wrong" onclick="markWrong()">不正解</button>
  <button class="game-btn btn-reset" onclick="resetGame()">リセット</button>
  <button id="nextBtn" class="game-btn" onclick="nextQuestion()" style="display:none;">次の問題へ</button>
</div>

<div class="controls-row">
  <button class="game-btn btn-menu" onclick="location.href='index.html'">メニューへ戻る</button>
</div>

<div id="successEffect">STAGE CLEAR!! ✨</div>
<div id="explosion">💥</div>

<script>
/* -------------------------
    WebAudio：正解音 (完全維持)
------------------------- */
function playCorrect(){
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o1 = ctx.createOscillator();
    const g1 = ctx.createGain();
    o1.type = "sine";
    o1.frequency.setValueAtTime(784, ctx.currentTime);
    g1.gain.setValueAtTime(0.25, ctx.currentTime);
    o1.connect(g1);
    g1.connect(ctx.destination);
    o1.start();
    o1.stop(ctx.currentTime + 0.18);

    const o2 = ctx.createOscillator();
    const g2 = ctx.createGain();
    o2.type = "sine";
    o2.frequency.setValueAtTime(1046, ctx.currentTime + 0.18);
    g2.gain.setValueAtTime(0.25, ctx.currentTime + 0.18);
    o2.connect(g2);
    g2.connect(ctx.destination);
    o2.start(ctx.currentTime + 0.18);
    o2.stop(ctx.currentTime + 0.45);
}

/* -------------------------
    WebAudio：不正解音 (完全維持)
------------------------- */
function playWrong(){
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(120, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.3);
    osc.stop(ctx.currentTime + 0.3);
}

/* -------------------------
    WebAudio：爆発音 (完全維持)
------------------------- */
function playExplosion(){
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = 2 * ctx.sampleRate;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        output[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
    noise.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
    noise.stop(ctx.currentTime + 1);
}

/* -------------------------
    ゲーム変数
------------------------- */
let barNum = 5;
let timeLimit = 50;
let timeLeft = 50;
let found = 0;
let timerId;
let started = false;
let timerStopped = [];
let totalScore = 0;

/* ★ 鮮烈なサイバーネオンカラー（背景ベース色） */
const barColors = [
  "linear-gradient(to bottom, #00f2fe, #4facfe)", // ネオンシアン
  "linear-gradient(to bottom, #ff007f, #ff00ff)", // ネオンマゼンタ
  "linear-gradient(to bottom, #00ff66, #00aa50)", // ネオングリーン
  "linear-gradient(to bottom, #ffd700, #ff8800)", // ネオンゴールド
  "linear-gradient(to bottom, #7f00ff, #ff00ff)"  // ネオンパープル
];

const questions = [
    "色のつく曲を答えよ！",
    "アニメの曲を答えよ！",
    "動物の曲を答えよ！",
    "三文字の曲を答えよ！",
    "DAM人気TOP50に入っている曲を答えよ！",
    "演歌を答えよ！",
    "英語の曲を答えよ！",
    "ラップの入った曲を答えよ！",
    "Mrs.GREENAPPLEの曲を答えよ！",
    "ーの入った曲を答えよ！"
];

let currentQuestion = 0;

/* -------------------------
    設定表示切り替え
------------------------- */
function toggleSettingsPanel() {
  const panel = document.getElementById("settings");
  panel.style.display = (panel.style.display === "block") ? "none" : "block";
}

/* -------------------------
    設定反映
------------------------- */
function applySettings() {
  barNum = Number(document.getElementById("barCount").value);
  timeLimit = Number(document.getElementById("timeInput").value);
  resetGame();
}

/* -------------------------
    初期化
------------------------- */
function init() {
  timeLeft = timeLimit;
  found = 0;
  started = false;
  timerStopped = Array(barNum).fill(false);

  document.getElementById("question").textContent = questions[currentQuestion];
  document.getElementById("score").querySelector("span").textContent = totalScore;
  document.getElementById("startBtn").style.display = "inline-block";
  document.getElementById("nextBtn").style.display = "none";

  document.getElementById("timerRow").innerHTML = "";
  document.getElementById("answers").innerHTML = "";

  for (let i = 0; i < barNum; i++) {
    const t = document.createElement("div");
    t.className = "timer-box";
    t.id = "timer" + i;
    t.textContent = timeLeft;
    document.getElementById("timerRow").appendChild(t);

    const box = document.createElement("div");
    box.className = "answer-box";
    box.id = "box" + i;
    box.style.background = barColors[i % barColors.length];
    // ネオンカラーの枠線グロー効果を追加
    box.style.boxShadow = `0 0 15px rgba(255,255,255,0.1), inset 0 0 15px rgba(0,0,0,0.6)`;

    /* 【変更】上から下へ向かって伸びる赤レイヤー */
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.id = "fill" + i;

    box.appendChild(fill);
    box.innerHTML += "<span>？</span>";
    document.getElementById("answers").appendChild(box);
  }
}

/* -------------------------
    START
------------------------- */
function startGame() {
  if (started) return;
  started = true;
  document.getElementById("startBtn").style.display = "none";
  startTimer();
}

/* -------------------------
    タイマー（上から下へ赤色が侵食する動きを制御）
------------------------- */
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;

    for (let i = 0; i < barNum; i++) {
      if (!timerStopped[i]) {
        document.getElementById("timer" + i).textContent = timeLeft;

        // 時間の経過度(%)に合わせて、上から赤色を下に伸ばす(heightを増やす)
        const percent = ((timeLimit - timeLeft) / timeLimit) * 100;
        document.getElementById("fill" + i).style.height = percent + "%";
      }
    }

    if (timeLeft <= 0) {
      clearInterval(timerId);
      triggerExplosion();
    }
  }, 1000);
}

/* -------------------------
    正解
------------------------- */
function markCorrect() {
  if (!started) return;

  playCorrect();

  // 現在回答中のバーのタイマー判定のみをストップ（変化した赤色の高さをそのまま維持）
  timerStopped[found] = true;

  const box = document.getElementById("box" + found);
  // 文字を「👍」に変え、ネオンを強調
  box.querySelector("span").innerHTML = "<span style='color:#ffff00; font-size:3rem; text-shadow:0 0 15px #ffff00;'>👍</span>";

  found++;
  totalScore++;
  document.getElementById("score").querySelector("span").textContent = totalScore;

  if (found === barNum) {
    clearInterval(timerId);
    showSuccess();
    started = false;
    document.getElementById("nextBtn").style.display = "inline-block";
  }
}

/* -------------------------
    不正解
------------------------- */
function markWrong() {
  if (!started) return;

  playWrong();

  const box = document.getElementById("box" + found);
  box.classList.add("wrongFlash");
  setTimeout(() => box.classList.remove("wrongFlash"), 600);
}

/* -------------------------
    爆発（失敗）
------------------------- */
function triggerExplosion() {
  document.getElementById("explosion").style.display = "block";
  playExplosion();
  started = false;

  setTimeout(() => {
    document.getElementById("explosion").style.display = "none";
  }, 900);

  document.getElementById("nextBtn").style.display = "inline-block";
}

/* -------------------------
    成功
------------------------- */
function showSuccess() {
  document.getElementById("successEffect").style.display = "block";
  setTimeout(() => {
    document.getElementById("successEffect").style.display = "none";
  }, 1200);
}

/* -------------------------
    次の問題
------------------------- */
function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= questions.length) currentQuestion = 0;
  init();
}

/* -------------------------
    点数リセット
------------------------- */
function resetScore() {
  totalScore = 0;
  document.getElementById("score").querySelector("span").textContent = totalScore;
}

/* -------------------------
    リセット
------------------------- */
function resetGame() {
  clearInterval(timerId);
  init();
}

init();
</script>

<div id="manual">
  <b>【ルールと操作】</b><br>
  ・<b>START</b>でタイムリミットのカウントが始まります。<br>
  ・時間が経つにつれ、ネオンバーが<b>上から下へ向かって鮮烈な赤色に染まっていきます</b>。<br>
  ・<b>正解</b>を押すと、そのバーは<b>赤色の侵食がその段階でピタッと停止してキープ</b>され、次のバーへ移動します。<br>
  ・すべてのバーを赤で完全に染まる前にロックできればステージクリアです！
</div>

</body>
</html>
