<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>カラオケビンゴ！</title>
<style>
  :root {
    --bg-color: #0b0c10; /* さらに暗く */
    --card-bg: #1f2833;
    --text-color: #c5c6c7;
    --accent-blue: #66fcf1; /* 目に優しいネオンブルー */
    --hit-border: #45a29e; /* ヒット時の枠色 */
    --title-color: #a8dadc; /* 目に優しいタイトル色 */
    --border-radius: 8px;
    --font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: var(--font-family);
    text-align: center;
    padding: 10px; /* スマホ向けに余白縮小 */
    margin: 0;
  }

  /* タイトルを目に優しく見やすい水色系ネオンへ */
  h1 { 
    font-size: 2rem; 
    margin: 15px 0 10px 0; 
    color: var(--title-color);
    text-shadow: 0 0 10px rgba(168, 218, 220, 0.6); 
  }

  /* コントロールエリア全体のレイアウト調整 */
  .controls-group {
    background: var(--card-bg);
    padding: 15px;
    border-radius: var(--border-radius);
    max-width: 420px;
    margin: 0 auto 15px auto;
    box-sizing: border-box;
  }

  /* セレクトボックスを行に固定 */
  .select-row {
    margin-bottom: 10px;
  }

  select, input {
    font-size: 1rem;
    padding: 8px;
    margin: 4px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #000;
    color: #fff;
    box-sizing: border-box;
  }

  /* 最低点・最高点の項目を中段に配置 */
  #scoreRangeBox {
    display: block; /* 改行 */
    margin: 10px 0;
    font-size: 0.95rem;
    color: #aaa;
  }
  #scoreRangeBox input { width: 70px; }

  /* ボタン群のレイアウト */
  .button-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }

  button {
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: background 0.2s;
    min-width: 90px; /* スマホで押しやすい最低幅 */
  }
  button:active { transform: scale(0.98); }

  #randomBtn { background: #4a4e69; color: #fff; }
  #startBtn { background: #198754; color: #fff; }
  #resetBtn { background: #6c757d; color: #fff; }
  .btn-menu { background: #343a40; color: var(--text-color); min-width: 120px;}
  button:disabled { background: #333 !important; color: #555 !important; cursor: not-allowed; }

  /* ビンゴ盤：スマホ幅約8cmに収まり、マスが大きく見やすいサイズ */
  #board {
    margin: 15px auto;
    display: grid;
    gap: 6px; /* 隙間を広げて見やすく */
    max-width: 100%; /* スマホ幅いっぱいまで許可 */
    width: 310px; /* 幅8cm≒320px前後に収まるように固定 */
    box-sizing: border-box;
  }

  .cell {
    background: #121212;
    border-radius: var(--border-radius);
    min-height: 60px; /* 文字を大きく見せるため高さを維持 */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem; /* 文字を大きく */
    font-weight: bold;
    padding: 6px;
    word-break: break-word;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    box-sizing: border-box;
    transition: all 0.25s ease;
    border: 2px solid transparent; /* 初期は枠線なし */
  }

  .editable:hover { 
    outline: none; /* デフォルトを消す */
    border-color: #666; 
  }

  /* 【新規設定】ヒット時：ネオンブルー枠、文字は白 */
  .hit {
    background: #000; /* 当たった背景は黒に */
    color: #fff; /* 文字は白 */
    border-color: var(--accent-blue); /* 枠がネオンブルー */
    transform: scale(1.02);
    box-shadow: 0 0 10px rgba(102, 252, 241, 0.6); 
  }

  /* ビンゴバナーも水色系へ */
  #bingoBanner {
    margin: 10px 0 15px 0;
    font-size: 2.5rem;
    font-weight: 900;
    color: var(--accent-blue);
    text-shadow: 0 0 15px rgba(102, 252, 241, 0.8);
    display: none;
    animation: bingoPop 0.3s ease-out;
  }
  @keyframes bingoPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  #rules {
    margin: 20px auto 10px auto;
    max-width: 420px;
    text-align: left;
    background: var(--card-bg);
    padding: 15px;
    border-radius: var(--border-radius);
    font-size: 0.9rem;
    line-height: 1.6;
    color: #aaa;
    box-sizing: border-box;
  }
  #rules b { color: #fff; }
</style>
</head>
<body>

<h1>カラオケビンゴ！</h1>

<div class="controls-group">
  <div class="select-row">
    <select id="mode">
      <option value="score">点数ビンゴ</option>
      <option value="word">漢字ビンゴ</option>
    </select>

    <select id="sizeSelect">
      <option value="4">4×4（16マス）</option>
      <option value="5" selected>5×5（25マス）</option>
      <option value="6">6×6（36マス）</option>
    </select>
  </div>

  <span id="scoreRangeBox">
    最低点 <input id="minScore" type="number" value="70">
    最高点 <input id="maxScore" type="number" value="100">
  </span>

  <div class="button-row">
    <button id="randomBtn">ランダム生成</button>
    <button id="startBtn">START</button>
    <button id="resetBtn">リセット</button>
    <button class="btn-menu" onclick="location.href='index.html'">メニューへ戻る</button>
  </div>
</div>

<div id="bingoBanner">BINGO！！</div>

<div id="board"></div>

<div id="rules">
  <b>【遊び方】</b><br>
  ・点数ビンゴ or 漢字ビンゴを選びます。<br>
  ・マス数（4×4 / 5×5 / 6×6）を選びます。<br>
  ・START前はマスをクリックして候補から選択できます。<br>
  ・START後は編集できません。<br>
  ・ゲーム中は一致したマスをタップしてロックします（もう一度タップで解除）。<br>
  ・縦・横・斜めのどれかが揃うとBINGOです。<br>
</div>

<script>
// JavaScriptロジックは完全維持
const wordPool = [
  "愛","夢","心","空","海","風","花","星","月","夜",
  "光","音","歌","声","道","雨","雪","恋","涙","虹",
  "春","夏","秋","冬","桜","陽","蒼","青","赤","白",
  "黒","金","銀","時","瞬","永","未","今","明","暗",
  "君","僕","私","人","友","家","旅","街","影","波",
  "炎","雲","森","川","山","島","絆","願","祈","想",
  "魂","詩","響","旋","舞","華","香","宙","天","地",
  "幻","零","一","二","三","四","五","六","七","八",
  "九","水","獣","好","電","千","万","怪","髪","桃"
];

let size = 5;
let mode = "score";
let boardValues = [];
let hits = [];
let started = false;

const boardEl = document.getElementById("board");
const modeEl = document.getElementById("mode");
const sizeEl = document.getElementById("sizeSelect");
const scoreRangeBox = document.getElementById("scoreRangeBox");
const randomBtn = document.getElementById("randomBtn");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const bingoBanner = document.getElementById("bingoBanner");

function initBoard(){
  boardEl.innerHTML = "";
  boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  const total = size*size;
  boardValues = new Array(total).fill("");
  hits = new Array(total).fill(false);

  for(let i=0;i<total;i++){
    const div = document.createElement("div");
    div.className = "cell editable";
    div.dataset.index = i;
    div.onclick = () => onCellClick(i);
    boardEl.appendChild(div);
  }
  bingoBanner.style.display = "none";
}

function onCellClick(i){
  if(started){
    hits[i] = !hits[i];
    renderBoard();
    checkBingo();
    return;
  }

  if(mode === "score"){
    const min = Number(document.getElementById("minScore").value);
    const max = Number(document.getElementById("maxScore").value);
    const count = size*size;
    const candidates = generateScoreCandidates(min,max,count);
    const choice = prompt("点数を選んでください：\n" + candidates.join(" / "));
    if(choice) boardValues[i] = choice;
  }else{
    const count = size*size;
    const candidates = generateKanjiCandidates(count);
    const choice = prompt("漢字を選んでください：\n" + candidates.join(" / "));
    if(choice) boardValues[i] = choice;
  }
  renderBoard();
}

function generateScoreCandidates(min,max,count){
  const list=[];
  for(let i=0;i<count;i++){
    list.push(String(Math.floor(Math.random()*(max-min+1))+min));
  }
  return list;
}

function generateKanjiCandidates(count){
  const pool=[...wordPool];
  const result=[];
  for(let i=0;i<count;i++){
    if(pool.length===0) break;
    const idx=Math.floor(Math.random()*pool.length);
    result.push(pool[idx]);
    pool.splice(idx,1);
  }
  return result;
}

function randomFill(){
  if(started) return;
  const total = size*size;

  if(mode==="score"){
    const min = Number(document.getElementById("minScore").value);
    const max = Number(document.getElementById("maxScore").value);
    boardValues = generateScoreCandidates(min,max,total);
  }else{
    boardValues = generateKanjiCandidates(total);
  }
  renderBoard();
}

function startGame(){
  if(started) return;

  if(boardValues.some(v => v === "")){
    alert("空欄のマスがあります。すべて埋めてからSTARTしてください。");
    return;
  }

  started = true;

  randomBtn.disabled = true;
  modeEl.disabled = true;
  sizeEl.disabled = true;
  document.getElementById("minScore").disabled = true;
  document.getElementById("maxScore").disabled = true;

  renderBoard();
}

function checkBingo(){
  const lines = [];

  for(let r=0;r<size;r++){
    const row=[];
    for(let c=0;c<size;c++) row.push(r*size+c);
    lines.push(row);
  }
  for(let c=0;c<size;c++){
    const col=[];
    for(let r=0;r<size;r++) col.push(r*size+c);
    lines.push(col);
  }
  const d1=[], d2=[];
  for(let i=0;i<size;i++){
    d1.push(i*size+i);
    d2.push(i*size+(size-1-i));
  }
  lines.push(d1,d2);

  let bingo=false;
  for(const line of lines){
    if(line.every(i=>hits[i])) bingo=true;
  }

  if(bingo){
    bingoBanner.style.display="block";
  }
}

function renderBoard(){
  const cells = boardEl.querySelectorAll(".cell");
  cells.forEach((c,idx)=>{
    c.textContent = boardValues[idx];
    c.classList.toggle("hit", hits[idx]);
    c.classList.toggle("editable", !started);
  });
}

function resetAll(){
  started = false;
  randomBtn.disabled = false;
  modeEl.disabled = false;
  sizeEl.disabled = false;
  document.getElementById("minScore").disabled = false;
  document.getElementById("maxScore").disabled = false;
  bingoBanner.style.display="none";
  initBoard();
}

modeEl.addEventListener("change",()=>{
  mode = modeEl.value;
  scoreRangeBox.style.display = mode==="score" ? "inline" : "none";
});

sizeEl.addEventListener("change",()=>{
  size = Number(sizeEl.value);
  initBoard();
});

randomBtn.addEventListener("click",randomFill);
startBtn.addEventListener("click",startGame);
resetBtn.addEventListener("click",resetAll);

resetAll();
</script>

</body>
</html>
