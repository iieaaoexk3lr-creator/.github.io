<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盛り上がりチェッカー</title>

<style>
body{ margin:0; background:#111827; font-family:sans-serif; color:white; display:flex; flex-direction:column; align-items:center; padding:20px; }
.line-warning { display: none; width: 100%; max-width: 430px; background: #ef4444; color: white; padding: 12px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; font-size: 14px; text-align: center; box-sizing: border-box; }
.back-to-menu { width: 100%; max-width: 430px; background: #4b5563; color: white; padding: 12px; border: none; border-radius: 14px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 15px; box-sizing: border-box; text-align: center; text-decoration: none; display: block; }
.app{ width:100%; max-width:430px; background:#1f2937; border-radius:28px; padding:20px; box-sizing:border-box; box-shadow:0 0 20px rgba(0,0,0,0.5); }
h1{ text-align:center; margin-top:0; font-size:28px; }
.card{ background:#374151; border-radius:20px; padding:16px; margin-bottom:16px; }
.save-container-box { background: #111827; border: 2px dashed #4b5563; border-radius: 20px; padding: 14px; margin-top: 16px; margin-bottom: 16px; }
.save-title { font-size: 13px; font-weight: bold; color: #9ca3af; margin-bottom: 10px; text-align: center; }
.save-buttons-grid { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.label{ margin-bottom:8px; font-size:14px; opacity:0.8; }
input[type="text"], input[type="number"]{ width:100%; padding:12px; border:none; border-radius:12px; font-size:18px; box-sizing:border-box; margin-bottom:10px; background: white; color: black; }
.radio-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; background: #111827; padding: 12px; border-radius: 12px; }
.radio-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; }
.calib-container { background: #111827; padding: 12px; border-radius: 12px; margin-top: 10px; }
.calib-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: #3b82f6; font-weight: bold; }
input[type="range"] { width: 100%; margin: 5px 0; cursor: pointer; }
button{ width:100%; padding:14px; border:none; border-radius:16px; font-size:18px; font-weight:bold; cursor:pointer; margin-top:10px; }
.start{ background:#10b981; color:white; }
.stop{ background:#ef4444; color:white; }
.save-img, .save-video, .save-audio { flex: 1; min-width: 100px; padding: 10px 8px; font-size: 14px; border-radius: 12px; }
.save-img{ background:#3b82f6; color:white; }
.save-video{ background:#8b5cf6; color:white; display:none; }
.save-audio{ background:#ec4899; color:white; display:none; }
.meter{ height:28px; background:#111827; border-radius:999px; overflow:hidden; margin-top:10px; }
.bar{ height:100%; width:0%; background:linear-gradient(90deg,#22c55e,#eab308,#ef4444); }
.values{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; font-size:18px; }
canvas{ width:100%; background:#111827; border-radius:16px; margin-top:10px; }
.timer{ text-align:center; font-size:36px; font-weight:bold; }
</style>
</head>
<body>

<a href="index.html" class="back-to-menu">🏠 メニューへ戻る</a>
<div class="line-warning" id="lineWarning">⚠️ LINE等では録画不可。ブラウザで開き直してください。</div>

<div class="app">
    <h1>🎤 盛り上がりチェッカー</h1>
    <div class="card">
        <div class="label">プレイヤー名</div><input type="text" id="playerName" placeholder="名前">
        <div class="label">曲名</div><input type="text" id="songName" placeholder="曲名">
        <div class="label">制限時間(秒)</div><input type="number" id="timeInput" value="360">
        <div class="radio-container">
            <label class="radio-label"><input type="radio" name="modeSelect" value="video" checked> 📹 動画保存</label>
            <label class="radio-label"><input type="radio" name="modeSelect" value="audio"> 🎵 音声のみ</label>
            <label class="radio-label"><input type="radio" name="modeSelect" value="none"> 📊 測定のみ</label>
        </div>
        <button id="switchCamBtn">📷 カメラ切り替え</button>
        <div class="calib-container">
            <div class="calib-header"><span>🛠️ 感度補正</span><span id="calibVal">0 pt</span></div>
            <input type="range" id="calibSlider" min="-100" max="100" value="0" step="5">
        </div>
    </div>
    <div class="card">
        <div class="timer" id="timer">360</div>
        <div class="meter"><div class="bar" id="bar"></div></div>
        <div class="values">
            <div>現在: <span id="current">600</span> pt</div>
            <div>最大: <span id="max">600</span> pt</div>
            <div>平均: <span id="avg">600</span> pt</div>
            <div>時間: <span id="elapsed">0</span> 秒</div>
        </div>
    </div>
    <canvas id="graph" width="360" height="480"></canvas>
    <button class="start" id="startBtn">開始</button>
    <button class="stop" id="stopBtn">停止</button>
    <div class="save-container-box">
        <div class="save-title">💾 データの保存</div>
        <button class="save-img" id="saveImgBtn">画像保存</button>
        <button class="save-video" id="saveVideoBtn">動画保存</button>
        <button class="save-audio" id="saveAudioBtn">録音保存</button>
    </div>
</div>

<script>
let running = false, waveHistory = new Array(80).fill({high:600, low:600});
let prevRawTotal=500, maxVol=600, totalSum=0, count=0;
let ctx = document.getElementById("graph").getContext("2d");

function draw(data) {
    ctx.fillStyle = "#111827"; ctx.fillRect(0,0,360,480);
    ctx.strokeStyle = "#374151";
    [600,700,800,900,1000].forEach(s => {
        let y = 240 - (s-600)/400 * 200;
        ctx.strokeRect(0, y, 360, 0); ctx.strokeRect(0, 480-y, 360, 0);
    });
    data.forEach((v, i) => {
        ctx.fillStyle = "#f43f5e"; ctx.fillRect(i*4.5, 240 - (v.high-600)/400*200, 3, (v.high-600)/400*200);
        ctx.fillStyle = "#34d399"; ctx.fillRect(i*4.5, 240, 3, (v.low-600)/400*200);
    });
    // 上端/下端の数値表示
    ctx.fillStyle="#f43f5e"; ctx.fillText("High MAX/AVG", 10, 20);
    ctx.fillStyle="#34d399"; ctx.fillText("Low MAX/AVG", 10, 470);
}

async function loop() {
    if(!running) return;
    analyser.getByteFrequencyData(new Uint8Array(512)); // 省略形ロジック
    // ...計算と更新...
    document.getElementById("current").textContent = Math.floor(600 + Math.random()*400); // デモ用
    draw(waveHistory);
    requestAnimationFrame(loop);
}

document.getElementById("startBtn").onclick = () => { running = true; loop(); };
document.getElementById("stopBtn").onclick = () => running = false;
</script>
</body>
</html>
