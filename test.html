<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>早押しクイズ＆対戦メンバー分けシステム（3画面構成）</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 16px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    
    /* 上部テスト用画面切替ナビ */
    .view-nav { display: flex; gap: 8px; margin-bottom: 16px; background: #e9ecef; padding: 8px; border-radius: 8px; }
    .view-btn { flex: 1; padding: 10px; border: none; background: #fff; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .view-btn.active { background: #0d6efd; color: white; }

    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 24px; }
    .hidden { display: none; }
    label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 4px; }
    input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 12px; font-size: 16px; }
    button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; font-size: 15px; }

    /* バッジ */
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; }
    .team-個人 { background-color: #6c757d; }
    .team-チームA { background-color: #0d6efd; }
    .team-チームB { background-color: #dc3545; }
    .team-チームC { background-color: #198754; }
    .team-default { background-color: #0dcaf0; }

    /* 1. 参加者用画面（早押しボタン） */
    .buzzer-btn { width: 100%; height: 200px; border-radius: 50%; background: #dc3545; color: white; font-size: 32px; font-weight: bold; border: 8px solid #a71d2a; box-shadow: 0 8px 0 #72121c; cursor: pointer; margin-top: 20px; }
    .buzzer-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #72121c; }
    .buzzer-btn:disabled { background: #6c757d; border-color: #495057; box-shadow: none; cursor: not-allowed; }

    /* 2. 管理者用画面 */
    .participant-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .participant-chip { background: #f8f9fa; border: 1px solid #ddd; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; }
    .group-card { border: 1px solid #e0e0e0; background: #fafafa; padding: 12px; border-radius: 6px; margin-bottom: 12px; }
    .member-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: white; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 6px; cursor: pointer; }
    .member-item.selected { border: 2px solid #0d6efd; background-color: #e3f2fd; }

    /* 3. 演出用画面（モニター用） */
    .display-screen { background: #1a1a2e; color: #fff; padding: 30px; border-radius: 12px; text-align: center; min-height: 400px; }
    .buzzer-first { font-size: 48px; color: #ffcc00; margin: 20px 0; padding: 20px; border: 4px dashed #ffcc00; border-radius: 8px; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.02); } }
    .grid-matches { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; text-align: left; }
    .display-match-card { background: #16213e; border: 1px solid #0f3460; padding: 16px; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <!-- テスト用：画面切替ナビゲーション -->
  <div class="view-nav">
    <button class="view-btn active" onclick="switchView('participant')">📱 1. 参加者用（入室＆早押し）</button>
    <button class="view-btn" onclick="switchView('admin')">⚙️ 2. 管理者用（チーム＆対戦分け）</button>
    <button class="view-btn" onclick="switchView('display')">📺 3. 演出用（全体モニター）</button>
  </div>

  <!-- ================================================================= -->
  <!-- 画面 1: 参加者用ページ (部屋番号・名前・チーム選択・早押しボタン)   -->
  <!-- ================================================================= -->
  <div id="view-participant" class="card">
    <div id="participant-login-form">
      <h2>部屋に入室</h2>
      <form onsubmit="handleJoin(event)">
        <label>部屋番号</label>
        <input type="text" id="p-room" value="101" required>

        <label>お名前（ニックネーム）</label>
        <input type="text" id="p-name" placeholder="例: たろう" required>

        <label>所属チーム</label>
        <select id="p-team">
          <!-- JSで動的付与 -->
        </select>

        <button type="submit" style="width:100%; padding:12px; background:#0d6efd; color:#fff;">部屋に入る</button>
      </form>
    </div>

    <!-- 入室後の早押し画面 -->
    <div id="participant-buzzer-area" class="hidden" style="text-align: center;">
      <p style="font-size: 14px; color: #666;">
        部屋番号: <strong id="p-status-room">101</strong> | 
        名前: <strong id="p-status-name">-</strong> | 
        チーム: <span id="p-status-team-badge" class="badge team-個人">個人</span>
      </p>
      
      <h3>早押しボタン</h3>
      <button id="p-buzzer-btn" class="buzzer-btn" onclick="pressBuzzer()">PUSH!</button>
      <p id="p-buzzer-msg" style="margin-top: 12px; font-weight: bold; color: #28a745;"></p>
    </div>
  </div>

  <!-- ================================================================= -->
  <!-- 画面 2: 管理者用ページ (チーム設定・メンバー変更・メンバー分け・判定) -->
  <!-- ================================================================= -->
  <div id="view-admin" class="card hidden">
    <h2>管理者ダッシュボード</h2>

    <!-- 設定 ＆ 部屋フィルタ -->
    <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 16px;">
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 140px;">
          <label>管理対象の部屋番号</label>
          <input type="text" id="a-room-filter" value="101" oninput="renderApp()">
        </div>
        <div style="flex: 2; min-width: 200px;">
          <label>チーム選択肢の追加</label>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="a-new-team" placeholder="例: チームD" style="margin:0;">
            <button style="padding:0 16px; background:#6c757d; color:#fff;" onclick="addTeamOption()">追加</button>
          </div>
        </div>
      </div>
    </div>

    <!-- リアルタイム早押し判定状況 -->
    <div style="background:#fff3cd; border:1px solid #ffe69c; padding:12px; border-radius:6px; margin-bottom:16px;">
      <h4 style="margin:0 0 6px 0; color:#664d03;">⚡ 早押しリアルタイム着地情報</h4>
      <p id="a-buzzer-result" style="margin:0; font-weight:bold; color:#856404;">まだ誰も押していません</p>
      <button style="margin-top:8px; padding:4px 8px; background:#dc3545; color:#fff; font-size:12px;" onclick="resetBuzzer()">早押しリセット</button>
    </div>

    <!-- 参加者一覧 ＆ チーム変更 -->
    <h3>部屋 <span id="a-display-room">101</span> の入室者 (<span id="a-participant-count">0</span>名)</h3>
    <div id="a-participant-list" class="participant-list"></div>

    <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

    <!-- 対戦分けコントロール -->
    <h3>対戦メンバー分け（1戦完結）</h3>
    <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;">
      <div style="width: 140px;">
        <label>1対戦の定員</label>
        <select id="a-capacity" style="margin:0;">
          <option value="2">2人 (1v1)</option>
          <option value="3">3人</option>
          <option value="4" selected>4人 (グループ)</option>
        </select>
      </div>
      <div style="align-self: flex-end;">
        <button style="padding:10px 16px; background:#198754; color:#fff;" onclick="generateMatches()">🎲 シャッフル対戦作成</button>
      </div>
    </div>

    <!-- スワップ可能な対戦分け結果 -->
    <div id="a-match-results"></div>
  </div>

  <!-- ================================================================= -->
  <!-- 画面 3: 演出用ページ (スクリーン・大画面モニター用)                 -->
  <!-- ================================================================= -->
  <div id="view-display" class="card hidden" style="background:transparent; padding:0; box-shadow:none;">
    <div class="display-screen">
      <h2 style="margin:0; color:#8a99ad; font-size:20px;">部屋 <span id="d-room-no">101</span> 対戦モニター</h2>
      
      <!-- 早押しランプ表示 -->
      <div id="d-buzzer-container">
        <div class="buzzer-first">
          <span style="font-size: 20px; display:block; color:#aaa;">FIRST PRESS</span>
          <span id="d-first-name">待機中...</span>
          <span id="d-first-team" class="badge team-個人" style="font-size:16px; vertical-align:middle;">-</span>
        </div>
      </div>

      <!-- 決定された対戦分け一覧表示 -->
      <h3 style="text-align:left; border-bottom:1px solid #0f3460; padding-bottom:8px; margin-top:30px;">本日の対戦組み合わせ</h3>
      <div id="d-match-grid" class="grid-matches">
        <p style="color:#666;">対戦分けが作成されるとここに表示されます</p>
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // アプリケーション状態 (メモリ同期)
  // ==========================================
  let teamOptions = ['個人', 'チームA', 'チームB', 'チームC'];
  let participants = []; // { id, roomNo, name, team }
  let currentParticipantId = null;
  let matchGroups = [];  // { id, name, members: [] }
  let selectedSwapTarget = null; // { groupId, memberIndex }
  let firstBuzzerUser = null; // 早押し1位のデータ

  window.onload = () => {
    updateTeamDropdown();
    renderApp();
  };

  // 画面表示切り替え (テスト用タブ)
  function switchView(viewName) {
    document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('view-participant').classList.add('hidden');
    document.getElementById('view-admin').classList.add('hidden');
    document.getElementById('view-display').classList.add('hidden');

    if (viewName === 'participant') {
      document.querySelectorAll('.view-btn')[0].classList.add('active');
      document.getElementById('view-participant').classList.remove('hidden');
    } else if (viewName === 'admin') {
      document.querySelectorAll('.view-btn')[1].classList.add('active');
      document.getElementById('view-admin').classList.remove('hidden');
    } else {
      document.querySelectorAll('.view-btn')[2].classList.add('active');
      document.getElementById('view-display').classList.add('hidden');
      document.getElementById('view-display').classList.remove('hidden');
    }
    renderApp();
  }

  // チーム選択肢の描画
  function updateTeamDropdown() {
    const select = document.getElementById('p-team');
    select.innerHTML = teamOptions.map(t => `<option value="${t}">${t}</option>`).join('');
  }

  // チーム追加 (管理者)
  function addTeamOption() {
    const input = document.getElementById('a-new-team');
    const val = input.value.trim();
    if (val && !teamOptions.includes(val)) {
      teamOptions.push(val);
      updateTeamDropdown();
      renderApp();
      input.value = '';
    }
  }

  // 参加者入室処理
  function handleJoin(e) {
    e.preventDefault();
    const roomNo = document.getElementById('p-room').value.trim();
    const name = document.getElementById('p-name').value.trim();
    const team = document.getElementById('p-team').value;

    const newParticipant = {
      id: 'user_' + Date.now(),
      roomNo, name, team
    };

    participants.push(newParticipant);
    currentParticipantId = newParticipant.id;

    // 早押し画面へ表示切替
    document.getElementById('participant-login-form').classList.add('hidden');
    document.getElementById('participant-buzzer-area').classList.remove('hidden');

    document.getElementById('p-status-room').innerText = roomNo;
    document.getElementById('p-status-name').innerText = name;
    
    const badge = document.getElementById('p-status-team-badge');
    badge.innerText = team;
    badge.className = `badge ${getTeamBadgeClass(team)}`;

    renderApp();
  }

  // 早押しボタン押下
  function pressBuzzer() {
    if (firstBuzzerUser) return; // 既に誰かが押していれば無効

    const me = participants.find(p => p.id === currentParticipantId);
    if (!me) return;

    firstBuzzerUser = me;
    document.getElementById('p-buzzer-msg').innerText = 'ランプが点灯しました！(1番目)';
    document.getElementById('p-buzzer-btn').disabled = true;

    renderApp();
  }

  // 早押しリセット (管理者)
  function resetBuzzer() {
    firstBuzzerUser = null;
    document.getElementById('p-buzzer-msg').innerText = '';
    document.getElementById('p-buzzer-btn').disabled = false;
    renderApp();
  }

  // チームバッジ色切り替え
  function getTeamBadgeClass(team) {
    if (['個人', 'チームA', 'チームB', 'チームC'].includes(team)) return `team-${team}`;
    return 'team-default';
  }

  // アプリ全体の描画更新
  function renderApp() {
    const targetRoom = document.getElementById('a-room-filter').value.trim();
    const roomParticipants = participants.filter(p => p.roomNo === targetRoom);

    // --- 管理者画面の描画 ---
    document.getElementById('a-display-room').innerText = targetRoom;
    document.getElementById('a-participant-count').innerText = roomParticipants.length;

    // 参加者リスト & チーム変更
    const aList = document.getElementById('a-participant-list');
    if (roomParticipants.length === 0) {
      aList.innerHTML = '<p style="color:#888; margin:0;">入室者が居ません</p>';
    } else {
      aList.innerHTML = roomParticipants.map(p => {
        const opts = teamOptions.map(t => `<option value="${t}" ${t===p.team?'selected':''}>${t}</option>`).join('');
        return `
          <div class="participant-chip">
            <strong>${p.name}</strong>
            <span class="badge ${getTeamBadgeClass(p.team)}">
              <select onchange="updateParticipantTeam('${p.id}', this.value)" style="border:none; background:transparent; color:#fff; font-weight:bold;">
                ${opts}
              </select>
            </span>
          </div>
        `;
      }).join('');
    }

    // 早押し判定表示
    const aBuzzerRes = document.getElementById('a-buzzer-result');
    if (firstBuzzerUser && firstBuzzerUser.roomNo === targetRoom) {
      aBuzzerRes.innerHTML = `🎉 1番目: <strong>${firstBuzzerUser.name}</strong> (${firstBuzzerUser.team})`;
    } else {
      aBuzzerRes.innerText = 'まだ誰も押していません';
    }

    renderMatchResultsAdmin();

    // --- 演出用画面（モニター）の描画 ---
    document.getElementById('d-room-no').innerText = targetRoom;
    if (firstBuzzerUser && firstBuzzerUser.roomNo === targetRoom) {
      document.getElementById('d-first-name').innerText = firstBuzzerUser.name;
      const dTeam = document.getElementById('d-first-team');
      dTeam.innerText = firstBuzzerUser.team;
      dTeam.className = `badge ${getTeamBadgeClass(firstBuzzerUser.team)}`;
    } else {
      document.getElementById('d-first-name').innerText = '待機中...';
      document.getElementById('d-first-team').innerText = '-';
      document.getElementById('d-first-team').className = 'badge team-個人';
    }

    const dGrid = document.getElementById('d-match-grid');
    if (matchGroups.length === 0) {
      dGrid.innerHTML = '<p style="color:#666;">対戦分けが作成されるとここに表示されます</p>';
    } else {
      dGrid.innerHTML = matchGroups.map(g => `
        <div class="display-match-card">
          <h4 style="margin:0 0 8px 0; color:#ffcc00; border-bottom:1px solid #333; padding-bottom:4px;">${g.name}</h4>
          ${g.members.map(m => `
            <div style="margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:18px; font-weight:bold;">${m.name}</span>
              <span class="badge ${getTeamBadgeClass(m.team)}">${m.team}</span>
            </div>
          `).join('')}
        </div>
      `).join('');
    }
  }

  // 管理者によるチーム変更
  function updateParticipantTeam(pId, newTeam) {
    const target = participants.find(p => p.id === pId);
    if (target) {
      target.team = newTeam;
      // 対戦表内も更新
      matchGroups.forEach(g => {
        g.members.forEach(m => { if (m.id === pId) m.team = newTeam; });
      });
      renderApp();
    }
  }

  // 1戦完結対戦シャッフル作成
  function generateMatches() {
    const targetRoom = document.getElementById('a-room-filter').value.trim();
    const roomParticipants = participants.filter(p => p.roomNo === targetRoom);

    if (roomParticipants.length === 0) {
      alert('該当の部屋に参加者がいません。');
      return;
    }

    const cap = parseInt(document.getElementById('a-capacity').value, 10);
    const shuffled = [...roomParticipants].sort(() => Math.random() - 0.5);

    matchGroups = [];
    let gIdx = 1;
    for (let i = 0; i < shuffled.length; i += cap) {
      matchGroups.push({
        id: `g_${gIdx}`,
        name: `対戦 ${gIdx}`,
        members: shuffled.slice(i, i + cap)
      });
      gIdx++;
    }

    selectedSwapTarget = null;
    renderApp();
  }

  // 手動スワップ（入れ替え）
  function handleMemberClick(groupId, memberIndex) {
    if (!selectedSwapTarget) {
      selectedSwapTarget = { groupId, memberIndex };
    } else if (selectedSwapTarget.groupId === groupId && selectedSwapTarget.memberIndex === memberIndex) {
      selectedSwapTarget = null;
    } else {
      const src = matchGroups.find(g => g.id === selectedSwapTarget.groupId);
      const tgt = matchGroups.find(g => g.id === groupId);

      const temp = src.members[selectedSwapTarget.memberIndex];
      src.members[selectedSwapTarget.memberIndex] = tgt.members[memberIndex];
      tgt.members[memberIndex] = temp;

      selectedSwapTarget = null;
    }
    renderApp();
  }

  // 管理者対戦分け描画
  function renderMatchResultsAdmin() {
    const container = document.getElementById('a-match-results');
    if (matchGroups.length === 0) {
      container.innerHTML = '';
      return;
    }

    container.innerHTML = '<h4>対戦組み（枠をタップして手動スワップできます）</h4>' +
      matchGroups.map(g => {
        const membersHtml = g.members.map((m, idx) => {
          const isSel = selectedSwapTarget && selectedSwapTarget.groupId === g.id && selectedSwapTarget.memberIndex === idx;
          return `
            <div class="member-item ${isSel ? 'selected' : ''}" onclick="handleMemberClick('${g.id}', ${idx})">
              <div>
                <span class="badge ${getTeamBadgeClass(m.team)}">${m.team}</span>
                <strong style="margin-left: 6px;">${m.name}</strong>
              </div>
              <small style="color:${isSel?'#0d6efd':'#888'}; font-weight:bold;">
                ${isSel ? '選択中' : '選択'}
              </small>
            </div>
          `;
        }).join('');

        return `<div class="group-card"><h4 style="margin:0 0 8px 0;">${g.name}</h4>${membersHtml}</div>`;
      }).join('');
  }
</script>

</body>
</html>
