<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一画千点！曲名クイズ</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root {
  --bg-color: #0b0c10;
  --card-bg: #1f2833;
  --text-color: #c5c6c7;
  --accent-blue: #66fcf1;
  --title-color: #a8dadc;
  --border-radius: 8px;
  --font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", sans-serif;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: var(--font-family);
  text-align: center;
  padding: 10px;
  margin: 0;
}

h1 {
  font-size: 1.8rem;
  margin: 15px 0 10px 0;
  color: var(--title-color);
  text-shadow: 0 0 10px rgba(168, 218, 220, 0.6);
}

hr {
  border: 0;
  height: 1px;
  background: #333;
  margin: 15px 0;
}

.app-card {
  background: var(--card-bg);
  padding: 15px;
  border-radius: var(--border-radius);
  max-width: 420px;
  margin: 0 auto 15px auto;
  box-sizing: border-box;
}

#container {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  flex-wrap: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  margin: 15px auto;
  padding: 10px;
  background: #121212;
  border-radius: var(--border-radius);
  min-height: 85px;
  max-width: 100%;
  box-sizing: border-box;
  -webkit-overflow-scrolling: touch;
}

#container::-webkit-scrollbar {
  height: 6px;
}
#container::-webkit-scrollbar-thumb {
  background: #444;
  border-radius: 3px;
}

svg {
  width: 65px;
  height: 65px;
  margin: 0 4px;
  flex-shrink: 0;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-bottom: 10px;
}

button {
  font-size: 0.95rem;
  font-weight: bold;
  padding: 10px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  min-width: 90px;
}
button:active {
  transform: scale(0.95);
}

.btn-nav { background: #4a4e69; color: #fff; }
.btn-action { background: #343a40; color: #fff; }
.btn-reveal { background: #e63946; color: #fff; }
.btn-submit { background: #198754; color: #fff; width: 100%; max-width: 260px; margin: 8px auto; display: block;}
.btn-reset { background: #6c757d; color: #fff; }
.btn-menu { background: #2b2d42; color: var(--text-color); min-width: 120px; text-decoration: none; display: inline-block; padding: 10px 14px; border-radius: 6px; font-weight: bold; font-size: 0.95rem;}
.btn-toggle { background: #5c5d63; color: #fff; font-size: 0.85rem; padding: 6px 12px; }

input {
  font-size: 1.1rem;
  padding: 10px;
  margin-top: 5px;
  width: 100%;
  max-width: 260px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #000;
  color: #fff;
  box-sizing: border-box;
  text-align: center;
}

.db-input {
  width: 45%;
  font-size: 0.95rem;
  padding: 8px;
  margin: 5px 2px;
}

#result {
  margin-top: 10px;
  font-size: 1.1rem;
  font-weight: bold;
  min-height: 24px;
}

#scoreBox {
  margin: 10px 0;
  font-size: 1.4rem;
  font-weight: bold;
  color: var(--accent-blue);
  text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
}

#questionCounter {
  font-size: 0.9rem;
  color: #aaa;
  margin-bottom: 5px;
}

.rules-container, .history-container {
  font-size: 0.9rem;
  color: #aaa;
  line-height: 1.6;
  padding: 15px;
  text-align: left;
  max-width: 420px;
  margin: 15px auto 10px auto;
  background: var(--card-bg);
  border-radius: var(--border-radius);
  box-sizing: border-box;
}
.rules-container b, .history-container b {
  color: #fff;
}

.history-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 0.85rem;
  color: var(--text-color);
}
.history-table th, .history-table td {
  border: 1px solid #444;
  padding: 6px;
  text-align: center;
}
.history-table th { background: #121212; }

.hidden-element {
  display: none !important;
}
.admin-section {
  margin-top: 30px;
  padding: 10px;
  border: 1px dashed #555;
  border-radius: var(--border-radius);
  max-width: 420px;
  margin-left: auto;
  margin-right: auto;
}
</style>
</head>
<body>

<hr style="margin-top:10px;">

<h1>一画千点！曲名クイズ</h1>

<div class="app-card">
  <div id="questionCounter">第 1 / 20 問</div>

  <div class="button-row">
    <button id="nextQuestionBtn" class="btn-nav hidden-element" onclick="nextQuestion()">次の問題へ</button>
  </div>

  <div id="container"></div>

  <div class="button-row">
    <button class="btn-action" onclick="nextStep()">次の一画</button>
  </div>
  
  <div id="quizFormArea">
    <input id="answerInput" placeholder="曲名を入力">
    <button class="btn-submit" onclick="checkAnswer()">回答</button>
  </div>

  <div id="finalResultArea" class="hidden-element" style="border: 1px dashed var(--accent-blue); padding: 10px; border-radius: 6px; margin-top: 10px;">
    <h3 style="color:var(--accent-blue); margin:5px 0;">🎉 全問題終了！ 🎉</h3>
    <div id="evaluationText" style="font-size:1.2rem; font-weight:bold; margin-bottom:10px;"></div>
    
    <input id="roomNameInput" class="db-input" placeholder="ルーム名を入力">
    <input id="playerNameInput" class="db-input" placeholder="お名前を入力">
    <button class="btn-submit" style="background:#198754; margin:10px auto 0 auto;" onclick="saveToFirebase()">結果をオンライン保存</button>
  </div>

  <div id="result"></div>
  <div id="scoreBox">得点：0</div>
</div>

<button class="btn-toggle" onclick="toggleHistory()">前回結果（履歴）を表示/非表示</button>
<div id="historySection" class="history-container hidden-element">
  <b>📊 前回結果（最新5件）</b>
  <table class="history-table">
    <thead>
      <tr>
        <th>ルーム</th>
        <th>名前</th>
        <th>得点</th>
        <th>評価</th>
      </tr>
    </thead>
    <tbody id="historyTableBody">
      <tr><td colspan="4">データを読み込み中...</td></tr>
    </tbody>
  </table>
</div>

<br>

<button class="btn-toggle" onclick="toggleRules()">遊び方を表示/非表示</button>
<div id="rulesSection" class="rules-container hidden-element">
  <b>■遊び方</b><br>
  画面に表示される“一画ずつの漢字”から曲名を当てるゲームです。<br>
  分かったら曲名を入力して回答してください。
  <br><br>
  <b>■点数配分</b><br>
  ・1画目で正解：<b>1000点</b><br>
  ・2画目で正解：<b>500点</b><br>
  ・3画目で正解：<b>250点</b><br>
  ・4画目で正解：<b>100点</b><br>
  ・それ以降：<b>0点</b>
  <br><br>
  <b>■補足</b><br>
  ・Enterキー：回答<br>
  ・スペースキー：次の一画
</div>

<div class="button-row" style="margin-top: 15px;">
  <button class="btn-reset" onclick="resetScore()">リセット</button>
  <a href="index.html" class="btn-menu">📘 メニュー</a>
</div>

<div class="admin-section">
  <button class="btn-toggle" style="background:#222;" onclick="toggleAdmin()">⚙️ 管理者機能を表示/非表示</button>
  <div id="adminCommands" class="hidden-element" style="margin-top:10px;">
    <div class="button-row">
      <button class="btn-nav" onclick="prevQuestion()">前の問題</button>
      <button class="btn-action" onclick="prevStep()">1画戻る</button>
      <button class="btn-reveal" onclick="revealAll()">答え（全表示）</button>
    </div>
  </div>
</div>

<script>
// ■ Firebaseの設定と初期化
const firebaseConfig = {
  apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
  authDomain: "gamehistory-m84.firebaseapp.com",
  databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
  projectId: "gamehistory-m84",
  storageBucket: "gamehistory-m84.firebasestorage.app",
  messagingSenderId: "475761727837",
  appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
  measurementId: "G-3636W6LC4F"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const DB_PREFIX = "KAKU_"; 

// 指定された20曲の新しいリスト
const questions = [
  "怪獣の花唄", "最後の雨", "蕾", "居酒屋",
  "夏色", "栄光の架橋", "天体観測", "月光花",
  "踊", "燦然", "雪の華", "前前前世",
  "紅蓮華", "残響散歌", "恋音と雨空", "流星",
  "革命道中", "睡蓮花", "常緑", "情熱の薔薇"
];

let questionOrder = []; // ランダムな出題順序を管理する配列
let gameProgressIndex = 0; // 現在何問目か（0～19）
let currentAnswer = "";
let strokeGroups = [];
let step = 0;
let score = 0;
let hasAnsweredCurrent = false;

// ■ 出題順序をランダムにシャッフルする関数（フィッシャー–イェーツのシャッフル）
function shuffleQuestions() {
  questionOrder = [];
  for (let i = 0; i < questions.length; i++) {
    questionOrder.push(i);
  }
  for (let i = questionOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [questionOrder[i], questionOrder[j]] = [questionOrder[j], questionOrder[i]];
  }
}

function normalize(str) {
  return str.replace(/\s/g,"").toLowerCase();
}

function calculateScore() {
  if (step <= 1) return 1000;
  if (step === 2) return 500;
  if (step === 3) return 250;
  if (step === 4) return 100;
  return 0;
}

function getEvaluation(totalScore) {
  if (totalScore >= 15000) return "神レベル（SSS）";
  if (totalScore >= 10000) return "達人（S）";
  if (totalScore >= 6000) return "玄人（A）";
  if (totalScore >= 3000) return "普通（B）";
  return "見習い（C）";
}

function checkAnswer() {
  const input = document.getElementById("answerInput").value;
  
  if (normalize(input) === normalize(currentAnswer)) {
    let point = calculateScore();
    score += point;
    updateScore();
    document.getElementById("result").innerHTML = "<span style='color:#198754;'>正解！ +" + point + "点</span>";
  } else {
    document.getElementById("result").innerHTML = "<span style='color:#e63946;'>不正解…（正解: " + currentAnswer + "）</span>";
  }

  hasAnsweredCurrent = true;

  // 全20問終了したか判定
  if (gameProgressIndex >= questions.length) {
    showFinalResult();
  } else {
    document.getElementById("nextQuestionBtn").classList.remove("hidden-element");
  }
}

function updateScore() {
  document.getElementById("scoreBox").innerText = "得点：" + score;
}

function resetScore() {
  score = 0;
  gameProgressIndex = 0;
  updateScore();
  document.getElementById("result").innerText = "";
  document.getElementById("quizFormArea").classList.remove("hidden-element");
  document.getElementById("finalResultArea").classList.add("hidden-element");
  shuffleQuestions(); // 新しくシャッフル
  nextQuestion();
}

async function nextQuestion() {
  if (gameProgressIndex >= questions.length) return;
  
  hasAnsweredCurrent = false;
  document.getElementById("nextQuestionBtn").classList.add("hidden-element");
  
  document.getElementById("questionCounter").innerText = "第 " + (gameProgressIndex + 1) + " / " + questions.length + " 問";
  
  // シャッフルされた順序から元配列のインデックスを引く
  const actualQuestionIndex = questionOrder[gameProgressIndex];
  loadQuestion(actualQuestionIndex);
  
  gameProgressIndex++;
}

function prevQuestion() {
  if (gameProgressIndex <= 1) return;
  gameProgressIndex -= 2;
  nextQuestion();
}

async function loadQuestion(index) {
  const container = document.getElementById("container");
  container.innerHTML = "";
  strokeGroups = [];
  step = 0;

  currentAnswer = questions[index];
  document.getElementById("answerInput").value = "";
  document.getElementById("result").innerText = "";

  for (let char of currentAnswer) {
    const code = char.charCodeAt(0).toString(16);
    const url = "https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/" + code.padStart(5, "0") + ".svg";

    try {
      const res = await fetch(url);
      const text = await res.text();

      const wrapper = document.createElement("div");
      wrapper.innerHTML = text;
      const svg = wrapper.querySelector("svg");

      if (!svg) continue;

      const paths = svg.querySelectorAll("path");
      let group = [];

      paths.forEach(p=>{
        p.style.display="none";
        p.style.stroke="#ffffff";
        p.style.fill="none";
        p.style.strokeWidth=4;
        group.push(p);
      });

      strokeGroups.push(group);
      container.appendChild(svg);
    } catch {}
  }
}

function nextStep() {
  strokeGroups.forEach(g=>{
    if(step<g.length) g[step].style.display="block";
  });
  step++;
}

function prevStep() {
  if(step<=0)return;
  step--;
  strokeGroups.forEach(g=>{
    if(step<g.length) g[step].style.display="none";
  });
}

function revealAll() {
  strokeGroups.forEach(g=>{
    g.forEach(p=>p.style.display="block");
  });
}

function showFinalResult() {
  document.getElementById("quizFormArea").classList.add("hidden-element");
  document.getElementById("nextQuestionBtn").classList.add("hidden-element");
  
  const evalStr = getEvaluation(score);
  document.getElementById("evaluationText").innerHTML = "合計スコア: <span style='color:var(--accent-blue);'>" + score + "点</span><br>評価: " + evalStr;
  document.getElementById("finalResultArea").classList.remove("hidden-element");
}

function saveToFirebase() {
  const room = document.getElementById("roomNameInput").value.trim();
  const name = document.getElementById("playerNameInput").value.trim();
  
  if(!room || !name) {
    alert("ルーム名とお名前を入力してください。");
    return;
  }

  const evalStr = getEvaluation(score);
  
  db.ref(DB_PREFIX + "results").push({
    roomName: room,
    playerName: name,
    finalScore: score,
    evaluation: evalStr,
    timestamp: firebase.database.ServerValue.TIMESTAMP
  }).then(() => {
    alert("結果をオンラインに保存しました！");
    loadHistory(); 
  }).catch((error) => {
    alert("保存に失敗しました: " + error.message);
  });
}

function loadHistory() {
  const tbody = document.getElementById("historyTableBody");
  
  db.ref(DB_PREFIX + "results").orderByChild("timestamp").limitToLast(5).once("value", (snapshot) => {
    tbody.innerHTML = "";
    if(!snapshot.exists()) {
      tbody.innerHTML = "<tr><td colspan='4'>履歴データはありません。</td></tr>";
      return;
    }
    
    let rows = [];
    snapshot.forEach((child) => {
      const data = child.val();
      rows.unshift(`
        <tr>
          <td>${escapeHtml(data.roomName)}</td>
          <td>${escapeHtml(data.playerName)}</td>
          <td style="color:var(--accent-blue); font-weight:bold;">${data.finalScore}</td>
          <td>${escapeHtml(data.evaluation)}</td>
        </tr>
      `);
    });
    tbody.innerHTML = rows.join("");
  });
}

function escapeHtml(str) {
  if(!str) return "";
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toggleRules() {
  document.getElementById("rulesSection").classList.toggle("hidden-element");
}
function toggleHistory() {
  const sec = document.getElementById("historySection");
  sec.classList.toggle("hidden-element");
  if(!sec.classList.contains("hidden-element")) {
    loadHistory();
  }
}
function toggleAdmin() {
  document.getElementById("adminCommands").classList.toggle("hidden-element");
}

document.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    if(!hasAnsweredCurrent && gameProgressIndex <= questions.length) {
      checkAnswer();
    }
  }
  if(e.code==="Space"){
    e.preventDefault();
    nextStep();
  }
});

// アプリ起動時の初期化
shuffleQuestions(); 
loadHistory();
nextQuestion();
</script>

</body>
</html>
