<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カラオケビンゴ！</title>
<style>
  :root {
    /* ── 画面全体の背景（サイバー空間をイメージした深紫） ── */
    --bg-color: #120826;
    --card-bg: #1f2833;
    --text-color: #c5c6c7;
    --title-color: #a8dadc;
    
    /* ── ゲーム進行中のネオンエフェクト ── */
    --accent-blue: #00f2fe;   /* 通常ヒット枠（ネオンブルー） */
    --accent-yellow: #ffea00; /* リーチ枠（ネオンイエロー） */
    --accent-red: #ff0055;    /* ビンゴ成立枠（ネオンレッド） */
    
    /* ── カードの縁：極細の超高輝度ミントグリーンネオン ── */
    --neon-edge: #00f5d4; 

    /* ── 各行の【ネオン枠線・文字】と【マス内側のパステル色】 ── */
    --row1-border: #ff2a5f; --row1-bg: #2d1219; /* 1行目：レッド */
    --row2-border: #00b4d8; --row2-bg: #0b2230; /* 2行目：ブルー */
    --row3-border: #ffdf00; --row3-bg: #2d2a0b; /* 3行目：イエロー */
    --row4-border: #00f5d4; --row4-bg: #092b25; /* 4行目：グリーン */
    --row5-border: #ff7000; --row5-bg: #30190b; /* 5行目：オレンジ */

    --border-radius: 10px;
    --font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 50%, #251245 0%, #120826 70%);
    color: var(--text-color);
    font-family: var(--font-family);
    text-align: center;
    padding: 10px;
    margin: 0;
    min-height: 100vh;
  }

  h1 { 
    font-size: 2rem; 
    margin: 15px 0 10px 0; 
    color: var(--title-color);
    text-shadow: 0 0 10px rgba(168, 218, 220, 0.6); 
  }

  .controls-group {
    background: rgba(31, 40, 51, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 15px;
    border-radius: 8px;
    max-width: 480px;
    margin: 0 auto 15px auto;
    box-sizing: border-box;
    transition: all 0.3s ease;
  }

  .select-row {
    margin-bottom: 10px;
  }

  select, input {
    font-size: 1rem;
    padding: 8px;
    margin: 4px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #000;
    color: #fff;
    box-sizing: border-box;
  }

  .score-config-area {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0;
  }

  #scoreRangeBox {
    font-size: 0.95rem;
    color: #aaa;
  }
  #scoreRangeBox input { width: 65px; }

  /* ── 新設：フリー切替ボタンのデザイン ── */
  #freeToggleBtn {
    font-size: 0.85rem;
    padding: 6px 12px;
    min-width: auto;
    border-radius: 20px;
    background: #212529;
    color: #ff0055;
    border: 1px solid #ff0055;
    box-shadow: 0 0 8px rgba(255, 0, 85, 0.2);
  }
  #freeToggleBtn.active {
    background: #ff0055;
    color: #fff;
    box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
  }
  #freeToggleBtn:disabled {
    background: #333 !important;
    color: #666 !important;
    border-color: #444 !important;
    box-shadow: none !important;
    cursor: not-allowed;
  }

  .button-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 5px;
  }

  button {
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    min-width: 90px;
  }
  button:active { transform: scale(0.98); }

  #randomBtn { background: #4a4e69; color: #fff; }
  #startBtn { background: #198754; color: #fff; }
  #resetBtn { background: #6c757d; color: #fff; }
  
  .btn-menu { 
    background: #343a40; 
    color: var(--text-color); 
    min-width: 140px;
    margin-top: 15px;
    display: inline-block;
  }
  button:disabled { background: #333 !important; color: #555 !important; cursor: not-allowed; }

  /* ── ビンゴカード全体の背景枠 ── */
  #board {
    margin: 25px auto;
    display: grid;
    gap: 10px;
    max-width: 100%;
    width: 330px;
    box-sizing: border-box;
    padding: 16px;
    border-radius: 20px;

    /* 白ベースに各行の色を縦にうっすらとグラデーション */
    background: linear-gradient(to bottom, 
      #fff2f4 0%,   
      #f2f8ff 25%,  
      #fffdeb 50%,  
      #f0fffb 75%,  
      #fff6f0 100%  
    ); 

    /* 極細（1px）の緑ネオン枠と、クッキリとした発光シャドウ */
    border: 1px solid var(--neon-edge);
    box-shadow: 
      0 0 15px rgba(0, 245, 212, 0.6), 
      inset 0 0 10px rgba(0, 245, 212, 0.2),
      0 20px 40px rgba(0,0,0,0.7);
    
    /* 3D傾きエフェクト */
    transform: perspective(800px) rotateX(4deg) rotateY(-2deg);
  }

  /* ── 各マスの基本スタイル ── */
  .cell {
    border-radius: var(--border-radius);
    min-height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 900;
    padding: 6px;
    word-break: break-word;
    box-sizing: border-box;
    position: relative;
    transition: all 0.25s ease;
    
    /* 立体的に沈み込んで見える内側シャドウ */
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.2);
    text-shadow: 0 0 6px currentColor;
  }

  /* ── 行（横ライン）ごとのネオン管デザイン ── */
  .r1 { border: 2.5px solid var(--row1-border); color: var(--row1-border); background: var(--row1-bg); box-shadow: inset 0 0 8px rgba(255,42,95,0.3), 0 0 8px rgba(255,42,95,0.4); }
  .r2 { border: 2px solid var(--row2-border); color: var(--row2-border); background: var(--row2-bg); box-shadow: inset 0 0 8px rgba(0,180,216,0.3), 0 0 8px rgba(0,180,216,0.4); }
  .r3 { border: 2.5px solid var(--row3-border); color: var(--row3-border); background: var(--row3-bg); box-shadow: inset 0 0 8px rgba(255,223,0,0.3), 0 0 8px rgba(255,223,0,0.4); }
  .r4 { border: 2px solid var(--row4-border); color: var(--row4-border); background: var(--row4-bg); box-shadow: inset 0 0 8px rgba(0,245,148,0.3), 0 0 8px rgba(0,245,148,0.4); }
  .r5 { border: 2.5px solid var(--row5-border); color: var(--row5-border); background: var(--row5-bg); box-shadow: inset 0 0 8px rgba(255,112,0,0.3), 0 0 8px rgba(255,112,0,0.4); }
  .r-default { border: 2.5px solid var(--row5-border); color: var(--row5-border); background: var(--row5-bg); box-shadow: inset 0 0 8px rgba(255,112,0,0.3), 0 0 8px rgba(255,112,0,0.4); }

  /* FREEマスの特別デザイン ── */
  .free-cell {
    font-size: 0.8rem !important;
    line-height: 1.2;
  }
  .free-cell span {
    font-size: 1.4rem;
    display: block;
    margin-bottom: -2px;
  }

  .editable:hover { 
    outline: none;
    border-color: #fff !important; 
    box-shadow: 0 0 8px #fff;
  }

  /* ── ヒット時（選択）は「漆黒背景×白文字×ネオンブルー枠」 ── */
  .hit {
    background: #000000 !important; 
    color: #ffffff !important;
    border: 2.5px solid var(--accent-blue) !important;
    transform: scale(1.03) !important;
    text-shadow: 0 0 8px #ffffff, 0 0 15px var(--accent-blue) !important;
    box-shadow: 0 0 15px var(--accent-blue), inset 0 0 8px rgba(255,255,255,0.2) !important;
    z-index: 2;
  }

  /* リーチ状態の枠：ネオンイエロー */
  .cell.reach {
    border-color: var(--accent-yellow) !important;
    box-shadow: 0 0 15px rgba(255, 234, 0, 0.9), inset 0 0 8px rgba(255, 234, 0, 0.4) !important;
    text-shadow: 0 0 8px #ffffff, 0 0 15px var(--accent-yellow) !important;
  }

  /* ビンゴ達成ラインの枠：ネオンレッド */
  .cell.bingo-line {
    background: #a3cfbb !important; 
    color: #000000 !important;
    border-color: var(--accent-red) !important;
    box-shadow: 0 0 18px rgba(255, 0, 85, 1) !important;
    text-shadow: none !important;
    animation: pulseRed 1.5s infinite alternate;
  }

  @keyframes pulseRed {
    0% { box-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
    100% { box-shadow: 0 0 20px rgba(255, 0, 85, 1); }
  }

  /* ビンゴ情報バナー */
  #bingoBanner {
    margin: 10px 0 15px 0;
    font-size: 2.3rem;
    font-weight: 900;
    color: var(--accent-red);
    text-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
    display: none;
    animation: bingoPop 0.3s ease-out;
  }
  @keyframes bingoPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  #rules {
    margin: 20px auto 10px auto;
    max-width: 420px;
    text-align: left;
    background: rgba(31, 40, 51, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 15px;
    border-radius: 8px;
    font-size: 0.9rem;
    line-height: 1.6;
    color: #aaa;
    box-sizing: border-box;
  }
  #rules b { color: #fff; }
</style>
</head>
<body>

<h1>カラオケBINGO！</h1>

<div class="controls-group">
  <div id="hideSetupContainer">
    <div class="select-row">
      <select id="mode">
        <option value="score">点数ビンゴ</option>
        <option value="word">漢字ビンゴ</option>
      </select>

      <select id="sizeSelect">
        <option value="4">4×4（16マス）</option>
        <option value="5" selected>5×5（25マス）</option>
        <option value="6">6×6（36マス）</option>
      </select>
    </div>

    <div class="score-config-area">
      <span id="scoreRangeBox">
        最低点 <input id="minScore" type="number" value="80"> 最高点 <input id="maxScore" type="number" value="99"> </span>
      <button id="freeToggleBtn" type="button">FREE中央マス：無効</button>
    </div>
  </div>

  <div class="button-row">
    <button id="randomBtn">ランダム生成</button>
    <button id="startBtn">START</button>
    <button id="resetBtn">リセット</button>
  </div>
</div>

<div id="bingoBanner">BINGO！！</div>

<div id="board"></div>

<div id="rules">
  <b>【遊び方】</b><br>
  ・点数ビンゴ or 漢字ビンゴを選びます。<br>
  ・マス数（4×4 / 5×5 / 6×6）を選びます。<br>
  ・<b>【5×5マス限定】フリー切替ボタンを有効にすると、中央が自動でFREEマスになり、START時に自動解放されます！</b><br>
  ・START前はマスをクリックして個別編集も可能です。<br>
  ・ゲーム中は一致したマスをタップしてロックします（もう一度タップで解除）。<br>
  ・<b>あと1マスで揃う列は枠が黄色（リーチ）</b>になります。<br>
  ・<b>揃った列は枠が赤色（ビンゴ）</b>になり、枠の中が少し濃い緑色に変化します！
</div>

<button class="btn-menu" onclick="location.href='index.html'">メニューへ戻る</button>

<script>
const wordPool = [
  "愛","夢","心","空","海","風","花","星","月","夜",
  "光","音","歌","声","道","雨","雪","恋","涙","虹",
  "春","夏","秋","冬","桜","陽","蒼","青","赤","白",
  "黒","金","銀","時","瞬","永","未","今","明","暗",
  "君","僕","私","人","友","家","旅","街","影","波",
  "炎","雲","森","川","山","島","絆","願","祈","想",
  "魂","詩","響","旋","舞","華","香","宙","天","地",
  "幻","零","一","二","三","四","五","六","七","八",
  "九","水","獣","好","電","千","万","怪","髪","桃"
];

let size = 5;
let mode = "score";
let boardValues = [];
let hits = [];
let started = false;
let isFreeEnabled = false; // FREE中央機能の有効/無効フラグ

const boardEl = document.getElementById("board");
const modeEl = document.getElementById("mode");
const sizeEl = document.getElementById("sizeSelect");
const scoreRangeBox = document.getElementById("scoreRangeBox");
const freeToggleBtn = document.getElementById("freeToggleBtn");
const randomBtn = document.getElementById("randomBtn");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const bingoBanner = document.getElementById("bingoBanner");
const hideSetupContainer = document.getElementById("hideSetupContainer");

function initBoard(){
  boardEl.innerHTML = "";
  boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  const total = size*size;
  boardValues = new Array(total).fill("");
  hits = new Array(total).fill(false);

  // 5x5マス以外ならフリー状態を強制解除してボタンを無効化
  if (size !== 5) {
    isFreeEnabled = false;
    freeToggleBtn.classList.remove("active");
    freeToggleBtn.textContent = "FREE中央マス：無効";
    freeToggleBtn.disabled = true;
  } else {
    freeToggleBtn.disabled = false;
  }

  for(let i=0;i<total;i++){
    const div = document.createElement("div");
    
    const rowIndex = Math.floor(i / size);
    let rowClass = "r-default";
    if (rowIndex < 5) {
      rowClass = `r${rowIndex + 1}`;
    }
    
    div.className = `cell editable ${rowClass}`;
    div.dataset.index = i;
    div.onclick = () => onCellClick(i);
    boardEl.appendChild(div);
  }

  // 5x5でフリー機能が有効な場合、最初から中央をFREE状態にしておく
  if (size === 5 && isFreeEnabled) {
    boardValues[12] = "FREE";
  }

  bingoBanner.style.display = "none";
  renderBoard();
}

function onCellClick(i){
  if(started){
    hits[i] = !hits[i];
    renderBoard();
    checkBingo(); 
    return;
  }

  const centerIndex = Math.floor((size * size) / 2);

  // フリー有効時の5x5中央マスはロック（編集不可）
  if (size === 5 && isFreeEnabled && i === centerIndex) {
    alert("現在FREE中央機能が有効なため、このマスはFREE固定です。");
    return;
  }

  inputManualValue(i);
}

function inputManualValue(i){
  if(mode === "score"){
    const min = Number(document.getElementById("minScore").value);
    const max = Number(document.getElementById("maxScore").value);
    const count = size*size;
    const candidates = generateScoreCandidates(min,max,count);
    const choice = prompt("点数を選んでください：\n" + candidates.join(" / "));
    if(choice) boardValues[i] = choice;
  }else{
    const count = size*size;
    const candidates = generateKanjiCandidates(count);
    const choice = prompt("漢字を選んでください：\n" + candidates.join(" / "));
    if(choice) boardValues[i] = choice;
  }
  renderBoard();
}

function generateScoreCandidates(min,max,count){
  const list=[];
  for(let i=0;i<count;i++){
    list.push(String(Math.floor(Math.random()*(max-min+1))+min));
  }
  return list;
}

function generateKanjiCandidates(count){
  const pool=[...wordPool];
  const result=[];
  for(let i=0;i<count;i++){
    if(pool.length===0) break;
    const idx=Math.floor(Math.random()*pool.length);
    result.push(pool[idx]);
    pool.splice(idx,1);
  }
  return result;
}

function randomFill(){
  if(started) return;
  const total = size*size;

  if(mode==="score"){
    const min = Number(document.getElementById("minScore").value);
    const max = Number(document.getElementById("maxScore").value);
    boardValues = generateScoreCandidates(min,max,total);
  }else{
    boardValues = generateKanjiCandidates(total);
  }

  // ランダム生成時も、5x5でフリー機能が有効なら真ん中を上書き
  if(size === 5 && isFreeEnabled){
    boardValues[12] = "FREE";
  }

  renderBoard();
}

function startGame(){
  if(started) return;

  if(boardValues.some(v => v === "")){
    alert("空欄のマスがあります。すべて埋めてからSTARTしてください。");
    return;
  }

  started = true;

  // ── [アップデート] FREEが有効な場合、START時に自動で真ん中(12)をヒット状態にする ──
  if (size === 5 && isFreeEnabled && boardValues[12] === "FREE") {
    hits[12] = true;
  }

  hideSetupContainer.style.display = "none";
  randomBtn.style.display = "none";
  startBtn.style.display = "none";

  renderBoard();
  checkBingo(); // 初回判定を実行して、最初からリーチ等の色を反映させる
}

function checkBingo(){
  const cells = boardEl.querySelectorAll(".cell");
  
  cells.forEach(c => {
    c.classList.remove("reach", "bingo-line");
  });

  const lines = [];

  for(let r=0; r<size; r++){
    const row=[];
    for(let c=0; c<size; c++) row.push(r*size+c);
    lines.push(row);
  }
  for(let c=0; c<size; c++){
    const col=[];
    for(let r=0; r<size; r++) col.push(r*size+c);
    lines.push(col);
  }
  const d1=[], d2=[];
  for(let i=0; i<size; i++){
    d1.push(i*size+i);
    d2.push(i*size+(size-1-i));
  }
  lines.push(d1, d2);

  let bingoCount = 0;
  let bingoIndices = new Set();
  let reachIndices = new Set();

  for(const line of lines){
    const hitCount = line.filter(i => hits[i]).length;
    
    if (hitCount === size) {
      bingoCount++;
      line.forEach(i => bingoIndices.add(i));
    } else if (hitCount === size - 1) {
      line.forEach(i => reachIndices.add(i));
    }
  }

  reachIndices.forEach(i => {
    cells[i].classList.add("reach");
  });

  bingoIndices.forEach(i => {
    cells[i].classList.remove("reach"); 
    cells[i].classList.add("bingo-line");
  });

  if(bingoCount > 0){
    let text = "BINGO！！";
    if (bingoCount >= 2) text = `${bingoCount} BINGO！！！`;
    
    bingoBanner.textContent = text;
    bingoBanner.style.display = "block";
  } else {
    bingoBanner.style.display = "none";
  }
}

function renderBoard(){
  const cells = boardEl.querySelectorAll(".cell");
  if(cells.length === 0) return;
  
  cells.forEach((c,idx)=>{
    const val = boardValues[idx];
    
    if (val === "FREE") {
      c.classList.add("free-cell");
      c.innerHTML = "<span>🎤</span>FREE";
    } else {
      c.classList.remove("free-cell");
      c.textContent = val;
    }
    
    c.classList.toggle("hit", hits[idx]);
    c.classList.toggle("editable", !started);
  });
}

function resetAll(){
  started = false;
  
  hideSetupContainer.style.display = "block";
  randomBtn.style.display = "inline-block";
  startBtn.style.display = "inline-block";

  modeEl.disabled = false;
  sizeEl.disabled = false;
  document.getElementById("minScore").disabled = false;
  document.getElementById("maxScore").disabled = false;
  bingoBanner.style.display="none";
  initBoard();
}

// ── [アップデート] フリー切替ボタンのクリックイベント ──
freeToggleBtn.addEventListener("click", () => {
  if (started || size !== 5) return;

  isFreeEnabled = !isFreeEnabled;
  if (isFreeEnabled) {
    freeToggleBtn.classList.add("active");
    freeToggleBtn.textContent = "FREE中央マス：有効";
    boardValues[12] = "FREE"; // 真ん中をFREEに
  } else {
    freeToggleBtn.classList.remove("active");
    freeToggleBtn.textContent = "FREE中央マス：無効";
    boardValues[12] = ""; // 解除時は空文字に戻す
  }
  renderBoard();
});

modeEl.addEventListener("change",()=>{
  mode = modeEl.value;
  scoreRangeBox.style.display = mode==="score" ? "inline" : "none";
});

sizeEl.addEventListener("change",()=>{
  size = Number(sizeEl.value);
  initBoard(); // サイズ変更時に自動的にFREEが不適合なら解除されるロジック内包
});

randomBtn.addEventListener("click",randomFill);
startBtn.addEventListener("click",startGame);
resetBtn.addEventListener("click",resetAll);

resetAll();
</script>

</body>
</html>
