<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひらがじゃんカラオケ - 次局遷移バグ修正版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .jan-tile {
            width: 58px;
            height: 80px;
            font-size: 22pt;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #1e293b;
            border-radius: 8px;
            box-shadow: 0 4px 0 #cbd5e1, inset 0 -3px 0 #e2e8f0, 0 6px 10px -3px rgba(0, 0, 0, 0.3);
            border: 2px solid #94a3b8;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, box-shadow 0.1s;
            flex-shrink: 0;
        }
        .jan-tile:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cbd5e1, inset 0 -3px 0 #e2e8f0;
        }
        .jan-tile.selected {
            border-color: #3b82f6;
            background-color: #eff6ff;
            transform: translateY(-8px);
            box-shadow: 0 10px 0 #3b82f6, 0 12px 16px -3px rgba(59, 130, 246, 0.4);
        }
        .special-tile {
            background: #fffbeb;
            border-color: #f59e0b;
            color: #b45309;
            box-shadow: 0 4px 0 #f59e0b, inset 0 -3px 0 #fef3c7;
        }
        .scroller-zone {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 8px;
            padding: 12px 8px;
            -webkit-overflow-scrolling: touch;
            min-height: 110px;
        }
        .scroller-zone::-webkit-scrollbar {
            height: 5px;
        }
        .scroller-zone::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        .meld-set {
            display: inline-flex;
            background: rgba(30, 41, 59, 0.5);
            padding: 4px;
            border-radius: 6px;
            border: 1px dashed #475569;
            gap: 2px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans select-none">

    <div id="screen-lobby" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-700 text-center">
            <h1 class="text-3xl font-black text-emerald-400 mb-2 tracking-wider">ひらがじゃんカラオケ</h1>
            <p class="text-xs text-slate-400 mb-8">〜次局のカード初期化バグ修正版〜</p>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">プレイヤー名</label>
                    <input type="text" id="input-name" placeholder="名無しさん" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:border-emerald-400">
                </div>
                
                <div class="pt-4 space-y-3">
                    <button id="btn-create-room" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg">
                        新しいルームを作成
                    </button>
                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-slate-700"></div>
                        <span class="flex-shrink mx-4 text-slate-500 text-sm">または</span>
                        <div class="flex-grow border-t border-slate-700"></div>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="input-room-id" inputmode="numeric" placeholder="部屋番号" class="w-2/3 px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:border-blue-400 font-mono tracking-widest text-center">
                        <button id="btn-join-room" class="w-1/3 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">
                            参加
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-wait" class="hidden flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-700 text-center">
            <h2 class="text-xl font-bold text-slate-300 mb-2">待機ロビー</h2>
            <div class="bg-slate-950 p-3 rounded-xl mb-6 border border-slate-800">
                <span class="text-xs text-slate-500 block mb-1">ROOM ID</span>
                <span id="display-room-id" class="text-3xl font-mono font-black text-amber-400 tracking-widest">----</span>
            </div>
            
            <div class="text-left mb-6">
                <h3 class="text-sm font-semibold text-slate-400 mb-2">参加中のプレイヤー (<span id="player-count">0</span>/25)</h3>
                <ul id="player-list" class="space-y-2 bg-slate-900 p-4 rounded-xl border border-slate-800 font-medium max-h-48 overflow-y-auto"></ul>
            </div>
            
            <button id="btn-start-game" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-xl transition shadow-lg">
                ゲームを開始する！
            </button>
            <p id="wait-host-msg" class="text-sm text-slate-400 mt-2 hidden animate-pulse">ホストがゲームを開始するのを待っています...</p>
        </div>
    </div>

    <div id="screen-game" class="hidden flex flex-col min-h-screen">
        <div class="bg-slate-950 p-4 border-b border-slate-800 flex justify-between items-center shadow-md">
            <div>
                <span class="text-xs text-slate-500 block">ステータス</span>
                <span id="current-turn-player" class="font-bold text-emerald-400">----</span>
            </div>
            <div class="flex gap-4">
                <div class="text-center bg-slate-900 px-3 py-1 rounded-lg border border-slate-800">
                    <span class="text-[10px] text-slate-500 block">ドラ</span>
                    <span id="game-dora" class="font-bold text-red-400 text-lg">？</span>
                </div>
                <div class="text-center bg-slate-900 px-3 py-1 rounded-lg border border-slate-800">
                    <span class="text-[10px] text-slate-500 block">山札残り</span>
                    <span id="deck-count" class="font-bold text-slate-200 text-lg">0</span>
                </div>
            </div>
        </div>

        <div class="flex-grow p-4 space-y-4 max-w-5xl mx-auto w-full">
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800">
                <h3 class="text-xs font-bold text-slate-500 mb-2 tracking-wider">プレイヤー全員のスコア</h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-2 text-xs" id="game-scoreboard"></div>
            </div>

            <div id="host-next-action-zone" class="bg-emerald-950/40 border border-emerald-800/60 p-4 rounded-xl hidden text-center space-y-3">
                <p class="text-sm font-bold text-emerald-400">全員の点数確定が完了しました！</p>
                <div class="flex gap-4 justify-center">
                    <button id="btn-next-round" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2 rounded-xl text-sm">点数を引き継いで次の一局へ</button>
                    <button id="btn-end-room" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-6 py-2 rounded-xl text-sm">ゲームを終了（解散）</button>
                </div>
            </div>

            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 min-h-[110px]">
                <h3 id="board-title" class="text-xs font-bold text-slate-500 mb-2 tracking-wider">直近の捨て牌</h3>
                <div id="river-tiles" class="flex flex-wrap gap-2 items-center"></div>
                <div id="agari-result-board" class="hidden space-y-2"></div>
            </div>

            <div id="meld-selector-zone" class="bg-amber-950/40 border border-amber-800/60 p-4 rounded-xl hidden">
                <h3 class="text-xs font-bold text-amber-400 mb-2">💡 他のプレイヤーの捨て牌に対してアクション可能です！</h3>
                <div id="meld-candidates" class="flex flex-wrap gap-4 items-center"></div>
            </div>
        </div>

        <div class="bg-slate-950 p-4 border-t border-slate-800 sticky bottom-0 z-50">
            <div class="max-w-4xl mx-auto space-y-4">
                <div id="my-melds-area" class="hidden flex flex-wrap gap-3 p-2 bg-slate-900/50 rounded-lg border border-slate-800/80">
                    <span class="text-xs font-bold text-slate-500 flex items-center">鳴いたセット:</span>
                    <div id="my-melds-container" class="flex flex-wrap gap-2"></div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <span id="hand-title" class="text-xs font-bold text-slate-400 tracking-wider">自分の手札（選択して左右矢印で並び替え）</span>
                        <div id="sort-controls" class="flex gap-2">
                            <button id="btn-move-left" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded text-xs font-bold">← 左へ</button>
                            <button id="btn-move-right" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded text-xs font-bold">右へ →</button>
                        </div>
                    </div>

                    <div id="player-hand" class="scroller-zone bg-slate-900 rounded-xl border border-slate-800 items-center"></div>
                    
                    <div id="reserve-zone" class="mt-2 hidden">
                        <span id="reserve-title" class="text-xs font-bold text-red-400 block mb-1">⚠️ あまり牌（※1枚につき -300点ペナルティ）</span>
                        <div id="player-reserve-hand" class="scroller-zone bg-red-950/20 border border-red-900/40 rounded-xl items-center"></div>
                    </div>
                </div>

                <div class="flex gap-2 justify-end" id="action-panel">
                    <button id="btn-draw" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl transition hidden">ツモ</button>
                    <button id="btn-discard" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-6 py-3 rounded-xl transition opacity-50 cursor-not-allowed" disabled>1枚捨てる</button>
                    <button id="btn-trigger-agari" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-xl transition hidden">和了（アガリ！）</button>
                    <button id="btn-confirm-score" class="bg-blue-600 hover:bg-blue-500 text-white font-black px-6 py-3 rounded-xl transition hidden">この構成で点数を送信！</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, arrayUnion, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5ZizhaI7JRCy9-18heG6YIPxKmZFU1A8",
            authDomain: "majan-56ead.firebaseapp.com",
            projectId: "majan-56ead",
            storageBucket: "majan-56ead.firebasestorage.app",
            messagingSenderId: "462552034097",
            appId: "1:462552034097:web:e92cc6d7e4f544a26a1e10",
            measurementId: "G-VTX7ZM911W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const HIRAGANA_BASE = [
            'あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ','ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','ろ','わ','を','ん',
            'が','ぎ','ぐ','げ','ご','ざ','じ','ず','ぜ','ぞ','だ','ぢ','づ','で','ど','ば','び','ぶ','べ','ぼ','ぱ','ぴ','ぷ','ぺ','ぽ',
            'ゃ','ゅ','ょ'
        ];
        const KANJI_SPECIAL = ['春','夏','秋','冬','愛','恋','赤','青','白','道','唄','歌'];

        let myId = Math.random().toString(36).substring(2, 9);
        let myName = "";
        let currentRoomId = "";
        let roomState = {};
        
        let myHand = [];
        let myReserve = [];
        let myMelds = []; 
        
        let selectedTileIndex = null;
        let selectedTileZone = 'hand'; 
        
        let isLocalAgariPhase = false;
        let hasSubmittedScore = false;
        let hasJustMelded = false;      
        let hasDrawnThisTurn = false;   

        const sLobby = document.getElementById('screen-lobby');
        const sWait = document.getElementById('screen-wait');
        const sGame = document.getElementById('screen-game');

        document.getElementById('btn-create-room').addEventListener('click', () => createRoom());
        document.getElementById('btn-join-room').addEventListener('click', () => joinRoom());
        document.getElementById('btn-start-game').addEventListener('click', () => startGame());
        document.getElementById('btn-discard').addEventListener('click', () => discardTile());
        document.getElementById('btn-draw').addEventListener('click', () => drawTile());
        document.getElementById('btn-move-left').addEventListener('click', () => moveTile(-1));
        document.getElementById('btn-move-right').addEventListener('click', () => moveTile(1));
        document.getElementById('btn-trigger-agari').addEventListener('click', () => requestGlobalAgari(false)); 
        document.getElementById('btn-confirm-score').addEventListener('click', () => submitMyAgariStructure());
        document.getElementById('btn-next-round').addEventListener('click', () => startNextRound());
        document.getElementById('btn-end-room').addEventListener('click', () => terminateRoom());

        function generateDeck() {
            let deck = [];
            for(let i=0; i<4; i++) { deck = deck.concat([...HIRAGANA_BASE]); }
            for(let i=0; i<3; i++) { deck = deck.concat([...KANJI_SPECIAL]); }
            deck.sort(() => Math.random() - 0.5);
            return deck;
        }

        async function createRoom() {
            setProfile();
            currentRoomId = Math.floor(1000 + Math.random() * 9000).toString();
            let deck = generateDeck();
            const dora = deck.pop();

            roomState = {
                roomId: currentRoomId,
                status: "waiting",
                deck: deck,
                dora: dora,
                discardPile: [], 
                turnIndex: 0,
                turnOrder: [],
                hostId: myId,
                agariTriggered: false,
                ronTriggered: false,
                ronTargetCard: ""
            };

            await setDoc(doc(db, "rooms", currentRoomId), roomState);
            await joinRoomProcess(currentRoomId, true);
        }

        async function joinRoom() {
            setProfile();
            const rId = document.getElementById('input-room-id').value.trim();
            if(!rId || isNaN(rId)) return alert("ルームIDを入力してください");
            await joinRoomProcess(rId, false);
        }

        function setProfile() {
            myName = document.getElementById('input-name').value.trim() || "プレイヤー-" + myId.substring(0,3);
        }

        async function joinRoomProcess(roomId, isHost) {
            currentRoomId = roomId;
            await setDoc(doc(db, `rooms/${roomId}/players`, myId), {
                id: myId, name: myName, isHost: isHost, score: 0, hand: [], melds: [],
                activeSongCards: [], reserveCards: [], status: "playing"
            });
            sLobby.classList.add('hidden');
            sWait.classList.remove('hidden');
            document.getElementById('display-room-id').innerText = roomId;
            document.getElementById('btn-start-game').classList.toggle('hidden', !isHost);
            document.getElementById('wait-host-msg').classList.toggle('hidden', isHost);

            listenRoom(roomId);
        }

        function listenRoom(roomId) {
            onSnapshot(doc(db, "rooms", roomId), (snapshot) => {
                if(!snapshot.exists()) return;
                const oldAgariTriggered = roomState.agariTriggered;
                roomState = snapshot.data();
                
                if(roomState.status === "playing") {
                    sWait.classList.add('hidden');
                    sGame.classList.remove('hidden');
                    
                    // 【最重要】和了状態が解除（falseにリセット）されたらローカル側も完全に通常モードに戻す
                    if(oldAgariTriggered === true && roomState.agariTriggered === false) {
                        resetLocalGameStateForNextRound();
                    }

                    if(roomState.agariTriggered && !isLocalAgariPhase) {
                        enterLocalAgariPhase();
                    }
                    updateGameBoard();
                }
            });

            onSnapshot(collection(db, `rooms/${roomId}/players`), (snapshot) => {
                const players = [];
                let allSubmitted = true;
                
                snapshot.forEach(pDoc => {
                    const p = pDoc.data();
                    players.push(p);
                    
                    if(p.id === myId) {
                        // アガリ処理中、および和了モード中以外のみ、DBのhand配列を同期する
                        if(!isLocalAgariPhase && !roomState.agariTriggered) {
                            myHand = p.hand || [];
                        }
                        myMelds = p.melds || [];
                    }
                    if(p.status !== "submitted") {
                        allSubmitted = false;
                    }
                });

                if(roomState.status === "playing") {
                    renderScoreboard(players);
                    if(roomState.agariTriggered) {
                        renderAgariResults(players);
                        if(allSubmitted && roomState.hostId === myId) {
                            document.getElementById('host-next-action-zone').classList.remove('hidden');
                        }
                    }
                }
            });
        }

        function resetLocalGameStateForNextRound() {
            isLocalAgariPhase = false;
            hasSubmittedScore = false;
            hasJustMelded = false;
            hasDrawnThisTurn = false;
            myReserve = [];
            selectedTileIndex = null;
            selectedTileZone = 'hand';

            document.getElementById('hand-title').innerHTML = "自分の手札（選択して左右矢印で並び替え）";
            document.getElementById('reserve-zone').classList.add('hidden');
            document.getElementById('btn-confirm-score').classList.add('hidden');
            document.getElementById('btn-discard').classList.remove('hidden');
            document.getElementById('btn-trigger-agari').classList.remove('hidden');
        }

        async function startGame() {
            const playersSnapshot = await getDocs(collection(db, `rooms/${currentRoomId}/players`));
            let uids = [];
            playersSnapshot.forEach(d => uids.push(d.id));
            uids.sort(() => Math.random() - 0.5);

            let currentDeck = [...roomState.deck];
            for(const uid of uids) {
                let hand = [];
                for(let i=0; i<10; i++) { hand.push(currentDeck.pop()); }
                await updateDoc(doc(db, `rooms/${currentRoomId}/players`, uid), { 
                    hand: hand, melds: [], status: "playing", activeSongCards: [], reserveCards: [] 
                });
            }

            await updateDoc(doc(db, "rooms", currentRoomId), {
                status: "playing", deck: currentDeck, turnOrder: uids, turnIndex: 0, turnOwner: uids[0], agariTriggered: false, ronTriggered: false, discardPile: []
            });
        }

        function updateGameBoard() {
            document.getElementById('deck-count').innerText = roomState.deck.length;
            document.getElementById('game-dora').innerText = roomState.dora;
            
            const isMyTurn = roomState.turnOwner === myId;
            if (!isMyTurn) {
                hasDrawnThisTurn = false;
            }

            if(roomState.agariTriggered) {
                document.getElementById('current-turn-player').innerText = "和了モード：曲名仕分け中";
                document.getElementById('board-title').innerText = "🎵 全員の完成曲名・集計";
                document.getElementById('river-tiles').classList.add('hidden');
                document.getElementById('agari-result-board').classList.remove('hidden');
            } else {
                document.getElementById('current-turn-player').innerText = isMyTurn ? (hasJustMelded ? "鳴き後：1枚捨ててください" : "あなたの番です！") : "他プレイヤーの手番待ち";
                document.getElementById('board-title').innerText = "直近の捨て牌";
                document.getElementById('river-tiles').classList.remove('hidden');
                document.getElementById('agari-result-board').classList.add('hidden');
                document.getElementById('host-next-action-zone').classList.add('hidden');
                
                const river = document.getElementById('river-tiles');
                const playerCount = roomState.turnOrder.length || 1;
                const recentDiscards = (roomState.discardPile || []).slice(-playerCount);
                
                river.innerHTML = recentDiscards.map(p => {
                    const isSp = KANJI_SPECIAL.includes(p.card) || p.card === roomState.dora;
                    return `<div class="text-center"><span class="jan-tile transform scale-75 m-0.5 ${isSp?'special-tile':''}">${p.card}</span><span class="block text-[9px] text-slate-500 truncate max-w-[55px] mx-auto">${p.senderName}</span></div>`;
                }).join('');
            }

            const meldsArea = document.getElementById('my-melds-area');
            const meldsContainer = document.getElementById('my-melds-container');
            if(myMelds && myMelds.length > 0) {
                meldsArea.classList.remove('hidden');
                meldsContainer.innerHTML = myMelds.map(m => {
                    const count = m.type === 'ポン' ? 3 : 4;
                    let tilesHtml = "";
                    for(let i=0; i<count; i++) {
                        tilesHtml += `<span class="bg-slate-800 border border-slate-600 px-1 text-sm rounded font-bold text-amber-300">${m.card}</span>`;
                    }
                    return `<div class="meld-set items-center gap-1"><span class="text-[10px] text-slate-400 font-mono mr-1">${m.type}(+${m.score}点)</span>${tilesHtml}</div>`;
                }).join('');
            } else {
                meldsArea.classList.add('hidden');
            }

            const btnDraw = document.getElementById('btn-draw');
            const btnDiscard = document.getElementById('btn-discard');
            const btnAgari = document.getElementById('btn-trigger-agari');

            if(!roomState.agariTriggered && !isLocalAgariPhase) {
                if(isMyTurn) {
                    if (hasJustMelded) {
                        btnDraw.classList.add('hidden');
                        btnDiscard.classList.remove('hidden');
                        btnAgari.classList.add('hidden');
                    } else if (!hasDrawnThisTurn) {
                        btnDraw.classList.remove('hidden');
                        btnDiscard.classList.add('hidden');
                        btnAgari.classList.add('hidden');
                    } else {
                        btnDraw.classList.add('hidden');
                        btnDiscard.classList.remove('hidden');
                        btnAgari.classList.remove('hidden'); 
                    }
                    document.getElementById('meld-selector-zone').classList.add('hidden');
                } else {
                    btnDraw.classList.add('hidden');
                    btnDiscard.classList.add('hidden');
                    btnAgari.classList.add('hidden');
                    renderMeldActionZone(); 
                }
            } else {
                btnDraw.classList.add('hidden');
                if(!isLocalAgariPhase) btnDiscard.classList.add('hidden');
                btnAgari.classList.add('hidden');
                document.getElementById('meld-selector-zone').classList.add('hidden');
            }

            renderHand();
        }

        function renderMeldActionZone() {
            const zone = document.getElementById('meld-selector-zone');
            const container = document.getElementById('meld-candidates');
            container.innerHTML = "";

            if(!roomState.discardPile || roomState.discardPile.length === 0) return zone.classList.add('hidden');
            
            const lastDiscard = roomState.discardPile[roomState.discardPile.length - 1];
            if(lastDiscard.playerId === myId) return zone.classList.add('hidden');

            const matchCount = myHand.filter(c => c === lastDiscard.card).length;

            zone.classList.remove('hidden');
            const wrapper = document.createElement('div');
            wrapper.className = "flex items-center bg-slate-900 p-3 rounded-xl border border-slate-700 gap-4 w-full justify-between";
            
            let html = `<div class="text-xs">対象牌: <b class="text-amber-400 text-lg">${lastDiscard.card}</b> (${lastDiscard.senderName}の捨て札)</div><div class="flex gap-2">`;
            html += `<button id="btn-action-ron" class="bg-gradient-to-r from-amber-500 to-red-600 hover:from-amber-400 hover:to-red-500 text-slate-950 font-black px-5 py-2 rounded-lg text-xs shadow-md">ロン（他人の牌で和了！）</button>`;
            
            if(matchCount >= 2) {
                html += `<button id="btn-action-pon" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-black px-4 py-2 rounded-lg text-xs">ポン</button>`;
            }
            if(matchCount === 3) {
                html += `<button id="btn-action-kan" class="bg-red-600 hover:bg-red-500 text-white font-black px-4 py-2 rounded-lg text-xs">カン</button>`;
            }
            html += `</div>`;
            wrapper.innerHTML = html;
            container.appendChild(wrapper);

            document.getElementById('btn-action-ron').addEventListener('click', () => executeRon(lastDiscard.card));
            if(matchCount >= 2) {
                document.getElementById('btn-action-pon').addEventListener('click', () => executeMeld('ポン', lastDiscard.card));
            }
            if(matchCount === 3) {
                document.getElementById('btn-action-kan').addEventListener('click', () => executeMeld('カン', lastDiscard.card));
            }
        }

        async function executeRon(targetCard) {
            myHand.push(targetCard);
            await requestGlobalAgari(true, targetCard);
        }

        async function executeMeld(type, card) {
            let currentRiver = [...roomState.discardPile];
            currentRiver.pop(); 

            const removeCount = type === 'ポン' ? 2 : 3;
            let removed = 0;
            myHand = myHand.filter(c => {
                if(c === card && removed < removeCount) {
                    removed++;
                    return false;
                }
                return true;
            });

            const score = type === 'ポン' ? 3 : 4;
            const newMeld = { type: type, card: card, score: score };
            myMelds.push(newMeld);

            hasJustMelded = true; 
            hasDrawnThisTurn = true; 

            const myTurnIndex = roomState.turnOrder.indexOf(myId);

            await updateDoc(doc(db, `rooms/${currentRoomId}/players`, myId), { 
                hand: myHand, 
                melds: myMelds 
            });

            await updateDoc(doc(db, "rooms", currentRoomId), {
                discardPile: currentRiver,
                turnIndex: myTurnIndex,
                turnOwner: myId
            });
        }

        function renderHand() {
            renderZoneTiles(document.getElementById('player-hand'), myHand, 'hand');
            if(isLocalAgariPhase) {
                renderZoneTiles(document.getElementById('player-reserve-hand'), myReserve, 'reserve');
            }
        }

        function renderZoneTiles(container, array, zoneName) {
            container.innerHTML = "";
            array.forEach((tile, index) => {
                const isSp = KANJI_SPECIAL.includes(tile) || tile === roomState.dora;
                const el = document.createElement('div');
                
                el.className = `jan-tile ${isSp ? 'special-tile':''} ${selectedTileIndex === index && selectedTileZone === zoneName ? 'selected' : ''}`;
                if(zoneName === 'reserve') el.classList.add('opacity-80');
                el.innerText = tile;
                
                if(!hasSubmittedScore) {
                    el.addEventListener('click', () => selectTile(index, zoneName));
                }
                container.appendChild(el);
            });
        }

        function selectTile(index, zone) {
            if(hasSubmittedScore) return;
            
            if (isLocalAgariPhase) {
                if (zone === 'hand') {
                    const card = myHand.splice(index, 1)[0];
                    myReserve.push(card);
                    selectedTileIndex = myReserve.length - 1;
                    selectedTileZone = 'reserve';
                } else {
                    const card = myReserve.splice(index, 1)[0];
                    myHand.push(card);
                    selectedTileIndex = myHand.length - 1;
                    selectedTileZone = 'hand';
                }
            } else {
                selectedTileIndex = index;
                selectedTileZone = zone;
                
                if(selectedTileZone === 'hand' && (hasDrawnThisTurn || hasJustMelded)) {
                    document.getElementById('btn-discard').classList.remove('opacity-50', 'cursor-not-allowed');
                    document.getElementById('btn-discard').removeAttribute('disabled');
                }
            }
            renderHand();
        }

        function moveTile(direction) {
            if(selectedTileIndex === null || hasSubmittedScore) return;
            const arr = selectedTileZone === 'hand' ? myHand : myReserve;
            const newIndex = selectedTileIndex + direction;
            if(newIndex < 0 || newIndex >= arr.length) return;
            
            const temp = arr[selectedTileIndex];
            arr[selectedTileIndex] = arr[newIndex];
            arr[newIndex] = temp;
            selectedTileIndex = newIndex;
            renderHand();
        }

        function renderScoreboard(players) {
            const board = document.getElementById('game-scoreboard');
            board.innerHTML = players.map(p => `
                <div class="p-2 rounded-lg border text-center ${roomState.turnOwner === p.id && !roomState.agariTriggered ? 'border-emerald-500 bg-emerald-950/20':'border-slate-800 bg-slate-900'}">
                    <div class="font-bold text-slate-300 truncate text-[11px]">👤 ${p.name}</div>
                    <div class="font-mono font-bold text-amber-400 text-xs mt-0.5">${p.score.toLocaleString()} 点</div>
                    <div class="text-[10px] mt-0.5">${p.status === 'submitted' ? '✅ 確定済':'⏳ 思考中'}</div>
                </div>
            `).join('');
        }

        function renderAgariResults(players) {
            const board = document.getElementById('agari-result-board');
            board.innerHTML = players.map(p => {
                const songText = p.activeSongCards && p.activeSongCards.length > 0 ? p.activeSongCards.join('') : `<span class="text-rose-500 font-bold">曲名作れず</span>`;
                const meldBonusText = p.melds && p.melds.length > 0 ? p.melds.map(m => `[${m.type}:${m.card}(+${m.score}点)]`).join(' ') : 'なし';
                return `
                    <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-500 block">👤 ${p.name} の構成</span>
                            <span class="text-xs text-amber-400 font-mono">鳴きボーナス: ${meldBonusText}</span>
                        </div>
                        <div class="text-lg font-black tracking-wider text-emerald-400">${songText}</div>
                        <div class="text-xs text-slate-400 flex justify-between mt-1">
                            <span>予備牌: ${p.reserveCards ? p.reserveCards.length : 0}枚 (-${(p.reserveCards ? p.reserveCards.length*300 : 0)}点)</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function drawTile() {
            let currentDeck = [...roomState.deck];
            if(currentDeck.length === 0) return alert("山札がなくなりました！引き分けです。");
            myHand.push(currentDeck.pop());
            
            hasDrawnThisTurn = true; 

            await updateDoc(doc(db, `rooms/${currentRoomId}/players`, myId), { hand: myHand });
            await updateDoc(doc(db, "rooms", currentRoomId), { deck: currentDeck });
        }

        async function discardTile() {
            if(selectedTileIndex === null || selectedTileZone !== 'hand') return;
            const discardedCard = myHand.splice(selectedTileIndex, 1)[0];
            selectedTileIndex = null;
            hasJustMelded = false; 
            hasDrawnThisTurn = false; 

            let nextIndex = (roomState.turnIndex + 1) % roomState.turnOrder.length;

            document.getElementById('btn-discard').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('btn-discard').setAttribute('disabled', 'true');

            await updateDoc(doc(db, `rooms/${currentRoomId}/players`, myId), { hand: myHand });
            await updateDoc(doc(db, "rooms", currentRoomId), {
                discardPile: arrayUnion({ playerId: myId, senderName: myName, card: discardedCard }),
                turnIndex: nextIndex,
                turnOwner: roomState.turnOrder[nextIndex]
            });
        }
        
        async function requestGlobalAgari(isRon = false, ronCard = "") {
            if(isRon) {
                await updateDoc(doc(db, "rooms", currentRoomId), { 
                    agariTriggered: true, 
                    ronTriggered: true, 
                    ronTargetCard: ronCard 
                });
            } else {
                await updateDoc(doc(db, "rooms", currentRoomId), { 
                    agariTriggered: true 
                });
            }
        }

        function enterLocalAgariPhase() {
            isLocalAgariPhase = true;
            hasSubmittedScore = false;
            myReserve = [];
            selectedTileIndex = null;
            
            document.getElementById('hand-title').innerHTML = "✨ <b>【和了モード】</b> 牌を<b>タップ</b>して上の「完成曲名」と下の「あまり牌」に仕分けてください（横スクロール可能）";
            document.getElementById('reserve-zone').classList.remove('hidden');
            document.getElementById('reserve-title').innerText = "⚠️ あまり牌（※1枚につき -300点ペナルティ）";
            document.getElementById('btn-discard').classList.add('hidden');
            document.getElementById('btn-trigger-agari').classList.add('hidden');
            document.getElementById('btn-confirm-score').classList.remove('hidden');
            renderHand();
        }

        async function submitMyAgariStructure() {
            hasSubmittedScore = true;
            document.getElementById('btn-confirm-score').classList.add('hidden');
            
            const playerDocRef = doc(db, `rooms/${currentRoomId}/players`, myId);
            await updateDoc(playerDocRef, {
                activeSongCards: myHand,
                reserveCards: myReserve,
                status: "submitted"
            });

            if(roomState.hostId === myId) {
                setTimeout(() => finalizeTotalScores(), 2000);
            }
            alert("あなたの構成を送信しました！他のプレイヤーが確定するまでお待ちください。");
        }

        async function finalizeTotalScores() {
            const playersSnapshot = await getDocs(collection(db, `rooms/${currentRoomId}/players`));
            let playersData = [];
            playersSnapshot.forEach(doc => playersData.push(doc.data()));

            if(roomState.ronTriggered && roomState.discardPile.length > 0) {
                let currentRiver = [...roomState.discardPile];
                currentRiver.pop();
                await updateDoc(doc(db, "rooms", currentRoomId), { discardPile: currentRiver });
            }

            for(const p of playersData) {
                let roundScore = p.score || 0;
                
                if(p.activeSongCards && p.activeSongCards.length > 0) {
                    roundScore += p.activeSongCards.length * 1000;
                }
                
                if(p.melds && p.melds.length > 0) {
                    p.melds.forEach(m => { roundScore += m.score; });
                }

                if(p.reserveCards && p.reserveCards.length > 0) {
                    roundScore -= (p.reserveCards.length * 300);
                }
                
                await updateDoc(doc(db, `rooms/${currentRoomId}/players`, p.id), { score: roundScore });
            }
        }

        async function startNextRound() {
            let deck = generateDeck();
            const dora = deck.pop();

            const playersSnapshot = await getDocs(collection(db, `rooms/${currentRoomId}/players`));
            let uids = [];
            playersSnapshot.forEach(d => uids.push(d.id));
            uids.sort(() => Math.random() - 0.5);

            for(const uid of uids) {
                let hand = [];
                for(let i=0; i<10; i++) { hand.push(deck.pop()); }
                // 【バグ修正】ここで新しいhand分配と同時に、前局のアガリ仕分けデータ(activeSongCards, reserveCards)を完全に「空」へ初期化
                await updateDoc(doc(db, `rooms/${currentRoomId}/players`, uid), {
                    hand: hand, 
                    melds: [], 
                    status: "playing", 
                    activeSongCards: [], 
                    reserveCards: []
                });
            }

            await updateDoc(doc(db, "rooms", currentRoomId), {
                deck: deck,
                dora: dora,
                discardPile: [],
                turnIndex: 0,
                turnOwner: uids[0],
                agariTriggered: false,
                ronTriggered: false,
                ronTargetCard: ""
            });
        }

        async function terminateRoom() {
            if(!confirm("本当にゲームを終了し、ルームを解散しますか？")) return;
            const playersSnapshot = await getDocs(collection(db, `rooms/${currentRoomId}/players`));
            playersSnapshot.forEach(async (p) => {
                await deleteDoc(doc(db, `rooms/${currentRoomId}/players`, p.id));
            });
            await deleteDoc(doc(db, "rooms", currentRoomId));
            window.location.reload();
        }
    </script>
</body>
</html>
