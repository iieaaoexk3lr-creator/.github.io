<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔄 逆再生伝言ゲーム - MCコントロール＆連動システム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght=700;900&display=swap');
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #0f0f15;
    color: #fff;
  }
  .app-gradient {
    background: linear-gradient(135deg, #ff3366, #ff6633);
  }
  .glass-box {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .score-hidden {
    filter: blur(12px);
    user-select: none;
  }
</style>
</head>
<body class="p-4 min-h-screen flex flex-col items-center">

  <div class="w-full max-w-xl flex flex-col min-h-screen justify-between pb-6">
    
    <div>
      <div class="mb-4 flex justify-center items-center gap-2">
        <input type="password" id="adminKeyInput" placeholder="管理キー" class="w-24 bg-gray-800 text-white px-3 py-1.5 rounded-xl border border-gray-700 text-xs focus:outline-none">
        <button id="authBtn" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">⚙️ 操作パネル表示</button>
      </div>

      <div id="adminPanel" class="hidden bg-slate-900 text-white border-4 border-pink-500 rounded-3xl p-5 mb-6 shadow-2xl space-y-4">
        <h2 class="text-base font-black text-pink-400 flex justify-between items-center">
          <span>⚙️ 逆再生伝言 MC専用コントロール</span>
          <button onclick="resetSync()" class="text-xs bg-gray-800 px-2 py-1 rounded border border-gray-700 text-white">システムリセット</button>
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-black/30 p-3 rounded-xl border border-gray-800">
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">■ スコア加算先チーム</label>
            <div class="grid grid-cols-2 gap-2">
              <button id="setTeamA" onclick="selectTargetTeam('Aチーム')" class="py-2 rounded-lg border-2 border-gray-700 font-bold text-xs bg-gray-800 text-white">Aチーム</button>
              <button id="setTeamB" onclick="selectTargetTeam('Bチーム')" class="py-2 rounded-lg border-2 border-gray-700 font-bold text-xs bg-gray-800 text-white">Bチーム</button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">■ 1問あたりの配点設定</label>
            <select id="pointPerAnswer" class="w-full text-black p-2 rounded-lg font-bold text-sm">
              <option value="10" selected>10 点</option>
              <option value="12">12 点</option>
              <option value="13">13 点</option>
              <option value="15">15 点</option>
              <option value="20">20 点</option>
            </select>
          </div>
        </div>

        <div>
          <p class="text-xs font-bold text-gray-400 mb-1">■ 1. 出題する問題を選択（全員へリアルタイム配信）</p>
          <div class="flex gap-1.5 overflow-x-auto pb-2" id="adminButtons"></div>
        </div>

        <div>
          <p class="text-xs font-bold text-gray-400 mb-1">■ 2. 答えの表示コントロール</p>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="setAnswerVisibility(true)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs shadow">
              🔓 答えを全員に公開
            </button>
            <button onclick="setAnswerVisibility(false)" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-xl text-xs shadow">
              🔒 答えを隠す
            </button>
          </div>
        </div>

        <div class="border-t border-gray-800 pt-3">
          <div class="flex justify-between items-center text-xs bg-black/20 p-2 rounded mb-2">
            <span>加算ターゲット: <b id="adminTargetDisplay" class="text-pink-400 text-sm">Aチーム</b></span>
          </div>
          <button onclick="submitFinalScore()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-black py-3 rounded-xl text-sm shadow-lg transition-all">
            現在の問題の得点をチームへ確定送信（手元自動リセット）
          </button>
        </div>
      </div>

      <div id="gameScreen" class="w-full flex flex-col">
        
        <div class="glass-box rounded-3xl p-6 text-center shadow-xl mb-6 min-h-[220px] flex flex-col justify-center border-2 border-white/10 relative">
          <div class="absolute top-3 left-4 text-[10px] font-bold text-pink-400 flex items-center gap-1">
            📢 ターゲット: <span id="displayRoom" class="text-white">Aチーム</span>
          </div>

          <div class="text-xs font-black text-gray-400 uppercase tracking-widest mb-1" id="syncStatusLabel">待機中</div>
          <div class="text-xs font-bold text-pink-500 mb-3" id="quizNumDisplay">管理者が出題するまでお待ちください</div>
          
          <div class="text-4xl font-black text-white tracking-wide min-h-[48px] flex items-center justify-center mb-4" id="question">
            ーーー
          </div>
          
          <div class="text-2xl font-black text-emerald-400 min-h-[36px] flex items-center justify-center border-t border-white/10 pt-4" id="answerContainer">
            <span id="answer" class="score-hidden">？ ？ ？</span>
          </div>
        </div>

        <div class="bg-black/40 border border-white/10 p-4 rounded-2xl">
          <div class="text-xs font-bold text-center text-gray-400 mb-2">手元結果入力（選択中のチームに得点権利が与えられます）</div>
          <div class="grid grid-cols-2 gap-3">
            <button id="btnCorrect" onclick="markResult(true)" class="bg-gray-800 hover:opacity-90 border-2 border-gray-700 text-white font-black py-4 rounded-xl flex flex-col items-center justify-center gap-1 text-base active:scale-95 transition-all shadow">
              <span class="text-2xl">⭕</span>
              <span>正解判定にする</span>
            </button>
            <button id="btnWrong" onclick="markResult(false)" class="bg-gray-800 hover:opacity-90 border-2 border-gray-700 text-white font-black py-4 rounded-xl flex flex-col items-center justify-center gap-1 text-base active:scale-95 transition-all shadow">
              <span class="text-2xl">❌</span>
              <span>不正解判定にする</span>
            </button>
          </div>
        </div>

      </div>
    </div>

    <div class="text-center mt-8">
      <a href="6gatu.html" class="inline-block text-sm font-bold text-gray-500 hover:text-gray-300 border border-gray-800 rounded-full px-6 py-2 transition-all bg-gray-900/50">
        メニューへ戻る
      </a>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

  <script>
    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
      authDomain: "gamehistory-m84.firebaseapp.com",
      databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
      projectId: "gamehistory-m84",
      storageBucket: "gamehistory-m84.firebasestorage.app",
      messagingSenderId: "475761727837",
      appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
      measurementId: "G-3636W6LC4F"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();       
    const firestore = firebase.firestore(); 

    // クイズデータ
    const quiz = [
      { q: "さか", a: "アカ" },
      { q: "ひあ", a: "愛" },
      { q: "にずおひ", a: "異邦人" },
      { q: "あぼとくるこ", a: "贈る言葉" },
      { q: "るべ", a: "EVERY" },
      { q: "にらあだ", a: "ダーリン" },
      { q: "いけしか", a: "キセキ" },
      { q: "あばたなは", a: "花束" },
      { q: "おぶなるかさ", a: "さくらんぼ" },
      { q: "いすもつばか", a: "カブトムシ" }
    ];

    // 状態管理変数 (マイクボンバー統合仕様)
    let activeTeam = "Aチーム";
    let serverCurrentIndex = -1;
    let currentJudgeStatus = null; // true = 正解判定保持, false = 不正解判定保持

    // DOM要素
    const adminKeyInput = document.getElementById("adminKeyInput");
    const authBtn = document.getElementById("authBtn");
    const adminPanel = document.getElementById("adminPanel");
    const gameScreen = document.getElementById("gameScreen");
    const displayRoom = document.getElementById("displayRoom");
    
    const syncStatusLabel = document.getElementById("syncStatusLabel");
    const quizNumDisplay = document.getElementById("quizNumDisplay");
    const questionText = document.getElementById("question");
    const answerText = document.getElementById("answer");

    // --- 1. 管理者認証トグル (キー: 0001) ---
    authBtn.onclick = () => {
      if (adminKeyInput.value === "0001") {
        adminPanel.classList.toggle("hidden");
        adminKeyInput.value = "";
        syncAdminUI();
      } else {
        alert("管理キーが正しくありません。");
      }
    };

    // チームターゲット選択
    window.selectTargetTeam = (teamName) => {
      activeTeam = teamName;
      syncAdminUI();
    };

    function syncAdminUI() {
      document.getElementById("adminTargetDisplay").textContent = activeTeam;
      displayRoom.textContent = activeTeam;
      const btnA = document.getElementById("setTeamA");
      const btnB = document.getElementById("setTeamB");
      if(activeTeam === "Aチーム") {
        btnA.className = "py-2 rounded-lg border-2 border-pink-500 font-black text-xs bg-pink-950 text-pink-200";
        btnB.className = "py-2 rounded-lg border-2 border-gray-700 font-bold text-xs bg-gray-800 text-white";
      } else {
        btnA.className = "py-2 rounded-lg border-2 border-gray-700 font-bold text-xs bg-gray-800 text-white";
        btnB.className = "py-2 rounded-lg border-2 border-pink-500 font-black text-xs bg-pink-950 text-pink-200";
      }
    }

    // --- 2. 管理者用：10問のボタンを生成 ---
    const adminButtonsArea = document.getElementById("adminButtons");
    quiz.forEach((item, index) => {
      const btn = document.createElement("button");
      btn.textContent = index + 1;
      btn.className = "w-10 h-10 flex-shrink-0 bg-gray-800 text-white font-bold rounded-xl text-sm border border-gray-700 transition-all";
      btn.onclick = () => {
        db.ref('syncState/currentIndex').set(index);
        db.ref('syncState/showAnswer').set(false);
        clearJudgeVisual(); // 問題が変わったら判定状態もクリア
      };
      adminButtonsArea.appendChild(btn);
    });

    window.setAnswerVisibility = (visible) => {
      db.ref('syncState/showAnswer').set(visible);
    };

    window.resetSync = () => {
      if(confirm("システム全体の同期状態を初期化しますか？")) {
        db.ref('syncState').set({
          currentIndex: -1,
          showAnswer: false
        });
        clearJudgeVisual();
      }
    };

    // --- 3. 手元の○✕判定トグルシステム ---
    function markResult(isCorrect) {
      currentJudgeStatus = isCorrect;
      const btnCorrect = document.getElementById("btnCorrect");
      const btnWrong = document.getElementById("btnWrong");

      if (isCorrect) {
        btnCorrect.className = "bg-emerald-950 text-emerald-200 border-2 border-emerald-500 font-black py-4 rounded-xl flex flex-col items-center justify-center gap-1 text-base active:scale-95 transition-all shadow-lg scale-102";
        btnWrong.className = "bg-gray-800 border-2 border-gray-700 text-gray-500 font-bold py-4 rounded-xl flex flex-col items-center justify-center gap-1 text-base active:scale-95 transition-all opacity-60";
      } else {
        btnCorrect.className = "bg-gray-800 border-2 border-gray-700 text-gray-500 font-bold py-4 rounded-xl flex flex-col items-center justify-center gap-1 text-base active:scale-95 transition-all opacity-60";
        btnWrong.className = "bg-red-950 text-red-200 border-2 border-red-500 font-black py-4 rounded-xl flex flex-col items-center justify-center gap-1 text-base active:scale-95 transition-all shadow-lg scale-102";
      }
    }

    function clearJudgeVisual() {
      currentJudgeStatus = null;
      document.getElementById("btnCorrect").className = "bg-gray-800 hover:opacity-90 border-2 border-gray-700 text-white font-black py-4 rounded-xl flex flex-col items-center justify-center gap-1 text-base active:scale-95 transition-all shadow";
      document.getElementById("btnWrong").className = "bg-gray-800 hover:opacity-90 border-2 border-gray-700 text-white font-black py-4 rounded-xl flex flex-col items-center justify-center gap-1 text-base active:scale-95 transition-all shadow";
    }

    // --- 4. リアルタイム同期リスナー (Realtime DB) ---
    db.ref('syncState').on('value', (snapshot) => {
      const data = snapshot.val() || { currentIndex: -1, showAnswer: false };
      serverCurrentIndex = data.currentIndex;
      const showAnswer = data.showAnswer;

      // 管理者パネル内ボタンのスタイル同期
      document.querySelectorAll("#adminButtons button").forEach((b, idx) => {
        if (idx === serverCurrentIndex) {
          b.className = "w-10 h-10 flex-shrink-0 bg-pink-600 text-white font-bold rounded-xl text-sm border border-pink-400 scale-105 shadow-lg";
        } else {
          b.className = "w-10 h-10 flex-shrink-0 bg-gray-800 text-white font-bold rounded-xl text-sm border border-gray-700";
        }
      });

      // 表示ボード書き換え
      if (serverCurrentIndex === -1) {
        syncStatusLabel.textContent = "待機中";
        quizNumDisplay.textContent = "管理者が出題するまでお待ちください";
        questionText.textContent = "ーーー";
        answerText.textContent = "？ ？ ？";
        answerText.className = "score-hidden";
      } else {
        syncStatusLabel.textContent = "🔴 LIVE 同期中";
        quizNumDisplay.textContent = `QUESTION 0${serverCurrentIndex + 1}`;
        questionText.textContent = quiz[serverCurrentIndex].q;
        
        if (showAnswer) {
          answerText.textContent = quiz[serverCurrentIndex].a;
          answerText.classList.remove("score-hidden");
        } else {
          answerText.textContent = "？ ？ ？";
          answerText.classList.add("score-hidden");
        }
      }
    });

    // --- 5. 🚀 チームポイント確定送信システム（Firestoreリザルト直結） ---
    window.submitFinalScore = async () => {
      if (serverCurrentIndex === -1) {
        alert("現在クイズが出題されていません。");
        return;
      }
      if (currentJudgeStatus === null) {
        alert("手元の「⭕ 正解」または「❌ 不正解」判定を選択してください。");
        return;
      }

      // 配点計算
      const pointPerAnswer = parseInt(document.getElementById("pointPerAnswer").value) || 10;
      const finalCalculatedScore = currentJudgeStatus ? pointPerAnswer : 0;

      if (finalCalculatedScore === 0) {
        if (!confirm("不正解（0点）のまま送信しますか？")) return;
      }

      try {
        // 結果発表画面(6gatukekka.html)と同一の統合用ドキュメント
        const docRef = firestore.collection("gameResults").doc(`${activeTeam}_総合スコア`);
        
        // score_reverse フィールドへスコアをインクリメント加算
        await docRef.set({
          room: activeTeam,
          name: "チーム合計",
          score_reverse: firebase.firestore.FieldValue.increment(finalCalculatedScore),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        // トータルスコアを再集計してマージ更新
        const docSnap = await docRef.get();
        if (docSnap.exists()) {
          const data = docSnap.data();
          const bomb = data.score_bomb || 0;
          const trans = data.score_translate || 0;
          const rev = data.score_reverse || 0;
          await docRef.update({ totalScore: bomb + trans + rev });
        }

        alert(`🏆 【${activeTeam}】へ逆再生ゲームの得点を送信しました！\n（判定: ${currentJudgeStatus ? "⭕ 正解" : "❌ 不正解"} ＝ ＋${finalCalculatedScore}点）`);
        
        // 送信が完了したら手元の○✕選択状態だけをリセット
        clearJudgeVisual();
      } catch (error) {
        alert("送信・集計エラー: " + error.message);
      }
    };

    // 初期起動時のUI同期
    syncAdminUI();
  </script>

</body>
</html>
