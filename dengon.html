<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>逆再生クイズ</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 20px;
  }

  .quiz-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
  }

  button {
    font-size: 1.2rem;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  .question-box, .answer-box {
    font-size: 1.6rem;
    margin-top: 20px;
    min-height: 40px;
  }

  @media (max-width: 600px) {
    button { font-size: 1rem; padding: 8px 14px; }
    .question-box, .answer-box { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<h1>逆再生クイズ</h1>

<div class="question-box" id="question">ボタンを押してお題を表示</div>
<div class="answer-box" id="answer"></div>

<!-- 10問分のボタン -->
<div id="buttons"></div>

<script>
  // 逆再生すると意味が分かる言葉（10問）
  const quiz = [
    { q: "あいさか", a: "アカシア" },
    { q: "うたかひあ", a: "愛は勝つ" },
    { q: "にずおひ", a: "異邦人" },
    { q: "あぼとくるこ", a: "贈る言葉" },
    { q: "うぐにしるべ", a: "EVERYTHING" },
    { q: "にらあだ", a: "ダーリン" },
    { q: "いけしか", a: "キセキ" },
    { q: "あばたなは", a: "花束" },
    { q: "おぶなるかさ", a: "さくらんぼ" },
    { q: "いすもつばか", a: "カブトムシ" }
  ];

  // ボタン生成
  const btnArea = document.getElementById("buttons");
  quiz.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "quiz-row";

    const qBtn = document.createElement("button");
    qBtn.textContent = "問題 " + (index + 1);
    qBtn.onclick = () => {
      document.getElementById("question").textContent = item.q;
      document.getElementById("answer").textContent = "";
    };

    const aBtn = document.createElement("button");
    aBtn.textContent = "答え";
    aBtn.onclick = () => {
      document.getElementById("answer").textContent = item.a;
    };

    row.appendChild(qBtn);
    row.appendChild(aBtn);
    btnArea.appendChild(row);
  });
</script>

</body>
</html>
