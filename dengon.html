<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>逆再生クイズ</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 20px;
  }

  .quiz-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 14px 0;
  }

  button {
    font-size: 1.3rem;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  .question-box {
    font-size: 2.6rem;
    margin-top: 25px;
    min-height: 60px;
  }

  .answer-box {
    font-size: 2.2rem;
    margin-top: 15px;
    min-height: 50px;
    color: #00ffcc;
  }

  @media (max-width: 600px) {
    button { font-size: 1.1rem; padding: 8px 14px; }
    .question-box { font-size: 2rem; }
    .answer-box { font-size: 1.7rem; }
  }
</style>
</head>
<body>

<h1>逆再生クイズ</h1>

<div class="question-box" id="question">ボタンを押してお題を表示</div>
<div class="answer-box" id="answer"></div>

<!-- 10問分のボタン -->
<div id="buttons"></div>

<!-- 共通ボタン -->
<button onclick="showAnswer()">答え</button>
<button onclick="clearText()">消す</button>
<button onclick="location.href='index.html'">メニュー</button>

<script>
  // 逆再生すると意味が分かる言葉（10問）
  const quiz = [
    { q: "あいさか", a: "アカシア" },
    { q: "うたかひあ", a: "愛は勝つ" },
    { q: "にずおひ", a: "異邦人" },
    { q: "あぼとくるこ", a: "贈る言葉" },
    { q: "うぐにしるべ", a: "EVERYTHING" },
    { q: "にらあだ", a: "ダーリン" },
    { q: "いけしか", a: "キセキ" },
    { q: "あばたなは", a: "花束" },
    { q: "おぶなるかさ", a: "さくらんぼ" },
    { q: "いすもつばか", a: "カブトムシ" }
  ];

  let currentIndex = -1;

  // ボタン生成
  const btnArea = document.getElementById("buttons");
  quiz.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "quiz-row";

    const qBtn = document.createElement("button");
    qBtn.textContent = "問題 " + (index + 1);
    qBtn.onclick = () => {
      currentIndex = index;
      document.getElementById("question").textContent = item.q;
      document.getElementById("answer").textContent = "";
    };

    row.appendChild(qBtn);
    btnArea.appendChild(row);
  });

  // 答えボタン
  function showAnswer() {
    if (currentIndex === -1) return;
    document.getElementById("answer").textContent = quiz[currentIndex].a;
  }

  // 表示を消す
  function clearText() {
    document.getElementById("question").textContent = "";
    document.getElementById("answer").textContent = "";
    currentIndex = -1;
  }
</script>

</body>
</html>
