<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>人狼ゲーム 進行＆メモツール</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #bb86fc;
      --text: #e0e0e0;
      --danger: #cf6679;
      --success: #03dac6;
      --citizen: #00bcd4;
      --werewolf: #f44336;
      --neutral: #ff9800;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 12px;
      font-size: 15px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1, h2, h3 { color: var(--accent); margin: 0 0 12px 0; font-size: 1.2rem; }
    .card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    
    input, select, button, textarea {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2c2c2c;
      color: #fff;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      resize: vertical;
      font-family: inherit;
    }
    button {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      touch-action: manipulation;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.danger { background: var(--danger); color: #fff; }
    button.secondary { background: #444; color: #fff; }
    button.small { padding: 4px 8px; font-size: 12px; }
    
    .hidden { display: none !important; }

    /* 自分の役職カード大表示 */
    .my-role-card {
      background: #282828;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-top: 8px;
      border: 2px solid #333;
    }
    .my-role-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 6px 0;
      display: inline-block;
      padding: 4px 16px;
      border-radius: 6px;
    }
    .role-citizen { background-color: rgba(0, 188, 212, 0.2); color: var(--citizen); border: 1px solid var(--citizen); }
    .role-werewolf { background-color: rgba(244, 67, 54, 0.2); color: var(--werewolf); border: 1px solid var(--werewolf); }
    .role-neutral { background-color: rgba(255, 152, 0, 0.2); color: var(--neutral); border: 1px solid var(--neutral); }
    .role-none { background-color: #333; color: #aaa; }

    /* タイマー表示 */
    .timer-display {
      font-size: 2.2rem;
      font-family: monospace;
      font-weight: bold;
      text-align: center;
      color: #fff;
      background: #000;
      padding: 6px;
      border-radius: 6px;
      letter-spacing: 2px;
    }

    /* 横スクロール対応テーブル */
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #333;
      border-radius: 6px;
    }
    table {
      width: 100%;
      min-width: 450px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
    }
    th { background: #2a2a2a; font-size: 13px; }
    
    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-gm { background: #ffd700; color: #000; }
    .badge-confirmed { background: #4caf50; color: #fff; font-size: 10px; margin-left: 4px; }
    
    .role-memo-input {
      width: 100%;
      min-width: 180px;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      background: #121212;
      border: 1px solid #444;
    }

    /* モーダル（役職選択 / 説明） */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 12px;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 10px;
      width: 100%;
      max-width: 550px;
      max-height: 85vh;
      overflow-y: auto;
    }

    /* タブ切り替えUI */
    .tab-container {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      border-bottom: 2px solid #333;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      background: #2a2a2a;
      color: #aaa;
      border: none;
      border-radius: 6px 6px 0 0;
      font-size: 13px;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
    }
    .role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }
    .role-option-btn {
      padding: 10px 6px;
      font-size: 13px;
      text-align: center;
      background: #2c2c2c;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 style="text-align: center;">人狼ゲーム メモ＆タイマー</h1>

  <!-- 入室・作成画面 -->
  <div id="auth-screen" class="card">
    <h2>ルーム入室 / 作成</h2>
    <div class="flex" style="flex-direction: column;">
      <input type="text" id="room-id-input" placeholder="ルームナンバー (例: 1234)" style="width: 100%;">
      <input type="text" id="player-name-input" placeholder="あなたの名前" style="width: 100%;">
      <button id="join-btn" style="width: 100%; padding: 12px;">入室する</button>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="game-screen" class="hidden">
    <!-- ルーム基本情報 ＆ 司会設定 -->
    <div class="card flex-between">
      <div>
        <span style="color:#aaa; font-size: 12px;">ROOM</span>
        <div style="font-size: 1.2rem; font-weight: bold;" id="display-room-id">----</div>
      </div>
      <div class="flex">
        <button id="card-desc-btn" class="secondary small">❓ 役職一覧</button>
        <button id="leave-room-btn" class="danger small">退室</button>
      </div>
    </div>

    <!-- 自分のステータス ＆ 役職表示（大きく目立たせる） -->
    <div class="card">
      <div class="flex-between">
        <div>
          名前: <strong id="my-name"></strong>
          <span id="my-status" class="badge" style="margin-left:6px; background:#444; color:#fff;">生存</span>
        </div>
        <label class="flex" style="font-size:12px;">
          <input type="checkbox" id="gm-mode-check"> 専任GMモード
        </label>
      </div>

      <div class="my-role-card">
        <div style="font-size:12px; color:#aaa;">あなたの役職</div>
        <div id="my-role-display" class="my-role-title role-none">未選択</div>
        <div>
          <button id="open-role-select-btn" style="margin-top: 6px;" class="small">役職を変更・選択する</button>
        </div>
      </div>
    </div>

    <!-- 全体共有 タイマー機能 -->
    <div class="card">
      <div class="flex-between" style="margin-bottom: 8px;">
        <h3>⏱ 会議タイマー（全員共有）</h3>
        <span id="mc-status-text" style="font-size: 12px; color: #aaa;"></span>
      </div>

      <div class="timer-display" id="timer-text">03:00</div>

      <!-- 司会用タイマーコントロール -->
      <div id="mc-timer-controls" class="hidden" style="margin-top: 10px;">
        <div class="flex" style="justify-content: center; margin-bottom: 8px;">
          <button class="secondary small set-time-btn" data-sec="60">1分</button>
          <button class="secondary small set-time-btn" data-sec="180">3分</button>
          <button class="secondary small set-time-btn" data-sec="300">5分</button>
          <button class="secondary small set-time-btn" data-sec="600">10分</button>
        </div>
        <div class="flex" style="justify-content: center;">
          <button id="timer-start-btn" style="background:var(--success); color:#000;">スタート</button>
          <button id="timer-stop-btn" style="background:#ff9800; color:#000;">ストップ</button>
          <button id="timer-reset-btn" class="danger">リセット</button>
        </div>
      </div>

      <div style="margin-top: 10px; border-top: 1px dashed #333; padding-top: 8px;">
        <label style="font-size: 13px; color: #ccc;">
          <input type="checkbox" id="mc-toggle-check">
          自分が司会（進行操作権限）を引き受ける
        </label>
      </div>
    </div>

    <!-- 参加者一覧 ＆ 考察メモ（横スクロール対応） -->
    <div class="card">
      <div class="flex-between" style="margin-bottom: 8px;">
        <h3>参加者一覧 ＆ COメモ</h3>
        <button id="clear-my-memo-btn" class="secondary small">メモ全消去</button>
      </div>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 25%;">名前</th>
              <th style="width: 15%;">状態</th>
              <th style="width: 25%;">役職（本物）</th>
              <th style="width: 35%;">仮役職 / COメモ</th>
            </tr>
          </thead>
          <tbody id="player-list-body"></tbody>
        </table>
      </div>
      <div style="font-size: 11px; color: #888; margin-top: 4px; text-align: right;">※表は横スライドできます</div>
    </div>

    <!-- 全体フリーメモ（自分専用） -->
    <div class="card">
      <h3>全体フリーメモ（自分専用）</h3>
      <textarea id="free-memo-text" rows="4" placeholder="盤面全体や過去ログの整理など..."></textarea>
    </div>
  </div>
</div>

<!-- 陣営別 役職選択ダイアログ モーダル -->
<div id="role-select-modal" class="modal hidden">
  <div class="modal-content">
    <div class="flex-between" style="margin-bottom: 12px;">
      <h2>役職を選択</h2>
      <button id="close-role-modal-btn" class="secondary small">✕ 閉じる</button>
    </div>

    <div class="tab-container">
      <button class="tab-btn active" data-tab="tab-citizen">市民陣営</button>
      <button class="tab-btn" data-tab="tab-werewolf">人狼陣営</button>
      <button class="tab-btn" data-tab="tab-neutral">第三陣営</button>
    </div>

    <div id="tab-citizen" class="tab-content role-grid"></div>
    <div id="tab-werewolf" class="tab-content role-grid hidden"></div>
    <div id="tab-neutral" class="tab-content role-grid hidden"></div>
  </div>
</div>

<!-- 役職カード説明モーダル -->
<div id="card-modal" class="modal hidden">
  <div class="modal-content">
    <div class="flex-between" style="margin-bottom: 12px;">
      <h2>役職一覧・説明</h2>
      <button id="close-desc-modal-btn" class="secondary small">✕ 閉じる</button>
    </div>
    <div id="card-list-container"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC4DQhH_swesAD98Xyjg8d1lcWEkkrHrgw",
    authDomain: "gamehistory-m84.firebaseapp.com",
    databaseURL: "https://gamehistory-m84-default-rtdb.firebaseio.com",
    projectId: "gamehistory-m84",
    storageBucket: "gamehistory-m84.firebasestorage.app",
    messagingSenderId: "475761727837",
    appId: "1:475761727837:web:06d07e1ab4120a7ccaf0b4",
    measurementId: "G-3636W6LC4F"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const ROLES_DATA = [
    // 人狼陣営
    { name: "人狼", team: "人狼", count: 4, desc: "夜に人狼同士で話し合い、人間1人を襲撃する。" },
    { name: "人狼の子ども", team: "人狼", count: 1, desc: "追放されると、次の夜の人狼襲撃枠が+1される。" },
    { name: "裏切り者", team: "人狼", count: 2, desc: "市民としてカウント。人狼陣営の勝利を目指す。" },
    { name: "裏切りの共有者", team: "人狼", count: 2, desc: "裏切り者同士でお互いを認識できる。" },
    { name: "内通者", team: "人狼", count: 1, desc: "夜に人狼が誰かを特定・把握できる。" },
    { name: "裏切りの襲撃者", team: "人狼", count: 1, desc: "夜に人狼とは別に独自で1人襲撃できる。" },
    { name: "スパイ", team: "人狼", count: 1, desc: "夜に誰か1人の役職を占える（人狼陣営）。" },
    // 市民陣営
    { name: "市民", team: "市民", count: 9, desc: "特別な能力は持たない一般的な市民。" },
    { name: "予言者", team: "市民", count: 2, desc: "夜に指定した1人が「人狼」か「人間」かを知る。" },
    { name: "ボディーガード", team: "市民", count: 2, desc: "夜に1人を護衛し、人狼の襲撃から守る。" },
    { name: "霊媒師", team: "市民", count: 2, desc: "前日に追放された人が「人狼」か「人間」かを知る。" },
    { name: "ハンター", team: "市民", count: 1, desc: "死亡時に道連れとして1人を指名して脱落させる。" },
    { name: "共有者", team: "市民", count: 2, desc: "お互いが共有者であることを認識できる。" },
    { name: "独裁者", team: "市民", count: 1, desc: "昼の議論中、全投票を無効化し自分の一票で追放者を決定できる。" },
    { name: "タフガイ", team: "市民", count: 1, desc: "人狼に襲撃されても翌日の夜まで生き残る。" },
    { name: "カウンセラー", team: "市民", count: 1, desc: "指定した1人の陣営を知ることができる。" },
    { name: "奇術師", team: "市民", count: 1, desc: "ゲーム中1回、夜に2人の役職を入れ替える。" },
    { name: "罠師", team: "市民", count: 1, desc: "夜に仕掛けた罠で、襲撃してきた人狼を返り討ちにする。" },
    { name: "騎士団", team: "市民", count: 3, desc: "騎士団同士でお互いを認識できる。" },
    { name: "影武者", team: "市民", count: 1, desc: "王様が襲撃された際に代わりに身代わりになる。" },
    { name: "王様", team: "市民", count: 1, desc: "生き残っている限り重要な決定権を持つ。" },
    // 第三陣営 / その他
    { name: "妖狐", team: "単独", count: 1, desc: "襲撃で死なないが占われると死亡。生き残れば単独勝利。" },
    { name: "神様", team: "単独", count: 1, desc: "全知の能力を持つ。" },
    { name: "恋人", team: "単独", count: 2, desc: "2人で1対。片方が死ぬと後を追う。最後まで生存で勝利。" },
    { name: "一匹狼", team: "単独", count: 1, desc: "人狼が全滅した状態で最後まで生存すると単独勝利。" },
    { name: "アンドロイド", team: "単独", count: 1, desc: "コピー対象を選択し、その勝利条件に依存する。" },
    { name: "案山子", team: "単独", count: 3, desc: "追放されることで勝利する特殊役職。" },
    { name: "呪われた者", team: "両陣営", count: 1, desc: "初期は市民。襲撃されると「人狼」に覚醒する。" }
  ];

  let roomId = "";
  let playerId = "";
  let playerName = "";
  let currentRoomData = null;
  let localRoleMemos = {};
  let freeMemoText = "";
  let timerInterval = null;

  const authScreen = document.getElementById("auth-screen");
  const gameScreen = document.getElementById("game-screen");
  const roomIdInput = document.getElementById("room-id-input");
  const playerNameInput = document.getElementById("player-name-input");
  const joinBtn = document.getElementById("join-btn");
  const mcToggleCheck = document.getElementById("mc-toggle-check");
  const gmModeCheck = document.getElementById("gm-mode-check");
  const mcTimerControls = document.getElementById("mc-timer-controls");
  const playerListBody = document.getElementById("player-list-body");
  const freeMemoInput = document.getElementById("free-memo-text");

  function generateId() {
    return Math.random().toString(36).substring(2, 9);
  }

  function getStorageKey(key) {
    return `jinro_${roomId}_${playerId}_${key}`;
  }

  function loadLocalMemo() {
    const savedRoleMemos = localStorage.getItem(getStorageKey("roleMemos"));
    localRoleMemos = savedRoleMemos ? JSON.parse(savedRoleMemos) : {};
    freeMemoText = localStorage.getItem(getStorageKey("freeMemo")) || "";
    freeMemoInput.value = freeMemoText;
  }

  function saveLocalMemo() {
    localStorage.setItem(getStorageKey("roleMemos"), JSON.stringify(localRoleMemos));
    localStorage.setItem(getStorageKey("freeMemo"), freeMemoInput.value);
  }

  function clearAllLocalMemo() {
    localStorage.removeItem(getStorageKey("roleMemos"));
    localStorage.removeItem(getStorageKey("freeMemo"));
    localRoleMemos = {};
    freeMemoInput.value = "";
    renderGameScreen();
  }

  // 役職選択モーダルのタブ構築
  function initRoleSelectModal() {
    const tabCitizen = document.getElementById("tab-citizen");
    const tabWerewolf = document.getElementById("tab-werewolf");
    const tabNeutral = document.getElementById("tab-neutral");

    tabCitizen.innerHTML = "";
    tabWerewolf.innerHTML = "";
    tabNeutral.innerHTML = "";

    ROLES_DATA.forEach(r => {
      const btn = document.createElement("button");
      btn.className = "role-option-btn";
      btn.textContent = r.name;
      btn.onclick = () => selectRole(r.name);

      if (r.team === "市民") {
        tabCitizen.appendChild(btn);
      } else if (r.team === "人狼") {
        tabWerewolf.appendChild(btn);
      } else {
        tabNeutral.appendChild(btn);
      }
    });
  }
  initRoleSelectModal();

  async function selectRole(roleName) {
    await update(ref(db, `jinro/rooms/${roomId}/players/${playerId}`), {
      role: roleName
    });
    document.getElementById("role-select-modal").classList.add("hidden");
  }

  // --- 入退室の最適化処理 ---

  joinBtn.addEventListener("click", async () => {
    roomId = roomIdInput.value.trim();
    playerName = playerNameInput.value.trim();
    if (!roomId || !playerName) return alert("ルームナンバーと名前を入力してください");

    // 既存セッションIDの読み込みまたは新規作成
    playerId = localStorage.getItem(`jinro_session_pid_${roomId}`) || generateId();

    const roomRef = ref(db, `jinro/rooms/${roomId}`);
    const snapshot = await get(roomRef);

    if (snapshot.exists()) {
      const roomData = snapshot.val();
      const existingPlayers = roomData.players || {};

      // 同名チェック（自分のID以外のプレイヤーで同名が存在する場合のみ弾く）
      const isDuplicateName = Object.entries(existingPlayers).some(
        ([pId, p]) => p.name === playerName && pId !== playerId
      );

      if (isDuplicateName) {
        return alert("同じ名前のプレイヤーが既に存在します。別の名前を入力してください。");
      }
    } else {
      // ルーム新規作成
      await set(roomRef, {
        mcPlayerId: "",
        timer: { seconds: 180, isRunning: false, lastUpdated: Date.now() }
      });
    }

    localStorage.setItem(`jinro_session_pid_${roomId}`, playerId);

    document.getElementById("my-name").textContent = playerName;
    document.getElementById("display-room-id").textContent = roomId;

    const playerRef = ref(db, `jinro/rooms/${roomId}/players/${playerId}`);
    const playerSnapshot = await get(playerRef);

    // 既にデータが存在する場合（復帰）は状態を維持し、新規の場合のみ初期化
    if (!playerSnapshot.exists()) {
      await set(playerRef, {
        name: playerName,
        role: "",
        isRoleConfirmed: false,
        isAlive: true,
        isGMOnly: false
      });
    } else {
      await update(playerRef, { name: playerName });
    }

    // --- 自動退室・切断ハンドリング設定 ---
    // 1. 接続切断（タブ閉じ・回線切れ等）時の自動削除登録
    onDisconnect(playerRef).remove();

    loadLocalMemo();

    authScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");

    listenToRoomUpdates();
  });

  // 明示的な退室処理関数
  async function leaveRoom() {
    if (!roomId || !playerId) return;

    // 司会権限を持っていた場合は解除
    if (currentRoomData?.mcPlayerId === playerId) {
      await update(ref(db, `jinro/rooms/${roomId}`), { mcPlayerId: "" });
    }

    // プレイヤーデータをDBから削除
    const playerRef = ref(db, `jinro/rooms/${roomId}/players/${playerId}`);
    await onDisconnect(playerRef).cancel(); // onDisconnectの予約をキャンセル
    await remove(playerRef);

    clearAllLocalMemo();
    localStorage.removeItem(`jinro_session_pid_${roomId}`);
    location.reload();
  }

  document.getElementById("leave-room-btn").addEventListener("click", async () => {
    if (confirm("本当に退室しますか？")) {
      await leaveRoom();
    }
  });

  // --- その他のゲームロジック（そのまま保持） ---

  function listenToRoomUpdates() {
    const roomRef = ref(db, `jinro/rooms/${roomId}`);
    onValue(roomRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      currentRoomData = data;
      renderGameScreen();
      updateTimerDisplay();
    });
  }

  function renderGameScreen() {
    if (!currentRoomData) return;
    const { mcPlayerId, players } = currentRoomData;
    const me = players ? players[playerId] : null;

    const isMC = mcPlayerId === playerId;
    mcToggleCheck.checked = isMC;
    mcToggleCheck.disabled = Boolean(mcPlayerId && !isMC);
    document.getElementById("mc-status-text").textContent = 
      mcPlayerId ? (isMC ? "（あなたが進行役）" : `（進行役: ${players[mcPlayerId]?.name || ''}）`) : "（進行役不在）";

    if (isMC) {
      mcTimerControls.classList.remove("hidden");
    } else {
      mcTimerControls.classList.add("hidden");
    }

    // 自分のステータス・役職カード更新
    if (me) {
      const statusEl = document.getElementById("my-status");
      statusEl.textContent = me.isAlive ? "生存" : "脱落";
      statusEl.style.background = me.isAlive ? "#4caf50" : "var(--danger)";

      const roleDisplay = document.getElementById("my-role-display");
      const currentRole = me.role || "未選択";
      roleDisplay.textContent = currentRole;
      
      roleDisplay.className = "my-role-title ";
      const roleData = ROLES_DATA.find(r => r.name === currentRole);
      if (roleData) {
        if (roleData.team === "市民") roleDisplay.classList.add("role-citizen");
        else if (roleData.team === "人狼") roleDisplay.classList.add("role-werewolf");
        else roleDisplay.classList.add("role-neutral");
      } else {
        roleDisplay.classList.add("role-none");
      }
    }

    // 参加者テーブル生成
    playerListBody.innerHTML = "";
    if (players) {
      Object.entries(players).forEach(([pId, p]) => {
        const tr = document.createElement("tr");

        const canSeeRole = (pId === playerId) || (me && me.isGMOnly) || p.isRoleConfirmed;
        let roleDisplay = canSeeRole ? (p.role || "未選択") : "???";
        if (p.isRoleConfirmed) {
          roleDisplay += ' <span class="badge badge-confirmed">確定</span>';
        }

        const roleMemoVal = localRoleMemos[pId] || "";

        tr.innerHTML = `
          <td>${p.name} ${pId === mcPlayerId ? '<span class="badge badge-gm">司会</span>' : ''}</td>
          <td>
            ${p.isAlive ? '生存' : '<span style="color:var(--danger)">脱落</span>'}
            ${isMC ? `<button class="small secondary" style="padding:1px 4px; margin-left:4px;" onclick="togglePlayerStatus('${pId}',${p.isAlive})">切替</button>` : ''}
          </td>
          <td>
            ${p.isGMOnly ? '<b>専任GM</b>' : roleDisplay}
            ${isMC && !p.isGMOnly ? `<br><button class="small secondary" style="padding:1px 4px; margin-top:2px;" onclick="toggleRoleConfirm('${pId}', ${p.isRoleConfirmed})">${p.isRoleConfirmed ? '解除' : '確定'}</button>` : ''}
          </td>
          <td>
            <input type="text" class="role-memo-input" data-pid="${pId}" value="${roleMemoVal}" placeholder="例: 占いCO, 狼？">
          </td>
        `;
        playerListBody.appendChild(tr);
      });

      document.querySelectorAll(".role-memo-input").forEach(input => {
        input.addEventListener("input", (e) => {
          const targetPid = e.target.getAttribute("data-pid");
          localRoleMemos[targetPid] = e.target.value;
          saveLocalMemo();
        });
      });
    }
  }

  // タイマー同期処理
  function updateTimerDisplay() {
    if (!currentRoomData || !currentRoomData.timer) return;
    const timer = currentRoomData.timer;

    if (timerInterval) clearInterval(timerInterval);

    function calcRemaining() {
      if (!timer.isRunning) return timer.seconds;
      const elapsed = Math.floor((Date.now() - timer.lastUpdated) / 1000);
      return Math.max(0, timer.seconds - elapsed);
    }

    function render() {
      const rem = calcRemaining();
      const m = String(Math.floor(rem / 60)).padStart(2, '0');
      const s = String(rem % 60).padStart(2, '0');
      document.getElementById("timer-text").textContent = `${m}:${s}`;
    }

    render();
    if (timer.isRunning) {
      timerInterval = setInterval(render, 1000);
    }
  }

  // タイマーコントロール（司会用）
  document.querySelectorAll(".set-time-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const sec = parseInt(e.target.getAttribute("data-sec"));
      await update(ref(db, `jinro/rooms/${roomId}/timer`), {
        seconds: sec,
        isRunning: false,
        lastUpdated: Date.now()
      });
    });
  });

  document.getElementById("timer-start-btn").addEventListener("click", async () => {
    if (!currentRoomData?.timer) return;
    await update(ref(db, `jinro/rooms/${roomId}/timer`), {
      isRunning: true,
      lastUpdated: Date.now()
    });
  });

  document.getElementById("timer-stop-btn").addEventListener("click", async () => {
    if (!currentRoomData?.timer) return;
    const timer = currentRoomData.timer;
    const elapsed = Math.floor((Date.now() - timer.lastUpdated) / 1000);
    const remaining = Math.max(0, timer.seconds - elapsed);

    await update(ref(db, `jinro/rooms/${roomId}/timer`), {
      seconds: remaining,
      isRunning: false,
      lastUpdated: Date.now()
    });
  });

  document.getElementById("timer-reset-btn").addEventListener("click", async () => {
    await update(ref(db, `jinro/rooms/${roomId}/timer`), {
      seconds: 180,
      isRunning: false,
      lastUpdated: Date.now()
    });
  });

  // フリーメモ
  freeMemoInput.addEventListener("input", () => saveLocalMemo());

  document.getElementById("clear-my-memo-btn").addEventListener("click", () => {
    if (confirm("自分のすべてのメモ情報を削除しますか？")) clearAllLocalMemo();
  });

  mcToggleCheck.addEventListener("change", async (e) => {
    const isChecked = e.target.checked;
    const mcRef = ref(db, `jinro/rooms/${roomId}`);
    await update(mcRef, {
      mcPlayerId: isChecked ? playerId : ""
    });

    // 司会中に切断された場合の自動解放処理
    if (isChecked) {
      onDisconnect(ref(db, `jinro/rooms/${roomId}/mcPlayerId`)).set("");
    } else {
      onDisconnect(ref(db, `jinro/rooms/${roomId}/mcPlayerId`)).cancel();
    }
  });

  gmModeCheck.addEventListener("change", async (e) => {
    const isGM = e.target.checked;
    await update(ref(db, `jinro/rooms/${roomId}/players/${playerId}`), {
      isGMOnly: isGM,
      role: isGM ? "GM" : ""
    });
  });

  // 生存/役職確定切り替え関数
  window.togglePlayerStatus = async (targetId, currentAlive) => {
    await update(ref(db, `jinro/rooms/${roomId}/players/${targetId}`), { isAlive: !currentAlive });
  };
  window.toggleRoleConfirm = async (targetId, currentConfirmed) => {
    await update(ref(db, `jinro/rooms/${roomId}/players/${targetId}`), { isRoleConfirmed: !currentConfirmed });
  };

  // 役職選択モーダル管理
  const roleModal = document.getElementById("role-select-modal");
  document.getElementById("open-role-select-btn").onclick = () => roleModal.classList.remove("hidden");
  document.getElementById("close-role-modal-btn").onclick = () => roleModal.classList.add("hidden");

  // タブ切り替え logic
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.add("hidden"));
      
      e.target.classList.add("active");
      const tabId = e.target.getAttribute("data-tab");
      document.getElementById(tabId).classList.remove("hidden");
    });
  });

  // 役職説明モーダル管理
  const cardModal = document.getElementById("card-modal");
  document.getElementById("card-desc-btn").onclick = () => {
    const container = document.getElementById("card-list-container");
    container.innerHTML = ROLES_DATA.map(r => `
      <div style="border-bottom: 1px solid #333; padding: 8px 0;">
        <strong>${r.name}</strong> <span class="badge" style="background:#333; color:#fff;">${r.team}</span> (最大 ${r.count} 枚)
        <p style="margin: 4px 0 0 0; font-size: 13px; color: #ccc;">${r.desc}</p>
      </div>
    `).join("");
    cardModal.classList.remove("hidden");
  };
  document.getElementById("close-desc-modal-btn").onclick = () => cardModal.classList.add("hidden");
</script>
